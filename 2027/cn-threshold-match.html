<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Threshold — Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF2244;--red2:#ff4466;
  --glow:rgba(255,34,68,.3);--glow2:rgba(255,34,68,.1);
  --bg:#06060a;--s1:#0d0d14;--s2:#12121a;--s3:#0a0a10;
  --bdr:rgba(255,255,255,.07);
  --txt:#e4e4ee;--muted:rgba(228,228,238,.38);--muted2:rgba(228,228,238,.16);
  color-scheme:dark;
}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif}

/* ambient + scanlines */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 20%,rgba(255,34,68,.065) 0%,transparent 65%),
    radial-gradient(ellipse 40% 30% at 5% 95%, rgba(255,34,68,.04) 0%,transparent 55%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,transparent 1px,transparent 3px);
  opacity:.5}

/* CRT wrapper */
#screen{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;
  transform:scaleY(.02);opacity:0;transform-origin:center;
  animation:crtOn .5s cubic-bezier(.16,1,.3,1) .06s forwards}
#screen::after{content:'';position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(to bottom,transparent,rgba(255,80,100,.5),transparent);
  animation:scanSweep .6s .3s linear forwards;z-index:100;opacity:0}

@keyframes crtOn{
  0%  {transform:scaleY(.02);filter:brightness(7);opacity:.85}
  18% {transform:scaleY(.02);filter:brightness(9)}
  32% {transform:scaleY(1);filter:brightness(2.5)}
  65% {filter:brightness(1.15)}
  100%{transform:scaleY(1);filter:brightness(1);opacity:1}}
@keyframes scanSweep{0%{top:-5px;opacity:1}100%{top:100%;opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 8px var(--glow),0 0 20px var(--glow2)}
  50%    {box-shadow:0 0 16px var(--glow),0 0 40px var(--glow2),0 0 60px rgba(255,34,68,.05)}}
@keyframes dataIn{
  from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}

/* ── Header ── */
.hdr{flex-shrink:0;padding:.85rem 1.5rem .8rem;
  display:flex;align-items:center;gap:.75rem;
  border-bottom:1px solid var(--bdr);position:relative;
  background:rgba(6,6,10,.97);
  animation:fadeUp .4s .45s both}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(to right,var(--red) 0%,transparent 50%,var(--red) 100%);opacity:.25}
.back-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  background:none;border:none;cursor:pointer;transition:color .15s}
.back-btn:hover{color:#fff}
.sep{width:1px;height:18px;background:var(--bdr);flex-shrink:0}
.cn-badge{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.15em;background:var(--red);color:#fff;padding:2px 7px;border-radius:2px;flex-shrink:0}
.hdr-info{display:flex;flex-direction:column;gap:1px}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:900;
  text-transform:uppercase;letter-spacing:.06em;color:#fff;line-height:1}
.hdr-sub{font-family:'Barlow Condensed',sans-serif;font-size:9.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hdr-spacer{flex:1}
.round-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,34,68,.7);
  border:1px solid rgba(255,34,68,.25);padding:3px 10px;border-radius:2px}

/* ── Match header card ── */
.match-hero{
  max-width:960px;margin:1.2rem auto 0;padding:0 1.2rem;
  animation:fadeUp .4s .55s both}
.hero-card{
  background:var(--s1);border:1px solid var(--bdr);border-radius:5px;overflow:hidden;
  position:relative}
.hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,transparent,var(--red),transparent);opacity:.5}

/* Team sides */
.hero-teams{display:grid;grid-template-columns:1fr auto 1fr;height:110px;position:relative}
.team-side{display:flex;align-items:center;padding:0 2rem;position:relative;overflow:hidden}
.team-side-a{
  background:linear-gradient(to right,rgba(255,34,68,.12) 0%,transparent 100%);
  border-right:2px solid rgba(255,34,68,.3);
  justify-content:flex-start;gap:1rem}
.team-side-b{
  background:linear-gradient(to left,rgba(255,34,68,.08) 0%,transparent 100%);
  border-left:2px solid rgba(255,34,68,.15);
  justify-content:flex-end;gap:1rem;flex-direction:row-reverse}
.team-logo-hero{width:60px;height:60px;object-fit:contain;flex-shrink:0;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.team-name-hero{font-family:'Barlow Condensed',sans-serif;font-size:1.8rem;font-weight:900;
  text-transform:uppercase;letter-spacing:.06em;color:#fff;line-height:1}
.team-name-hero.tbd{color:var(--muted);font-weight:400;font-style:italic;font-size:1.2rem}
.team-bg-logo{position:absolute;width:140px;height:140px;object-fit:contain;opacity:.07;
  pointer-events:none}
.team-bg-logo-a{left:-10px;top:50%;transform:translateY(-50%)}
.team-bg-logo-b{right:-10px;top:50%;transform:translateY(-50%)}

/* Center score panel */
.hero-center{
  width:160px;flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  border-left:1px solid var(--bdr);border-right:1px solid var(--bdr)}
.match-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}
.match-score{font-family:'Barlow Condensed',sans-serif;font-size:3rem;font-weight:900;
  letter-spacing:.04em;color:#fff;line-height:1;display:flex;align-items:center;gap:.5rem}
.score-sep{color:var(--muted2);font-weight:300;font-size:1.5rem}
.score-num{min-width:28px;text-align:center}
.score-num.win{color:#fff}
.score-num.loss{color:var(--muted)}
.score-num.tbd{color:var(--muted2);font-size:1.2rem;font-weight:400;font-style:italic}
.bo-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,34,68,.5)}

/* ── Map cards section ── */
.maps-section{max-width:960px;margin:0 auto;padding:1rem 1.2rem 2rem;
  display:flex;flex-direction:column;gap:.75rem;
  animation:fadeUp .4s .7s both}

/* Map card */
.map-card{background:var(--s1);border:1px solid var(--bdr);border-radius:4px;overflow:hidden;
  position:relative}
.map-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,var(--red),rgba(255,34,68,.2));opacity:.35}
.map-card.admin-mode{cursor:default}

/* Map scoreboard */
.map-sb{position:relative;height:130px;overflow:hidden;
  background:linear-gradient(135deg,#0d0406 0%,#140310 50%,#0d0406 100%)}
.map-sb-img{width:100%;height:100%;object-fit:cover;object-position:center 40%;
  display:block;opacity:.55}
.map-sb-overlay{position:absolute;inset:0;
  background:linear-gradient(to right,rgba(6,6,10,.7) 0%,transparent 30%,transparent 70%,rgba(6,6,10,.7) 100%)}

/* Team blocks inside scoreboard */
.sb-block{position:absolute;top:42%;transform:translateY(-50%);
  display:flex;align-items:center;gap:.7rem}
.sb-block-l{left:1.5rem}
.sb-block-r{right:1.5rem;flex-direction:row-reverse}
.sb-logo{width:48px;height:48px;object-fit:contain;
  filter:drop-shadow(0 1px 6px rgba(0,0,0,.8))}
.sb-team-name{font-family:'Barlow Condensed',sans-serif;font-size:clamp(13px,2.5vw,20px);
  font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.9)}
.sb-team-name.tbd{color:var(--muted);font-weight:400;font-style:italic}

/* Center map name panel */
.sb-center{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
  width:130px;height:80px;overflow:hidden;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 10px rgba(0,0,0,.4)}
.sb-map-img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.sb-map-name{position:absolute;bottom:0;left:0;right:0;padding:3px 0;
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent);
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.85);text-align:center}

/* Score diamonds */
.sb-scores{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px}
.sb-score-l,.sb-score-r{font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(28px,5vw,52px);font-weight:900;
  text-shadow:0 1px 12px rgba(0,0,0,.95);line-height:1;min-width:40px;text-align:center}
.sb-score-l{color:#fff;text-align:right}
.sb-score-r{color:rgba(255,255,255,.35);text-align:left}
.sb-score-l.lose,.sb-score-r.win{color:#fff}
.sb-score-l.lose{color:rgba(255,255,255,.35)}
.sb-score-sep{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:300;
  color:var(--muted2)}

/* Map result badge */
.map-result{position:absolute;top:.6rem;left:50%;transform:translateX(-50%);
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.map-result.win-a{background:rgba(255,34,68,.2);color:rgba(255,80,100,.9);border:.5px solid rgba(255,34,68,.3)}
.map-result.win-b{background:rgba(255,34,68,.1);color:rgba(255,80,100,.6);border:.5px solid rgba(255,34,68,.15)}

/* ── Round tracker ── */
.rt-wrap{display:flex;align-items:stretch;background:var(--s3);
  border-top:1px solid var(--bdr);overflow:hidden}
.rt-left{flex-shrink:0;border-right:1px solid var(--bdr);display:flex;flex-direction:column}
.rt-spacer{height:20px;border-bottom:1px solid var(--bdr)}
.rt-team-row{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;
  height:30px;position:relative}
.rt-team-row+.rt-team-row{border-top:1px solid var(--bdr)}
.rt-accent{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red)}
.rt-logo{width:16px;height:16px;object-fit:contain;flex-shrink:0}
.rt-name{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#fff;min-width:28px}

/* Round cells */
.rt-rounds{flex:1;overflow-x:auto;display:flex;flex-direction:column}
.rt-rounds::-webkit-scrollbar{height:2px}
.rt-rounds::-webkit-scrollbar-thumb{background:rgba(255,34,68,.2)}
.rt-header{height:20px;display:flex;align-items:center;gap:1px;
  border-bottom:1px solid var(--bdr);padding:0 1px}
.rt-hn{width:22px;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;
  letter-spacing:.06em;color:var(--muted2);flex-shrink:0}
.rt-hn.half-sep{border-left:1px solid rgba(255,255,255,.08)}
.rt-rows{display:flex;flex-direction:column;flex:1;gap:1px;padding:1px}
.rt-data-row{display:flex;gap:1px}
.rt-cell{width:22px;height:29px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border-radius:2px;cursor:pointer;transition:opacity .15s;
  font-size:11px;background:rgba(255,255,255,.04)}
.rt-cell:hover{opacity:.75}
.rt-cell.win-atk{background:rgba(255,34,68,.55)}
.rt-cell.win-def{background:rgba(255,140,0,.5)}
.rt-cell.loss-atk{background:rgba(255,34,68,.14)}
.rt-cell.loss-def{background:rgba(255,140,0,.14)}
.rt-cell.half-sep{border-left:1px solid rgba(255,255,255,.08)}

/* ── Admin controls ── */
.admin-bar{background:var(--s2);border-top:1px solid var(--bdr);
  padding:.5rem .75rem;display:none;align-items:center;gap:.5rem;flex-wrap:wrap}
.admin-bar.visible{display:flex}
.admin-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,34,68,.5);margin-right:.3rem}
.adm-input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:3px;padding:4px 8px;color:#fff;font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:700;width:52px;text-align:center;letter-spacing:.04em;
  text-transform:uppercase}
.adm-input:focus{outline:none;border-color:rgba(255,34,68,.4)}
.adm-select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:3px;padding:4px 8px;color:#fff;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;cursor:pointer}
.adm-select:focus{outline:none;border-color:rgba(255,34,68,.4)}
.adm-sep{width:1px;height:18px;background:var(--bdr)}
.adm-btn{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:3px;
  border:1px solid rgba(255,34,68,.3);background:rgba(255,34,68,.1);color:rgba(255,34,68,.8);
  cursor:pointer;transition:all .15s}
.adm-btn:hover{background:rgba(255,34,68,.2);color:var(--red)}
.adm-btn.save{border-color:rgba(255,34,68,.5);background:rgba(255,34,68,.18);color:var(--red2)}

/* ── Team stats ── */
.team-stats{border-top:1px solid var(--bdr);background:var(--s3);
  padding:.6rem .75rem .75rem;position:relative;overflow:hidden}
.ts-bg{position:absolute;top:50%;transform:translateY(-50%);
  width:130px;height:130px;object-fit:contain;opacity:.08;pointer-events:none}
.ts-bg-a{left:10px}.ts-bg-b{right:10px}
.ts-header{display:flex;align-items:center;padding:0 4px .5rem}
.ts-label{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ts-label-r{text-align:right}
.ts-center-h{width:130px;text-align:center;font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.ts-row{display:flex;align-items:center;height:34px;border-radius:2px;
  transition:background .1s}
.ts-row:hover{background:rgba(255,255,255,.03)}
.ts-val{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900}
.ts-val-a{text-align:right;padding-right:16px;color:rgba(255,255,255,.85)}
.ts-val-b{padding-left:16px;color:rgba(255,255,255,.85)}
.ts-val.hi{color:#fff}
.ts-val.lo{color:var(--muted)}
.ts-wrap{width:130px;flex-shrink:0;text-align:center}
.ts-stat-name{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ts-divider{height:1px;background:var(--bdr);margin:2px 4px}

/* ── Footer ── */
.ftr{border-top:1px solid var(--bdr);padding:.5rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  animation:fadeUp .4s .85s both;margin-top:auto}
.ftr-info{font-family:'Barlow Condensed',sans-serif;font-size:9.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}
.ftr-brand{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,34,68,.45)}

/* Empty state */
.empty-maps{text-align:center;padding:3rem 1rem;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.empty-maps .em-icon{font-size:2rem;margin-bottom:.75rem;opacity:.4}
</style>
</head>
<body>
<div id="screen">

  <!-- Header -->
  <div class="hdr site-header">
    <button class="back-btn" id="backBtn">← 대진표</button>
    <div class="sep"></div>
    <span class="cn-badge">CN OQ</span>
    <div class="hdr-info">
      <div class="hdr-title" id="hdrTitle">China Threshold</div>
      <div class="hdr-sub" id="hdrSub">KickOff Open Qualifier · China</div>
    </div>
    <div class="hdr-spacer"></div>
    <span class="round-badge" id="roundBadge">—</span>
  </div>

  <!-- Match hero -->
  <div class="match-hero">
    <div class="hero-card">
      <div class="hero-teams">
        <div class="team-side team-side-a" id="heroSideA">
          <img class="team-bg-logo team-bg-logo-a" id="bgLogoA" src="" alt="">
          <img class="team-logo-hero" id="heroLogoA" src="" alt="" onerror="this.style.display='none'">
          <span class="team-name-hero tbd" id="heroNameA">TBD</span>
        </div>
        <div class="hero-center">
          <div class="match-label" id="boLabel">BO3</div>
          <div class="match-score">
            <span class="score-num tbd" id="scoreA">-</span>
            <span class="score-sep">:</span>
            <span class="score-num tbd" id="scoreB">-</span>
          </div>
          <div class="bo-label" id="matchStatus">미예정</div>
        </div>
        <div class="team-side team-side-b" id="heroSideB">
          <img class="team-bg-logo team-bg-logo-b" id="bgLogoB" src="" alt="">
          <img class="team-logo-hero" id="heroLogoB" src="" alt="" onerror="this.style.display='none'">
          <span class="team-name-hero tbd" id="heroNameB">TBD</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Maps -->
  <div class="maps-section" id="mapsSection">
    <div class="empty-maps" id="emptyState">
      <div class="em-icon">⚡</div>
      <div>경기 데이터 없음</div>
      <div style="margin-top:.4rem;font-size:10px;color:var(--muted2)">Admin이 경기 결과를 입력하면 표시됩니다</div>
    </div>
  </div>

  <div class="ftr">
    <span class="ftr-info" id="ftrInfo">KickOff Open Qualifier · China · All times KST</span>
    <span class="ftr-brand">VCT 2027</span>
  </div>
</div>

<script>
const LP   = '../assets/teams/VCT 2027/VCT CN/CN_OQ/';
const MAPS_IMG = '../assets/maps/';

const MAPS = [
  {id:'abyss',   name:'Abyss'},
  {id:'ascent',  name:'Ascent'},
  {id:'bind',    name:'Bind'},
  {id:'breeze',  name:'Breeze'},
  {id:'fracture',name:'Fracture'},
  {id:'haven',   name:'Haven'},
  {id:'icebox',  name:'Icebox'},
  {id:'lotus',   name:'Lotus'},
  {id:'pearl',   name:'Pearl'},
  {id:'split',   name:'Split'},
  {id:'sunset',  name:'Sunset'},
];

const CN_OQ_POOL = [
  {abbr:'NOVA', name:'Nova Esports',                 logo:'NOVA.png'},
  {abbr:'TEC',  name:'Titan Esports Club',           logo:'TEC.png'},
  {abbr:'DRG',  name:'Dragon Ranger Gaming',         logo:'DRG.png'},
  {abbr:'WOL',  name:'Wolves Esports',               logo:'WOL.png'},
  {abbr:'FPX',  name:'FunPlus Phoenix',              logo:'FPX.png'},
  {abbr:'KBG',  name:'KeepBest Gaming',              logo:'KBG.png'},
  {abbr:'AQ',   name:'Any Question Gaming',          logo:'AQ.png'},
  {abbr:'UR',   name:'Unsettled Resentment',         logo:'UR.png'},
  {abbr:'AT',   name:'A Team',                       logo:'AT.png'},
  {abbr:'RA',   name:'Rare Atom',                    logo:'RA.png'},
  {abbr:'WSIG', name:'World Sports Invictus Gaming', logo:'WSIG.png'},
  {abbr:'ODG',  name:'Octagonal Disposition Gaming', logo:'ODG.png'},
  {abbr:'VLG',  name:'Victory No Limits Gaming',     logo:'VLG.png'},
];

const ROUND_LABELS = {
  r12:'Round of 12', qf:'Quarterfinals', sf:'Semifinals', gf:'Grand Final'
};

// ── URL params ──
const params = new URLSearchParams(location.search);
const WEEK  = parseInt(params.get('w')) || 1;
const ROUND = params.get('r') || 'r12';
const MI    = parseInt(params.get('m')) || 0;

// ── Storage helpers ──
function getPoolTeam(abbr){ return CN_OQ_POOL.find(t=>t.abbr===abbr)||null; }
function loadAssign(wk){
  try{const s=localStorage.getItem(`cnt_w${wk}`);return s?JSON.parse(s):{r12:[[null,null],[null,null],[null,null],[null,null]],qf_seeds:[null,null,null,null]};}
  catch(e){return{r12:[[null,null],[null,null],[null,null],[null,null]],qf_seeds:[null,null,null,null]};}
}
function matchKey(){ return `cnt_match_w${WEEK}_${ROUND}_${MI}`; }
function loadMatch(){
  try{const s=localStorage.getItem(matchKey());return s?JSON.parse(s):{maps:[],bo:3};}
  catch(e){return{maps:[],bo:3};}
}
function saveMatch(d){ try{localStorage.setItem(matchKey(),JSON.stringify(d));}catch(e){} }
function isAdmin(){
  try{const u=JSON.parse(localStorage.getItem('vct_auth_user'));return !!(u&&u.role==='admin');}
  catch(e){return false;}
}

// ── Resolve teams ──
function resolveTeams(){
  const a = loadAssign(WEEK);
  let tA=null, tB=null;
  if(ROUND==='r12'){
    const pair = a.r12[MI]||[null,null];
    tA = pair[0]?getPoolTeam(pair[0]):null;
    tB = pair[1]?getPoolTeam(pair[1]):null;
  } else if(ROUND==='qf'){
    tA = a.qf_seeds[MI]?getPoolTeam(a.qf_seeds[MI]):null; // seeded
    // t2 = r12 winner (not tracked yet — show TBD)
    tB = null;
  } else {
    tA = null; tB = null;
  }
  return {tA, tB};
}

// ── Page init ──
function init(){
  const {tA, tB} = resolveTeams();
  const md = loadMatch();
  const admin = isAdmin();

  // Header
  document.getElementById('roundBadge').textContent = `${ROUND_LABELS[ROUND]||ROUND} · M${MI+1}`;
  document.getElementById('hdrTitle').textContent = `China Threshold — Week ${WEEK}`;
  document.getElementById('backBtn').addEventListener('click',()=>history.back());

  // Hero teams
  if(tA){
    document.getElementById('heroNameA').textContent = tA.abbr;
    document.getElementById('heroNameA').classList.remove('tbd');
    const src = LP + tA.logo;
    document.getElementById('heroLogoA').src = src;
    document.getElementById('bgLogoA').src   = src;
  }
  if(tB){
    document.getElementById('heroNameB').textContent = tB.abbr;
    document.getElementById('heroNameB').classList.remove('tbd');
    const src = LP + tB.logo;
    document.getElementById('heroLogoB').src = src;
    document.getElementById('bgLogoB').src   = src;
  }

  // Scores
  const winsA = md.maps.filter(m=>m.winnerA===true).length;
  const winsB = md.maps.filter(m=>m.winnerA===false).length;
  const played = md.maps.length;
  if(played > 0){
    const sA = document.getElementById('scoreA');
    const sB = document.getElementById('scoreB');
    sA.textContent = winsA; sA.classList.remove('tbd');
    sB.textContent = winsB; sB.classList.remove('tbd');
    sA.classList.add(winsA>winsB?'win':'loss');
    sB.classList.add(winsB>winsA?'win':'loss');
    document.getElementById('matchStatus').textContent = winsA===winsB?'진행 중':(winsA>winsB?(tA?.abbr||'Team A')+' 승':(tB?.abbr||'Team B')+' 승');
  }
  document.getElementById('boLabel').textContent = `BO${md.bo||3}`;

  // Render maps
  renderMaps(md, tA, tB, admin);

  // Admin: add map button
  if(admin){
    const addBtn = document.createElement('button');
    addBtn.style.cssText='font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.5rem 1.2rem;border-radius:3px;border:1px dashed rgba(255,34,68,.3);background:rgba(255,34,68,.07);color:rgba(255,34,68,.7);cursor:pointer;align-self:flex-start;transition:all .15s;margin-top:-.25rem';
    addBtn.textContent = '+ 맵 추가';
    addBtn.onmouseover=()=>addBtn.style.borderColor='rgba(255,34,68,.5)';
    addBtn.onmouseout =()=>addBtn.style.borderColor='rgba(255,34,68,.3)';
    addBtn.addEventListener('click',()=>{
      const d = loadMatch();
      if(!d.maps) d.maps=[];
      d.maps.push({mapId:'abyss',scoreA:0,scoreB:0,winnerA:null,rounds:Array(24).fill(null)});
      saveMatch(d);
      init();
    });
    const sec = document.getElementById('mapsSection');
    sec.appendChild(addBtn);
  }
}

function renderMaps(md, tA, tB, admin){
  const sec = document.getElementById('mapsSection');
  sec.innerHTML='';
  const maps = md.maps||[];
  document.getElementById('emptyState') && (document.getElementById('emptyState').style.display = maps.length?'none':'');

  if(!maps.length){
    sec.innerHTML = `<div class="empty-maps"><div class="em-icon">⚡</div><div>경기 데이터 없음</div><div style="margin-top:.4rem;font-size:10px;color:var(--muted2)">Admin이 경기 결과를 입력하면 표시됩니다</div></div>`;
    if(admin){
      const addBtn = document.createElement('button');
      addBtn.style.cssText='display:block;margin:.75rem auto 0;font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.5rem 1.2rem;border-radius:3px;border:1px dashed rgba(255,34,68,.3);background:rgba(255,34,68,.07);color:rgba(255,34,68,.7);cursor:pointer;transition:all .15s';
      addBtn.textContent='+ 맵 추가';
      addBtn.addEventListener('click',()=>{
        const d=loadMatch(); d.maps=[]; d.maps.push({mapId:'abyss',scoreA:0,scoreB:0,winnerA:null,rounds:Array(24).fill(null)});
        saveMatch(d); init();
      });
      sec.appendChild(addBtn);
    }
    return;
  }

  maps.forEach((m, mi)=>{
    const mapInfo = MAPS.find(x=>x.id===m.mapId)||{id:m.mapId,name:m.mapId||'MAP'};
    const card = document.createElement('div');
    card.className='map-card';

    const winA = m.winnerA===true;
    const winB = m.winnerA===false;

    // Scoreboard
    const sbHtml = `
      <div class="map-sb">
        <img class="map-sb-img" src="${MAPS_IMG}${mapInfo.id}.jpg" alt="${mapInfo.name}" onerror="this.style.opacity=0">
        <div class="map-sb-overlay"></div>
        <div class="sb-block sb-block-l">
          ${tA?`<img class="sb-logo" src="${LP}${tA.logo}" alt="${tA.abbr}" onerror="this.style.display='none'">`:''}
          <span class="sb-team-name${tA?'':' tbd'}">${tA?.abbr||'TBD'}</span>
        </div>
        <div class="sb-block sb-block-r">
          ${tB?`<img class="sb-logo" src="${LP}${tB.logo}" alt="${tB.abbr}" onerror="this.style.display='none'">`:''}
          <span class="sb-team-name${tB?'':' tbd'}">${tB?.abbr||'TBD'}</span>
        </div>
        <div class="sb-center">
          <img class="sb-map-img" src="${MAPS_IMG}${mapInfo.id}.jpg" alt="${mapInfo.name}" onerror="this.style.display='none'">
          <div class="sb-map-name">${mapInfo.name}</div>
        </div>
        <div style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:6px">
          <span class="sb-score-l${winB?' lose':''}">${m.scoreA??0}</span>
          <span class="sb-score-sep">—</span>
          <span class="sb-score-r${winB?' win':''}">${m.scoreB??0}</span>
        </div>
        ${winA||winB?`<div class="map-result ${winA?'win-a':'win-b'}">${winA?(tA?.abbr||'A'):(tB?.abbr||'B')} 승</div>`:''}
      </div>`;

    // Round tracker
    const rounds = m.rounds||Array(24).fill(null);
    const rtHtml = buildRoundTracker(rounds, tA, tB, mi, admin);

    // Team stats
    const tsHtml = buildTeamStats(m, tA, tB);

    // Admin controls
    const adminHtml = admin ? `
      <div class="admin-bar visible">
        <span class="admin-label">Admin</span>
        <select class="adm-select" data-mi="${mi}" data-field="mapId" onchange="updateMapField(this)">
          ${MAPS.map(mp=>`<option value="${mp.id}"${mp.id===m.mapId?' selected':''}>${mp.name}</option>`).join('')}
        </select>
        <div class="adm-sep"></div>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase">스코어</span>
        <input class="adm-input" type="number" min="0" max="14" value="${m.scoreA??0}" placeholder="A" data-mi="${mi}" data-field="scoreA" onchange="updateMapField(this)">
        <span style="color:var(--muted2);font-size:12px">:</span>
        <input class="adm-input" type="number" min="0" max="14" value="${m.scoreB??0}" placeholder="B" data-mi="${mi}" data-field="scoreB" onchange="updateMapField(this)">
        <div class="adm-sep"></div>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase">승자</span>
        <select class="adm-select" data-mi="${mi}" data-field="winnerA" onchange="updateMapField(this)">
          <option value="">미결정</option>
          <option value="true"${m.winnerA===true?' selected':''}>${tA?.abbr||'Team A'}</option>
          <option value="false"${m.winnerA===false?' selected':''}>${tB?.abbr||'Team B'}</option>
        </select>
        <div class="adm-sep"></div>
        <button class="adm-btn" onclick="removeMap(${mi})">맵 삭제</button>
      </div>` : '';

    card.innerHTML = sbHtml + rtHtml + tsHtml + adminHtml;
    sec.appendChild(card);
  });

  // Add map btn at bottom (admin)
  if(admin && maps.length < (md.bo||3)){
    const addBtn = document.createElement('button');
    addBtn.style.cssText='font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.5rem 1.2rem;border-radius:3px;border:1px dashed rgba(255,34,68,.3);background:rgba(255,34,68,.07);color:rgba(255,34,68,.7);cursor:pointer;align-self:flex-start;transition:all .15s';
    addBtn.textContent='+ 맵 추가';
    addBtn.addEventListener('click',()=>{
      const d=loadMatch();
      d.maps.push({mapId:'abyss',scoreA:0,scoreB:0,winnerA:null,rounds:Array(24).fill(null)});
      saveMatch(d); init();
    });
    sec.appendChild(addBtn);
  }
}

function buildRoundTracker(rounds, tA, tB, mi, admin){
  const total = rounds.length || 24;
  const half  = Math.ceil(total/2);
  let hdr1='', hdr2='', rowA='', rowB='';
  for(let i=0;i<total;i++){
    const sep = i===half?' half-sep':'';
    hdr1+=`<div class="rt-hn${sep}">${i+1}</div>`;
    // Each round: null=empty, 'A_atk','A_def','B_atk','B_def'
    const rv = rounds[i];
    const cellClassA = rv==='A_atk'?'win-atk':rv==='A_def'?'win-def':rv==='B_atk'?'loss-atk':rv==='B_def'?'loss-def':'';
    const cellClassB = rv==='B_atk'?'win-atk':rv==='B_def'?'win-def':rv==='A_atk'?'loss-atk':rv==='A_def'?'loss-def':'';
    const atkSep = i===half?' half-sep':'';
    rowA+=`<div class="rt-cell${cellClassA?' '+cellClassA:''}${atkSep}"${admin?` onclick="cycleRound(${mi},${i})" title="클릭: 라운드 결과 변경"`:''}></div>`;
    rowB+=`<div class="rt-cell${cellClassB?' '+cellClassB:''}${atkSep}"></div>`;
  }
  const logoA = tA?`<img class="rt-logo" src="${LP}${tA.logo}" alt="${tA.abbr}" onerror="this.style.display='none'">`:'';
  const logoB = tB?`<img class="rt-logo" src="${LP}${tB.logo}" alt="${tB.abbr}" onerror="this.style.display='none'">`:'';
  return `<div class="rt-wrap">
    <div class="rt-left">
      <div class="rt-spacer"></div>
      <div class="rt-team-row"><div class="rt-accent"></div>${logoA}<span class="rt-name">${tA?.abbr||'TBD'}</span></div>
      <div class="rt-team-row"><div class="rt-accent" style="background:rgba(255,34,68,.3)"></div>${logoB}<span class="rt-name">${tB?.abbr||'TBD'}</span></div>
    </div>
    <div class="rt-rounds">
      <div class="rt-header">${hdr1}</div>
      <div class="rt-rows">
        <div class="rt-data-row">${rowA}</div>
        <div class="rt-data-row">${rowB}</div>
      </div>
    </div>
  </div>`;
}

function buildTeamStats(m, tA, tB){
  const stats = m.stats||[];
  if(!stats.length) return '';
  return `<div class="team-stats">
    ${tA?`<img class="ts-bg ts-bg-a" src="${LP}${tA.logo}" alt="">`:''}
    ${tB?`<img class="ts-bg ts-bg-b" src="${LP}${tB.logo}" alt="">`:''}
    <div class="ts-header">
      <div class="ts-label">${tA?.abbr||'TBD'}</div>
      <div class="ts-center-h">Team Stats</div>
      <div class="ts-label ts-label-r">${tB?.abbr||'TBD'}</div>
    </div>
    ${stats.map(s=>`
      <div class="ts-row">
        <div class="ts-val ts-val-a${s.aHi?' hi':' lo'}">${s.a}</div>
        <div class="ts-wrap"><div class="ts-stat-name">${s.name}</div></div>
        <div class="ts-val ts-val-b${s.bHi?' hi':' lo'}">${s.b}</div>
      </div>
      <div class="ts-divider"></div>`).join('')}
  </div>`;
}

// ── Admin actions ──
function updateMapField(el){
  const d = loadMatch();
  const mi = +el.dataset.mi;
  const field = el.dataset.field;
  let val = el.value;
  if(field==='winnerA') val = val===''?null:val==='true';
  else if(field==='scoreA'||field==='scoreB') val = parseInt(val)||0;
  if(!d.maps[mi]) return;
  d.maps[mi][field] = val;
  saveMatch(d); init();
}

function cycleRound(mi, ri){
  const d = loadMatch();
  if(!d.maps[mi]) return;
  const rounds = d.maps[mi].rounds||Array(24).fill(null);
  const seq = [null,'A_atk','A_def','B_atk','B_def'];
  const cur = rounds[ri];
  const next = seq[(seq.indexOf(cur)+1)%seq.length];
  rounds[ri] = next;
  d.maps[mi].rounds = rounds;
  saveMatch(d); init();
}

function removeMap(mi){
  if(!confirm(`Map ${mi+1} 삭제?`)) return;
  const d = loadMatch();
  d.maps.splice(mi,1);
  saveMatch(d); init();
}

init();
</script>
<script src="../auth.js"></script>
</body>
</html>
