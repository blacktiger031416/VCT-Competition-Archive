<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENA North Africa 1 Qualifier — VCT 2027 EMEA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#85E62C;--bg:#06060a;--s1:#0d0d14;
  --bdr:rgba(255,255,255,.07);
  --txt:#e4e4ee;--muted:rgba(228,228,238,.38);--muted2:rgba(228,228,238,.14);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(133,230,44,.045) 0%,transparent 65%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,transparent 1px,transparent 3px);
  pointer-events:none;z-index:1;opacity:.5}
#screen{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;
  transform:scaleY(.02);opacity:0;transform-origin:center;
  animation:crtOn .5s cubic-bezier(.16,1,.3,1) .05s forwards}
@keyframes crtOn{
  0%  {transform:scaleY(.02);filter:brightness(7);opacity:.85}
  18% {transform:scaleY(.02);filter:brightness(9)}
  32% {transform:scaleY(1);filter:brightness(2.8)}
  65% {filter:brightness(1.15)}
  100%{transform:scaleY(1);filter:brightness(1);opacity:1}}
@keyframes crtOff{
  0%  {transform:scaleY(1);filter:brightness(1);opacity:1}
  35% {transform:scaleY(1);filter:brightness(3.5) saturate(2)}
  55% {transform:scaleY(.04);filter:brightness(8) saturate(0)}
  80% {transform:scaleY(.02);filter:brightness(.5)}
  100%{transform:scaleY(0);filter:brightness(0);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 8px rgba(133,230,44,.2),0 0 20px rgba(133,230,44,.07)}
  50%    {box-shadow:0 0 16px rgba(133,230,44,.38),0 0 40px rgba(133,230,44,.13)}}
@keyframes matchIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── top bar ── */
#topbar{display:flex;align-items:center;gap:1rem;
  padding:.65rem 1.5rem;border-bottom:1px solid var(--bdr);
  background:rgba(6,6,10,.92);backdrop-filter:blur(8px);flex-shrink:0;position:relative;overflow:hidden}
#topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--g),transparent);opacity:.4}
.tb-back{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  text-decoration:none;border:1px solid rgba(255,255,255,.1);
  padding:4px 12px;border-radius:2px;transition:all .15s;flex-shrink:0}
.tb-back:hover{color:var(--g);border-color:rgba(133,230,44,.3)}
.tb-sep{width:1px;height:20px;background:var(--bdr);flex-shrink:0}
.tb-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--g);opacity:.65}
.tb-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;
  letter-spacing:.06em;text-transform:uppercase;color:var(--txt)}
.tb-right{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:10px;
  letter-spacing:.08em;color:var(--muted);text-transform:uppercase;white-space:nowrap}

/* ── layout ── */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:.6rem 1.5rem .4rem}

/* ── bracket ── */
.bracket-outer{flex:1;overflow:auto;position:relative;padding-bottom:.5rem}
.bracket-rnd-labels{display:flex;padding-bottom:.4rem;min-width:max-content}
.bcol-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted2);text-align:center;padding:.2rem 0}
.bracket-inner{position:relative;min-width:max-content}
.bracket-svg{position:absolute;top:0;left:0;pointer-events:none}
.bm-wrap{position:absolute}
.bcard{background:var(--s1);border:1px solid var(--bdr);border-radius:3px;
  width:200px;overflow:hidden;cursor:pointer;transition:border-color .15s;
  animation:matchIn .2s ease both}
.bcard:hover{border-color:rgba(133,230,44,.22)}
.bcard.has-result{border-color:rgba(133,230,44,.18)}
.bcard-row{display:flex;align-items:center;gap:.45rem;padding:.4rem .5rem;min-height:32px}
.bcard-row + .bcard-row{border-top:1px solid var(--bdr)}
.bcard-row.win{background:rgba(133,230,44,.045)}
.bcard-logo{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.bcard-logo img{width:100%;height:100%;object-fit:contain}
.bcard-logo-ph{width:18px;height:18px;border-radius:2px;background:var(--bdr)}
.bcard-info{flex:1;min-width:0}
.bcard-abbr{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;
  letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard-row.win .bcard-abbr{color:var(--g)}
.bcard-fullname{font-size:9px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard-score{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;
  color:var(--muted2);flex-shrink:0;min-width:14px;text-align:right}
.bcard-row.win .bcard-score{color:var(--g)}
.bcard-sep{height:1px;background:var(--bdr)}
.match-reset{background:rgba(255,255,255,.07);border:1px solid var(--bdr);
  color:var(--muted);border-radius:2px;cursor:pointer;line-height:1}
.match-reset:hover{color:var(--txt)}

/* ── winner banner ── */
.winner-wrap{display:flex;align-items:center;gap:.8rem;
  border:1px solid rgba(133,230,44,.25);border-radius:3px;
  padding:.6rem 1rem;background:rgba(133,230,44,.04);margin-top:.8rem}
.winner-logo{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.winner-logo img{width:100%;height:100%;object-fit:contain}
.winner-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--g);opacity:.7}
.winner-name{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;color:var(--txt)}
.winner-badge{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:9px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--g);border:1px solid rgba(133,230,44,.3);padding:3px 8px;border-radius:2px;
  background:rgba(133,230,44,.06);flex-shrink:0}

/* ── score overlay ── */
#scoreOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#scoreOverlay.open{opacity:1;pointer-events:all}
#scoreBox{background:#111118;border:1px solid rgba(133,230,44,.25);border-radius:4px;
  width:320px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7)}
.sb-header{display:flex;align-items:center;justify-content:space-between;
  padding:.7rem 1rem;border-bottom:1px solid var(--bdr);background:rgba(133,230,44,.04)}
.sb-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--g)}
.sb-close{background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;padding:2px}
.sb-close:hover{color:var(--txt)}
.sb-body{padding:.8rem 1rem}
.sb-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted2);margin-bottom:.4rem}
.sb-label:not(:first-child){margin-top:.8rem}
.sb-teams{display:flex;gap:.5rem;margin-bottom:.3rem}
.sb-team{flex:1;background:var(--s1);border:1px solid var(--bdr);border-radius:3px;
  color:var(--txt);cursor:pointer;padding:.5rem;text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.04em;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.sb-team:hover{border-color:rgba(133,230,44,.3)}
.sb-team.selected{border-color:var(--g);background:rgba(133,230,44,.08);color:var(--g)}
.sb-team-logo{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.sb-team-logo img{width:100%;height:100%;object-fit:contain}
.sb-logo-ph{width:28px;height:28px;border-radius:3px;background:var(--bdr)}
.sb-team-abbr{display:block;font-size:13px}
.sb-team-name{display:block;font-size:9px;color:var(--muted);font-weight:400;letter-spacing:.02em}
.sb-vs{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  color:var(--muted2);display:flex;align-items:center}
.sb-scores{display:flex;gap:.4rem}
.sb-score-btn{flex:1;background:var(--s1);border:1px solid var(--bdr);border-radius:3px;
  color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  padding:.45rem;cursor:pointer;transition:all .15s}
.sb-score-btn:hover{border-color:rgba(133,230,44,.3);color:var(--txt)}
.sb-score-btn.selected{border-color:var(--g);background:rgba(133,230,44,.08);color:var(--g)}
.sb-footer{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--bdr)}
.sb-btn{flex:1;padding:.5rem;border-radius:3px;border:1px solid var(--bdr);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.sb-btn.cancel{background:transparent;color:var(--muted)}
.sb-btn.cancel:hover{border-color:rgba(255,255,255,.2);color:var(--txt)}
.sb-btn.confirm{background:rgba(133,230,44,.1);border-color:rgba(133,230,44,.3);color:var(--g)}
.sb-btn.confirm:hover:not(:disabled){background:rgba(133,230,44,.18)}
.sb-btn.confirm:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
<div id="screen">
  <div id="topbar">
    <a class="tb-back" href="index.html" onclick="triggerCrtOff(event)">← BACK</a>
    <div class="tb-sep"></div>
    <div>
      <div class="tb-eyebrow">VCT 2027 · EMEA KICKOFF OQ · MENA</div>
      <div class="tb-title">NORTH AFRICA 1 QUALIFIER</div>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-right">32팀 · Single Elimination · 1팀 → OQ Playoff</div>
  </div>

  <div id="main">
    <div class="bracket-outer" id="bracketOuter">
      <div id="content"></div>
    </div>
  </div>
</div>

<!-- score overlay -->
<div id="scoreOverlay">
  <div id="scoreBox">
    <div class="sb-header">
      <div class="sb-title" id="sbTitle">결과 입력</div>
      <button class="sb-close" onclick="closeScoreModal()">✕</button>
    </div>
    <div class="sb-body">
      <div class="sb-label">승자 선택</div>
      <div class="sb-teams" id="sbTeams"></div>
      <div class="sb-label">스코어</div>
      <div class="sb-scores" id="sbScores">
        <button class="sb-score-btn" data-s="2-0" onclick="pickScore(this)">2 : 0</button>
        <button class="sb-score-btn" data-s="2-1" onclick="pickScore(this)">2 : 1</button>
        <button class="sb-score-btn" data-s="FF" onclick="pickScore(this)" style="letter-spacing:.08em">FF</button>
      </div>
    </div>
    <div class="sb-footer">
      <button class="sb-btn cancel" onclick="closeScoreModal()">취소</button>
      <button class="sb-btn confirm" id="sbConfirm" disabled>확인</button>
    </div>
  </div>
</div>

<script>
const DB_KEY = 'mena_na1_scores_v1';
const ALL_RNDS = ['r32','r16','r8','r4','f'];
const RND_FULL = {r32:'Round of 32',r16:'Round of 16',r8:'Round of 8',r4:'Semifinals',f:'Final'};

const ROUND_CFG = {
  r32:{matchCount:16, compact:true},
  r16:{matchCount:8,  compact:true},
  r8: {matchCount:4,  compact:true},
  r4: {matchCount:2},
  f:  {matchCount:1},
};

const L = (abbr) => `../assets/teams/VCT 2027/VCT EMEA/EMEA_OQ/MENA/${abbr}.png`;

function mkM(n) {
  return Array.from({length:n}, () => ({t1:null,t2:null,s1:null,s2:null,w:null}));
}

function mkT(abbr, name) { return {abbr, name, logo:L(abbr)}; }

const MATCHES = {
  r32: [
    {t1:mkT('ARGE','Argea'),             t2:mkT('LPZ','LPZ'),                      s1:null,s2:null,w:null},
    {t1:mkT('LG','Life Gamers'),          t2:mkT('PAYP','Payphone'),                s1:null,s2:null,w:null},
    {t1:mkT('PAPS','PapaSmurfs'),         t2:mkT('USMH','USMH ESPORTS'),           s1:null,s2:null,w:null},
    {t1:mkT('BAM','BAAM Esports'),        t2:mkT('LUNAR','Lunaria Esports'),        s1:null,s2:null,w:null},
    {t1:mkT('ATL','Atlas Legacy'),        t2:mkT('HEXT','Hextech Esports'),         s1:null,s2:null,w:null},
    {t1:mkT('ROGU','Rogue'),              t2:mkT('AA','Arena Academy'),             s1:null,s2:null,w:null},
    {t1:mkT('IMRC','Ifr9a MRC'),          t2:mkT('CHRO','Chronoclast'),             s1:null,s2:null,w:null},
    {t1:mkT('L9OL','L9OL'),               t2:mkT('SUPE','Super Games Esports'),     s1:null,s2:null,w:null},
    {t1:mkT('HOMI','Homixculus'),         t2:mkT('FRGA','Fruits Gang'),             s1:null,s2:null,w:null},
    {t1:mkT('NEGA','Negative'),           t2:mkT('EQAC','Equation Academy'),        s1:null,s2:null,w:null},
    {t1:mkT('EXCL','Exclamationmarks'),   t2:mkT('100TH','100Throwers'),            s1:null,s2:null,w:null},
    {t1:mkT('MIX','Mix My Miks'),         t2:mkT('OLYM','Olympique kasserine eSports'), s1:null,s2:null,w:null},
    {t1:mkT('R8','R8 Esports'),           t2:mkT('KASB','KASBAH eSPORTS'),          s1:null,s2:null,w:null},
    {t1:mkT('GMX','Gamax Esports'),       t2:mkT('ZYVR','ZYVRA'),                   s1:null,s2:null,w:null},
    {t1:mkT('GUGA','GUGUGAGA'),           t2:mkT('SROPS','Syrian Recon OPS'),       s1:null,s2:null,w:null},
    {t1:mkT('NEYA','Neya esports'),       t2:mkT('META','METAGAMING'),              s1:null,s2:null,w:null},
  ],
  r16: mkM(8),
  r8:  mkM(4),
  r4:  mkM(2),
  f:   mkM(1),
  winner: null,
};

/* 로고 자동 주입 */
ALL_RNDS.forEach(rnd => {
  MATCHES[rnd].forEach(m => {
    if (m.t1 && !m.t1.logo) m.t1.logo = L(m.t1.abbr);
    if (m.t2 && !m.t2.logo) m.t2.logo = L(m.t2.abbr);
  });
});

const BK = {SLOT_H:90, CARD_H:64, CARD_W:200, CONN_W:26};

function bCardTop(ri, mi) {
  const s = Math.pow(2, ri);
  return mi * s * BK.SLOT_H + (s * BK.SLOT_H - BK.CARD_H) / 2;
}
function bCenterY(ri, mi) {
  const s = Math.pow(2, ri);
  return mi * s * BK.SLOT_H + s * BK.SLOT_H / 2;
}

function propagateWinner(rnd, idx) {
  const nextRnd = ALL_RNDS[ALL_RNDS.indexOf(rnd) + 1];
  if (!nextRnd) return;
  const m = MATCHES[rnd][idx];
  const winner = m.w === 1 ? m.t1 : m.t2;
  const nextIdx = Math.floor(idx / 2);
  const slot = idx % 2 === 0 ? 't1' : 't2';
  MATCHES[nextRnd][nextIdx][slot] = winner ? {...winner} : null;
}

function clearPropagated(rnd, idx) {
  const nextRnd = ALL_RNDS[ALL_RNDS.indexOf(rnd) + 1];
  if (!nextRnd) return;
  const nextIdx = Math.floor(idx / 2);
  const slot = idx % 2 === 0 ? 't1' : 't2';
  const nm = MATCHES[nextRnd][nextIdx];
  nm[slot] = null;
  if (nm.w !== null) { nm.w = null; nm.s1 = null; nm.s2 = null; clearPropagated(nextRnd, nextIdx); }
  if (nextRnd === 'f') MATCHES.winner = null;
}

/* ── DB save/load ── */
function showSaveToast(state) {
  let t = document.getElementById('save-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'save-toast';
    t.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:700;z-index:9999;transition:opacity .4s;pointer-events:none';
    document.body.appendChild(t);
  }
  if (state === 'saving') { t.textContent = '저장 중...'; t.style.background='#555'; t.style.color='#fff'; }
  else if (state === 'ok') { t.textContent = '✓ 저장됨'; t.style.background='#85E62C'; t.style.color='#000'; }
  else { t.textContent = '⚠ 저장 실패'; t.style.background='#c00'; t.style.color='#fff'; }
  t.style.opacity = '1';
  clearTimeout(t._timer);
  if (state !== 'saving') t._timer = setTimeout(() => t.style.opacity='0', 2000);
}

function buildPayload() {
  const out = {};
  ALL_RNDS.forEach(rnd => {
    out[rnd] = MATCHES[rnd].map(m => ({
      t1: m.t1?{abbr:m.t1.abbr,name:m.t1.name}:null,
      t2: m.t2?{abbr:m.t2.abbr,name:m.t2.name}:null,
      s1:m.s1, s2:m.s2, w:m.w
    }));
  });
  out.winner = MATCHES.winner ? {abbr:MATCHES.winner.abbr,name:MATCHES.winner.name} : null;
  return JSON.stringify(out);
}

function applyData(raw) {
  if (!raw) return;
  try {
    const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!d) return;
    ALL_RNDS.forEach(rnd => {
      (d[rnd] || []).forEach((s, i) => {
        if (!MATCHES[rnd][i]) return;
        if (s.t1 && !MATCHES[rnd][i].t1) MATCHES[rnd][i].t1 = {...s.t1, logo:L(s.t1.abbr)};
        if (s.t2 && !MATCHES[rnd][i].t2) MATCHES[rnd][i].t2 = {...s.t2, logo:L(s.t2.abbr)};
        MATCHES[rnd][i].s1 = s.s1; MATCHES[rnd][i].s2 = s.s2; MATCHES[rnd][i].w = s.w;
      });
    });
    if (d.winner) MATCHES.winner = {abbr:d.winner.abbr, name:d.winner.name, logo:L(d.winner.abbr)};
  } catch(e) {}
}

function saveScores() {
  showSaveToast('saving');
  fetch('/api/data/' + encodeURIComponent(DB_KEY), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({value: buildPayload()})
  }).then(r=>r.json()).then(d => {
    if (d.ok) showSaveToast('ok'); else showSaveToast('err');
  }).catch(() => showSaveToast('err'));
}

function loadScores() {
  fetch('/api/data/' + encodeURIComponent(DB_KEY))
    .then(r=>r.json())
    .then(raw => { applyData(raw); renderContent(); })
    .catch(() => {});
}

/* ── bracket renderer ── */
function bCardRow(t, side, m) {
  const win = m.w === side;
  const score = side === 1 ? m.s1 : m.s2;
  const hasResult = m.w !== null;
  const logoHTML = t?.logo
    ? `<img src="${t.logo}" alt="" onerror="this.onerror=null;this.src='../assets/teams/VCT 2027/Base_Logo.png'">`
    : '<div class="bcard-logo-ph"></div>';
  return `<div class="bcard-row${win?' win':''}">
    <div class="bcard-logo">${logoHTML}</div>
    <div class="bcard-info">
      <div class="bcard-abbr">${t?.abbr ?? 'TBD'}</div>
      ${t?.name && t.name !== t?.abbr ? `<div class="bcard-fullname">${t.name}</div>` : ''}
    </div>
    ${hasResult ? `<div class="bcard-score">${score}</div>` : ''}
  </div>`;
}

function renderBracket() {
  const isAdmin = window.vctIsAdmin && window.vctIsAdmin();
  const totalH = MATCHES[ALL_RNDS[0]].length * BK.SLOT_H;
  const COL_STEP = BK.CARD_W + BK.CONN_W;
  const totalW = ALL_RNDS.length * COL_STEP - BK.CONN_W;

  let svgLines = '';
  let colsHTML = '';

  const labelsHTML = ALL_RNDS.map((rnd, vi) => {
    const mr = vi < ALL_RNDS.length - 1 ? BK.CONN_W : 0;
    return `<div style="width:${BK.CARD_W}px;flex-shrink:0;margin-right:${mr}px">
      <div class="bcol-label">${RND_FULL[rnd]}</div>
    </div>`;
  }).join('');

  ALL_RNDS.forEach((rnd, vi) => {
    const ri = vi;
    const matches = MATCHES[rnd];
    const colLeft = vi * COL_STEP;
    let cardsHTML = '';

    matches.forEach((m, mi) => {
      const top = bCardTop(ri, mi);
      const hasResult = m.w !== null;
      const ctx = `'${rnd}',${mi}`;
      const resetBtn = hasResult && isAdmin
        ? `<button class="match-reset" onclick="event.stopPropagation();resetMatch(${ctx})" style="position:absolute;top:2px;right:2px;font-size:9px;padding:0 4px">↺</button>` : '';

      cardsHTML += `<div class="bm-wrap" style="top:${top}px;left:0">
        <div class="bcard${hasResult?' has-result':''}" style="position:relative" onclick="openScoreModal(${ctx})">
          ${bCardRow(m.t1,1,m)}<div class="bcard-sep"></div>${bCardRow(m.t2,2,m)}${resetBtn}
        </div>
      </div>`;

      if (vi < ALL_RNDS.length - 1 && mi % 2 === 0 && mi + 1 < matches.length) {
        const topCY = bCenterY(ri, mi);
        const botCY = bCenterY(ri, mi + 1);
        const parCY = bCenterY(ri + 1, mi / 2);
        const srcX  = colLeft + BK.CARD_W;
        const jx    = srcX + BK.CONN_W * 0.5;
        const parX  = colLeft + COL_STEP;
        const c     = 'rgba(255,255,255,.09)';
        svgLines += `<line x1="${srcX}" y1="${topCY}" x2="${jx}" y2="${topCY}" stroke="${c}" stroke-width="1"/>`;
        svgLines += `<line x1="${srcX}" y1="${botCY}" x2="${jx}" y2="${botCY}" stroke="${c}" stroke-width="1"/>`;
        svgLines += `<line x1="${jx}" y1="${topCY}" x2="${jx}" y2="${botCY}" stroke="${c}" stroke-width="1"/>`;
        svgLines += `<line x1="${jx}" y1="${parCY}" x2="${parX}" y2="${parCY}" stroke="${c}" stroke-width="1"/>`;
      }
    });

    colsHTML += `<div style="position:relative;width:${BK.CARD_W}px;height:${totalH}px;flex-shrink:0;margin-right:${vi < ALL_RNDS.length-1 ? BK.CONN_W : 0}px">${cardsHTML}</div>`;
  });

  return `<div class="bracket-rnd-labels" style="width:${totalW}px">${labelsHTML}</div>
    <div class="bracket-inner" style="width:${totalW}px;height:${totalH}px">
      <svg class="bracket-svg" width="${totalW}" height="${totalH}">${svgLines}</svg>
      <div style="display:flex">${colsHTML}</div>
    </div>`;
}

function renderContent() {
  const w = MATCHES.winner;
  const winnerHTML = `<div class="winner-wrap" style="${w?'':'opacity:.35'}">
    <div class="winner-logo">${w?.logo ? `<img src="${w.logo}" alt="">` : '<span style="font-size:1.2rem">🏆</span>'}</div>
    <div>
      <div class="winner-label">WINNER → OQ Playoff</div>
      <div class="winner-name">${w?.name ?? '미정'}</div>
    </div>
    <div class="winner-badge">OQ Playoff 진출</div>
  </div>`;

  document.getElementById('content').innerHTML = renderBracket() + winnerHTML;
}

/* ── Score Modal ── */
let _modalCtx = null, _selWinner = null, _selScore = null;

function openScoreModal(rnd, idx) {
  if (!(window.vctIsAdmin && window.vctIsAdmin())) return;
  const m = MATCHES[rnd][idx];
  _modalCtx = {rnd, idx};
  _selWinner = m.w;
  _selScore = m.s1 !== null ? (m.s1==='W'||m.s1==='FF'?'FF':`${Math.max(m.s1,m.s2)}-${Math.min(m.s1,m.s2)}`) : null;

  document.getElementById('sbTitle').textContent = `${RND_FULL[rnd]} · MATCH ${String(idx+1).padStart(2,'0')}`;
  const t1 = m.t1, t2 = m.t2;
  document.getElementById('sbTeams').innerHTML = `
    <button class="sb-team${_selWinner===1?' selected':''}" onclick="pickWinner(1)">
      <div class="sb-team-logo">${t1?.logo?`<img src="${t1.logo}" onerror="this.onerror=null;this.src='../assets/teams/VCT 2027/Base_Logo.png'">`:'<div class="sb-logo-ph"></div>'}</div>
      <span class="sb-team-abbr">${t1?.abbr??'TBD'}</span>
      <span class="sb-team-name">${t1?.name??'미정'}</span>
    </button>
    <div class="sb-vs">VS</div>
    <button class="sb-team${_selWinner===2?' selected':''}" onclick="pickWinner(2)">
      <div class="sb-team-logo">${t2?.logo?`<img src="${t2.logo}" onerror="this.onerror=null;this.src='../assets/teams/VCT 2027/Base_Logo.png'">`:'<div class="sb-logo-ph"></div>'}</div>
      <span class="sb-team-abbr">${t2?.abbr??'TBD'}</span>
      <span class="sb-team-name">${t2?.name??'미정'}</span>
    </button>`;
  document.querySelectorAll('.sb-score-btn').forEach(b => b.classList.toggle('selected', b.dataset.s === _selScore));
  document.getElementById('sbConfirm').disabled = !(_selWinner && _selScore);
  document.getElementById('sbConfirm').onclick = confirmScore;
  document.getElementById('scoreOverlay').classList.add('open');
}

function pickWinner(side) {
  _selWinner = side;
  document.querySelectorAll('.sb-team').forEach((el,i) => el.classList.toggle('selected', i+1===side));
  document.getElementById('sbConfirm').disabled = !(_selWinner && _selScore);
}

function pickScore(btn) {
  _selScore = btn.dataset.s;
  document.querySelectorAll('.sb-score-btn').forEach(b => b.classList.toggle('selected', b===btn));
  document.getElementById('sbConfirm').disabled = !(_selWinner && _selScore);
}

function confirmScore() {
  if (!_selWinner || !_selScore) return;
  const {rnd, idx} = _modalCtx;
  const m = MATCHES[rnd][idx];
  m.w = _selWinner;
  if (_selScore === 'FF') {
    m.s1 = _selWinner===1?'W':'FF'; m.s2 = _selWinner===2?'W':'FF';
  } else {
    const [big,small] = _selScore.split('-').map(Number);
    m.s1 = _selWinner===1?big:small; m.s2 = _selWinner===2?big:small;
  }
  propagateWinner(rnd, idx);
  if (rnd === 'f') {
    const winner = _selWinner===1 ? m.t1 : m.t2;
    if (winner) MATCHES.winner = {...winner};
  }
  saveScores();
  closeScoreModal();
  renderContent();
}

function resetMatch(rnd, idx) {
  const m = MATCHES[rnd][idx];
  m.s1=null; m.s2=null; m.w=null;
  clearPropagated(rnd, idx);
  if (rnd==='f') MATCHES.winner=null;
  saveScores();
  renderContent();
}

function closeScoreModal() {
  document.getElementById('scoreOverlay').classList.remove('open');
  _modalCtx=null; _selWinner=null; _selScore=null;
}
document.getElementById('scoreOverlay').addEventListener('click', e => {
  if (e.target===document.getElementById('scoreOverlay')) closeScoreModal();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeScoreModal(); });

function triggerCrtOff(e) {
  e.preventDefault();
  const href = e.currentTarget.href;
  document.getElementById('screen').style.animation = 'crtOff .45s cubic-bezier(.55,0,1,.45) forwards';
  setTimeout(() => { window.location.href = href; }, 420);
}

renderContent();
loadScores();
</script>
<script src="../auth.js"></script>
</body>
</html>
