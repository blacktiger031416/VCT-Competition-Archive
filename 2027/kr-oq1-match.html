<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korea OQ 1 — 경기 상세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="../storage.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00D2BE;--bg:#030c0e;--s1:#0a1418;
  --bdr:rgba(0,210,190,.1);--bdr2:rgba(0,210,190,.22);
  --txt:#d8eeea;--muted:rgba(160,220,210,.42);--muted2:rgba(160,220,210,.14);
  --win-a:#00D2BE;--win-b:#00D2BE;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif}

body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 15% 30%,rgba(0,180,165,.12) 0%,transparent 65%),
    radial-gradient(ellipse 50% 50% at 88% 72%,rgba(55,8,110,.16) 0%,transparent 62%),
    radial-gradient(ellipse 40% 30% at 55% 100%,rgba(0,130,118,.06) 0%,transparent 55%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.04) 0,rgba(0,0,0,.04) 1px,transparent 1px,transparent 3px);
  pointer-events:none;z-index:1;opacity:.5}

#screen{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;
  transform:scaleY(.02);opacity:0;transform-origin:center;
  animation:crtOn .55s cubic-bezier(.16,1,.3,1) .08s forwards}
@keyframes crtOn{
  0%  {transform:scaleY(.02);filter:brightness(8);opacity:.9}
  18% {transform:scaleY(.02);filter:brightness(10)}
  34% {transform:scaleY(1);filter:brightness(2.5)}
  70% {filter:brightness(1.1)}
  100%{transform:scaleY(1);filter:brightness(1);opacity:1}}
@keyframes crtOff{
  0%  {transform:scaleY(1);filter:brightness(1);opacity:1}
  35% {transform:scaleY(1);filter:brightness(4) saturate(2)}
  55% {transform:scaleY(.04);filter:brightness(9) saturate(0)}
  80% {transform:scaleY(.02);filter:brightness(.4)}
  100%{transform:scaleY(0);filter:brightness(0);opacity:0}}

/* ── top bar ── */
#topbar{
  flex-shrink:0;display:flex;align-items:center;gap:.7rem;
  padding:.55rem 1.2rem;
  background:rgba(3,12,14,.92);border-bottom:1px solid var(--bdr);
  position:relative;z-index:20}
.tb-back{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;
  padding:.3rem .6rem;border:1px solid var(--bdr);border-radius:3px;
  transition:all .15s;white-space:nowrap;flex-shrink:0}
.tb-back:hover{color:var(--g);border-color:var(--bdr2)}
.tb-sep{width:1px;height:28px;background:var(--bdr);flex-shrink:0}
.tb-logo{height:28px;width:auto;flex-shrink:0;opacity:.85}
.tb-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:rgba(0,210,190,.5)}
.tb-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;color:var(--txt);line-height:1.1}
.tb-match-id{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:11px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  flex-shrink:0}

/* ── body ── */
#body{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0}
#body::-webkit-scrollbar{width:3px}
#body::-webkit-scrollbar-thumb{background:rgba(0,210,190,.2);border-radius:2px}

/* ── scoreboard ── */
#scoreboard{
  position:relative;overflow:hidden;
  height:220px;
  background:linear-gradient(135deg,rgba(0,25,22,.95) 0%,rgba(10,20,24,.97) 50%,rgba(0,25,22,.95) 100%);
  border-bottom:1px solid var(--bdr)}
#scoreboard::before{content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 80% at 20% 50%,rgba(0,210,190,.09) 0%,transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 50%,rgba(0,210,190,.06) 0%,transparent 60%),
    repeating-linear-gradient(to bottom,rgba(0,210,190,.007) 0,rgba(0,210,190,.007) 1px,transparent 1px,transparent 4px);
  pointer-events:none;z-index:0}
#scoreboard::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,210,190,.5) 40%,rgba(0,210,190,.8) 50%,rgba(0,210,190,.5) 60%,transparent)}
.sb-bg-text{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:'Barlow Condensed',sans-serif;font-size:clamp(50px,10vw,120px);
  font-weight:900;letter-spacing:.3em;
  text-transform:uppercase;color:transparent;
  -webkit-text-stroke:1px rgba(0,210,190,.04);
  white-space:nowrap;pointer-events:none;user-select:none;z-index:0}

.sb-layout{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  height:100%;gap:0;padding:0 2rem}

.sb-team-block{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.sb-team-block.t1{align-items:flex-end;padding-right:2.5rem}
.sb-team-block.t2{align-items:flex-start;padding-left:2.5rem}

.sb-logo-wrap{
  width:72px;height:72px;border-radius:6px;
  border:1px solid rgba(0,210,190,.15);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:rgba(0,210,190,.04);transition:border-color .3s}
.sb-logo-wrap.win{border-color:rgba(0,210,190,.45);
  box-shadow:0 0 20px rgba(0,210,190,.2)}
.sb-logo-wrap img{width:100%;height:100%;object-fit:contain}
.sb-team-name{
  font-family:'Barlow Condensed',sans-serif;font-size:clamp(18px,3vw,28px);
  font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txt);text-align:center;transition:color .3s}
.sb-team-name.win{color:var(--g)}
.sb-team-fullname{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:400;
  letter-spacing:.08em;color:var(--muted);text-align:center}
.sb-win-badge{
  font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;border-radius:2px;
  background:rgba(0,210,190,.12);color:var(--g);border:1px solid rgba(0,210,190,.3)}
.sb-loss-badge{
  font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;border-radius:2px;
  background:transparent;color:var(--muted2);border:1px solid var(--bdr)}

.sb-center{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.sb-score{
  font-family:'Barlow Condensed',sans-serif;font-size:clamp(44px,7vw,72px);
  font-weight:900;letter-spacing:.04em;color:var(--txt);line-height:1;
  display:flex;align-items:center;gap:.3em}
.sb-score .sc-num{color:var(--txt);transition:color .3s}
.sb-score .sc-num.win{color:var(--g)}
.sb-score .sc-sep{color:var(--muted2);font-size:.7em}
.sb-format{
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sb-match-label{
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(0,210,190,.4)}

/* ── content area ── */
#content{max-width:760px;margin:0 auto;padding:1.6rem 1.2rem 2rem}

/* ── section header ── */
.sect-label{
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.8rem}

/* ── game card ── */
.game-card{
  border:1px solid var(--bdr);border-radius:4px;overflow:hidden;
  background:var(--s1)}
.gc-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.5rem .9rem;background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--bdr)}
.gc-game-num{
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.gc-map-name{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--txt)}
.gc-map-btn{
  background:none;border:1px solid var(--bdr);border-radius:2px;
  cursor:pointer;padding:1px 6px;
  font-family:'Barlow Condensed',sans-serif;font-size:7px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  transition:all .15s}
.gc-map-btn:hover{border-color:rgba(0,210,190,.3);color:var(--g)}

.gc-score-row{
  display:flex;align-items:center;justify-content:center;
  padding:1.6rem 2rem;gap:1.5rem}
.gc-team-col{display:flex;flex-direction:column;align-items:center;gap:.4rem;flex:1}
.gc-team-col.t1{align-items:flex-end}
.gc-team-col.t2{align-items:flex-start}
.gc-team-abbr{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gc-team-abbr.win{color:var(--g)}
.gc-round-score{
  font-family:'Barlow Condensed',sans-serif;font-size:clamp(32px,5vw,48px);
  font-weight:900;color:var(--txt);line-height:1;transition:color .3s}
.gc-round-score.win{color:var(--g)}
.gc-round-score.ff{font-size:clamp(16px,2.5vw,24px);color:var(--muted)}
.gc-score-sep{
  font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;
  color:var(--muted2);flex-shrink:0}

/* no result state */
.gc-no-result{
  text-align:center;padding:2rem;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}

/* ── map edit modal ── */
#mapOverlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
  align-items:center;justify-content:center}
#mapOverlay.open{display:flex}
#mapBox{
  background:#0a1418;border:1px solid rgba(0,210,190,.35);border-radius:6px;
  width:min(320px,90vw);overflow:hidden;position:relative}
#mapBox::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--g)}
.mb-header{
  padding:.7rem 1rem;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between}
.mb-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;color:var(--txt)}
.mb-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}
.mb-close:hover{color:var(--txt)}
.mb-body{padding:.9rem 1rem}
.mb-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.mb-input{
  width:100%;padding:.45rem .7rem;
  background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:3px;
  font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--txt);outline:none;transition:border-color .15s}
.mb-input:focus{border-color:rgba(0,210,190,.4)}
.mb-presets{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem}
.mb-preset{
  padding:.25rem .6rem;border:1px solid var(--bdr);border-radius:3px;
  background:transparent;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  transition:all .15s}
.mb-preset:hover{border-color:rgba(0,210,190,.3);color:var(--g)}
.mb-footer{display:flex;gap:.5rem;padding:.7rem 1rem;border-top:1px solid var(--bdr)}
.mb-btn{flex:1;padding:.5rem;border-radius:3px;border:1px solid var(--bdr);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.mb-btn.cancel{background:transparent;color:var(--muted)}
.mb-btn.cancel:hover{border-color:rgba(255,255,255,.2);color:var(--txt)}
.mb-btn.confirm{background:rgba(0,210,190,.12);color:var(--g);border-color:rgba(0,210,190,.4)}
.mb-btn.confirm:hover{background:rgba(0,210,190,.22)}

/* ── pending state ── */
#pending{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:calc(100vh - 60px);gap:1rem;
  font-family:'Barlow Condensed',sans-serif;color:var(--muted);letter-spacing:.1em}
#pending .p-title{font-size:14px;font-weight:700;text-transform:uppercase}
#pending .p-sub{font-size:11px}
</style>
</head>
<body>
<div id="screen">

  <div id="topbar">
    <a class="tb-back" id="backBtn" href="kr-oq1-qualifier.html">← 브래킷</a>
    <div class="tb-sep"></div>
    <img class="tb-logo" src="../assets/vct-pacific.webp" alt="VCT Pacific">
    <div>
      <div class="tb-eyebrow">VCT 2027 · PACIFIC KICKOFF OQ · KOREA</div>
      <div class="tb-title" id="tbTitle">KR OPEN QUALIFIER 1 — 경기 상세</div>
    </div>
    <div class="tb-match-id" id="tbMatchId"></div>
  </div>

  <!-- content injected here -->
  <div id="body">
    <div id="pending">
      <div class="p-title">데이터 로딩 중…</div>
      <div class="p-sub">잠시 기다려주세요</div>
    </div>
  </div>

</div>

<!-- map edit modal -->
<div id="mapOverlay">
  <div id="mapBox">
    <div class="mb-header">
      <div class="mb-title">맵 선택</div>
      <button class="mb-close" onclick="closeMapModal()">✕</button>
    </div>
    <div class="mb-body">
      <div class="mb-label">맵 이름</div>
      <input class="mb-input" id="mapInput" placeholder="예: Ascent" maxlength="30">
      <div class="mb-presets" id="mapPresets"></div>
    </div>
    <div class="mb-footer">
      <button class="mb-btn cancel" onclick="closeMapModal()">취소</button>
      <button class="mb-btn confirm" onclick="saveMap()">확인</button>
    </div>
  </div>
</div>

<script>
/* ── URL params ── */
const P      = new URLSearchParams(location.search);
const GRP    = P.get('grp') || 'A';
const RND    = P.get('rnd') || 'r32';
const IDX    = parseInt(P.get('idx') ?? '0', 10);
const DB_KEY      = 'kr_oq1_scores_v1';
const MAP_DB_KEY  = 'kr_oq1_mapdata_v1';

const RND_FULL = {
  r32:'ROUND OF 32', r16:'ROUND OF 16', r8:'QUARTERFINALS',
  r4:'SEMIFINALS', r2:'FINAL'
};
const RND_SHORT = {r32:'R032',r16:'R016',r8:'QF',r4:'SF',r2:'FINAL'};

/* ── logo map ── */
const LP = '../assets/teams/VCT 2027/VCT Pacific/Pacific_OQ/Korea/';
const BASE_LOGO = '../assets/teams/VCT 2027/Base_Logo.png';
const LOGO_FILES = {DK:'DK.png', CNE:'CNE.png', SRP:'SRP.png'};
function getLogoSrc(abbr) {
  return LOGO_FILES[abbr] ? LP + LOGO_FILES[abbr] : BASE_LOGO;
}

/* ── round label helper ── */
function mapKey() { return `${GRP}_${RND}_${IDX}`; }

/* ── VAL maps for preset ── */
const VAL_MAPS = ['Ascent','Bind','Breeze','Corrode','Fracture','Haven',
  'Icebox','Lotus','Pearl','Split','Sunset','Abyss'];

/* ── state ── */
let matchData = null;  // {t1,t2,s1,s2,w}
let mapName = '';
let isAdmin = false;

/* ── init ── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tbMatchId').textContent =
    `GROUP ${GRP} · ${RND_FULL[RND] || RND} · MATCH ${String(IDX+1).padStart(2,'0')}`;

  // back btn CRT effect
  document.getElementById('backBtn').addEventListener('click', e => {
    e.preventDefault();
    const href = e.currentTarget.href;
    document.getElementById('screen').style.animation = 'crtOff .4s ease forwards';
    setTimeout(() => { location.href = href; }, 420);
  });

  // keyboard shortcut
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMapModal(); });
  document.getElementById('mapOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('mapOverlay')) closeMapModal();
  });
});

/* ── load data ── */
(window.storageReady || Promise.resolve()).then(() => {
  isAdmin = window.vctIsAdmin ? window.vctIsAdmin() : false;
  Promise.all([
    fetch('/api/data/' + encodeURIComponent(DB_KEY)).then(r => r.json()).catch(() => null),
    fetch('/api/data/' + encodeURIComponent(MAP_DB_KEY)).then(r => r.json()).catch(() => null),
  ]).then(([bracketRaw, mapRaw]) => {
    // parse bracket data
    if (bracketRaw) {
      try {
        const data = typeof bracketRaw === 'string' ? JSON.parse(bracketRaw) : bracketRaw;
        const rndArr = data?.[GRP]?.[RND];
        if (rndArr && rndArr[IDX]) matchData = rndArr[IDX];
      } catch(e) {}
    }

    // parse map data
    if (mapRaw) {
      try {
        const md = typeof mapRaw === 'string' ? JSON.parse(mapRaw) : mapRaw;
        mapName = md?.[mapKey()] || '';
      } catch(e) {}
    }

    renderPage();
  });
});

/* ── render ── */
function renderPage() {
  const body = document.getElementById('body');
  if (!matchData || (!matchData.t1 && !matchData.t2)) {
    body.innerHTML = `<div id="pending">
      <div class="p-title">경기 미확정</div>
      <div class="p-sub">아직 대진표가 확정되지 않았습니다</div>
    </div>`;
    return;
  }

  const m = matchData;
  const t1 = m.t1, t2 = m.t2;
  const hasResult = m.w !== null && m.w !== undefined;
  const w1 = hasResult && m.w === 1;
  const w2 = hasResult && m.w === 2;
  const sc1 = hasResult ? (w1 ? 1 : 0) : null;
  const sc2 = hasResult ? (w2 ? 1 : 0) : null;

  // round score display
  const r1 = m.s1, r2 = m.s2;
  const isFF = r1 === 'W' || r1 === 'FF' || r2 === 'W' || r2 === 'FF';
  const hasRoundScore = typeof r1 === 'number' && typeof r2 === 'number';

  const logoSrc1 = t1 ? getLogoSrc(t1.abbr) : BASE_LOGO;
  const logoSrc2 = t2 ? getLogoSrc(t2.abbr) : BASE_LOGO;

  body.innerHTML = `
    <!-- scoreboard -->
    <div id="scoreboard">
      <div class="sb-bg-text">KOREA</div>
      <div class="sb-layout">
        <div class="sb-team-block t1">
          ${hasResult ? `<div class="${w1?'sb-win-badge':'sb-loss-badge'}">${w1?'승리':'패배'}</div>` : ''}
          <div class="sb-logo-wrap${w1?' win':''}">
            <img src="${logoSrc1}" alt="${t1?.abbr||''}" onerror="this.src='${BASE_LOGO}'">
          </div>
          <div class="sb-team-name${w1?' win':''}">${t1?.abbr ?? 'TBD'}</div>
          ${t1?.name && t1.name !== t1.abbr ? `<div class="sb-team-fullname">${t1.name}</div>` : ''}
        </div>

        <div class="sb-center">
          <div class="sb-match-label">GROUP ${GRP} · ${RND_FULL[RND]||RND} · MATCH ${String(IDX+1).padStart(2,'0')}</div>
          ${hasResult
            ? `<div class="sb-score">
                <span class="sc-num${w1?' win':''}">${sc1}</span>
                <span class="sc-sep">:</span>
                <span class="sc-num${w2?' win':''}">${sc2}</span>
               </div>`
            : `<div class="sb-score"><span class="sc-sep" style="font-size:.6em;color:var(--muted)">VS</span></div>`}
          <div class="sb-format">Bo1</div>
        </div>

        <div class="sb-team-block t2">
          ${hasResult ? `<div class="${w2?'sb-win-badge':'sb-loss-badge'}">${w2?'승리':'패배'}</div>` : ''}
          <div class="sb-logo-wrap${w2?' win':''}">
            <img src="${logoSrc2}" alt="${t2?.abbr||''}" onerror="this.src='${BASE_LOGO}'">
          </div>
          <div class="sb-team-name${w2?' win':''}">${t2?.abbr ?? 'TBD'}</div>
          ${t2?.name && t2.name !== t2.abbr ? `<div class="sb-team-fullname">${t2.name}</div>` : ''}
        </div>
      </div>
    </div>

    <!-- content -->
    <div id="content">
      <div class="sect-label">GAME 1</div>
      <div class="game-card">
        <div class="gc-header">
          <div class="gc-game-num">GAME 1 · Bo1</div>
          <div class="gc-map-name" id="gcMapName">${mapName || '—'}</div>
          ${isAdmin ? `<button class="gc-map-btn" onclick="openMapModal()">맵 수정</button>` : ''}
        </div>
        <div class="gc-score-row">
          <div class="gc-team-col t1">
            <div class="gc-team-abbr${w1?' win':''}">${t1?.abbr ?? '—'}</div>
            <div class="gc-round-score${w1?' win':''}${isFF?' ff':''}">
              ${isFF ? (m.s1 === 'W' ? 'W' : 'FF') : (hasRoundScore ? r1 : (hasResult ? (w1?'W':'-') : '—'))}
            </div>
          </div>
          <div class="gc-score-sep">:</div>
          <div class="gc-team-col t2">
            <div class="gc-team-abbr${w2?' win':''}">${t2?.abbr ?? '—'}</div>
            <div class="gc-round-score${w2?' win':''}${isFF?' ff':''}">
              ${isFF ? (m.s2 === 'W' ? 'W' : 'FF') : (hasRoundScore ? r2 : (hasResult ? (w2?'W':'-') : '—'))}
            </div>
          </div>
        </div>
        ${!hasResult ? `<div class="gc-no-result">경기 결과 미입력</div>` : ''}
      </div>
    </div>`;
}

/* ── map modal ── */
function openMapModal() {
  if (!isAdmin) return;
  document.getElementById('mapInput').value = mapName;
  // build preset buttons
  document.getElementById('mapPresets').innerHTML = VAL_MAPS.map(m =>
    `<button class="mb-preset" onclick="document.getElementById('mapInput').value='${m}'">${m}</button>`
  ).join('');
  document.getElementById('mapOverlay').classList.add('open');
  setTimeout(() => document.getElementById('mapInput').focus(), 60);
}

function closeMapModal() {
  document.getElementById('mapOverlay').classList.remove('open');
}

function saveMap() {
  const val = document.getElementById('mapInput').value.trim();
  mapName = val;

  // persist to DB
  fetch('/api/data/' + encodeURIComponent(MAP_DB_KEY))
    .then(r => r.json()).catch(() => null)
    .then(raw => {
      let md = {};
      try { md = typeof raw === 'string' ? JSON.parse(raw) : (raw || {}); } catch(e) {}
      md[mapKey()] = val;
      fetch('/api/data/' + encodeURIComponent(MAP_DB_KEY), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({value:JSON.stringify(md)})
      }).catch(() => {});
    });

  const el = document.getElementById('gcMapName');
  if (el) el.textContent = val || '—';
  closeMapModal();
}
</script>
<script src="../auth.js"></script>
</body>
</html>
