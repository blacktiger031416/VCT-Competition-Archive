<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Threshold — VCT 2027 CN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF2244;--red-hi:#ff4466;
  --glow:rgba(255,34,68,.3);--glow2:rgba(255,34,68,.1);
  --bg:#06060a;--s1:#0d0d14;--s2:#12121a;
  --bdr:rgba(255,255,255,.07);
  --txt:#e4e4ee;--muted:rgba(228,228,238,.38);--muted2:rgba(228,228,238,.16);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;position:relative}

/* ambient */
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%,rgba(255,34,68,.065) 0%,transparent 65%),
    radial-gradient(ellipse 35% 45% at 5% 90%, rgba(255,34,68,.04) 0%,transparent 55%),
    radial-gradient(ellipse 35% 45% at 95% 10%,rgba(255,34,68,.04) 0%,transparent 55%);
  pointer-events:none;z-index:0}
/* scanlines */
body::after{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,transparent 1px,transparent 3px);
  pointer-events:none;z-index:1;opacity:.55}

/* ── CRT wrapper ── */
#screen{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;
  transform:scaleY(.02);opacity:0;transform-origin:center;
  animation:crtOn .55s cubic-bezier(.16,1,.3,1) .08s forwards}
#screen::after{content:'';position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(to bottom,transparent,rgba(255,80,100,.55),transparent);
  animation:scanSweep .65s .35s linear forwards;z-index:100;opacity:0}

@keyframes crtOn{
  0%  {transform:scaleY(.02);filter:brightness(7);opacity:.85}
  18% {transform:scaleY(.02);filter:brightness(9)}
  32% {transform:scaleY(1);filter:brightness(2.8)}
  65% {filter:brightness(1.15)}
  100%{transform:scaleY(1);filter:brightness(1);opacity:1}}
@keyframes crtOff{
  0%  {transform:scaleY(1);filter:brightness(1);opacity:1}
  35% {transform:scaleY(1);filter:brightness(3.5) saturate(2)}
  55% {transform:scaleY(.04);filter:brightness(8) saturate(0)}
  80% {transform:scaleY(.02);filter:brightness(.5)}
  100%{transform:scaleY(0);filter:brightness(0);opacity:0}}
@keyframes scanSweep{0%{top:-5px;opacity:1}100%{top:100%;opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 8px var(--glow),0 0 20px var(--glow2),inset 0 0 20px rgba(255,34,68,.03)}
  50%    {box-shadow:0 0 14px var(--glow),0 0 35px var(--glow2),0 0 60px rgba(255,34,68,.06),inset 0 0 30px rgba(255,34,68,.05)}}
@keyframes glitchH{
  0%  {transform:translateX(0)   scaleY(1)}
  15% {transform:translateX(-6px) scaleY(1.002)}
  30% {transform:translateX(8px)  scaleY(.998)}
  45% {transform:translateX(-4px) scaleY(1.003)}
  60% {transform:translateX(5px)  scaleY(.997)}
  75% {transform:translateX(-3px) scaleY(1)}
  100%{transform:translateX(0)   scaleY(1)}}
@keyframes rgbSplit{
  0%  {text-shadow:0 0 0 transparent}
  20% {text-shadow:-4px 0 rgba(255,0,60,.7), 4px 0 rgba(0,200,255,.5)}
  50% {text-shadow:3px 0 rgba(255,0,60,.8), -3px 0 rgba(0,200,255,.6)}
  80% {text-shadow:-2px 0 rgba(255,0,60,.4), 2px 0 rgba(0,200,255,.3)}
  100%{text-shadow:0 0 0 transparent}}
@keyframes flashRed{
  0%  {opacity:0}
  20% {opacity:.65}
  45% {opacity:.3}
  65% {opacity:.8}
  85% {opacity:.2}
  100%{opacity:1}}

/* ── Nav transition overlay ── */
#nav-overlay{
  position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:linear-gradient(135deg,#000 0%,#0a0005 50%,#000 100%);
  opacity:0;transition:opacity .05s}
#nav-overlay.active{pointer-events:all}
#nav-overlay .nl{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(to right,transparent,var(--red),transparent);
  animation:nlScan .3s linear infinite;opacity:0}
@keyframes nlScan{0%{top:0}100%{top:100%}}
#nav-overlay .nr{
  position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(255,34,68,.04) 0,rgba(255,34,68,.04) 1px,transparent 1px,transparent 4px);
  opacity:0}
/* CRT off state applied to #screen */
#screen.crt-off{
  animation:crtOff .42s cubic-bezier(.4,0,1,1) forwards;
  pointer-events:none}

/* ── Header ── */
.hdr{flex-shrink:0;padding:.85rem 1.5rem .8rem;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--bdr);position:relative;
  background:linear-gradient(to bottom,rgba(6,6,10,1) 60%,rgba(6,6,10,0));
  animation:fadeUp .4s .48s both}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(to right,var(--red) 0%,transparent 50%,var(--red) 100%);opacity:.28}
.hdr-left{display:flex;align-items:center;gap:.75rem}
.back-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  background:none;border:none;cursor:pointer;padding:.3rem;transition:color .15s}
.back-btn:hover{color:#fff}
.sep{width:1px;height:18px;background:var(--bdr)}
.cn-badge{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.15em;background:var(--red);color:#fff;padding:2px 7px;border-radius:2px}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:900;
  text-transform:uppercase;letter-spacing:.06em;color:#fff}
.hdr-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:.4rem;margin-left:2.5rem}
.wtab{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:.35rem .85rem;border-radius:3px;
  border:1px solid rgba(255,255,255,.08);background:transparent;color:var(--muted);
  cursor:pointer;transition:all .18s;white-space:nowrap}
.wtab.on{background:var(--red);border-color:var(--red);color:#fff;
  box-shadow:0 0 14px var(--glow)}
.wtab:not(.on):hover{color:#fff;border-color:rgba(255,255,255,.2)}

/* ── Bracket area ── */
.bracket-area{flex:1;overflow:auto;display:flex;align-items:center;justify-content:flex-start;
  padding:1rem 1.2rem;position:relative;
  animation:fadeUp .4s .62s both}
.bracket-area::-webkit-scrollbar{height:5px}
.bracket-area::-webkit-scrollbar-thumb{background:rgba(255,34,68,.25);border-radius:2px}

/* ── Bracket grid ── */
#bracket{display:grid;grid-template-columns:220px 44px 220px 44px 220px 44px 220px;
  grid-template-rows:auto 1fr;width:max-content;min-width:100%;
  height:100%;position:relative}

/* round labels row */
.rlabel{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--red);
  padding:.2rem 0 .6rem;text-align:center;grid-row:1}

/* round columns */
.rcol{grid-row:2;display:flex;flex-direction:column;
  justify-content:space-around;position:relative;padding:.2rem 0}

/* connector column */
.ccol{grid-row:2;position:relative}
.ccol svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* ── Match card ── */
.mg{position:relative;display:flex;flex-direction:column;align-items:stretch}
.mc{background:var(--s1);border:1px solid rgba(255,255,255,.08);border-radius:4px;
  overflow:hidden;position:relative;transition:border-color .2s,box-shadow .2s;width:100%}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,var(--red),rgba(255,34,68,.2));opacity:.4}
.mc[data-href]{cursor:pointer}
.mc:hover{border-color:rgba(255,34,68,.4);
  box-shadow:0 0 16px rgba(255,34,68,.14),0 4px 20px rgba(0,0,0,.4)}
.mc.gf-card{border-color:rgba(255,34,68,.2);
  animation:glowPulse 3.2s ease-in-out infinite}
.mc.gf-card::before{opacity:1;width:3px}

.tr{display:flex;align-items:center;gap:.5rem;padding:.42rem .65rem;
  border-bottom:1px solid var(--bdr);position:relative;transition:background .15s}
.tr:last-child{border-bottom:none}
.tr.win{background:rgba(255,34,68,.09)}
.tr.loss .tname{color:var(--muted)}
.tr.loss .tlogo{opacity:.4}

.tlogo{width:22px;height:22px;flex-shrink:0;border-radius:3px;overflow:hidden;
  background:var(--s2);display:flex;align-items:center;justify-content:center}
.tlogo img{width:100%;height:100%;object-fit:contain}
.tlogo .qi{font-family:'Barlow Condensed',sans-serif;font-size:11px;
  font-weight:700;color:var(--muted2)}
.tname{font-family:'Barlow Condensed',sans-serif;font-size:12.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname.tbd{color:var(--muted2);font-weight:400;font-style:italic;letter-spacing:.02em}
.score{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;
  min-width:14px;text-align:right;color:var(--muted)}
.tr.win .score{color:#fff}
.tr.win .tname{color:#fff}

.mtime{display:none}

/* seeded indicator */
.seed-tag{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,34,68,.6);
  position:absolute;right:.5rem;top:.22rem}

/* ── Footer ── */
.ftr{flex-shrink:0;padding:.5rem 1.5rem;border-top:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;
  animation:fadeUp .4s .78s both}
.ftr-info{font-family:'Barlow Condensed',sans-serif;font-size:9.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}
.ftr-brand{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,34,68,.5)}
</style>
</head>
<body>
<div id="nav-overlay"><div class="nl"></div><div class="nr"></div></div>
<div id="screen">

  <div class="hdr site-header">
    <div class="hdr-left">
      <button class="back-btn" onclick="history.back()">← VCT 2027</button>
      <div class="sep"></div>
      <span class="cn-badge">CN OQ</span>
      <div>
        <div class="hdr-title">China Threshold</div>
        <div class="hdr-sub">KickOff Open Qualifier · China</div>
      </div>
    </div>
    <div class="hdr-right" id="hdrRight">
      <button class="wtab on" id="w1btn" onclick="switchWeek(1)">Week 1</button>
      <button class="wtab"    id="w2btn" onclick="switchWeek(2)">Week 2</button>
    </div>
  </div>

  <div class="bracket-area">
    <div id="bracket"></div>
  </div>

  <div class="ftr">
    <span class="ftr-info">All times KST · Single Elimination · 12 Teams</span>
    <span class="ftr-brand">VCT 2027</span>
  </div>

</div>
<style>
/* ── Admin edit indicator ── */
.tr.editable{cursor:pointer}
.tr.editable:hover{background:rgba(255,34,68,.07)}
.edit-hint{font-size:9px;color:rgba(255,34,68,.4);margin-left:auto;flex-shrink:0;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.05em;
  opacity:0;transition:opacity .15s}
.tr.editable:hover .edit-hint{opacity:1}
/* ── Team picker overlay ── */
#pickerOverlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center}
#pickerOverlay.open{display:flex}
#pickerBox{background:#0d0d14;border:1px solid rgba(255,34,68,.3);border-radius:6px;
  padding:1.2rem;width:min(520px,92vw);max-height:80vh;overflow-y:auto;
  box-shadow:0 0 40px rgba(255,34,68,.15)}
.picker-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(255,34,68,.7);
  margin-bottom:.85rem;display:flex;align-items:center;justify-content:space-between}
.picker-close-btn{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;
  font-size:14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  transition:color .15s}
.picker-close-btn:hover{color:#fff}
#pickerGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem}
.picker-team{display:flex;align-items:center;gap:.55rem;padding:.5rem .7rem;
  border:1px solid rgba(255,255,255,.08);border-radius:4px;cursor:pointer;
  background:rgba(255,255,255,.03);transition:all .15s}
.picker-team:hover:not(.used){border-color:rgba(255,34,68,.4);
  background:rgba(255,34,68,.09)}
.picker-team.used{opacity:.3;cursor:not-allowed}
.picker-team .pt-logo{width:24px;height:24px;border-radius:3px;overflow:hidden;
  background:rgba(255,255,255,.06);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.picker-team .pt-logo img{width:100%;height:100%;object-fit:contain}
.picker-team .pt-name{font-family:'Barlow Condensed',sans-serif;font-size:12px;
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.picker-team .pt-full{font-family:'Barlow',sans-serif;font-size:9px;
  color:rgba(255,255,255,.3);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.picker-team-clear{display:flex;align-items:center;justify-content:center;
  padding:.5rem;border:1px dashed rgba(255,255,255,.12);border-radius:4px;
  cursor:pointer;color:rgba(255,255,255,.25);font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  transition:all .15s;grid-column:1/-1}
.picker-team-clear:hover{border-color:rgba(255,34,68,.3);color:rgba(255,34,68,.6)}
</style>
<!-- Team Picker -->
<div id="pickerOverlay">
  <div id="pickerBox">
    <div class="picker-title">
      <span id="pickerLabel">팀 선택</span>
      <button class="picker-close-btn" onclick="closePicker()">[ 닫기 ]</button>
    </div>
    <div id="pickerGrid"></div>
  </div>
</div>
<script>
const LP = '../assets/teams/VCT 2027/VCT CN/CN_OQ/';

const CN_OQ_POOL = [
  {abbr:'NOVA', name:'Nova Esports',                 logo:'NOVA.png'},
  {abbr:'TEC',  name:'Titan Esports Club',           logo:'TEC.png'},
  {abbr:'DRG',  name:'Dragon Ranger Gaming',         logo:'DRG.png'},
  {abbr:'WOL',  name:'Wolves Esports',               logo:'WOL.png'},
  {abbr:'FPX',  name:'FunPlus Phoenix',              logo:'FPX.png'},
  {abbr:'KBG',  name:'KeepBest Gaming',              logo:'KBG.png'},
  {abbr:'AQ',   name:'Any Question Gaming',          logo:'AQ.png'},
  {abbr:'UR',   name:'Unsettled Resentment',         logo:'UR.png'},
  {abbr:'AT',   name:'A Team',                       logo:'AT.png'},
  {abbr:'RA',   name:'Rare Atom',                    logo:'RA.png'},
  {abbr:'WSIG', name:'World Sports Invictus Gaming', logo:'WSIG.png'},
  {abbr:'ODG',  name:'Octagonal Disposition Gaming', logo:'ODG.png'},
  {abbr:'VLG',  name:'Victory No Limits Gaming',     logo:'VLG.png'},
];

function isAdmin() {
  try { const u=JSON.parse(localStorage.getItem('vct_auth_user')); return !!(u&&u.role==='admin'); } catch(e){return false;}
}
function getPoolTeam(abbr) { return CN_OQ_POOL.find(t=>t.abbr===abbr)||null; }
function storageKey(wk) { return `cnt_w${wk}`; }
const emptyAssign = () => ({ r12:[[null,null],[null,null],[null,null],[null,null]], qf_seeds:[null,null,null,null] });
function loadA(wk) {
  try { const s=localStorage.getItem(storageKey(wk)); return s?JSON.parse(s):emptyAssign(); } catch(e){return emptyAssign();}
}
function saveA(wk,d) { try{localStorage.setItem(storageKey(wk),JSON.stringify(d));}catch(e){} }

let currentWeek = 1;
let pickerSlot = null; // {type:'r12'|'qf_seed', mi, si}

// ── TBD (team object: {abbr, name?, logo?}
const TBD = () => ({abbr:'TBD', logo:null, name:'TBD', tbd:true});


function teamRow(t, extraCls='', slotAttr='') {
  const hasTeam = t && !t.tbd;
  const logo = hasTeam && t.logo
    ? `<img src="${LP}${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">`
    : `<span class="qi">?</span>`;
  const nc = hasTeam ? 'tname' : 'tname tbd';
  const display = hasTeam ? t.abbr : 'TBD';
  const winCls = t.winner===true?' win':t.winner===false?' loss':'';
  const editableCls = slotAttr ? ' editable' : '';
  return `<div class="tr${winCls}${editableCls}${extraCls?' '+extraCls:''}" ${slotAttr}>
    <div class="tlogo">${logo}</div>
    <span class="${nc}">${display}</span>
    ${t.score!=null?`<span class="score">${t.score}</span>`:''}
    ${slotAttr?'<span class="edit-hint">✎</span>':''}
  </div>`;
}

function matchCard(t1, t2, isGF=false, t1Slot='', t2Slot='', href='') {
  const cc = isGF ? ' gf-card' : '';
  const hrefAttr = href ? ` data-href="${href}"` : '';
  return `<div class="mc${cc}"${hrefAttr}>
    ${teamRow(t1,'',t1Slot)}
    ${teamRow(t2,'',t2Slot)}
    <div class="mtime"></div>
  </div>`;
}

function render(wk) {
  currentWeek = wk;
  const a = loadA(wk);
  const admin = isAdmin();
  const el = document.getElementById('bracket');

  // Build team objects from assignments
  const r12Teams = a.r12.map(([a1,a2])=>[
    a1 ? {...getPoolTeam(a1)} : TBD(),
    a2 ? {...getPoolTeam(a2)} : TBD(),
  ]);
  const qfSeeds = a.qf_seeds.map(s => s ? {...getPoolTeam(s)} : TBD());

  // QF matches: t1=seeded(assignable), t2=R12 winner (TBD)
  const qfMatches = qfSeeds.map((seed, i) => ({
    t1: seed, t2: TBD(),
    t1Slot: admin ? `data-type="qf_seed" data-mi="${i}"` : '',
    t2Slot: '',
  }));

  // SF and GF are auto-propagated (always TBD for now)
  const sfMatches = [{t1:TBD(),t2:TBD()},{t1:TBD(),t2:TBD()}];
  const gfMatches = [{t1:TBD(),t2:TBD()}];

  const labels = ['Round of 12','Quarterfinals','Semifinals','Grand Final'];

  let html = '';
  [1,3,5,7].forEach((gc,i)=>{
    html += `<div class="rlabel" style="grid-column:${gc}">${labels[i]}</div>`;
  });
  [2,4,6].forEach(gc=>{
    html += `<div style="grid-column:${gc};grid-row:1"></div>`;
  });

  function mhref(t1, t2){
    const a = encodeURIComponent(t1.tbd ? '' : (t1.name||''));
    const b = encodeURIComponent(t2.tbd ? '' : (t2.name||''));
    return `../cn-match-dark.html?teamA=${a}&teamB=${b}&from=threshold`;
  }

  // R12 column
  const r12Html = r12Teams.map(([t1,t2],mi)=>`
    <div class="mg">${matchCard(
      t1, t2, false,
      admin?`data-type="r12" data-mi="${mi}" data-si="0"`:'',
      admin?`data-type="r12" data-mi="${mi}" data-si="1"`:'',
      mhref(t1,t2),
    )}</div>`).join('');
  html += `<div class="rcol" id="rc0" style="grid-column:1">${r12Html}</div>`;

  // QF column
  const qfHtml = qfMatches.map((m,mi)=>`
    <div class="mg">${matchCard(m.t1,m.t2,false,m.t1Slot,'',mhref(m.t1,m.t2))}</div>`).join('');
  html += `<div class="rcol" id="rc1" style="grid-column:3">${qfHtml}</div>`;

  // SF column
  const sfHtml = sfMatches.map((m,mi)=>`<div class="mg">${matchCard(m.t1,m.t2,false,'','',mhref(m.t1,m.t2))}</div>`).join('');
  html += `<div class="rcol" id="rc2" style="grid-column:5">${sfHtml}</div>`;

  // GF column
  const gfHtml = gfMatches.map((m,mi)=>`<div class="mg">${matchCard(m.t1,m.t2,true,'','',mhref(m.t1,m.t2))}</div>`).join('');
  html += `<div class="rcol" id="rc3" style="grid-column:7">${gfHtml}</div>`;

  [2,4,6].forEach((gc,i)=>{
    html += `<div class="ccol" id="cc${i}" style="grid-column:${gc}"></div>`;
  });

  el.innerHTML = html;

  // Attach click listeners for admin slots
  if (admin) {
    el.querySelectorAll('.tr.editable').forEach(row=>{
      row.addEventListener('click', e=>{
        e.stopPropagation(); // prevent match card navigation
        const type = row.dataset.type;
        const mi   = +row.dataset.mi;
        const si   = row.dataset.si !== undefined ? +row.dataset.si : -1;
        openPicker(type, mi, si);
      });
    });
  }

  // Match card navigation with digital transition
  el.querySelectorAll('.mc[data-href]').forEach(card=>{
    card.addEventListener('click', ()=>navigateTo(card.dataset.href));
  });

  requestAnimationFrame(()=>requestAnimationFrame(drawConnectors));
}

/* ── Picker ── */
function getUsedAbbrs(wk, exclude) {
  const a = loadA(wk);
  const used = new Set();
  a.r12.forEach(([a1,a2],mi)=>{
    a1 && !(exclude.type==='r12'&&exclude.mi===mi&&exclude.si===0) && used.add(a1);
    a2 && !(exclude.type==='r12'&&exclude.mi===mi&&exclude.si===1) && used.add(a2);
  });
  a.qf_seeds.forEach((s,mi)=>{
    s && !(exclude.type==='qf_seed'&&exclude.mi===mi) && used.add(s);
  });
  return used;
}

function openPicker(type, mi, si) {
  pickerSlot = {type, mi, si};
  const used = getUsedAbbrs(currentWeek, pickerSlot);
  const label = type==='r12' ? `Round of 12 · Match ${mi+1} · ${si===0?'Team 1':'Team 2'}` : `Quarterfinals · Match ${mi+1} · Seeded`;
  document.getElementById('pickerLabel').textContent = label;

  const grid = document.getElementById('pickerGrid');
  grid.innerHTML = `<div class="picker-team-clear" onclick="assignTeam(null)">슬롯 비우기</div>` +
    CN_OQ_POOL.map(t=>`
      <div class="picker-team${used.has(t.abbr)?' used':''}" onclick="${used.has(t.abbr)?'':'assignTeam(\''+t.abbr+'\')'}">
        <div class="pt-logo"><img src="${LP}${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'"></div>
        <div><div class="pt-name">${t.abbr}</div><div class="pt-full">${t.name}</div></div>
      </div>`).join('');

  document.getElementById('pickerOverlay').classList.add('open');
}

function closePicker() {
  document.getElementById('pickerOverlay').classList.remove('open');
  pickerSlot = null;
}

function assignTeam(abbr) {
  if (!pickerSlot) return;
  const a = loadA(currentWeek);
  const {type, mi, si} = pickerSlot;
  if (type==='r12') {
    if (!a.r12[mi]) a.r12[mi] = [null,null];
    a.r12[mi][si] = abbr;
  } else if (type==='qf_seed') {
    a.qf_seeds[mi] = abbr;
  }
  saveA(currentWeek, a);
  closePicker();
  render(currentWeek);
}

document.getElementById('pickerOverlay').addEventListener('click', e=>{
  if (e.target === document.getElementById('pickerOverlay')) closePicker();
});

function drawConnectors() {
  const bracket = document.getElementById('bracket');
  const bRect = bracket.getBoundingClientRect();

  // For each connector column, draw lines between adjacent round columns
  // cc0: R12→QF, cc1: QF→SF, cc2: SF→GF
  const pairs = [
    {cc:'cc0', from:'rc0', to:'rc1'},
    {cc:'cc1', from:'rc1', to:'rc2'},
    {cc:'cc2', from:'rc2', to:'rc3'},
  ];

  const stroke = 'rgba(255,34,68,.22)';
  const strokeW = 1;

  pairs.forEach(({cc,from,to})=>{
    const ccEl = document.getElementById(cc);
    const fromEl = document.getElementById(from);
    const toEl = document.getElementById(to);
    if(!ccEl||!fromEl||!toEl) return;

    const ccRect = ccEl.getBoundingClientRect();
    const fromMatches = fromEl.querySelectorAll('.mc');
    const toMatches = toEl.querySelectorAll('.mc');

    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none';

    const W = ccRect.width;
    const ratio = fromMatches.length / toMatches.length; // e.g. 2 for QF→SF

    // For each "to" match, gather its "from" matches and draw connectors
    Array.from(toMatches).forEach((toMc, ti)=>{
      const toRect = toMc.getBoundingClientRect();
      const toY = toRect.top + toRect.height/2 - ccRect.top;

      const fromStart = Math.round(ti * ratio);
      const fromEnd   = Math.round((ti+1) * ratio);
      const fromSlice = Array.from(fromMatches).slice(fromStart, fromEnd);

      if(fromSlice.length === 1) {
        // straight horizontal line
        const fRect = fromSlice[0].getBoundingClientRect();
        const fY = fRect.top + fRect.height/2 - ccRect.top;
        const path = `M0,${fY} H${W/2} V${toY} H${W}`;
        const el = document.createElementNS('http://www.w3.org/2000/svg','path');
        el.setAttribute('d',path);
        el.setAttribute('stroke',stroke);
        el.setAttribute('stroke-width',strokeW);
        el.setAttribute('fill','none');
        svg.appendChild(el);
      } else {
        // elbow: each from-match → midpoint vertical → to-match
        const midX = W/2;
        const ys = fromSlice.map(f=>{
          const r = f.getBoundingClientRect();
          return r.top + r.height/2 - ccRect.top;
        });
        const topY = Math.min(...ys);
        const botY = Math.max(...ys);
        const midY = (topY+botY)/2;

        // vertical spine
        const spine = document.createElementNS('http://www.w3.org/2000/svg','line');
        spine.setAttribute('x1',midX); spine.setAttribute('y1',topY);
        spine.setAttribute('x2',midX); spine.setAttribute('y2',botY);
        spine.setAttribute('stroke',stroke); spine.setAttribute('stroke-width',strokeW);
        svg.appendChild(spine);

        // horizontal arms from each "from" match to midX
        ys.forEach(fy=>{
          const arm = document.createElementNS('http://www.w3.org/2000/svg','line');
          arm.setAttribute('x1',0); arm.setAttribute('y1',fy);
          arm.setAttribute('x2',midX); arm.setAttribute('y2',fy);
          arm.setAttribute('stroke',stroke); arm.setAttribute('stroke-width',strokeW);
          svg.appendChild(arm);
        });

        // line from spine midY to "to" match
        const out = document.createElementNS('http://www.w3.org/2000/svg','path');
        out.setAttribute('d',`M${midX},${midY} H${W}`);
        out.setAttribute('stroke',stroke); out.setAttribute('stroke-width',strokeW);
        out.setAttribute('fill','none');
        svg.appendChild(out);
      }
    });

    ccEl.innerHTML='';
    ccEl.appendChild(svg);
  });
}

function switchWeek(n) {
  document.getElementById('w1btn').classList.toggle('on', n===1);
  document.getElementById('w2btn').classList.toggle('on', n===2);
  render(n);
}

render(1);
window.addEventListener('resize', ()=>{ drawConnectors(); });

/* ── Digital transition ── */
let _navigating = false;
function navigateTo(href) {
  if (_navigating) return;
  _navigating = true;

  const overlay = document.getElementById('nav-overlay');
  const screen  = document.getElementById('screen');
  const nl = overlay.querySelector('.nl');
  const nr = overlay.querySelector('.nr');

  // Phase 1: glitch the screen (50ms)
  screen.style.animation = 'glitchH .18s steps(1) forwards';

  setTimeout(() => {
    // Phase 2: CRT off animation
    screen.classList.add('crt-off');

    // Show scanline overlay simultaneously
    nl.style.opacity = '1';
    nr.style.opacity = '1';
    overlay.style.opacity = '0';
    overlay.classList.add('active');

    // Phase 3: flash overlay to black during collapse
    setTimeout(() => {
      overlay.style.transition = 'opacity .18s ease-in';
      overlay.style.opacity = '1';
    }, 180);

    // Phase 4: navigate when black
    setTimeout(() => {
      window.location.href = href;
    }, 430);

  }, 60);
}
