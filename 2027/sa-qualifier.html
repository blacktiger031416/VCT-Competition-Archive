<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Open Qualifier — VCT 2027 Pacific</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700&family=Barlow:wght@300;400;500&family=Share+Tech+Mono&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00D2BE;--gb:rgba(0,210,190,1);
  --bg:#030c0e;--s1:rgba(3,14,16,.85);--s2:rgba(0,10,12,.65);
  --bdr:rgba(0,210,190,.1);--bdr2:rgba(0,210,190,.22);
  --txt:#d8eeea;--muted:rgba(160,220,210,.42);--muted2:rgba(160,220,210,.14);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif}

/* ── stars canvas ── */
#stars-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── atmosphere — Pacific gradient ── */
#atm{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 65% 55% at 10% 35%, rgba(0,180,165,.14) 0%, transparent 68%),
    radial-gradient(ellipse 50% 50% at 90% 70%, rgba(55,8,110,.18)  0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 55% 100%,rgba(0,130,118,.07) 0%, transparent 55%),
    radial-gradient(ellipse 30% 25% at 85% 10%, rgba(80,15,140,.1)  0%, transparent 50%);
}

/* ── CRT effect ── */
#screen{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;
  transform:scaleY(.02);opacity:0;transform-origin:center;
  animation:crtOn .55s cubic-bezier(.16,1,.3,1) .08s forwards}
#screen::after{content:'';position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(to bottom,transparent,rgba(0,210,190,.6),transparent);
  animation:scanSweep .7s .35s linear forwards;z-index:100;opacity:0}

@keyframes crtOn{
  0%  {transform:scaleY(.02);filter:brightness(8);opacity:.9}
  18% {transform:scaleY(.02);filter:brightness(10)}
  34% {transform:scaleY(1);filter:brightness(2.5)}
  70% {filter:brightness(1.1)}
  100%{transform:scaleY(1);filter:brightness(1);opacity:1}}
@keyframes crtOff{
  0%  {transform:scaleY(1);filter:brightness(1);opacity:1}
  35% {transform:scaleY(1);filter:brightness(4) saturate(2)}
  55% {transform:scaleY(.04);filter:brightness(9) saturate(0)}
  80% {transform:scaleY(.02);filter:brightness(.4)}
  100%{transform:scaleY(0);filter:brightness(0);opacity:0}}
@keyframes scanSweep{0%{top:-4px;opacity:1}100%{top:100%;opacity:.2}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 10px rgba(0,210,190,.18),0 0 24px rgba(0,210,190,.07),inset 0 0 10px rgba(0,210,190,.04)}
  50%    {box-shadow:0 0 18px rgba(0,210,190,.42),0 0 48px rgba(0,210,190,.14),inset 0 0 16px rgba(0,210,190,.07)}}
@keyframes matchIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}}

/* ── topbar ── */
#topbar{
  flex-shrink:0;
  display:flex;align-items:center;gap:1.2rem;
  padding:.7rem 1.8rem;
  background:linear-gradient(to bottom,rgba(0,8,24,.98),rgba(0,6,18,.95));
  border-bottom:1px solid rgba(0,210,190,.14);
  position:relative;overflow:hidden;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#topbar::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(0,210,190,.5) 30%,rgba(0,210,190,.8) 50%,rgba(0,210,190,.5) 70%,transparent 100%);
  opacity:.6}
#topbar::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,rgba(0,210,190,.03) 0%,transparent 40%);
  pointer-events:none}
.tb-back{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  text-decoration:none;border:1px solid rgba(0,210,190,.18);
  padding:5px 14px;border-radius:2px;transition:all .2s;flex-shrink:0;
  position:relative;overflow:hidden}
.tb-back::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(0,210,190,.08),transparent);
  transform:translateX(-100%);transition:transform .3s}
.tb-back:hover{color:var(--g);border-color:rgba(0,210,190,.5);
  box-shadow:0 0 12px rgba(0,210,190,.12)}
.tb-back:hover::before{transform:translateX(100%)}
.tb-sep{width:1px;height:22px;background:rgba(0,210,190,.14);flex-shrink:0}
.tb-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--g);opacity:.7;
  text-shadow:0 0 10px rgba(0,210,190,.4)}
.tb-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;
  letter-spacing:.07em;text-transform:uppercase;color:var(--txt);
  text-shadow:0 0 20px rgba(0,210,190,.15)}
.tb-meta{
  margin-left:auto;
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.06em;
  color:rgba(0,210,190,.5);text-transform:uppercase;white-space:nowrap;
  border:1px solid rgba(0,210,190,.12);padding:3px 10px;border-radius:1px}

/* ── layout ── */
#body{flex:1;display:flex;overflow:hidden}

/* ── sidebar ── */
#sidebar{
  width:70px;flex-shrink:0;
  border-right:1px solid rgba(0,210,190,.1);
  background:linear-gradient(to bottom,rgba(0,8,22,.96),rgba(0,5,15,.92));
  display:flex;flex-direction:column;align-items:center;
  padding:.8rem 0;gap:.4rem;position:relative;overflow-y:auto}
#sidebar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom,transparent 0%,rgba(0,210,190,.35) 50%,transparent 100%)}
.g-btn{
  width:48px;height:48px;border-radius:3px;
  border:1px solid rgba(0,210,190,.14);
  background:transparent;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:all .25s}
.g-btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,210,190,.04) 0%,transparent 50%);
  opacity:0;transition:opacity .2s}
.g-btn:hover{border-color:rgba(0,210,190,.35);background:rgba(0,210,190,.04)}
.g-btn:hover::before{opacity:1}
.g-btn.active{
  border-color:var(--g);
  background:linear-gradient(135deg,rgba(0,210,190,.1) 0%,rgba(0,210,190,.03) 100%);
  animation:glowPulse 2.8s ease-in-out infinite}
.g-btn .g-label{
  position:relative;z-index:1;
  font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;
  color:var(--muted);letter-spacing:.02em;transition:all .2s}
.g-btn:hover .g-label{color:var(--txt)}
.g-btn.active .g-label{color:var(--g);text-shadow:0 0 10px rgba(0,210,190,.6)}
.g-btn .g-sub{
  position:relative;z-index:1;
  font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.08em;
  color:var(--muted2);transition:color .2s}
.g-btn.active .g-sub{color:rgba(0,210,190,.6)}
.g-corner{position:absolute;width:6px;height:6px;border-color:var(--g);border-style:solid;
  opacity:0;transition:opacity .25s}
.g-btn.active .g-corner{opacity:1}
.g-corner.tl{top:3px;left:3px;border-width:1px 0 0 1px}
.g-corner.tr{top:3px;right:3px;border-width:1px 1px 0 0}
.g-corner.bl{bottom:3px;left:3px;border-width:0 0 1px 1px}
.g-corner.br{bottom:3px;right:3px;border-width:0 1px 1px 0}

/* ── main ── */
#main{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;min-width:0;
  background:linear-gradient(to bottom,rgba(0,8,22,.5) 0%,transparent 200px)}
#main::-webkit-scrollbar{width:3px}
#main::-webkit-scrollbar-thumb{background:rgba(0,210,190,.25);border-radius:2px}
#main::-webkit-scrollbar-track{background:transparent}

/* ── region banner ── */
#region-banner{
  flex-shrink:0;
  display:flex;align-items:center;gap:2rem;
  padding:1.4rem 1.8rem 1.2rem;
  position:relative;overflow:hidden;
  border-bottom:1px solid rgba(0,210,190,.1)}
#region-banner::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(105deg, rgba(0,185,170,.18) 0%, rgba(0,160,145,.08) 30%, transparent 60%, rgba(55,8,110,.12) 100%),
    repeating-linear-gradient(to bottom,
      rgba(0,210,190,.012) 0,rgba(0,210,190,.012) 1px,transparent 1px,transparent 5px)}
#region-banner::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,210,190,.5) 40%,rgba(0,210,190,.8) 50%,rgba(0,210,190,.5) 60%,transparent)}
.rb-logo{
  height:90px;width:auto;flex-shrink:0;position:relative;z-index:1;
  filter:
    drop-shadow(0 0 18px rgba(0,210,190,.5))
    drop-shadow(0 0 50px rgba(0,210,190,.2));
  opacity:.92}
.rb-info{position:relative;z-index:1;display:flex;flex-direction:column;gap:.35rem}
.rb-label{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(0,210,190,.5)}
.rb-name{
  font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;
  letter-spacing:.06em;text-transform:uppercase;color:var(--txt);
  text-shadow:0 0 30px rgba(0,210,190,.2);line-height:1}
.rb-sub{
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(0,210,190,.55)}
.rb-divider{
  width:1px;height:60px;background:rgba(0,210,190,.14);flex-shrink:0;position:relative;z-index:1}
/* ── region map ── */
.rb-map{
  flex:1;min-width:0;height:100%;
  position:relative;z-index:1;overflow:hidden;
  margin:0 1rem;display:flex;align-items:center}
.rb-map-svg{width:100%;height:92px;opacity:.85}
.rb-map-img{height:100%;width:100%;object-fit:contain;object-position:center;opacity:.9;pointer-events:none;user-select:none}
@keyframes cityPing{0%,100%{opacity:.7}50%{opacity:.2}}
@keyframes cityRing{0%{r:2.5;opacity:.4;stroke-width:.8}100%{r:8;opacity:0;stroke-width:.3}}
.cring{animation:cityRing 3.6s ease-out infinite}
.cdot{animation:cityPing 3.6s ease-in-out infinite}
.hring{animation:hubRing 2.4s ease-out infinite}
.hdot{animation:cityPing 2.4s ease-in-out infinite}
.flow-line{stroke-dasharray:14,350;animation:sweepFlow 4.5s linear infinite;stroke-linecap:round}
.rb-stats{
  position:relative;z-index:1;display:flex;gap:2rem;flex-shrink:0}
.rb-stat{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.rb-stat-num{
  font-family:'Share Tech Mono',monospace;font-size:22px;
  color:var(--g);text-shadow:0 0 14px rgba(0,210,190,.45);line-height:1}
.rb-stat-lbl{
  font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(0,210,190,.4)}

/* ── content ── */
#content{
  padding:1.2rem 1.4rem;position:relative;
  background-image:radial-gradient(circle,rgba(0,210,190,.035) 1px,transparent 1px);
  background-size:30px 30px}

/* Pacific logo watermark */
#content::before{
  content:'';position:fixed;
  right:8%;bottom:5%;
  width:380px;height:380px;
  background:url('../assets/vct-pacific.webp') center/contain no-repeat;
  opacity:.03;pointer-events:none;z-index:0}


/* ── holographic panel ── */
.bracket-sec{
  position:relative;
  margin-bottom:1.8rem;
  border:1px solid rgba(0,210,190,.22);
  border-radius:4px;
  background:linear-gradient(135deg,rgba(0,18,20,.88) 0%,rgba(5,4,22,.78) 60%,rgba(20,4,38,.7) 100%);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:
    0 14px 55px rgba(0,0,0,.62),
    0 0 0 1px rgba(0,210,190,.05),
    0 0 30px rgba(0,210,190,.07),
    inset 0 1px 0 rgba(0,210,190,.22),
    inset 0 0 70px rgba(0,210,190,.03);
  overflow:hidden}
/* scan-line texture */
.bracket-sec::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,210,190,.014) 0,rgba(0,210,190,.014) 1px,
    transparent 1px,transparent 5px);
  z-index:0}
/* top glow edge */
.bracket-sec::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(0,210,190,.55) 35%,rgba(0,210,190,.85) 50%,rgba(0,210,190,.55) 65%,transparent 100%);
  z-index:2}
/* corner bracket decorators */
.pc{position:absolute;z-index:3}
.pc::before,.pc::after{content:'';position:absolute;background:rgba(0,210,190,.55)}
.pc-tl{top:5px;left:5px}
.pc-tl::before{top:0;left:0;width:1px;height:10px}
.pc-tl::after{top:0;left:0;width:10px;height:1px}
.pc-tr{top:5px;right:5px}
.pc-tr::before{top:0;right:0;width:1px;height:10px}
.pc-tr::after{top:0;right:0;width:10px;height:1px}
.pc-bl{bottom:5px;left:5px}
.pc-bl::before{bottom:0;left:0;width:1px;height:10px}
.pc-bl::after{bottom:0;left:0;width:10px;height:1px}
.pc-br{bottom:5px;right:5px}
.pc-br::before{bottom:0;right:0;width:1px;height:10px}
.pc-br::after{bottom:0;right:0;width:10px;height:1px}

/* ── panel title bar ── */
.grp-header{
  display:flex;align-items:center;gap:.9rem;
  padding:.65rem 1.1rem;
  background:linear-gradient(to right,rgba(0,210,190,.13) 0%,rgba(0,210,190,.04) 55%,transparent 100%);
  border-bottom:1px solid rgba(0,210,190,.14);
  position:relative;z-index:1;margin:0}
.grp-title{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--g);
  text-shadow:0 0 12px rgba(0,210,190,.4);opacity:.9}
.grp-badge{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:2px}
.grp-badge.pending{color:var(--muted);background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07)}
.grp-badge.done{color:rgba(0,210,190,.6);background:rgba(0,210,190,.06);border:1px solid rgba(0,210,190,.18)}
.grp-badge.live{color:var(--g);background:rgba(0,210,190,.1);border:1px solid rgba(0,210,190,.3);
  text-shadow:0 0 8px rgba(0,210,190,.5);animation:pulse 1.4s ease-in-out infinite}
.grp-desc{
  margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:9px;
  color:rgba(0,210,190,.4);letter-spacing:.06em;text-transform:uppercase}

/* ── panel body ── */
.panel-body{padding:1.1rem 1.2rem;position:relative;z-index:1}

/* ── compact rows (Bo1) ── */
/* ── match grid (unified) ── */
.match-grid{display:grid;gap:.8rem}
.match-grid.g2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* ── wave/diamond animations ── */
@keyframes waveBob1{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes waveBob2{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes diamondPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:.2;transform:scale(.82)}}
/* ── hub node ring ── */
@keyframes hubRing{0%{r:4;opacity:.65;stroke-width:1.2}100%{r:18;opacity:0;stroke-width:.4}}
/* ── light sweep along route line ── */
@keyframes sweepFlow{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}

/* ── banner background graphics ── */
.rb-bg-text{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(55px,9vw,135px);font-weight:900;letter-spacing:.28em;
  text-transform:uppercase;color:transparent;
  -webkit-text-stroke:1px rgba(0,210,190,.055);
  white-space:nowrap;pointer-events:none;z-index:0;user-select:none;line-height:1}
.rb-wave-svg{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;overflow:visible}
#rw1{animation:waveBob1 10s ease-in-out infinite;transform-origin:center}
#rw2{animation:waveBob2 14s ease-in-out infinite .6s;transform-origin:center}
.rb-diamond{animation:diamondPulse 4s ease-in-out infinite}

/* ── round number watermark ── */
.round-wm{
  position:absolute;right:.3rem;bottom:-.22em;
  font-family:'Barlow Condensed',sans-serif;font-size:200px;font-weight:900;line-height:1;
  color:transparent;-webkit-text-stroke:1px rgba(0,210,190,.045);
  pointer-events:none;z-index:0;user-select:none;letter-spacing:-.04em}

/* ── match card — gradient border + diagonal stripe ── */
.match-card{
  border:1px solid transparent;border-radius:4px;
  background:
    linear-gradient(135deg,rgba(0,14,16,.82) 0%,rgba(5,3,20,.74) 55%,rgba(18,3,32,.7) 100%) padding-box,
    linear-gradient(150deg,rgba(0,210,190,.3) 0%,rgba(60,10,140,.22) 50%,rgba(140,20,210,.18) 100%) border-box;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  overflow:hidden;position:relative;cursor:pointer;
  transition:all .22s;animation:matchIn .2s ease both}
.match-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,transparent,var(--g),transparent);opacity:0;transition:opacity .2s;z-index:1}
.match-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    -45deg,transparent 0,transparent 24px,
    rgba(0,210,190,.016) 24px,rgba(0,210,190,.016) 25px);
  z-index:0;transition:opacity .22s}
.match-card:hover{
  background:
    linear-gradient(135deg,rgba(0,20,22,.88) 0%,rgba(8,4,24,.8) 55%,rgba(24,5,40,.75) 100%) padding-box,
    linear-gradient(150deg,rgba(0,210,190,.58) 0%,rgba(80,15,185,.44) 50%,rgba(185,30,255,.36) 100%) border-box;
  box-shadow:0 8px 40px rgba(0,0,0,.55),0 0 22px rgba(0,210,190,.08),inset 0 1px 0 rgba(0,210,190,.18);
  transform:translateY(-2px)}
.match-card:hover::before{opacity:.55}
.match-card:hover::after{opacity:2.8}
.match-card.has-result{
  background:
    linear-gradient(135deg,rgba(0,14,16,.82) 0%,rgba(5,3,20,.74) 55%,rgba(18,3,32,.7) 100%) padding-box,
    linear-gradient(150deg,rgba(0,210,190,.2) 0%,rgba(60,10,140,.18) 50%,rgba(140,20,210,.15) 100%) border-box}
.match-card.has-result::before{opacity:.25}
.match-num-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:.32rem .8rem;border-bottom:1px solid rgba(0,210,190,.07);
  background:rgba(0,0,0,.2)}
.match-num-txt{
  font-family:'Share Tech Mono',monospace;font-size:8px;
  letter-spacing:.12em;color:rgba(0,210,190,.35)}
.match-bo-badge{
  font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.08em;
  color:rgba(0,210,190,.45);border:1px solid rgba(0,210,190,.18);
  padding:1px 6px;border-radius:1px}

/* ── team row (Bo3) ── */
.mt-row{
  display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;position:relative;
  transition:background .15s}
.mt-row.tbd{opacity:.32}
.mt-row.win{background:linear-gradient(90deg,rgba(0,210,190,.1) 0%,rgba(0,210,190,.03) 100%)}
.mt-row.win::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--g);box-shadow:0 0 6px rgba(0,210,190,.5)}
.mt-logo{
  width:30px;height:30px;border-radius:3px;
  border:1px solid rgba(0,210,190,.12);
  background:rgba(0,210,190,.04);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:all .15s}
.mt-row.win .mt-logo{border-color:rgba(0,210,190,.35);box-shadow:0 0 8px rgba(0,210,190,.2)}
.mt-logo img{width:100%;height:100%;object-fit:contain}
.mt-logo-ph{font-size:10px;color:rgba(255,255,255,.18)}
.mt-info{flex:1;min-width:0}
.mt-abbr{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.03em;color:var(--txt);display:block;line-height:1.1;

  function mkLine(){
    return{x:Math.random()*W,y:Math.random()*H,
      a:Math.random()*Math.PI*.5-Math.PI*.25,
      len:90+Math.random()*190,
      life:0,maxLife:Math.floor(260+Math.random()*340),
      col:Math.random()<.5?0:1};
  }
  function init(){
    W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
    pts=Array.from({length:140},()=>({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*.9+.15,
      vx:(Math.random()-.5)*.1,vy:(Math.random()-.5)*.1,
      a:Math.random()*.3+.06,
      tw:Math.random()*200+80,tp:Math.random()*300
    }));
    rings=Array.from({length:6},()=>({
      x:Math.random()*W,y:Math.random()*H,
      rx:140+Math.random()*200,ry:75+Math.random()*130,
      angle:Math.random()*Math.PI,
      phase:Math.random()*Math.PI*2,
      col:Math.random()<.5?0:1
    }));
    glines=Array.from({length:10},()=>mkLine());
  }
  let t=0;
  function draw(){
    t++;ctx.clearRect(0,0,W,H);
    // Topographic rings
    rings.forEach(r=>{
      r.phase+=.003;
      const s=1+.1*Math.sin(r.phase);
      ctx.save();
      ctx.translate(r.x,r.y);
      ctx.rotate(r.angle+r.phase*.04);
      for(let i=3;i>=1;i--){
        const a=.022*(4-i);
        ctx.beginPath();
        ctx.ellipse(0,0,r.rx*s*(i/3),r.ry*s*(i/3),0,0,Math.PI*2);
        ctx.strokeStyle=r.col===0?`rgba(0,210,190,${a})`:`rgba(80,20,185,${a})`;
        ctx.lineWidth=.5;ctx.stroke();
      }
      ctx.restore();
    });
    // Geometric fade lines
    glines.forEach((l,i)=>{
      l.life++;
      if(l.life>l.maxLife){glines[i]=mkLine();return;}
      const lr=l.life/l.maxLife;
      const fade=Math.min(lr*5,1)*Math.min((1-lr)*5,1);
      const x2=l.x+Math.cos(l.a)*l.len,y2=l.y+Math.sin(l.a)*l.len;
      const gr=ctx.createLinearGradient(l.x,l.y,x2,y2);
      if(l.col===0){
        gr.addColorStop(0,'rgba(0,210,190,0)');
        gr.addColorStop(.5,`rgba(0,210,190,${.045*fade})`);
        gr.addColorStop(1,'rgba(0,210,190,0)');
      }else{
        gr.addColorStop(0,'rgba(80,20,185,0)');
        gr.addColorStop(.5,`rgba(100,30,205,${.04*fade})`);
        gr.addColorStop(1,'rgba(80,20,185,0)');
      }
      ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(x2,y2);
      ctx.strokeStyle=gr;ctx.lineWidth=.8;ctx.stroke();
    });
    // Stars
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      const flicker=p.a*(.7+.3*Math.sin((t+p.tp)*Math.PI*2/p.tw));
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(160,220,255,${flicker})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',init);
  init();draw();
})();

/* ── data ── */
const DB_KEY = 'sa_oq_swiss_v1';
const L = abbr => `../assets/teams/VCT 2027/VCT Pacific/Pacific_OQ/SA/${abbr}.png`;

const STRUCTURE = [
  {id:'r1', round:'ROUND 1', desc:'전체 참가', brackets:[
    {id:'r1',    label:null,    bo:1, count:32}
  ]},
  {id:'r2', round:'ROUND 2', desc:'2라운드', brackets:[
    {id:'r2_10', label:'(1-0)', bo:1, count:16},
    {id:'r2_01', label:'(0-1)', bo:1, count:16}
  ]},
  {id:'r3', round:'ROUND 3', desc:'3라운드', brackets:[
    {id:'r3_20', label:'(2-0)', bo:3, count:8},
    {id:'r3_11', label:'(1-1)', bo:1, count:16}
  ]},
  {id:'r4', round:'ROUND 4', desc:'4라운드', brackets:[
    {id:'r4_30', label:'(3-0)', bo:3, count:4},
    {id:'r4_21', label:'(2-1)', bo:3, count:12}
  ]},
  {id:'r5', round:'ROUND 5', desc:'최종', brackets:[
    {id:'r5_31', label:'(3-1)', bo:3, count:8},
    {id:'r5_32', label:'(3-2)', bo:3, count:4}
  ]}
];

const MATCHES = {};
STRUCTURE.forEach(r => r.brackets.forEach(b => {
  MATCHES[b.id] = Array.from({length:b.count}, () =>
    ({t1:null,t2:null,w:null,s1:null,s2:null,ff:false}));
}));

function loadScores(){
  try{
    const data = JSON.parse(localStorage.getItem(DB_KEY)||'{}');
    Object.entries(data).forEach(([bid,arr])=>{
      if(!MATCHES[bid])return;
      arr.forEach((m,i)=>{
        if(!m||!MATCHES[bid][i])return;
        const dm=MATCHES[bid][i];
        if(m.t1)dm.t1={abbr:m.t1.abbr,name:m.t1.name,logo:L(m.t1.abbr)};
        if(m.t2)dm.t2={abbr:m.t2.abbr,name:m.t2.name,logo:L(m.t2.abbr)};
        dm.w=m.w;dm.s1=m.s1;dm.s2=m.s2;dm.ff=!!m.ff;
      });
    });
  }catch(e){}
}

function saveScores(){
  try{
    const out={};
    Object.entries(MATCHES).forEach(([bid,arr])=>{
      out[bid]=arr.map(m=>({
        t1:m.t1?{abbr:m.t1.abbr,name:m.t1.name}:null,
        t2:m.t2?{abbr:m.t2.abbr,name:m.t2.name}:null,
        w:m.w,s1:m.s1,s2:m.s2,ff:m.ff
      }));
    });
    localStorage.setItem(DB_KEY,JSON.stringify(out));
  }catch(e){}
}

let curRound='r1';

function renderNav(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='';
  STRUCTURE.forEach(r=>{
    const btn=document.createElement('button');
    btn.className='g-btn'+(r.id===curRound?' active':'');
    const num=r.id.replace('r','');
    btn.innerHTML=`
      <div class="g-corner tl"></div><div class="g-corner tr"></div>
      <div class="g-corner bl"></div><div class="g-corner br"></div>
      <span class="g-label">R${num}</span>
      <span class="g-sub">RND</span>`;
    btn.onclick=()=>{
      curRound=r.id;
      document.querySelectorAll('#sidebar .g-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderContent();
    };
    sb.appendChild(btn);
  });
}



function mtRowHTML(t,side,m){
  const win=m.w===side, hasResult=m.w!==null;
  const score=side===1?m.s1:m.s2;
  const logoInner=t?.logo
    ?`<img src="${t.logo}" alt="" onerror="this.style.display='none'">`
    :`<span class="mt-logo-ph">?</span>`;
  const abbr=t?.abbr??'TBD';
  const name=t?.name&&t.name!==abbr?t.name:'';
  const rowCls=!t?'mt-row tbd':win?'mt-row win':'mt-row';
  const dim=hasResult&&!win?' style="opacity:.35"':'';
  const scoreStr=m.ff&&win?'FF':(score!==null?score:(hasResult?'':' '));
  return `<div class="${rowCls}"${dim}>
    <div class="mt-logo">${logoInner}</div>
    <div class="mt-info">
      <span class="mt-abbr">${abbr}</span>
      ${name?`<span class="mt-name">${name}</span>`:''}
    </div>
    <span class="mt-score">${scoreStr}</span>
  </div>`;
}

function renderMatchCard(bid,m,idx,bo=3){
  const hasResult=m.w!==null;
  const el=document.createElement('div');
  el.className='match-card'+(hasResult?' has-result':'');
  el.style.animationDelay=`${Math.min(idx,20)*.016}s`;
  el.innerHTML=`
    <div class="match-num-row">
      <span class="match-num-txt">MATCH ${String(idx+1).padStart(2,'0')}</span>
      <span class="match-bo-badge">Bo${bo}</span>
    </div>
    ${mtRowHTML(m.t1,1,m)}
    <div class="match-vs">
      <div class="match-vs-line"></div>
      <span class="match-vs-txt">VS</span>
      <div class="match-vs-line"></div>
    </div>
    ${mtRowHTML(m.t2,2,m)}`;
  el.onclick=()=>openScoreModal(bid,idx,bo);
  return el;
}

function renderContent(){
  const content=document.getElementById('content');
  content.innerHTML='';
  const rnd=STRUCTURE.find(x=>x.id===curRound);
  if(!rnd)return;
  rnd.brackets.forEach(b=>{
    const matches=MATCHES[b.id];
    const done=matches.filter(m=>m.w!==null).length;
    const sec=document.createElement('div');
    sec.className='bracket-sec';
    // Round number watermark
    const wm=document.createElement('div');
    wm.className='round-wm';
    wm.textContent=rnd.id.replace('r','');
    sec.appendChild(wm);
    const title=b.label?`${b.label} 조`:rnd.round;
    const badgeCls=done===matches.length?'done':done>0?'live':'pending';
    const badgeTxt=done===matches.length?'완료':done>0?`${done}/${matches.length}`:`${matches.length}경기`;
    const descTxt=b.bo===1?'BO1':'BO3';
    // Corner bracket decorators
    ['tl','tr','bl','br'].forEach(c=>{
      const d=document.createElement('div');
      d.className=`pc pc-${c}`;
      sec.appendChild(d);
    });
    // Title bar
    const hdr=document.createElement('div');
    hdr.className='grp-header';
    hdr.innerHTML=`
      <span class="grp-title">${title}</span>
      <span class="grp-badge ${badgeCls}">${badgeTxt}</span>
      <span class="grp-desc">${descTxt}</span>`;
    sec.appendChild(hdr);
    // Panel body
    const body=document.createElement('div');
    body.className='panel-body';
    const grid=document.createElement('div');
    grid.className='match-grid g2';
    matches.forEach((m,idx)=>grid.appendChild(renderMatchCard(b.id,m,idx,b.bo)));
    body.appendChild(grid);
    sec.appendChild(body);
    content.appendChild(sec);
  });
}

/* ── score modal ── */
let _bid,_idx,_bo,_selW=null,_selS=null;

function openScoreModal(bid,idx,bo){
  _bid=bid;_idx=idx;_bo=bo;
  const m=MATCHES[bid][idx];
  _selW=m.w;
  _selS=m.ff?'FF':(m.s1!==null?`${m.s1}-${m.s2??0}`:null);
  const info=(()=>{for(const r of STRUCTURE)for(const b of r.brackets)if(b.id===bid)return{r,b};})();
  const lbl=info.b.label?`${info.r.round} · ${info.b.label}`:info.r.round;
  document.getElementById('sbTitle').textContent=`${lbl} · MATCH ${String(idx+1).padStart(2,'0')} · Bo${bo}`;
  const teamsEl=document.getElementById('sbTeams');
  teamsEl.innerHTML='';
  [1,2].forEach(side=>{
    const t=side===1?m.t1:m.t2;
    const btn=document.createElement('button');
    btn.className='sb-team'+(_selW===side?' selected':'');
    const logoSrc=t?.logo?`<img src="${t.logo}" alt="" onerror="this.style.display='none'">`: '?';
    btn.innerHTML=`<div class="sb-team-logo">${logoSrc}</div>
      <div>
        <span class="sb-team-abbr">${t?.abbr??'TBD'}</span>
        ${t?.name&&t.name!==t?.abbr?`<span class="sb-team-name">${t.name}</span>`:''}
      </div>`;
    btn.onclick=()=>{
      _selW=side;
      teamsEl.querySelectorAll('.sb-team').forEach(b=>b.classList.toggle('selected',b===btn));
      if(bo===1){confirmScore();return;}
      updateConfirmBtn();
    };
    teamsEl.appendChild(btn);
  });
  const scoreWrap=document.getElementById('sbScoreWrap');
  scoreWrap.style.display=bo===1?'none':'';
  if(bo===3){
    document.querySelectorAll('.sb-score-btn').forEach(b=>{
      b.classList.toggle('selected',b.dataset.s===_selS);
    });
  }
  const footer=document.getElementById('sbFooter');
  const ec=footer.querySelector('.sb-clear');
  if(ec)ec.remove();
  if(m.w!==null){
    const clr=document.createElement('button');
    clr.className='sb-clear';clr.textContent='지우기';
    clr.onclick=clearScore;
    footer.insertBefore(clr,footer.firstChild);
  }
  if(bo===3)updateConfirmBtn();
  document.getElementById('scoreOverlay').classList.add('open');
}

function pickScore(btn){
  _selS=btn.dataset.s;
  document.querySelectorAll('.sb-score-btn').forEach(b=>b.classList.toggle('selected',b===btn));
  updateConfirmBtn();
}

function updateConfirmBtn(){
  document.getElementById('sbConfirm').disabled=!(_selW!==null&&(_bo===1||_selS!==null));
}

function confirmScore(){
  if(_selW===null)return;
  if(_bo===3&&_selS===null)return;
  const m=MATCHES[_bid][_idx];
  m.w=_selW;
  if(_bo===1){m.s1=null;m.s2=null;m.ff=false;}
  else{
    if(_selS==='FF'){
      m.ff=true;m.s1=_selW===1?2:0;m.s2=_selW===1?0:2;
    }else{
      m.ff=false;
      const[ws,ls]=_selS.split('-').map(Number);
      m.s1=_selW===1?ws:ls;m.s2=_selW===1?ls:ws;
    }
  }
  saveScores();closeScoreModal();renderContent();
}

function clearScore(){
  const m=MATCHES[_bid][_idx];
  m.w=null;m.s1=null;m.s2=null;m.ff=false;
  saveScores();closeScoreModal();renderContent();
}

function closeScoreModal(){
  document.getElementById('scoreOverlay').classList.remove('open');
  _selW=null;_selS=null;
}

document.getElementById('scoreOverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('scoreOverlay'))closeScoreModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeScoreModal();});

function triggerCrtOff(e){
  e.preventDefault();
  const href=e.currentTarget.href;
  document.getElementById('screen').style.animation='crtOff .4s ease forwards';
  setTimeout(()=>{window.location.href=href;},420);
}

loadScores();renderNav();renderContent();
</script>
