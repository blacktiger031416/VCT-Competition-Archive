<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Open Qualifier — VCT 2027 Pacific</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00C8FF;--bg:#06060a;--s1:#0d0d14;
  --bdr:rgba(255,255,255,.07);
  --txt:#e4e4ee;--muted:rgba(228,228,238,.38);--muted2:rgba(228,228,238,.14);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif}

body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(0,200,255,.04) 0%,transparent 65%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,transparent 1px,transparent 3px);
  pointer-events:none;z-index:1;opacity:.5}

#screen{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;
  transform:scaleY(.02);opacity:0;transform-origin:center;
  animation:crtOn .5s cubic-bezier(.16,1,.3,1) .05s forwards}
#screen::after{content:'';position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(to bottom,transparent,rgba(0,200,255,.5),transparent);
  animation:scanSweep .6s .3s linear forwards;z-index:100;opacity:0}

@keyframes crtOn{
  0%  {transform:scaleY(.02);filter:brightness(7);opacity:.85}
  18% {transform:scaleY(.02);filter:brightness(9)}
  32% {transform:scaleY(1);filter:brightness(2.8)}
  65% {filter:brightness(1.15)}
  100%{transform:scaleY(1);filter:brightness(1);opacity:1}}
@keyframes scanSweep{0%{top:-5px;opacity:1}100%{top:100%;opacity:.3}}
@keyframes matchIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Topbar */
#topbar{
  flex-shrink:0;height:48px;
  background:linear-gradient(to right,rgba(0,200,255,.1),transparent 60%);
  border-bottom:1px solid rgba(0,200,255,.18);
  display:flex;align-items:center;gap:14px;padding:0 20px;
}
.back{font-size:18px;color:var(--g);opacity:.7;cursor:pointer;text-decoration:none;transition:opacity .15s}
.back:hover{opacity:1}
.topbar-title{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.12em;color:var(--g);text-shadow:0 0 20px rgba(0,200,255,.4);
}
.topbar-sub{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-left:4px}

/* Layout */
#layout{flex:1;display:flex;overflow:hidden}

/* Sidebar */
#sidebar{
  width:76px;flex-shrink:0;
  border-right:1px solid var(--bdr);background:rgba(0,0,0,.2);
  display:flex;flex-direction:column;padding:12px 0;gap:2px;overflow-y:auto;
}
.rnd-btn{
  width:100%;padding:11px 4px;background:none;border:none;
  color:var(--muted);font-family:'Barlow Condensed',sans-serif;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:color .15s,background .15s;border-left:2px solid transparent;
}
.rnd-btn .rl{font-size:16px;font-weight:900;letter-spacing:.04em}
.rnd-btn .rs{font-size:9px;font-weight:600;letter-spacing:.06em;opacity:.6}
.rnd-btn:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.rnd-btn.active{color:var(--g);border-left-color:var(--g);background:rgba(0,200,255,.07)}
.rnd-btn.active .rl{text-shadow:0 0 12px rgba(0,200,255,.5)}

/* Main */
#main{flex:1;overflow-y:auto;padding:20px 24px}

/* Bracket section */
.bracket-section{margin-bottom:28px}
.bracket-header{
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
  padding-bottom:9px;border-bottom:1px solid var(--bdr);
}
.bracket-label{
  font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;
  color:var(--g);letter-spacing:.05em;
}
.bracket-meta{font-size:11px;color:var(--muted);letter-spacing:.06em}
.bracket-bo-badge{
  margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.08em;
  color:var(--g);background:rgba(0,200,255,.1);
  border:1px solid rgba(0,200,255,.2);border-radius:3px;padding:2px 7px;
}

/* Match grid */
.match-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}

/* Match card */
.match-card{
  background:var(--s1);border:1px solid var(--bdr);border-radius:6px;
  padding:9px 11px;cursor:pointer;
  display:flex;flex-direction:column;gap:7px;
  transition:border-color .15s,background .15s;
  animation:matchIn .2s ease both;
}
.match-card:hover{border-color:rgba(0,200,255,.22);background:rgba(0,200,255,.03)}
.match-card-top{display:flex;justify-content:space-between;align-items:center}
.match-num{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.match-bo{font-size:8px;font-weight:700;letter-spacing:.06em;
  color:var(--muted);border:1px solid var(--muted2);border-radius:2px;padding:1px 4px}

.match-row{display:flex;align-items:center;gap:6px}
.mteam{
  flex:1;display:flex;align-items:center;gap:7px;
  padding:5px 7px;border-radius:4px;min-width:0;
  transition:background .15s;
}
.mteam.t2{flex-direction:row-reverse}
.mteam.winner{background:rgba(0,200,255,.1)}
.mteam.loser{opacity:.38}

.mlogo{
  width:26px;height:26px;flex-shrink:0;border-radius:50%;overflow:hidden;
  background:var(--muted2);display:flex;align-items:center;justify-content:center;
  font-size:7px;color:var(--muted);
}
.mlogo.empty{border:1px dashed rgba(255,255,255,.12)}
.mlogo img{width:100%;height:100%;object-fit:contain}

.minfo{min-width:0;flex:1}
.mabbr{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;
  color:var(--txt);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mteam.winner .mabbr{color:var(--g)}
.mteam.t2 .minfo{text-align:right}
.mfull{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.msep{
  flex-shrink:0;width:48px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
}
.msep .vs{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--muted2)}
.msep .score{
  font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;
  color:var(--txt);letter-spacing:.04em;display:flex;align-items:center;gap:3px;
}
.msep .score .win{color:var(--g)}
.msep .score .colon{font-size:12px;color:var(--muted)}
.msep .bo1-result{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:900;
  letter-spacing:.06em;display:flex;align-items:center;gap:4px;
}
.msep .bo1-result .w{color:var(--g)}
.msep .bo1-result .l{color:var(--muted)}
.msep .bo1-result .bar{font-size:9px;color:var(--muted2)}

.tbd-team{
  flex:1;display:flex;align-items:center;gap:7px;padding:5px 7px;opacity:.28;min-width:0;
}
.tbd-team.t2{flex-direction:row-reverse}
.tbd-logo{width:26px;height:26px;flex-shrink:0;border-radius:50%;
  border:1px dashed rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  font-size:8px;color:var(--muted)}
.tbd-abbr{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;color:var(--muted)}

/* Modal */
#modal-wrap{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
#modal-wrap.open{opacity:1;pointer-events:all}
#modal{
  background:#0d0d18;border:1px solid rgba(0,200,255,.18);border-radius:10px;
  padding:24px;min-width:360px;max-width:480px;width:90%;
  box-shadow:0 0 60px rgba(0,200,255,.07);
  transform:translateY(10px);transition:transform .18s;
}
#modal-wrap.open #modal{transform:none}

.modal-ttl{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.12em;color:var(--muted);margin-bottom:18px;
}
.modal-sec{margin-bottom:14px}
.modal-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.modal-teams{display:flex;gap:10px}
.modal-team-btn{
  flex:1;padding:11px 8px;
  background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;
  color:var(--txt);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;
  letter-spacing:.06em;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.modal-team-btn:hover{border-color:rgba(0,200,255,.28);background:rgba(0,200,255,.06)}
.modal-team-btn.sel{border-color:var(--g);background:rgba(0,200,255,.12);color:var(--g);
  box-shadow:0 0 12px rgba(0,200,255,.14)}
.modal-tlogo{
  width:26px;height:26px;border-radius:50%;overflow:hidden;
  background:var(--muted2);display:flex;align-items:center;justify-content:center;font-size:8px;
}
.modal-tlogo img{width:100%;height:100%;object-fit:contain}

.modal-scores{display:flex;flex-wrap:wrap;gap:8px}
.modal-score-btn{
  padding:9px 20px;background:rgba(255,255,255,.04);
  border:1px solid var(--bdr);border-radius:6px;
  color:var(--muted);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;
  letter-spacing:.06em;transition:all .15s;
}
.modal-score-btn:hover{border-color:rgba(0,200,255,.28);color:var(--txt)}
.modal-score-btn.sel{border-color:var(--g);background:rgba(0,200,255,.12);color:var(--g)}

.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-clear{
  padding:11px 16px;background:none;border:1px solid var(--bdr);border-radius:6px;
  color:var(--muted);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.08em;transition:all .15s;
}
.modal-clear:hover{border-color:rgba(255,70,70,.4);color:#ff6060}
.modal-cancel{
  flex:1;padding:11px;background:none;border:1px solid var(--bdr);border-radius:6px;
  color:var(--muted);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.08em;transition:all .15s;
}
.modal-cancel:hover{border-color:rgba(255,255,255,.18);color:var(--txt)}
.modal-confirm{
  flex:2;padding:11px;background:rgba(0,200,255,.12);
  border:1px solid rgba(0,200,255,.28);border-radius:6px;
  color:var(--g);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.08em;transition:all .15s;
}
.modal-confirm:hover{background:rgba(0,200,255,.2)}
</style>
</head>
<body>
<div id="screen">
  <div id="topbar">
    <a class="back" href="index.html">←</a>
    <span class="topbar-title">SA OPEN QUALIFIER — SWISS STAGE</span>
    <span class="topbar-sub">VCT 2027 Pacific</span>
  </div>
  <div id="layout">
    <nav id="sidebar"></nav>
    <div id="main"></div>
  </div>
</div>

<div id="modal-wrap">
  <div id="modal">
    <div class="modal-ttl" id="modal-ttl"></div>
    <div class="modal-sec">
      <div class="modal-lbl">승자 선택</div>
      <div class="modal-teams" id="modal-teams"></div>
    </div>
    <div class="modal-sec" id="modal-score-sec" hidden>
      <div class="modal-lbl">스코어</div>
      <div class="modal-scores" id="modal-scores"></div>
    </div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
const DB_KEY = 'sa_oq_swiss_v1';
const L = abbr => `../assets/teams/VCT 2027/VCT Pacific/Pacific_OQ/SA/${abbr}.png`;

const STRUCTURE = [
  {id:'r1', round:'ROUND 1', brackets:[
    {id:'r1',    label:null,    bo:1, count:32}
  ]},
  {id:'r2', round:'ROUND 2', brackets:[
    {id:'r2_01', label:'(0-1)', bo:1, count:16},
    {id:'r2_10', label:'(1-0)', bo:1, count:16}
  ]},
  {id:'r3', round:'ROUND 3', brackets:[
    {id:'r3_20', label:'(2-0)', bo:3, count:8},
    {id:'r3_11', label:'(1-1)', bo:1, count:16}
  ]},
  {id:'r4', round:'ROUND 4', brackets:[
    {id:'r4_30', label:'(3-0)', bo:3, count:4},
    {id:'r4_21', label:'(2-1)', bo:3, count:12}
  ]},
  {id:'r5', round:'ROUND 5', brackets:[
    {id:'r5_31', label:'(3-1)', bo:3, count:8},
    {id:'r5_32', label:'(3-2)', bo:3, count:4}
  ]}
];

const MATCHES = {};
STRUCTURE.forEach(r => r.brackets.forEach(b => {
  MATCHES[b.id] = Array.from({length:b.count}, () => ({t1:null,t2:null,w:null,s1:null,s2:null,ff:false}));
}));

function loadScores() {
  try {
    const data = JSON.parse(localStorage.getItem(DB_KEY) || '{}');
    Object.entries(data).forEach(([bid, arr]) => {
      if (!MATCHES[bid]) return;
      arr.forEach((m, i) => {
        if (!m) return;
        const dm = MATCHES[bid][i];
        if (m.t1 && !dm.t1) dm.t1 = {...m.t1, logo:L(m.t1.abbr)};
        if (m.t2 && !dm.t2) dm.t2 = {...m.t2, logo:L(m.t2.abbr)};
        dm.w = m.w; dm.s1 = m.s1; dm.s2 = m.s2; dm.ff = !!m.ff;
      });
    });
  } catch(e){}
}

function saveScores() {
  try {
    const out = {};
    Object.entries(MATCHES).forEach(([bid, arr]) => {
      out[bid] = arr.map(m => ({
        t1: m.t1 ? {abbr:m.t1.abbr, name:m.t1.name} : null,
        t2: m.t2 ? {abbr:m.t2.abbr, name:m.t2.name} : null,
        w:m.w, s1:m.s1, s2:m.s2, ff:m.ff
      }));
    });
    localStorage.setItem(DB_KEY, JSON.stringify(out));
  } catch(e){}
}

let curRound = 'r1';
let mBid, mIdx, mBo, selW = null, selS = null;

function getBracketInfo(bid) {
  for (const r of STRUCTURE)
    for (const b of r.brackets)
      if (b.id === bid) return {r, b};
  return null;
}

function renderNav() {
  const nav = document.getElementById('sidebar');
  nav.innerHTML = '';
  STRUCTURE.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'rnd-btn' + (r.id === curRound ? ' active' : '');
    const num = r.id.replace('r','');
    btn.innerHTML = `<span class="rl">R${num}</span><span class="rs">ROUND ${num}</span>`;
    btn.onclick = () => { curRound = r.id; renderNav(); renderContent(); };
    nav.appendChild(btn);
  });
}

function teamHTML(t, isT2, isWin, isLose) {
  if (!t) {
    return `<div class="tbd-team${isT2 ? ' t2' : ''}">
      ${isT2 ? '' : '<div class="tbd-logo">?</div>'}
      <span class="tbd-abbr">TBD</span>
      ${isT2 ? '<div class="tbd-logo">?</div>' : ''}
    </div>`;
  }
  const cls = `mteam${isT2 ? ' t2' : ''}${isWin ? ' winner' : ''}${isLose ? ' loser' : ''}`;
  const logoHTML = t.logo
    ? `<img src="${t.logo}" onerror="this.style.display='none'">`
    : '';
  const fullHTML = t.name && t.name !== t.abbr ? `<div class="mfull">${t.name}</div>` : '';
  return `<div class="${cls}">
    <div class="mlogo">${logoHTML}</div>
    <div class="minfo">
      <div class="mabbr">${t.abbr}</div>
      ${fullHTML}
    </div>
  </div>`;
}

function sepHTML(m, bo) {
  const hasW = m.w !== null;
  const t1w = hasW && m.w === 1;
  const t2w = hasW && m.w === 2;
  if (!hasW) return `<div class="msep"><span class="vs">VS</span></div>`;
  if (bo === 1) {
    return `<div class="msep"><div class="bo1-result">
      <span class="${t1w ? 'w' : 'l'}">${t1w ? 'W' : 'L'}</span>
      <span class="bar">|</span>
      <span class="${t2w ? 'w' : 'l'}">${t2w ? 'W' : 'L'}</span>
    </div></div>`;
  }
  const disp = m.ff ? 'FF' : `${m.s1 ?? '-'} : ${m.s2 ?? '-'}`;
  if (m.ff) {
    return `<div class="msep"><div class="score"><span class="${t1w ? 'win' : ''}">FF</span></div></div>`;
  }
  return `<div class="msep"><div class="score">
    <span class="${t1w ? 'win' : ''}">${m.s1 ?? '-'}</span>
    <span class="colon">:</span>
    <span class="${t2w ? 'win' : ''}">${m.s2 ?? '-'}</span>
  </div></div>`;
}

function renderCard(bid, m, idx, bo) {
  const hasW = m.w !== null;
  const t1w = hasW && m.w === 1;
  const t2w = hasW && m.w === 2;
  const card = document.createElement('div');
  card.className = 'match-card';
  card.style.animationDelay = `${Math.min(idx, 15) * 0.02}s`;
  card.innerHTML = `
    <div class="match-card-top">
      <span class="match-num">MATCH ${String(idx+1).padStart(2,'0')}</span>
      <span class="match-bo">Bo${bo}</span>
    </div>
    <div class="match-row">
      ${teamHTML(m.t1, false, t1w, hasW && !t1w)}
      ${sepHTML(m, bo)}
      ${teamHTML(m.t2, true, t2w, hasW && !t2w)}
    </div>
  `;
  card.onclick = () => openModal(bid, idx, bo);
  return card;
}

function renderContent() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const r = STRUCTURE.find(x => x.id === curRound);
  if (!r) return;
  r.brackets.forEach(b => {
    const matches = MATCHES[b.id];
    const sec = document.createElement('div');
    sec.className = 'bracket-section';

    const hdr = document.createElement('div');
    hdr.className = 'bracket-header';
    hdr.innerHTML = `
      <span class="bracket-label">${b.label ? b.label + ' 조' : r.round}</span>
      <span class="bracket-meta">${matches.length}경기</span>
      <span class="bracket-bo-badge">Bo${b.bo}</span>
    `;
    sec.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'match-grid';
    matches.forEach((m, idx) => grid.appendChild(renderCard(b.id, m, idx, b.bo)));
    sec.appendChild(grid);
    main.appendChild(sec);
  });
}

function openModal(bid, idx, bo) {
  mBid = bid; mIdx = idx; mBo = bo;
  const m = MATCHES[bid][idx];
  selW = m.w; selS = null;
  if (m.ff) selS = 'FF';
  else if (m.s1 !== null && m.s2 !== null) selS = `${m.s1}:${m.s2}`;

  const info = getBracketInfo(bid);
  const lbl = info.b.label ? `${info.r.round} · ${info.b.label} 조` : info.r.round;
  document.getElementById('modal-ttl').textContent = `${lbl} · MATCH ${String(idx+1).padStart(2,'0')}`;

  // Teams
  const teamsEl = document.getElementById('modal-teams');
  teamsEl.innerHTML = '';
  [1,2].forEach(side => {
    const t = side === 1 ? m.t1 : m.t2;
    const btn = document.createElement('button');
    btn.className = 'modal-team-btn' + (selW === side ? ' sel' : '');
    btn.dataset.side = side;
    const logoSrc = t?.logo ? `<img src="${t.logo}" onerror="this.style.display='none'">` : '?';
    btn.innerHTML = `<div class="modal-tlogo">${logoSrc}</div><span>${t?.abbr ?? 'TBD'}</span>`;
    btn.onclick = () => {
      selW = side;
      teamsEl.querySelectorAll('.modal-team-btn').forEach(b => b.classList.toggle('sel', +b.dataset.side === side));
      if (bo === 1) { confirmMatch(); }
    };
    teamsEl.appendChild(btn);
  });

  // Score (Bo3 only)
  const scoreSec = document.getElementById('modal-score-sec');
  scoreSec.hidden = bo === 1;
  if (bo === 3) {
    const scEl = document.getElementById('modal-scores');
    scEl.innerHTML = '';
    ['2:0','2:1','FF'].forEach(sc => {
      const btn = document.createElement('button');
      btn.className = 'modal-score-btn' + (selS === sc ? ' sel' : '');
      btn.textContent = sc;
      btn.onclick = () => {
        selS = sc;
        scEl.querySelectorAll('.modal-score-btn').forEach(b => b.classList.toggle('sel', b.textContent === sc));
      };
      scEl.appendChild(btn);
    });
  }

  // Actions
  const actEl = document.getElementById('modal-actions');
  actEl.innerHTML = '';
  if (m.w !== null) {
    const clr = document.createElement('button');
    clr.className = 'modal-clear';
    clr.textContent = '결과 지우기';
    clr.onclick = () => { clearMatch(); };
    actEl.appendChild(clr);
  }
  const cancel = document.createElement('button');
  cancel.className = 'modal-cancel';
  cancel.textContent = '취소';
  cancel.onclick = closeModal;
  actEl.appendChild(cancel);
  if (bo === 3) {
    const confirm = document.createElement('button');
    confirm.className = 'modal-confirm';
    confirm.textContent = '확인';
    confirm.onclick = confirmMatch;
    actEl.appendChild(confirm);
  }

  document.getElementById('modal-wrap').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-wrap').classList.remove('open');
}

function confirmMatch() {
  if (selW === null) return;
  if (mBo === 3 && selS === null) return;
  const m = MATCHES[mBid][mIdx];
  m.w = selW;
  if (mBo === 1) {
    m.s1 = null; m.s2 = null; m.ff = false;
  } else {
    if (selS === 'FF') {
      m.ff = true;
      m.s1 = selW === 1 ? 2 : 0;
      m.s2 = selW === 1 ? 0 : 2;
    } else {
      m.ff = false;
      const [ws, ls] = selS.split(':').map(Number);
      m.s1 = selW === 1 ? ws : ls;
      m.s2 = selW === 1 ? ls : ws;
    }
  }
  saveScores();
  closeModal();
  renderContent();
}

function clearMatch() {
  const m = MATCHES[mBid][mIdx];
  m.w = null; m.s1 = null; m.s2 = null; m.ff = false;
  saveScores();
  closeModal();
  renderContent();
}

document.getElementById('modal-wrap').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-wrap')) closeModal();
});

loadScores();
renderNav();
renderContent();
</script>
</body>
</html>
