<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Open Qualifier — VCT 2027 Pacific</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700&family=Barlow:wght@300;400;500&family=Share+Tech+Mono&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00C8FF;--gb:rgba(0,200,255,1);
  --bg:#04040c;--s1:rgba(5,10,24,.82);--s2:rgba(0,8,20,.6);
  --bdr:rgba(0,200,255,.1);--bdr2:rgba(0,200,255,.22);
  --txt:#dde8f0;--muted:rgba(180,210,230,.42);--muted2:rgba(180,210,230,.14);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif}

/* ── stars canvas ── */
#stars-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── atmosphere ── */
#atm{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%,rgba(0,200,255,.07) 0%,transparent 70%),
    radial-gradient(ellipse 40% 30% at 100% 100%,rgba(0,80,160,.06) 0%,transparent 60%);
}

/* ── CRT effect ── */
#screen{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;
  transform:scaleY(.02);opacity:0;transform-origin:center;
  animation:crtOn .55s cubic-bezier(.16,1,.3,1) .08s forwards}
#screen::after{content:'';position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(to bottom,transparent,rgba(0,200,255,.6),transparent);
  animation:scanSweep .7s .35s linear forwards;z-index:100;opacity:0}

@keyframes crtOn{
  0%  {transform:scaleY(.02);filter:brightness(8);opacity:.9}
  18% {transform:scaleY(.02);filter:brightness(10)}
  34% {transform:scaleY(1);filter:brightness(2.5)}
  70% {filter:brightness(1.1)}
  100%{transform:scaleY(1);filter:brightness(1);opacity:1}}
@keyframes crtOff{
  0%  {transform:scaleY(1);filter:brightness(1);opacity:1}
  35% {transform:scaleY(1);filter:brightness(4) saturate(2)}
  55% {transform:scaleY(.04);filter:brightness(9) saturate(0)}
  80% {transform:scaleY(.02);filter:brightness(.4)}
  100%{transform:scaleY(0);filter:brightness(0);opacity:0}}
@keyframes scanSweep{0%{top:-4px;opacity:1}100%{top:100%;opacity:.2}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 10px rgba(0,200,255,.18),0 0 24px rgba(0,200,255,.07),inset 0 0 10px rgba(0,200,255,.04)}
  50%    {box-shadow:0 0 18px rgba(0,200,255,.42),0 0 48px rgba(0,200,255,.14),inset 0 0 16px rgba(0,200,255,.07)}}
@keyframes matchIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}}

/* ── topbar ── */
#topbar{
  flex-shrink:0;
  display:flex;align-items:center;gap:1.2rem;
  padding:.7rem 1.8rem;
  background:linear-gradient(to bottom,rgba(0,8,24,.98),rgba(0,6,18,.95));
  border-bottom:1px solid rgba(0,200,255,.14);
  position:relative;overflow:hidden;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#topbar::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(0,200,255,.5) 30%,rgba(0,200,255,.8) 50%,rgba(0,200,255,.5) 70%,transparent 100%);
  opacity:.6}
#topbar::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,rgba(0,200,255,.03) 0%,transparent 40%);
  pointer-events:none}
.tb-back{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  text-decoration:none;border:1px solid rgba(0,200,255,.18);
  padding:5px 14px;border-radius:2px;transition:all .2s;flex-shrink:0;
  position:relative;overflow:hidden}
.tb-back::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(0,200,255,.08),transparent);
  transform:translateX(-100%);transition:transform .3s}
.tb-back:hover{color:var(--g);border-color:rgba(0,200,255,.5);
  box-shadow:0 0 12px rgba(0,200,255,.12)}
.tb-back:hover::before{transform:translateX(100%)}
.tb-sep{width:1px;height:22px;background:rgba(0,200,255,.14);flex-shrink:0}
.tb-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--g);opacity:.7;
  text-shadow:0 0 10px rgba(0,200,255,.4)}
.tb-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;
  letter-spacing:.07em;text-transform:uppercase;color:var(--txt);
  text-shadow:0 0 20px rgba(0,200,255,.15)}
.tb-meta{
  margin-left:auto;
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.06em;
  color:rgba(0,200,255,.5);text-transform:uppercase;white-space:nowrap;
  border:1px solid rgba(0,200,255,.12);padding:3px 10px;border-radius:1px}

/* ── layout ── */
#body{flex:1;display:flex;overflow:hidden}

/* ── sidebar ── */
#sidebar{
  width:70px;flex-shrink:0;
  border-right:1px solid rgba(0,200,255,.1);
  background:linear-gradient(to bottom,rgba(0,8,22,.96),rgba(0,5,15,.92));
  display:flex;flex-direction:column;align-items:center;
  padding:.8rem 0;gap:.4rem;position:relative;overflow-y:auto}
#sidebar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom,transparent 0%,rgba(0,200,255,.35) 50%,transparent 100%)}
.g-btn{
  width:48px;height:48px;border-radius:3px;
  border:1px solid rgba(0,200,255,.14);
  background:transparent;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:all .25s}
.g-btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,200,255,.04) 0%,transparent 50%);
  opacity:0;transition:opacity .2s}
.g-btn:hover{border-color:rgba(0,200,255,.35);background:rgba(0,200,255,.04)}
.g-btn:hover::before{opacity:1}
.g-btn.active{
  border-color:var(--g);
  background:linear-gradient(135deg,rgba(0,200,255,.1) 0%,rgba(0,200,255,.03) 100%);
  animation:glowPulse 2.8s ease-in-out infinite}
.g-btn .g-label{
  position:relative;z-index:1;
  font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;
  color:var(--muted);letter-spacing:.02em;transition:all .2s}
.g-btn:hover .g-label{color:var(--txt)}
.g-btn.active .g-label{color:var(--g);text-shadow:0 0 10px rgba(0,200,255,.6)}
.g-btn .g-sub{
  position:relative;z-index:1;
  font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.08em;
  color:var(--muted2);transition:color .2s}
.g-btn.active .g-sub{color:rgba(0,200,255,.6)}
.g-corner{position:absolute;width:6px;height:6px;border-color:var(--g);border-style:solid;
  opacity:0;transition:opacity .25s}
.g-btn.active .g-corner{opacity:1}
.g-corner.tl{top:3px;left:3px;border-width:1px 0 0 1px}
.g-corner.tr{top:3px;right:3px;border-width:1px 1px 0 0}
.g-corner.bl{bottom:3px;left:3px;border-width:0 0 1px 1px}
.g-corner.br{bottom:3px;right:3px;border-width:0 1px 1px 0}

/* ── main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── content ── */
#content{flex:1;overflow-y:auto;padding:1.2rem 1.4rem;position:relative}
#content::-webkit-scrollbar{width:3px}
#content::-webkit-scrollbar-thumb{background:rgba(0,200,255,.25);border-radius:2px}
#content::-webkit-scrollbar-track{background:transparent}

/* ── section header ── */
.grp-header{
  display:flex;align-items:center;gap:.9rem;
  margin-bottom:1rem;padding-bottom:.7rem;
  border-bottom:1px solid rgba(0,200,255,.1);
  position:relative}
.grp-header::after{content:'';position:absolute;bottom:-1px;left:0;width:60px;height:1px;
  background:var(--g);opacity:.6}
.grp-title{
  font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;color:var(--txt)}
.grp-badge{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:2px}
.grp-badge.pending{color:var(--muted);background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07)}
.grp-badge.done{color:rgba(0,200,255,.6);background:rgba(0,200,255,.06);border:1px solid rgba(0,200,255,.18)}
.grp-badge.live{color:var(--g);background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.3);
  text-shadow:0 0 8px rgba(0,200,255,.5);animation:pulse 1.4s ease-in-out infinite}
.grp-desc{
  margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:9px;
  color:rgba(0,200,255,.45);letter-spacing:.06em;text-transform:uppercase}

/* ── bracket section ── */
.bracket-sec{margin-bottom:2rem}

/* ── compact rows (Bo1) ── */
.compact-grid{display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.cr{
  display:flex;align-items:center;
  border:1px solid rgba(0,200,255,.09);border-radius:3px;
  background:linear-gradient(135deg,rgba(0,10,30,.75) 0%,rgba(0,5,18,.65) 100%);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  overflow:hidden;cursor:pointer;min-height:56px;
  transition:all .22s;animation:matchIn .18s ease both;position:relative}
.cr::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,rgba(0,200,255,.12),rgba(0,200,255,.04));
  opacity:0;transition:opacity .2s}
.cr:hover{border-color:rgba(0,200,255,.28);
  background:linear-gradient(135deg,rgba(0,20,45,.85) 0%,rgba(0,10,30,.75) 100%);
  box-shadow:0 4px 24px rgba(0,200,255,.07),0 0 0 1px rgba(0,200,255,.08);
  transform:translateY(-1px)}
.cr:hover::before{opacity:1}
.cr.has-result{border-color:rgba(0,200,255,.16)}
.cr-team{flex:1;min-width:0;display:flex;align-items:center;gap:.7rem;padding:.6rem .85rem}
.cr-team.win{background:linear-gradient(90deg,rgba(0,200,255,.1) 0%,rgba(0,200,255,.03) 100%)}
.cr.has-result .cr-team:not(.win){opacity:.38}
.cr-logo{
  width:34px;height:34px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative}
.cr-logo::before{content:'';position:absolute;inset:-2px;border-radius:50%;
  border:1px solid rgba(0,200,255,.12);opacity:0;transition:opacity .2s}
.cr-team.win .cr-logo::before{opacity:1;border-color:rgba(0,200,255,.5);
  box-shadow:0 0 8px rgba(0,200,255,.25)}
.cr-logo img{width:100%;height:100%;object-fit:contain;border-radius:2px}
.cr-logo-ph{width:34px;height:34px;border-radius:2px;
  background:rgba(0,200,255,.05);border:1px solid rgba(0,200,255,.1);
  display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(0,200,255,.3)}
.cr-info{min-width:0;display:flex;flex-direction:column;gap:3px}
.cr-abbr{
  font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;
  letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--txt);line-height:1;transition:all .15s}
.cr-name{
  font-family:'Barlow',sans-serif;font-size:10px;font-weight:300;
  letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--muted);line-height:1}
.cr-team.win .cr-abbr{
  color:var(--g);text-shadow:0 0 14px rgba(0,200,255,.55)}
.cr-team.win .cr-name{color:rgba(0,200,255,.5)}
.cr-sep{width:1px;background:rgba(0,200,255,.08);align-self:stretch;flex-shrink:0}
.cr-vs{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.12em;
  color:rgba(0,200,255,.25);padding:0 .6rem;flex-shrink:0}

/* ── match card (Bo3) ── */
.match-grid{display:grid;gap:.6rem}
.match-grid.g2{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.match-card{
  border:1px solid rgba(0,200,255,.1);border-radius:4px;
  background:linear-gradient(160deg,rgba(0,10,28,.8) 0%,rgba(0,5,16,.72) 100%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  overflow:hidden;position:relative;cursor:pointer;
  transition:all .22s;animation:matchIn .2s ease both}
.match-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,transparent,var(--g),transparent);opacity:0;transition:opacity .2s}
.match-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,200,255,.25),transparent);opacity:0;transition:opacity .2s}
.match-card:hover{
  border-color:rgba(0,200,255,.28);
  box-shadow:0 6px 32px rgba(0,200,255,.09),0 0 0 1px rgba(0,200,255,.07);
  transform:translateY(-2px)}
.match-card:hover::before{opacity:.5}
.match-card:hover::after{opacity:1}
.match-card.has-result{border-color:rgba(0,200,255,.18)}
.match-card.has-result::before{opacity:.25}
.match-num-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:.32rem .8rem;border-bottom:1px solid rgba(0,200,255,.07);
  background:rgba(0,0,0,.2)}
.match-num-txt{
  font-family:'Share Tech Mono',monospace;font-size:8px;
  letter-spacing:.12em;color:rgba(0,200,255,.35)}
.match-bo-badge{
  font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.08em;
  color:rgba(0,200,255,.45);border:1px solid rgba(0,200,255,.18);
  padding:1px 6px;border-radius:1px}

/* ── team row (Bo3) ── */
.mt-row{
  display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;position:relative;
  transition:background .15s}
.mt-row.tbd{opacity:.32}
.mt-row.win{background:linear-gradient(90deg,rgba(0,200,255,.1) 0%,rgba(0,200,255,.03) 100%)}
.mt-row.win::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--g);box-shadow:0 0 6px rgba(0,200,255,.5)}
.mt-logo{
  width:30px;height:30px;border-radius:3px;
  border:1px solid rgba(0,200,255,.12);
  background:rgba(0,200,255,.04);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:all .15s}
.mt-row.win .mt-logo{border-color:rgba(0,200,255,.35);box-shadow:0 0 8px rgba(0,200,255,.2)}
.mt-logo img{width:100%;height:100%;object-fit:contain}
.mt-logo-ph{font-size:10px;color:rgba(255,255,255,.18)}
.mt-info{flex:1;min-width:0}
.mt-abbr{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.03em;color:var(--txt);display:block;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
.mt-row.win .mt-abbr{color:var(--g);text-shadow:0 0 10px rgba(0,200,255,.5)}
.mt-row.tbd .mt-abbr{color:var(--muted2)}
.mt-name{
  font-size:9px;color:var(--muted);display:block;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.mt-score{
  font-family:'Share Tech Mono',monospace;font-size:20px;font-weight:400;
  flex-shrink:0;color:var(--muted2);min-width:18px;text-align:right;letter-spacing:-.02em}
.mt-row.win .mt-score{color:var(--g);text-shadow:0 0 12px rgba(0,200,255,.5)}

/* ── vs divider (Bo3) ── */
.match-vs{
  display:flex;align-items:center;gap:.5rem;padding:.16rem .8rem;
  border-top:1px solid rgba(0,200,255,.06);border-bottom:1px solid rgba(0,200,255,.06);
  background:rgba(0,0,0,.12)}
.match-vs-line{flex:1;height:1px;background:rgba(0,200,255,.07)}
.match-vs-txt{
  font-family:'Share Tech Mono',monospace;font-size:8px;
  letter-spacing:.18em;color:rgba(0,200,255,.2)}

/* ── score overlay ── */
#scoreOverlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,2,12,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  align-items:center;justify-content:center}
#scoreOverlay.open{display:flex}
#scoreBox{
  background:linear-gradient(160deg,rgba(0,12,32,.97) 0%,rgba(0,6,20,.97) 100%);
  border:1px solid rgba(0,200,255,.28);border-radius:4px;
  width:min(400px,92vw);overflow:hidden;position:relative;
  box-shadow:0 0 60px rgba(0,200,255,.08),0 0 120px rgba(0,200,255,.04)}
#scoreBox::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--g),transparent);opacity:.8}
#scoreBox::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(to bottom,rgba(0,200,255,.03) 0%,transparent 30%);pointer-events:none}
.sb-header{
  padding:.75rem 1.1rem;border-bottom:1px solid rgba(0,200,255,.1);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,0,0,.15)}
.sb-title{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;
  letter-spacing:.12em;text-transform:uppercase;color:var(--txt)}
.sb-close{
  background:none;border:1px solid rgba(0,200,255,.18);
  border-radius:2px;cursor:pointer;color:var(--muted);
  font-size:14px;line-height:1;padding:3px 7px;transition:all .15s}
.sb-close:hover{color:var(--g);border-color:rgba(0,200,255,.5)}
.sb-body{padding:.95rem 1.1rem}
.sb-label{
  font-family:'Share Tech Mono',monospace;font-size:8px;
  letter-spacing:.18em;text-transform:uppercase;color:rgba(0,200,255,.45);
  margin-bottom:.55rem;padding-left:2px}
.sb-teams{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
.sb-team{
  display:flex;align-items:center;gap:.55rem;padding:.6rem .75rem;
  border:1px solid rgba(0,200,255,.12);border-radius:3px;
  background:rgba(0,10,25,.5);cursor:pointer;transition:all .18s;text-align:left}
.sb-team:hover{border-color:rgba(0,200,255,.35);background:rgba(0,200,255,.07)}
.sb-team.selected{
  border-color:var(--g);background:rgba(0,200,255,.12);
  box-shadow:0 0 14px rgba(0,200,255,.12)}
.sb-team-logo{
  width:28px;height:28px;border-radius:2px;border:1px solid rgba(0,200,255,.15);
  background:rgba(0,200,255,.04);flex-shrink:0;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.sb-team-logo img{width:100%;height:100%;object-fit:contain}
.sb-team-abbr{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.03em;color:var(--txt);display:block;line-height:1}
.sb-team.selected .sb-team-abbr{color:var(--g);text-shadow:0 0 8px rgba(0,200,255,.4)}
.sb-team-name{font-size:9px;color:var(--muted);display:block;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.sb-score-wrap{margin-bottom:1rem}
.sb-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.sb-score-btn{
  padding:.55rem .4rem;
  border:1px solid rgba(0,200,255,.12);border-radius:3px;
  background:rgba(0,10,25,.5);cursor:pointer;transition:all .18s;
  font-family:'Share Tech Mono',monospace;font-size:16px;
  color:var(--muted);text-align:center;letter-spacing:.04em}
.sb-score-btn:hover{border-color:rgba(0,200,255,.35);color:var(--txt)}
.sb-score-btn.selected{
  border-color:var(--g);color:var(--g);background:rgba(0,200,255,.1);
  text-shadow:0 0 10px rgba(0,200,255,.4)}
.sb-footer{
  display:flex;gap:.5rem;padding:.75rem 1.1rem;
  border-top:1px solid rgba(0,200,255,.08);background:rgba(0,0,0,.12)}
.sb-btn{
  flex:1;padding:.5rem;border-radius:2px;border:1px solid rgba(0,200,255,.14);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .18s}
.sb-btn.cancel{background:transparent;color:var(--muted)}
.sb-btn.cancel:hover{border-color:rgba(255,255,255,.2);color:var(--txt)}
.sb-btn.confirm{
  background:rgba(0,200,255,.14);color:var(--g);
  border-color:rgba(0,200,255,.35);text-shadow:0 0 8px rgba(0,200,255,.4)}
.sb-btn.confirm:hover{background:rgba(0,200,255,.24)}
.sb-btn.confirm:disabled{opacity:.25;cursor:not-allowed;text-shadow:none}
.sb-clear{
  background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:2px;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:.5rem .9rem;cursor:pointer;transition:all .18s}
.sb-clear:hover{border-color:rgba(255,80,80,.35);color:rgba(255,100,100,.8)}
</style>
</head>
<body>
<canvas id="stars-canvas"></canvas>
<div id="atm"></div>

<div id="screen">

  <div id="topbar">
    <a class="tb-back" href="index.html" onclick="triggerCrtOff(event)">← BACK</a>
    <div class="tb-sep"></div>
    <div>
      <div class="tb-eyebrow">VCT 2027 · SA KICKOFF OQ</div>
      <div class="tb-title">SA OPEN QUALIFIER — SWISS STAGE</div>
    </div>
    <div class="tb-meta">64 TEAMS · SWISS · TOP 8 → PLAYOFF</div>
  </div>

  <div id="body">
    <div id="sidebar"></div>
    <div id="main">
      <div id="content"></div>
    </div>
  </div>
</div>

<div id="scoreOverlay">
  <div id="scoreBox">
    <div class="sb-header">
      <div class="sb-title" id="sbTitle">결과 입력</div>
      <button class="sb-close" onclick="closeScoreModal()">✕</button>
    </div>
    <div class="sb-body">
      <div class="sb-label">승자 선택</div>
      <div class="sb-teams" id="sbTeams"></div>
      <div id="sbScoreWrap" class="sb-score-wrap">
        <div class="sb-label">스코어</div>
        <div class="sb-scores" id="sbScores">
          <button class="sb-score-btn" data-s="2-0" onclick="pickScore(this)">2 : 0</button>
          <button class="sb-score-btn" data-s="2-1" onclick="pickScore(this)">2 : 1</button>
          <button class="sb-score-btn" data-s="FF"  onclick="pickScore(this)">FF</button>
        </div>
      </div>
    </div>
    <div class="sb-footer" id="sbFooter">
      <button class="sb-btn cancel" onclick="closeScoreModal()">취소</button>
      <button class="sb-btn confirm" id="sbConfirm" onclick="confirmScore()" disabled>확인</button>
    </div>
  </div>
</div>

<script>
/* ── stars animation ── */
(function(){
  const cv = document.getElementById('stars-canvas');
  const ctx = cv.getContext('2d');
  let W, H, pts;
  function init(){
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    pts = Array.from({length:160}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*.9+.15,
      vx:(Math.random()-.5)*.12, vy:(Math.random()-.5)*.12,
      a: Math.random()*.35+.08,
      tw: Math.random()*200+80, tp:Math.random()*300
    }));
  }
  let t=0;
  function draw(){
    t++;
    ctx.clearRect(0,0,W,H);
    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      const flicker = p.a * (.7 + .3*Math.sin((t+p.tp)*Math.PI*2/p.tw));
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(160,220,255,${flicker})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', init);
  init(); draw();
})();

/* ── data ── */
const DB_KEY = 'sa_oq_swiss_v1';
const L = abbr => `../assets/teams/VCT 2027/VCT Pacific/Pacific_OQ/SA/${abbr}.png`;

const STRUCTURE = [
  {id:'r1', round:'ROUND 1', desc:'전체 참가', brackets:[
    {id:'r1',    label:null,    bo:1, count:32}
  ]},
  {id:'r2', round:'ROUND 2', desc:'2라운드', brackets:[
    {id:'r2_10', label:'(1-0)', bo:1, count:16},
    {id:'r2_01', label:'(0-1)', bo:1, count:16}
  ]},
  {id:'r3', round:'ROUND 3', desc:'3라운드', brackets:[
    {id:'r3_20', label:'(2-0)', bo:3, count:8},
    {id:'r3_11', label:'(1-1)', bo:1, count:16}
  ]},
  {id:'r4', round:'ROUND 4', desc:'4라운드', brackets:[
    {id:'r4_30', label:'(3-0)', bo:3, count:4},
    {id:'r4_21', label:'(2-1)', bo:3, count:12}
  ]},
  {id:'r5', round:'ROUND 5', desc:'최종', brackets:[
    {id:'r5_31', label:'(3-1)', bo:3, count:8},
    {id:'r5_32', label:'(3-2)', bo:3, count:4}
  ]}
];

const MATCHES = {};
STRUCTURE.forEach(r => r.brackets.forEach(b => {
  MATCHES[b.id] = Array.from({length:b.count}, () =>
    ({t1:null,t2:null,w:null,s1:null,s2:null,ff:false}));
}));

function loadScores(){
  try{
    const data = JSON.parse(localStorage.getItem(DB_KEY)||'{}');
    Object.entries(data).forEach(([bid,arr])=>{
      if(!MATCHES[bid])return;
      arr.forEach((m,i)=>{
        if(!m||!MATCHES[bid][i])return;
        const dm=MATCHES[bid][i];
        if(m.t1)dm.t1={abbr:m.t1.abbr,name:m.t1.name,logo:L(m.t1.abbr)};
        if(m.t2)dm.t2={abbr:m.t2.abbr,name:m.t2.name,logo:L(m.t2.abbr)};
        dm.w=m.w;dm.s1=m.s1;dm.s2=m.s2;dm.ff=!!m.ff;
      });
    });
  }catch(e){}
}

function saveScores(){
  try{
    const out={};
    Object.entries(MATCHES).forEach(([bid,arr])=>{
      out[bid]=arr.map(m=>({
        t1:m.t1?{abbr:m.t1.abbr,name:m.t1.name}:null,
        t2:m.t2?{abbr:m.t2.abbr,name:m.t2.name}:null,
        w:m.w,s1:m.s1,s2:m.s2,ff:m.ff
      }));
    });
    localStorage.setItem(DB_KEY,JSON.stringify(out));
  }catch(e){}
}

let curRound='r1';

function renderNav(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='';
  STRUCTURE.forEach(r=>{
    const btn=document.createElement('button');
    btn.className='g-btn'+(r.id===curRound?' active':'');
    const num=r.id.replace('r','');
    btn.innerHTML=`
      <div class="g-corner tl"></div><div class="g-corner tr"></div>
      <div class="g-corner bl"></div><div class="g-corner br"></div>
      <span class="g-label">R${num}</span>
      <span class="g-sub">RND</span>`;
    btn.onclick=()=>{
      curRound=r.id;
      document.querySelectorAll('#sidebar .g-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderContent();
    };
    sb.appendChild(btn);
  });
}

function crTeamHTML(t,isWin){
  const logoInner=t?.logo
    ?`<img src="${t.logo}" alt="" onerror="this.style.display='none'">`
    :`<div class="cr-logo-ph">?</div>`;
  const abbr=t?.abbr??'TBD';
  const name=t?.name&&t.name!==abbr?t.name:'';
  return `<div class="cr-team${isWin?' win':''}">
    <div class="cr-logo">${logoInner}</div>
    <div class="cr-info">
      <span class="cr-abbr">${abbr}</span>
      ${name?`<span class="cr-name">${name}</span>`:''}
    </div>
  </div>`;
}

function renderCrRow(bid,m,idx){
  const hasResult=m.w!==null;
  const t1w=hasResult&&m.w===1, t2w=hasResult&&m.w===2;
  const el=document.createElement('div');
  el.className='cr'+(hasResult?' has-result':'');
  el.style.animationDelay=`${Math.min(idx,20)*.016}s`;
  el.innerHTML=
    crTeamHTML(m.t1,t1w)+
    `<div class="cr-sep"></div><span class="cr-vs">VS</span><div class="cr-sep"></div>`+
    crTeamHTML(m.t2,t2w);
  el.onclick=()=>openScoreModal(bid,idx,1);
  return el;
}

function mtRowHTML(t,side,m){
  const win=m.w===side, hasResult=m.w!==null;
  const score=side===1?m.s1:m.s2;
  const logoInner=t?.logo
    ?`<img src="${t.logo}" alt="" onerror="this.style.display='none'">`
    :`<span class="mt-logo-ph">?</span>`;
  const abbr=t?.abbr??'TBD';
  const name=t?.name&&t.name!==abbr?t.name:'';
  const rowCls=!t?'mt-row tbd':win?'mt-row win':'mt-row';
  const dim=hasResult&&!win?' style="opacity:.35"':'';
  const scoreStr=m.ff&&win?'FF':(score!==null?score:(hasResult?'':' '));
  return `<div class="${rowCls}"${dim}>
    <div class="mt-logo">${logoInner}</div>
    <div class="mt-info">
      <span class="mt-abbr">${abbr}</span>
      ${name?`<span class="mt-name">${name}</span>`:''}
    </div>
    <span class="mt-score">${scoreStr}</span>
  </div>`;
}

function renderMatchCard(bid,m,idx){
  const hasResult=m.w!==null;
  const el=document.createElement('div');
  el.className='match-card'+(hasResult?' has-result':'');
  el.style.animationDelay=`${Math.min(idx,12)*.022}s`;
  el.innerHTML=`
    <div class="match-num-row">
      <span class="match-num-txt">MATCH ${String(idx+1).padStart(2,'0')}</span>
      <span class="match-bo-badge">Bo3</span>
    </div>
    ${mtRowHTML(m.t1,1,m)}
    <div class="match-vs">
      <div class="match-vs-line"></div>
      <span class="match-vs-txt">VS</span>
      <div class="match-vs-line"></div>
    </div>
    ${mtRowHTML(m.t2,2,m)}`;
  el.onclick=()=>openScoreModal(bid,idx,3);
  return el;
}

function renderContent(){
  const content=document.getElementById('content');
  content.innerHTML='';
  const rnd=STRUCTURE.find(x=>x.id===curRound);
  if(!rnd)return;
  rnd.brackets.forEach(b=>{
    const matches=MATCHES[b.id];
    const done=matches.filter(m=>m.w!==null).length;
    const sec=document.createElement('div');
    sec.className='bracket-sec';
    const title=b.label?`${b.label} 조`:rnd.round;
    const badgeCls=done===matches.length?'done':done>0?'live':'pending';
    const badgeTxt=done===matches.length?'완료':done>0?`${done}/${matches.length}`:`${matches.length}경기`;
    const descTxt=b.bo===1?'BO1':'BO3';
    sec.innerHTML=`
      <div class="grp-header">
        <span class="grp-title">${title}</span>
        <span class="grp-badge ${badgeCls}">${badgeTxt}</span>
        <span class="grp-desc">${descTxt}</span>
      </div>`;
    if(b.bo===1){
      const grid=document.createElement('div');
      grid.className='compact-grid';
      matches.forEach((m,idx)=>grid.appendChild(renderCrRow(b.id,m,idx)));
      sec.appendChild(grid);
    }else{
      const grid=document.createElement('div');
      grid.className='match-grid g2';
      matches.forEach((m,idx)=>grid.appendChild(renderMatchCard(b.id,m,idx)));
      sec.appendChild(grid);
    }
    content.appendChild(sec);
  });
}

/* ── score modal ── */
let _bid,_idx,_bo,_selW=null,_selS=null;

function openScoreModal(bid,idx,bo){
  _bid=bid;_idx=idx;_bo=bo;
  const m=MATCHES[bid][idx];
  _selW=m.w;
  _selS=m.ff?'FF':(m.s1!==null?`${m.s1}-${m.s2??0}`:null);
  const info=(()=>{for(const r of STRUCTURE)for(const b of r.brackets)if(b.id===bid)return{r,b};})();
  const lbl=info.b.label?`${info.r.round} · ${info.b.label}`:info.r.round;
  document.getElementById('sbTitle').textContent=`${lbl} · MATCH ${String(idx+1).padStart(2,'0')} · Bo${bo}`;
  const teamsEl=document.getElementById('sbTeams');
  teamsEl.innerHTML='';
  [1,2].forEach(side=>{
    const t=side===1?m.t1:m.t2;
    const btn=document.createElement('button');
    btn.className='sb-team'+(_selW===side?' selected':'');
    const logoSrc=t?.logo?`<img src="${t.logo}" alt="" onerror="this.style.display='none'">`: '?';
    btn.innerHTML=`<div class="sb-team-logo">${logoSrc}</div>
      <div>
        <span class="sb-team-abbr">${t?.abbr??'TBD'}</span>
        ${t?.name&&t.name!==t?.abbr?`<span class="sb-team-name">${t.name}</span>`:''}
      </div>`;
    btn.onclick=()=>{
      _selW=side;
      teamsEl.querySelectorAll('.sb-team').forEach(b=>b.classList.toggle('selected',b===btn));
      if(bo===1){confirmScore();return;}
      updateConfirmBtn();
    };
    teamsEl.appendChild(btn);
  });
  const scoreWrap=document.getElementById('sbScoreWrap');
  scoreWrap.style.display=bo===1?'none':'';
  if(bo===3){
    document.querySelectorAll('.sb-score-btn').forEach(b=>{
      b.classList.toggle('selected',b.dataset.s===_selS);
    });
  }
  const footer=document.getElementById('sbFooter');
  const ec=footer.querySelector('.sb-clear');
  if(ec)ec.remove();
  if(m.w!==null){
    const clr=document.createElement('button');
    clr.className='sb-clear';clr.textContent='지우기';
    clr.onclick=clearScore;
    footer.insertBefore(clr,footer.firstChild);
  }
  if(bo===3)updateConfirmBtn();
  document.getElementById('scoreOverlay').classList.add('open');
}

function pickScore(btn){
  _selS=btn.dataset.s;
  document.querySelectorAll('.sb-score-btn').forEach(b=>b.classList.toggle('selected',b===btn));
  updateConfirmBtn();
}

function updateConfirmBtn(){
  document.getElementById('sbConfirm').disabled=!(_selW!==null&&(_bo===1||_selS!==null));
}

function confirmScore(){
  if(_selW===null)return;
  if(_bo===3&&_selS===null)return;
  const m=MATCHES[_bid][_idx];
  m.w=_selW;
  if(_bo===1){m.s1=null;m.s2=null;m.ff=false;}
  else{
    if(_selS==='FF'){
      m.ff=true;m.s1=_selW===1?2:0;m.s2=_selW===1?0:2;
    }else{
      m.ff=false;
      const[ws,ls]=_selS.split('-').map(Number);
      m.s1=_selW===1?ws:ls;m.s2=_selW===1?ls:ws;
    }
  }
  saveScores();closeScoreModal();renderContent();
}

function clearScore(){
  const m=MATCHES[_bid][_idx];
  m.w=null;m.s1=null;m.s2=null;m.ff=false;
  saveScores();closeScoreModal();renderContent();
}

function closeScoreModal(){
  document.getElementById('scoreOverlay').classList.remove('open');
  _selW=null;_selS=null;
}

document.getElementById('scoreOverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('scoreOverlay'))closeScoreModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeScoreModal();});

function triggerCrtOff(e){
  e.preventDefault();
  const href=e.currentTarget.href;
  document.getElementById('screen').style.animation='crtOff .4s ease forwards';
  setTimeout(()=>{window.location.href=href;},420);
}

loadScores();renderNav();renderContent();
</script>
</body>
</html>
