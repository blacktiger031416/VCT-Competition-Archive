<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCT 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#FF4655;--americas:#FF8C00;--emea:#85E62C;--pacific:#00C8FF;--cn:#FF2244}
body{background:#080808;color:#fff;font-family:'Barlow',sans-serif;overflow:hidden;height:100vh}

.hdr{
  position:fixed;top:0;left:0;right:0;z-index:200;
  padding:1.1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(8,8,8,.85) 60%,transparent);
}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;letter-spacing:.12em;text-transform:uppercase}
.brand b{color:var(--red)}
.back-link{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);text-decoration:none;transition:color .15s}
.back-link:hover{color:#fff}

.map-section{position:fixed;inset:0;overflow:hidden}
#worldMap{position:absolute;inset:0;width:100%;height:100%}
#pinLayer{position:absolute;inset:0;pointer-events:none}

.section-title{position:absolute;top:5.5rem;left:1.5rem;z-index:50;pointer-events:none}
.section-phase{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:.3rem}
.section-name{font-family:'Barlow Condensed',sans-serif;font-size:2.8rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;line-height:1;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5)}

.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.pin-bubble{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.15);background:rgba(8,8,8,.75);font-size:20px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.pin-stem{width:2px;height:14px;opacity:.7}
.pin-dot{width:5px;height:5px;border-radius:50%;opacity:.8;margin-top:-1px}
.pin-label{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(8,8,8,.92);border-radius:3px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .15s}
.pin:hover .pin-bubble{transform:scale(1.25) translateY(-3px)}
.pin:hover .pin-label{opacity:1}

.legend{position:absolute;bottom:5.5rem;left:1.5rem;z-index:50;display:flex;flex-direction:column;gap:.35rem}
.legend-row{display:flex;align-items:center;gap:.4rem;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.phase-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:.75rem 1.5rem;display:flex;align-items:center;gap:.3rem;background:rgba(8,8,8,.88);border-top:.5px solid rgba(255,255,255,.08);overflow-x:auto;-webkit-overflow-scrolling:touch}
.phase-nav::-webkit-scrollbar{display:none}
.phase-btn{flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:.4rem .9rem;border-radius:3px;border:.5px solid transparent;cursor:pointer;color:rgba(255,255,255,.45);background:transparent;transition:color .15s,background .15s;white-space:nowrap}
.phase-btn:hover{color:rgba(255,255,255,.75)}
.phase-btn.active{background:var(--red);color:#fff}

/* ── Modal overlay ── */
.modal-overlay{
  position:fixed;inset:0;z-index:400;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0);
  pointer-events:none;
  transition:background .25s;
}
.modal-overlay.open{
  background:rgba(0,0,0,.72);
  pointer-events:auto;
}

/* ── Modal panel ── */
.modal{
  position:relative;
  width:min(860px,90vw);
  max-height:80vh;
  background:#050508;
  border:1px solid var(--mc,#fff);
  display:flex;flex-direction:column;
  overflow:hidden;
  /* screen-on animation */
  transform:scaleY(0);
  transform-origin:center;
  opacity:0;
  box-shadow:
    0 0 0 1px var(--mc,#fff),
    0 0 40px var(--mc,rgba(255,255,255,.2)),
    0 0 80px var(--mc,rgba(255,255,255,.08)),
    inset 0 0 60px rgba(0,0,0,.6);
}
.modal-overlay.open .modal{
  animation:screenOn .42s cubic-bezier(.16,1,.3,1) forwards;
}
.modal-overlay.closing .modal{
  animation:screenOff .18s ease-in forwards;
}

/* scan line overlay */
.modal-scan{
  position:absolute;inset:0;z-index:20;
  pointer-events:none;
  overflow:hidden;
}
.modal-scan::after{
  content:'';
  position:absolute;left:0;right:0;
  height:3px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.25),transparent);
  animation:scanSweep .5s .1s linear forwards;
  opacity:0;
}
/* CRT scanlines texture */
.modal-scan::before{
  content:'';
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.06) 0px,
    rgba(0,0,0,.06) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events:none;
}

/* Content fades in after screen opens */
.modal-content{
  display:flex;flex-direction:column;
  flex:1;overflow:hidden;
  opacity:0;
  animation:contentIn .3s .28s ease forwards;
}

/* ── Header ── */
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 1.5rem 1rem;
  border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.modal-header-left{display:flex;align-items:center;gap:1rem}
.modal-flag{font-size:2.4rem;line-height:1}
.modal-region-tag{
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:2px 7px;border-radius:2px;
  display:inline-block;margin-bottom:.3rem;
}
.modal-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:1.5rem;font-weight:900;
  text-transform:uppercase;letter-spacing:.04em;
  line-height:1;color:#fff;
}
.modal-phase-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,.3);
  text-align:right;margin-bottom:.25rem;
}
.modal-close{
  background:none;border:none;cursor:pointer;
  font-size:14px;color:rgba(255,255,255,.3);
  padding:.4rem;margin-left:1rem;
  transition:color .15s;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;letter-spacing:.05em;
}
.modal-close:hover{color:#fff}

/* ── Body ── */
.modal-body{
  flex:1;
  padding:0;
  position:relative;
  min-height:340px;
  overflow:hidden;
}
.modal-body::-webkit-scrollbar{width:3px}
.modal-body::-webkit-scrollbar-track{background:transparent}
.modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}

.modal-section-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.25);
  margin-bottom:.85rem;
  display:flex;align-items:center;gap:.6rem;
}
.modal-section-label::after{
  content:'';flex:1;height:1px;background:rgba(255,255,255,.07);
}

/* Team grid */
.teams-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:.5rem;
}
.team-slot{
  border:1px solid rgba(255,255,255,.08);
  border-radius:4px;
  padding:.65rem .75rem;
  display:flex;align-items:center;gap:.65rem;
  background:rgba(255,255,255,.03);
  transition:background .15s,border-color .15s;
  min-height:52px;
  cursor:default;
}
.team-slot.partner:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
.team-slot.oq-slot{opacity:.45}
.team-logo{
  width:32px;height:32px;border-radius:3px;
  background:rgba(255,255,255,.06);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;overflow:hidden;
}
.team-logo img{width:100%;height:100%;object-fit:contain;display:block}
.team-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.team-abbr{
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
  color:#fff;line-height:1;
}
.team-fullname{
  font-family:'Barlow',sans-serif;
  font-size:10px;color:rgba(255,255,255,.35);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.oq-badge{
  margin-top:.1rem;
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.22);
}

/* ── Keyframes ── */
@keyframes screenOn{
  0%  {transform:scaleY(.025);opacity:1;filter:brightness(6) blur(1px)}
  18% {transform:scaleY(.025);filter:brightness(8) blur(0)}
  42% {transform:scaleY(1);   filter:brightness(2)}
  65% {filter:brightness(1.15)}
  100%{transform:scaleY(1);   opacity:1;filter:brightness(1)}
}
@keyframes screenOff{
  0%  {transform:scaleY(1);opacity:1;filter:brightness(1)}
  60% {transform:scaleY(.03);filter:brightness(4)}
  100%{transform:scaleY(.03);opacity:0;filter:brightness(0)}
}
@keyframes scanSweep{
  0%  {top:-3px;opacity:0}
  10% {opacity:1}
  100%{top:100%;opacity:0}
}
@keyframes contentIn{
  0%  {opacity:0}
  100%{opacity:1}
}

.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);transition:opacity .6s}
.map-loading.done{opacity:0;pointer-events:none}

/* ── Roster Panel ── */
.modal-body{position:relative;overflow:hidden}
.teams-view,.roster-view{
  position:absolute;inset:0;padding:1.25rem 1.5rem 1.5rem;
  overflow-y:auto;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .2s;
}
.teams-view::-webkit-scrollbar,.roster-view::-webkit-scrollbar{width:3px}
.teams-view::-webkit-scrollbar-thumb,.roster-view::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
.teams-view{transform:translateX(0);opacity:1}
.teams-view.slide-out{transform:translateX(-60px);opacity:0;pointer-events:none}
.roster-view{transform:translateX(60px);opacity:0;pointer-events:none}
.roster-view.slide-in{transform:translateX(0);opacity:1;pointer-events:auto}

.rp-back{
  display:flex;align-items:center;gap:.4rem;
  background:none;border:none;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.32);padding:0;margin-bottom:1rem;
  transition:color .15s;
}
.rp-back:hover{color:rgba(255,255,255,.7)}
.rp-back::before{content:'←';font-size:12px}

.rp-team-header{
  display:flex;align-items:center;gap:.85rem;
  margin-bottom:1.25rem;padding-bottom:1rem;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.rp-logo{
  width:48px;height:48px;border-radius:4px;
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
}
.rp-logo img{width:100%;height:100%;object-fit:contain}
.rp-team-abbr{
  font-family:'Barlow Condensed',sans-serif;
  font-size:26px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;line-height:1;
}
.rp-team-name{
  font-family:'Barlow',sans-serif;
  font-size:11px;color:rgba(255,255,255,.35);margin-top:3px;
}

.rp-section{margin-bottom:1.1rem}
.rp-section-head{
  display:flex;align-items:center;gap:.55rem;
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.25);
  margin-bottom:.5rem;
}
.rp-section-head .rp-section-icon{
  display:inline-block;width:2px;height:10px;
  background:var(--rp-accent-full,rgba(255,34,68,.7));border-radius:1px;
}
.rp-section-head::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}

.rp-player-row{
  display:flex;align-items:center;gap:.6rem;
  padding:.38rem 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.rp-player-row:last-child{border-bottom:none}
.rp-num{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  color:var(--rp-accent,rgba(255,34,68,.5));width:18px;text-align:center;flex-shrink:0;
}
.rp-ign{
  font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.04em;color:rgba(255,255,255,.88);flex:1;
}
.rp-real-name{
  font-family:'Barlow',sans-serif;font-size:13px;color:rgba(255,255,255,.38);
  margin-left:auto;flex-shrink:0;
}

.rp-staff-row{
  display:flex;align-items:center;gap:.6rem;
  padding:.36rem 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.rp-staff-row:last-child{border-bottom:none}
.rp-role-badge{
  font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,34,68,.12);color:rgba(255,100,120,.85);
  border:1px solid rgba(255,34,68,.2);
  padding:2px 5px;border-radius:2px;flex-shrink:0;min-width:28px;text-align:center;
}
.rp-staff-name{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.03em;color:rgba(255,255,255,.75);flex:1;
}
.rp-staff-real{
  font-family:'Barlow',sans-serif;font-size:13px;color:rgba(255,255,255,.38);
  margin-left:auto;flex-shrink:0;
}
.rp-empty{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;
  color:rgba(255,255,255,.18);padding:.4rem 0;text-align:center;
}
.team-slot.partner.clickable{cursor:pointer}
.team-slot.partner.clickable:hover{
  background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);
}
.team-slot.partner.clickable:hover .team-abbr{color:var(--mc,#FF2244)}

/* 편집 모드 */
.rp-edit-input{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:2px;color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.03em;padding:3px 6px;outline:none;
  transition:border-color .15s;
}
.rp-edit-input:focus{border-color:rgba(255,34,68,.55);background:rgba(255,34,68,.06)}
.rp-ign-input{width:90px}
.rp-name-input{width:90px}
.rp-role-input{width:52px}
.rp-real-input{width:72px;color:rgba(255,255,255,.55)}
.rp-del-btn{
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,.2);font-size:12px;padding:2px 4px;
  transition:color .12s;line-height:1;flex-shrink:0;
}
.rp-del-btn:hover{color:rgba(255,60,80,.85)}
.rp-add-btn{
  display:block;width:100%;margin-top:.35rem;
  background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);
  border-radius:2px;color:rgba(255,255,255,.3);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:.3rem 0;cursor:pointer;transition:all .15s;
}
.rp-add-btn:hover{background:rgba(255,34,68,.08);border-color:rgba(255,34,68,.3);color:rgba(255,34,68,.7)}
.rp-move-btn{
  background:none;border:1px solid rgba(255,255,255,.1);border-radius:2px;cursor:pointer;
  color:rgba(255,255,255,.28);font-size:11px;padding:2px 5px;
  transition:all .12s;line-height:1;flex-shrink:0;font-family:monospace;
}
.rp-move-btn:hover{border-color:var(--rp-accent-full,#FF2244);color:var(--rp-accent-full,#FF2244);background:rgba(255,34,68,.06)}
.rp-bench-num{opacity:.4}

/* ── OQ Stage Panel ── */
.oq-panel{display:flex;flex-direction:column;min-height:100%}
.oq-stage-header{
  padding:1.2rem 1.5rem .8rem;flex-shrink:0;position:relative;
  background:
    linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);
  background-size:28px 28px;
}
.oq-structure-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.18);display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;
}
.oq-structure-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.oq-stage-flow{display:flex;align-items:stretch}
/* Connector: animated flowing dot */
.oq-stage-conn{
  display:flex;align-items:center;justify-content:center;
  width:26px;flex-shrink:0;position:relative;overflow:hidden;
}
.oq-conn-line{
  position:absolute;left:0;right:0;top:50%;height:1px;
  background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.18),rgba(255,255,255,.05));
}
.oq-conn-dot{
  position:absolute;width:5px;height:5px;border-radius:50%;
  top:calc(50% - 2.5px);
  animation:oqDotFlow 1.3s linear infinite;
}
@keyframes oqDotFlow{
  0%{left:-5px;opacity:0}
  10%{opacity:1}
  90%{opacity:.9}
  100%{left:calc(100% + 5px);opacity:0}
}
.oq-stage-card{
  flex:1;min-width:0;background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.07);border-radius:3px;
  padding:.8rem .65rem .55rem;cursor:pointer;
  position:relative;overflow:hidden;
  transition:background .2s,border-color .2s,box-shadow .2s;user-select:none;
}
.oq-stage-card:hover:not(.active){background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
.oq-card-top{
  position:absolute;top:0;left:0;right:0;height:2px;
  transform:scaleX(0);transform-origin:left;
  transition:transform .34s cubic-bezier(.4,0,.2,1);
}
.oq-stage-card.active .oq-card-top{transform:scaleX(1)}
.oq-card-scan{
  position:absolute;left:0;right:0;height:3px;top:-3px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.1),rgba(255,255,255,0));
  opacity:0;pointer-events:none;
}
.oq-stage-card.active .oq-card-scan{animation:oqCardScan 3.2s ease-in-out .3s infinite}
@keyframes oqCardScan{0%{top:-3px;opacity:0}5%{opacity:1}95%{opacity:.5}100%{top:100%;opacity:0}}
.oq-card-shimmer{
  position:absolute;top:0;left:-100%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
  pointer-events:none;
}
.oq-stage-card.active .oq-card-shimmer{animation:oqShimmer 3s ease-in-out .6s infinite}
@keyframes oqShimmer{0%,100%{left:-55%}55%{left:115%}}
.oq-card-num{
  font-family:'Barlow Condensed',sans-serif;
  font-size:8px;font-weight:700;letter-spacing:.2em;
  color:rgba(255,255,255,.18);margin-bottom:.25rem;
  display:flex;align-items:center;gap:.3rem;
}
.oq-card-num-dot{width:4px;height:4px;border-radius:50%;opacity:0;transition:opacity .2s;flex-shrink:0}
.oq-stage-card.active .oq-card-num-dot{opacity:1}
.oq-card-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
  color:rgba(255,255,255,.42);line-height:1.2;transition:color .2s;
}
.oq-stage-card.active .oq-card-name{
  color:#fff;
  animation:oqGlitch 5.5s ease infinite;
}
@keyframes oqGlitch{
  0%,84%,100%{text-shadow:none;transform:none;opacity:1}
  85%{transform:skewX(-3deg);text-shadow:-2px 0 var(--mc,#FF2244),2px 0 rgba(0,210,255,.8)}
  86%{transform:skewX(2deg);text-shadow:1px 0 var(--mc,#FF2244)}
  87%{transform:none;text-shadow:none;opacity:.3}
  87.5%{opacity:1}
  88%{text-shadow:-2px 0 rgba(0,210,255,.6),2px 0 var(--mc,#FF2244);transform:translateX(-1px)}
  89%{text-shadow:-1px 0 var(--mc,#FF2244);transform:translateX(1px)}
  90%{text-shadow:none;transform:none;opacity:1}
}
/* Corner brackets on active card */
.oq-card-corner{
  position:absolute;width:7px;height:7px;pointer-events:none;
  opacity:0;transition:opacity .3s;
}
.oq-stage-card.active .oq-card-corner{
  opacity:1;animation:oqCornerIn .4s cubic-bezier(.4,0,.2,1) both;
}
@keyframes oqCornerIn{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
.oq-card-corner.tl{top:3px;left:3px;border-top:1.5px solid var(--mc,#FF2244);border-left:1.5px solid var(--mc,#FF2244)}

.oq-card-corner.br{bottom:3px;right:3px;border-bottom:1.5px solid var(--mc,#FF2244);border-right:1.5px solid var(--mc,#FF2244)}
/* Active card pulse */
@keyframes oqPulse{
  0%,100%{box-shadow:0 0 18px var(--mc,#FF2244)22,inset 0 0 10px rgba(0,0,0,.2)}

}
.oq-stage-card.active .oq-card-meta{color:rgba(255,255,255,.34)}
.oq-card-ghost{
  position:absolute;right:4px;bottom:-8px;

.oq-content{
  flex:1;padding:.15rem 1.5rem 1.5rem;

}
@keyframes oqContentIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
/* Sweep line */
.oq-sweep{
  position:absolute;left:24px;right:24px;height:1px;top:0;

}
@keyframes oqSweep{0%{top:0;opacity:0}4%{opacity:.6}96%{opacity:.25}100%{top:100%;opacity:0}}
/* Flash overlay on stage switch */
.oq-flash{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:var(--mc,#FF2244);
  animation:oqFlashAnim .35s ease-out forwards;
}
@keyframes oqFlashAnim{0%{opacity:.18}100%{opacity:0}}
/* Staggered slot reveal */
@keyframes oqSlotIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.oq-stage-info{
  margin-bottom:.9rem;padding:.5rem .7rem;

<script>

function _emptyRoster(){return{players:[],스태프:[]};}
const CN_OQ_ROSTERS = {

  WOL:_emptyRoster(),  FPX:_emptyRoster(),  KBG:_emptyRoster(),

const OQ_PINS = [
  // Americas
  {id:'na',    flag:'🇺🇸',name:'North America',          region:'americas',sub:'NA',  lat:39.8, lng:-98.6},

const _allPartnerTeams = [].concat(

let projection;
let currentPhase = 'kickoff-oq';

function buildMap() {
  const W = window.innerWidth;
  const H = window.innerHeight;

  const svg = d3.select('#worldMap').attr('width', W).attr('height', H);
  svg.selectAll('*').remove();

  const defs = svg.append('defs');

  /* 배경: 붉은 방사형 그라데이션 */
  const bgGrad = defs.append('radialGradient')
    .attr('id','bgGrad').attr('cx','38%').attr('cy','50%').attr('r','70%');
  bgGrad.append('stop').attr('offset','0%').attr('stop-color','#B81020');
  bgGrad.append('stop').attr('offset','55%').attr('stop-color','#6A0510');
  bgGrad.append('stop').attr('offset','100%').attr('stop-color','#1A0208');

  /* 빛 레이 (원본 이미지 느낌 재현) */
  const rayGrad = defs.append('radialGradient')
    .attr('id','rayGrad').attr('cx','38%').attr('cy','50%').attr('r','50%');
  rayGrad.append('stop').attr('offset','0%').attr('stop-color','#FF3030').attr('stop-opacity','.18');
  rayGrad.append('stop').attr('offset','100%').attr('stop-color','#FF3030').attr('stop-opacity','0');

  /* 비네트 */
  const vig = defs.append('radialGradient')
    .attr('id','vig').attr('cx','50%').attr('cy','50%').attr('r','50%');
  vig.append('stop').attr('offset','40%').attr('stop-color','transparent');
  vig.append('stop').attr('offset','100%').attr('stop-color','#000').attr('stop-opacity','.65');

  svg.append('rect').attr('width',W).attr('height',H).attr('fill','url(#bgGrad)');
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','url(#rayGrad)');

  /* Natural Earth 투영 — 세계 지도 타원형
     D3 기본: scale=153 → 960×500 픽셀
     → 현재 뷰포트에 맞게: scale = min(W/960, H/500) × 153 × 0.92 (여백) */
  const s = Math.min(W / 960, H / 500) * 153 * 0.92;
  projection = d3.geoNaturalEarth1()
    .scale(s)
    .translate([W / 2, H / 2 + H * 0.04]);

  const pathGen = d3.geoPath().projection(projection);

  /* 세계 지도 데이터 fetch */
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);
      const borders   = topojson.mesh(world, world.objects.countries, (a,b) => a !== b);
      const land      = topojson.merge(world, world.objects.countries.geometries);

      /* 대륙 그림자 (약간 두꺼운 어두운 외곽) */
      svg.append('path').datum(land)
        .attr('d', pathGen)
        .attr('fill','none')
        .attr('stroke','#000')
        .attr('stroke-width', 4)
        .attr('stroke-linejoin','round')
        .attr('opacity', .4);

      /* 나라 채우기 */
      svg.append('g').selectAll('path')
        .data(countries.features)
        .join('path')
        .attr('d', pathGen)
        .attr('fill','#0e0808')
        .attr('stroke','none');

      /* 국경선 */
      svg.append('path').datum(borders)
        .attr('d', pathGen)
        .attr('fill','none')
        .attr('stroke','#301010')
        .attr('stroke-width', .5);

      /* 비네트 오버레이 */
      svg.append('rect').attr('width',W).attr('height',H).attr('fill','url(#vig)');

      document.getElementById('mapLoading').classList.add('done');
      renderPins(currentPhase);
    })
    .catch(() => {
      document.getElementById('mapLoading').textContent = '지도 로드 실패 (인터넷 연결 확인)';
    });
}

function renderPins(phaseKey) {
  if (!projection) return;
  const layer = document.getElementById('pinLayer');
  layer.innerHTML = '';
  (phases[phaseKey] || []).forEach(p => {
    const pt = projection([p.lng, p.lat]);
    if (!pt) return;
    const [px, py] = pt;
    const color = COLORS[p.region];
    const el = document.createElement('div');
    el.className = 'pin';
    el.style.left = px + 'px';
    el.style.top  = py + 'px';
    el.innerHTML = `
      <div class="pin-label" style="border-left:2px solid ${color}">${p.sub}</div>
      <div class="pin-bubble" style="border-color:${color}55;box-shadow:0 0 14px ${color}44">${p.flag}</div>
      <div class="pin-stem"  style="background:${color}"></div>
      <div class="pin-dot"   style="background:${color}"></div>`;
    el.addEventListener('click', () => openModal(p, phaseKey));
    layer.appendChild(el);
  });
}

var _modalRegionColor = '#ff2244';
function openModal(p, phaseKey) {
  const color  = COLORS[p.region];
  _modalRegionColor = color;
  const overlay = document.getElementById('modalOverlay');
  const modal   = document.getElementById('modal');

  /* CSS variable for glow color */
  modal.style.setProperty('--mc', color);
  modal.style.boxShadow = `
    0 0 0 1px ${color}99,
    0 0 40px ${color}44,
    0 0 80px ${color}22,
    inset 0 0 60px rgba(0,0,0,.6)`;
  modal.style.borderColor = color + '99';

  /* Header */
  document.getElementById('mFlag').textContent = p.flag;
  const tag = document.getElementById('mRegionTag');
  tag.textContent = REGION_LABELS[p.region];
  tag.style.cssText = `background:${color}22;color:${color};border:.5px solid ${color}55`;
  document.getElementById('mTitle').textContent  = p.name;
  document.getElementById('mPhase').textContent  = phaseLabels[phaseKey];

  /* 대진표 링크 버튼 */
  const existingBracketBtn = document.getElementById('mBracketBtn');
  if (existingBracketBtn) existingBracketBtn.remove();
  if (phaseKey === 'kickoff-oq' && p.id === 'cn') {
    const btn = document.createElement('a');
    btn.id = 'mBracketBtn';
    btn.href = 'cn-threshold.html';
    btn.style.cssText = `display:inline-block;margin-top:.4rem;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cn);border:1px solid rgba(255,34,68,.35);padding:3px 10px;border-radius:2px;text-decoration:none;transition:background .15s;`;
    btn.textContent = '대진표 보기 →';
    btn.onmouseover = () => btn.style.background = 'rgba(255,34,68,.15)';
    btn.onmouseout  = () => btn.style.background = '';
    document.getElementById('mPhase').insertAdjacentElement('afterend', btn);
  }

  /* Team slots */
  const tv = document.getElementById('teamsView');
  if (!document.getElementById('mTeamsGrid')) {
    tv.innerHTML = '<div class="modal-section-label">Participating Teams</div>' +
      '<div class="teams-grid" id="mTeamsGrid"></div>';
  }
  const grid = document.getElementById('mTeamsGrid');
  grid.innerHTML = '';

  /* Non-CN KickOff OQ → 스테이지 패널 */
  if (phaseKey === 'kickoff-oq' && p.id !== 'cn') {
    const oqData = OQ_STAGE_DATA[p.id];
    if (oqData) {
      tv.innerHTML = buildOQPanelHTML(oqData, color, 0);
      bindOQStageEvents(oqData, color);
      overlay.classList.remove('closing');
      overlay.classList.add('open');
      return;
    }
  }

  /* KickOff → 화려한 패널 */
  if (phaseKey === 'kickoff' && p.teams && p.teams.length) {
    tv.innerHTML = buildKickoffPanelHTML(p, color);
    overlay.classList.remove('closing');
    overlay.classList.add('open');
    return;
  }

  /* CN KickOff OQ → 화려한 CN 패널 */
  if (phaseKey === 'kickoff-oq' && p.id === 'cn' && p.teams && p.teams.length) {
    tv.innerHTML = buildCNOQPanelHTML(p, color);
    tv.querySelectorAll('.cn-slot-partner').forEach((slot, i) => {
      slot.addEventListener('click', () => openRosterPanel(p.teams[i]));
    });
    overlay.classList.remove('closing');
    overlay.classList.add('open');
    return;
  }

  if (p.teams && p.teams.length) {
    /* Partner teams (non-CN) */
    p.teams.forEach(t => {
      const slot = document.createElement('div');
      slot.className = 'team-slot partner';
      slot.innerHTML = `
        <div class="team-logo">
          <img src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">
        </div>
        <div class="team-info">
          <div class="team-abbr">${t.abbr}</div>
          <div class="team-fullname">${t.name}</div>
        </div>`;
      grid.appendChild(slot);
    });
    const oqCount = 12 - p.teams.length;
    for (let i = 0; i < oqCount; i++) {
      const slot = document.createElement('div');
      slot.className = 'team-slot oq-slot';
      slot.innerHTML = `
        <div class="team-logo" style="border:1px dashed rgba(255,255,255,.15)">?</div>
        <div class="team-info">
          <div class="team-abbr" style="color:rgba(255,255,255,.25)">TBD</div>
          <div class="oq-badge">Open Qualifier</div>
        </div>`;
      grid.appendChild(slot);
    }
  } else {
    /* Pure TBD (OQ phases, Masters, Champions) */
    const slotCount = phaseKey.includes('oq') ? 16 : (phaseKey.includes('masters') || phaseKey === 'champions') ? 12 : 8;
    for (let i = 0; i < slotCount; i++) {
      const slot = document.createElement('div');
      slot.className = 'team-slot oq-slot';
      slot.innerHTML = `
        <div class="team-logo" style="border:1px dashed rgba(255,255,255,.12)">?</div>
        <div class="team-info">
          <div class="team-abbr" style="color:rgba(255,255,255,.2)">TBD</div>
        </div>`;
      grid.appendChild(slot);
    }
  }

  /* Masters / Cups → 권역별 슬롯 패널 */
  if (INTL_EVENT_DATA[phaseKey]) {
    tv.innerHTML = buildIntlPanelHTML(INTL_EVENT_DATA[phaseKey], color);
    bindIntlStageEvents(INTL_EVENT_DATA[phaseKey], color);
    overlay.classList.remove('closing');
    overlay.classList.add('open');
    return;
  }

  /* Remove old animation classes to retrigger */
  overlay.classList.remove('closing');
  overlay.classList.add('open');
}

/* ── 로스터 패널 ── */
const RP_STORE_PREFIX = 'roster:cn-oq:';
let _rpCurrentAbbr = null;

function isAdmin() {
  try {
    if (localStorage.getItem('vct_admin_auth')) return true;
    const u = JSON.parse(localStorage.getItem('vct_auth_user'));
    return !!(u && u.role === 'admin');
  } catch(e) { return false; }
}

function rpLoadRoster(abbr) {
  const key = RP_STORE_PREFIX + abbr;
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const d = JSON.parse(raw);
      /* 구 포맷(감독/코치/기타) → 新 포맷 마이그레이션 */
      if (!d.스태프) {
        d.스태프 = [].concat(d.감독||[], d.코치||[], d.기타||[]);
        delete d.감독; delete d.코치; delete d.기타;
      }
      /* players 6번째~를 bench로 분리 마이그레이션 */
      if (!d.bench) {
        d.bench = d.players.slice(5);
        d.players = d.players.slice(0, 5);
      }
      /* 손상된 undefined/null 항목 제거 */
      d.players = (d.players || []).filter(p => p != null);
      d.bench   = (d.bench   || []).filter(p => p != null);
      d.스태프  = (d.스태프  || []).filter(p => p != null);
      return d;
    }
  } catch(e) {}
  const base = CN_OQ_ROSTERS[abbr] || {players:[],스태프:[]};
  if (!base.bench) { base.bench = base.players.slice(5); base.players = base.players.slice(0,5); }
  return base;
}

function rpSaveRoster(abbr, data) {
  localStorage.setItem(RP_STORE_PREFIX + abbr, JSON.stringify(data));
}

function rpSectionHTML(label, sectionKey, rows, admin) {
  const isPlayer = sectionKey === 'players';
  const rowsHTML = rows.length
    ? rows.map((r,i) => admin
        ? (isPlayer ? rpPlayerEditHTML(r,i,sectionKey) : rpStaffEditHTML(r,i,sectionKey))
        : (isPlayer ? rpPlayerRowHTML(r,i) : rpStaffRowHTML(r,label))
      ).join('')
    : (admin ? '' : `<div class="rp-empty">등록된 항목 없음</div>`);
  const addBtn = admin
    ? `<button class="rp-add-btn" data-section="${sectionKey}">+ 추가</button>` : '';
  return `<div class="rp-section">
    <div class="rp-section-head"><span class="rp-section-icon"></span>${label}</div>
    ${rowsHTML}
    ${addBtn}
  </div>`;
}

function rpRender(abbr) {
  const r = rpLoadRoster(abbr);
  const admin = isAdmin();
  const body = document.getElementById('rpBody');

  /* PLAYERS 섹션 */
  const pRows = r.players.map((p,i) =>
    admin ? rpPlayerEditHTML(p,i,'players') : rpPlayerRowHTML(p,i)
  ).join('');
  const pAddBtn = admin ? `<button class="rp-add-btn" data-section="players">+ 추가</button>` : '';
  const pEmpty = !r.players.length && !admin ? `<div class="rp-empty">등록된 항목 없음</div>` : '';
  const playersSection = `<div class="rp-section">
    <div class="rp-section-head"><span class="rp-section-icon"></span>PLAYERS</div>
    ${pRows}${pEmpty}${pAddBtn}
  </div>`;

  /* BENCH 섹션 (후보) */
  let benchSection = '';
  if (r.bench.length > 0 || admin) {
    const bRows = r.bench.map((p,i) =>
      admin ? rpBenchEditHTML(p,i) : rpBenchRowHTML(p,i)
    ).join('');
    const bAddBtn = admin ? `<button class="rp-add-btn" data-section="bench">+ 추가</button>` : '';
    benchSection = `<div class="rp-section">
      <div class="rp-section-head"><span class="rp-section-icon"></span>BENCH</div>
      ${bRows}${bAddBtn}
    </div>`;
  }

  body.innerHTML = playersSection + benchSection + rpSectionHTML('STAFF','스태프',r.스태프,admin);

  if (!r.players.length && !r.bench.length && !r.스태프.length) {
    body.innerHTML = '<div class="rp-empty" style="margin-top:2rem">등록된 로스터가 없습니다</div>';
  }

  if (admin) rpBindEditEvents(abbr);
}

function rpBindEditEvents(abbr) {
  const body = document.getElementById('rpBody');

  /* 필드 변경 */
  body.querySelectorAll('.rp-edit-input').forEach(input => {
    input.addEventListener('change', () => rpFlushEdit(abbr));
  });

  /* 삭제 */
  body.querySelectorAll('.rp-del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = btn.dataset.section;
      const idx = parseInt(btn.dataset.idx);
      const r = rpLoadRoster(abbr);
      r[section].splice(idx, 1);
      rpSaveRoster(abbr, r);
      rpRender(abbr);
    });
  });

  /* 추가 */
  body.querySelectorAll('.rp-add-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = btn.dataset.section;
      const r = rpLoadRoster(abbr);
      if (section === 'players') r.players.push({ign:'',real:''});
      else if (section === 'bench') r.bench.push({ign:'',real:''});
      else r.스태프.push({role:'',name:'',real:''});
      rpSaveRoster(abbr, r);
      rpRender(abbr);
      /* 새 행의 첫 input 포커스 */
      const rows = document.querySelectorAll(`[data-section="${section}"]`);
      const last = rows[rows.length-1];
      if (last) last.querySelector('input')?.focus();
    });
  });

  /* 이동 버튼 (↓ 후보로 / ↑ 로스터로) */
  body.querySelectorAll('.rp-move-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const dir = btn.dataset.dir;
      /* 현재 입력값 읽기 + 이동을 한 번의 load/save로 처리 (이중 저장 방지) */
      const r = rpLoadRoster(abbr);
      body.querySelectorAll('.rp-edit-row').forEach(row => {
        const section = row.dataset.section;
        const rowIdx = parseInt(row.dataset.idx);
        const obj = r[section]?.[rowIdx];
        if (!obj) return;
        row.querySelectorAll('.rp-edit-input').forEach(inp => {
          obj[inp.dataset.field] = inp.value.trim();
        });
      });
      if (dir === 'toBench') {
        const [player] = r.players.splice(idx, 1);
        r.bench.unshift(player);
      } else {
        const [player] = r.bench.splice(idx, 1);
        r.players.push(player);
      }
      rpSaveRoster(abbr, r);
      rpRender(abbr);
    });
  });
}

function rpFlushEdit(abbr) {
  const body = document.getElementById('rpBody');
  const r = rpLoadRoster(abbr);
  body.querySelectorAll('.rp-edit-row').forEach(row => {
    const section = row.dataset.section;
    const idx = parseInt(row.dataset.idx);
    const obj = r[section][idx];
    if (!obj) return;
    row.querySelectorAll('.rp-edit-input').forEach(inp => {
      obj[inp.dataset.field] = inp.value.trim();
    });
  });
  rpSaveRoster(abbr, r);
}

function openRosterPanel(t) {
  _rpCurrentAbbr = t.abbr;
  const teamsView  = document.getElementById('teamsView');
  const rosterView = document.getElementById('rosterView');
  const modal      = document.getElementById('modal');

  /* 팀 퍼스널 컬러 적용 */
  const tc = t.color || '#FF2244';
  rosterView.style.setProperty('--rp-accent', tc + '99');
  /* 섹션 아이콘/헤드 색상도 덮어쓰기 */
  rosterView.style.setProperty('--rp-accent-full', tc);
  /* 모달 테두리/글로우 교체 */
  modal.style.boxShadow = `
    0 0 0 1px ${tc}99,
    0 0 40px ${tc}44,
    0 0 80px ${tc}22,
    inset 0 0 60px rgba(0,0,0,.6)`;
  modal.style.borderColor = tc + '99';

  document.getElementById('rpLogo').innerHTML =
    `<img src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">`;
  document.getElementById('rpAbbr').textContent = t.abbr;
  document.getElementById('rpName').textContent = t.name;

  rpRender(t.abbr);

  teamsView.classList.add('slide-out');
  rosterView.classList.add('slide-in');
  rosterView.scrollTop = 0;
}

function closeRosterPanel() {
  document.getElementById('teamsView').classList.remove('slide-out');
  document.getElementById('rosterView').classList.remove('slide-in');
  /* 모달 테두리를 원래 region 색으로 복원 */
  const modal = document.getElementById('modal');
  const c = _modalRegionColor;
  modal.style.boxShadow = `0 0 0 1px ${c}99,0 0 40px ${c}44,0 0 80px ${c}22,inset 0 0 60px rgba(0,0,0,.6)`;
  modal.style.borderColor = c + '99';
}

document.getElementById('rosterBack').addEventListener('click', closeRosterPanel);

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  if (!overlay.classList.contains('open')) return;
  closeRosterPanel();
  overlay.classList.add('closing');
  setTimeout(() => overlay.classList.remove('open','closing'), 200);
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.querySelectorAll('.phase-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPhase = btn.dataset.phase;
    closeModal();
    const label = phaseLabels[currentPhase];
    const isOQ  = currentPhase.includes('oq');
    document.getElementById('sectionPhase').textContent = label;
    const nameHTML = isOQ ? 'Open<br>Qualifiers' : label.replace(/(\s)(?=\S+$)/,'<br>');
    document.getElementById('sectionName').innerHTML = nameHTML;
    renderPins(currentPhase);
  });
});

function buildIntlSlotHTML(slots, color, offset) {
  return slots.map((s, i) => {
    const rc = s.rc;
    return `<div class="team-slot oq-slot" style="
        border-color:${rc.c}33;
        animation:oqSlotIn .28s ease ${(offset+i)*0.04}s both">
      <div class="team-logo" style="border:1px solid ${rc.c}66;background:${rc.c}11;font-size:10px;color:${rc.c}">■</div>
      <div class="team-info" style="min-width:0">
        <div class="team-abbr" style="color:rgba(255,255,255,.25)">TBD</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
          letter-spacing:.06em;color:${rc.c}99;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${rc.l} · ${s.rank}</div>
      </div></div>`;
  }).join('');
}

function buildIntlStageContentHTML(stage, color) {
  const slots = stage.slots || [];
  return `<div class="oq-sweep" style="--mc:${color}"></div>
    <div class="oq-stage-info" style="border-left-color:${color}">${stage.desc}</div>
    <div class="oq-teams-label">PARTICIPATING TEAMS</div>
    <div class="teams-grid" id="intlGrid">${buildIntlSlotHTML(slots, color, 0)}</div>`;
}

function buildIntlPanelHTML(data, color, activeIdx=0) {
  let flowHTML = '';
  data.stages.forEach((s, i) => {
    const act = i === activeIdx;
    if (i > 0) {
      flowHTML += `<div class="oq-stage-conn">
        <div class="oq-conn-line"></div>
        <div class="oq-conn-dot" style="background:${color};box-shadow:0 0 5px ${color}"></div>
      </div>`;
    }
    const actStyle = act
      ? `border-color:${color};animation:oqPulse 2.8s ease-in-out infinite;--mc:${color}`
      : `--mc:${color}`;
    flowHTML += `<div class="oq-stage-card${act?' active':''}" data-stageidx="${i}" style="${actStyle}">
      <div class="oq-card-top" style="background:${color}"></div>
      <div class="oq-card-scan"></div>
      <div class="oq-card-shimmer"></div>
      <div class="oq-card-corner tl"></div>
      <div class="oq-card-corner tr"></div>
      <div class="oq-card-corner bl"></div>
      <div class="oq-card-corner br"></div>
      <div class="oq-card-num">
        <div class="oq-card-num-dot" style="background:${color}"></div>
        ${String(i+1).padStart(2,'0')}
      </div>
      <div class="oq-card-name">${s.name}</div>
      <div class="oq-card-meta">${s.meta}</div>
      <div class="oq-card-ghost" style="${act?`color:${color};opacity:.1`:''}">${String(i+1).padStart(2,'0')}</div>
    </div>`;
  });
  return `<div class="oq-panel">
    <div class="oq-stage-header" style="--mc:${color}">
      <div class="oq-structure-label">TOURNAMENT STRUCTURE</div>
      <div class="oq-stage-flow">${flowHTML}</div>
    </div>
    <div class="oq-content" id="intlContent" style="--mc:${color}">
      ${buildIntlStageContentHTML(data.stages[activeIdx], color)}
    </div>
  </div>`;
}

function bindIntlStageEvents(data, color) {
  const tv = document.getElementById('teamsView');
  tv.querySelectorAll('.oq-stage-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.stageidx);
      tv.querySelectorAll('.oq-stage-card').forEach((c, i) => {
        const act = i === idx;
        c.classList.toggle('active', act);
        c.style.borderColor = act ? color : '';
        c.style.animation   = act ? `oqPulse 2.8s ease-in-out infinite` : '';
        const ghost = c.querySelector('.oq-card-ghost');
        ghost.style.color   = act ? color : '';
        ghost.style.opacity = act ? '.1'  : '';
      });
      const cnt = document.getElementById('intlContent');
      const flash = document.createElement('div');
      flash.className = 'oq-flash';
      flash.style.setProperty('--mc', color);
      cnt.appendChild(flash);
      setTimeout(() => flash.remove(), 400);
      cnt.style.animation = 'none';
      void cnt.offsetHeight;
      cnt.style.animation = '';
      cnt.innerHTML = buildIntlStageContentHTML(data.stages[idx], color);
      cnt.style.setProperty('--mc', color);
    });
  });
}

    MENA:'rgba(133,230,44,.55)',
    KR:'rgba(0,200,255,.55)', JP:'rgba(0,200,255,.55)',
    VN:'rgba(0,200,255,.55)', TH:'rgba(0,200,255,.55)',
    ID:'rgba(0,200,255,.55)', SEA:'rgba(0,200,255,.55)',
    CN:'rgba(255,34,68,.55)',
  };

  let partnerHTML = teams.map((t, i) => {
    const sc = subColors[t.sub] || `${color}44`;
    return `<div class="team-slot partner" style="border-color:${color}44;animation:oqSlotIn .28s ease ${i*0.04}s both">
      <div class="team-logo" style="border:1px solid ${color}55">
        <img src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">
      </div>
      <div class="team-info">
        <div class="team-abbr">${t.abbr}</div>
        <div class="team-fullname">${t.name}</div>
      </div>
      <div style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;
        letter-spacing:.08em;color:${sc};flex-shrink:0;padding-left:.3rem">${t.sub}</div>
    </div>`;
  }).join('');

  let oqHTML = '';
  for (let i = 0; i < oqCount; i++) {
    oqHTML += `<div class="team-slot oq-slot" style="animation:oqSlotIn .28s ease ${(teams.length+i)*0.04}s both">
      <div class="team-logo" style="border:1px dashed rgba(255,255,255,.12)">?</div>
      <div class="team-info">
        <div class="team-abbr" style="color:rgba(255,255,255,.25)">TBD</div>
        <div class="oq-badge">Open Qualifier</div>
      </div></div>`;
  }

  const total = teams.length + oqCount;
  return `<div class="oq-panel">
    <div class="oq-stage-header" style="--mc:${color}">
      <div class="oq-structure-label">KICKOFF 2027 · ${p.name.toUpperCase()}</div>
      <div class="cn-oq-desc" style="border-left-color:${color};margin-top:.1rem">
        파트너 팀 ${teams.length}팀 + OQ 진출팀 ${oqCount}팀 · 총 ${total}팀<br>
        <span style="color:rgba(255,255,255,.22)">대진표 미정 — 발표 후 업데이트 예정</span>
      </div>
    </div>
    <div class="oq-content" style="--mc:${color}">
      <div class="oq-sweep" style="--mc:${color}"></div>
      <div class="oq-teams-label">PARTICIPATING TEAMS</div>
      <div class="teams-grid">${partnerHTML}${oqHTML}</div>
    </div>
  </div>`;
}

function buildCNOQPanelHTML(p, color) {
  const teams = p.teams || [];
  const oqCount = Math.max(0, 13 - teams.length);
  let slotsHTML = '';
  teams.forEach((t, i) => {
    slotsHTML += `<div class="team-slot partner clickable cn-slot-partner" data-teamidx="${i}"
        style="--mc:${color};animation-delay:${i*0.04}s">
      <div class="team-logo"><img src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'"></div>
      <div class="team-info">
        <div class="team-abbr">${t.abbr}</div>
        <div class="team-fullname">${t.name}</div>
      </div></div>`;
  });
  for (let i = 0; i < oqCount; i++) {
    slotsHTML += `<div class="team-slot oq-slot cn-slot-oq" style="animation-delay:${(teams.length+i)*0.04}s">
      <div class="team-logo" style="border:1px dashed rgba(255,255,255,.12)">?</div>
      <div class="team-info">
        <div class="team-abbr" style="color:rgba(255,255,255,.25)">TBD</div>
        <div class="oq-badge">Open Qualifier</div>
      </div></div>`;
  }
  return `<div class="cn-oq-panel">
    <div class="cn-oq-header" style="--mc:${color}">
      <div class="cn-oq-header-label">TOURNAMENT STRUCTURE</div>
      <div class="cn-oq-desc" style="border-left-color:${color}">
        OQ 참가팀 ${teams.length}팀 확정<br>
        상위 팀 → KickOff 본선 진출 · <span style="color:${color}99">팀 클릭 시 로스터 확인</span>
      </div>
    </div>
    <div class="cn-oq-content" style="--mc:${color}">
      <div class="oq-sweep" style="--mc:${color}"></div>
      <div class="oq-teams-label">PARTICIPATING TEAMS</div>
      <div class="teams-grid" id="cnOQGrid">${slotsHTML}</div>
    </div>
  </div>`;
}

function buildOQStageContentHTML(stage, color) {
  const invites = typeof stage.invites === 'number' ? stage.invites : 0;
  const invTag  = stage.invites === 'TBA'
    ? '<span class="oq-invite-tag">INVITES TBA</span>'
    : invites > 0 ? `<span class="oq-invite-tag">${invites} INVITED</span>` : '';
  const totals = {oq:16, swiss:16, playoff:8, sea:8, lcq:4};
  const total  = totals[stage.key] ?? 16;
  const oqSlots = total - invites;
  let slotsHTML = '';
  for (let i = 0; i < invites; i++) {
    const t = stage.invitedTeams?.[i];
    slotsHTML += `<div class="team-slot oq-slot" style="border-color:${color}44;animation:oqSlotIn .25s ease ${i*0.05}s both">
      <div class="team-logo" style="border:1px solid ${color}66${t?'':''}">
        ${t ? `<img src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none;font-size:10px;color:${color}cc">✦</span>` : `<span style="font-size:10px;color:${color}cc">✦</span>`}
      </div>
      <div class="team-info">
        <div class="team-abbr" style="color:${t?'rgba(255,255,255,.85)':'rgba(255,255,255,.32)'}">${t?t.abbr:'TBD'}</div>
        <div class="oq-badge" style="color:${color}cc">INVITED</div>
      </div></div>`;
  }
  for (let i = 0; i < oqSlots; i++) {
    slotsHTML += `<div class="team-slot oq-slot" style="animation:oqSlotIn .25s ease ${(invites+i)*0.04}s both">
      <div class="team-logo" style="border:1px dashed rgba(255,255,255,.12)">?</div>
      <div class="team-info">
        <div class="team-abbr" style="color:rgba(255,255,255,.2)">TBD</div>
        <div class="oq-badge">Open Qualifier</div>
      </div></div>`;
  }
  return `<div class="oq-sweep"></div>
    <div class="oq-stage-info" style="border-left-color:${color}">${stage.desc}${invTag}</div>
    <div class="oq-teams-label">PARTICIPATING TEAMS</div>
    <div class="teams-grid">${slotsHTML}</div>`;
}

function buildOQPanelHTML(data, color, activeIdx) {
  let flowHTML = '';
  data.stages.forEach((s, i) => {
    const act = i === activeIdx;
    if (i > 0) {
      flowHTML += `<div class="oq-stage-conn">
        <div class="oq-conn-line"></div>
        <div class="oq-conn-dot" style="background:${color};box-shadow:0 0 5px ${color}"></div>
      </div>`;
    }
    const actStyle = act
      ? `border-color:${color};animation:oqPulse 2.8s ease-in-out infinite;--mc:${color}`
      : `--mc:${color}`;
    flowHTML += `<div class="oq-stage-card${act?' active':''}" data-stageidx="${i}" style="${actStyle}">
      <div class="oq-card-top" style="background:${color}"></div>
      <div class="oq-card-scan"></div>
      <div class="oq-card-shimmer"></div>
      <div class="oq-card-corner tl"></div>
      <div class="oq-card-corner tr"></div>
      <div class="oq-card-corner bl"></div>
      <div class="oq-card-corner br"></div>
      <div class="oq-card-num">
        <div class="oq-card-num-dot" style="background:${color}"></div>
        ${String(i+1).padStart(2,'0')}
      </div>
      <div class="oq-card-name">${s.name}</div>
      <div class="oq-card-meta">${s.meta}</div>
      <div class="oq-card-ghost" style="${act?`color:${color};opacity:.1`:''}">${String(i+1).padStart(2,'0')}</div>
    </div>`;
  });
  const bracketUrl = data.stages[0]?.bracketUrl;
  const bracketBtnHTML = bracketUrl ? `<div id="euBracketWrap" style="${activeIdx===0?'':'display:none'}">
    <a href="${bracketUrl}" class="eu-oq-btn">
      <div class="eu-oq-corner tl"></div><div class="eu-oq-corner tr"></div>
      <div class="eu-oq-corner bl"></div><div class="eu-oq-corner br"></div>
      <div class="eu-oq-scan"></div>
      <div class="eu-oq-inner">
        <div class="eu-oq-live"><div class="eu-oq-dot"></div><span>LIVE</span></div>
        <div class="eu-oq-sep"></div>
        <div class="eu-oq-label">GROUP STAGE BRACKET</div>
        <div class="eu-oq-arrow">↗</div>
      </div>
    </a>
  </div>` : '';
  return `<div class="oq-panel">
    <div class="oq-stage-header">
      <div class="oq-structure-label">TOURNAMENT STRUCTURE</div>
      <div class="oq-stage-flow">${flowHTML}</div>
    </div>
    ${bracketBtnHTML}
    <div class="oq-content" id="oqContent" style="--mc:${color}">${buildOQStageContentHTML(data.stages[activeIdx], color)}</div>
  </div>`;
}

function bindOQStageEvents(data, color) {
  const tv = document.getElementById('teamsView');
  tv.querySelectorAll('.oq-stage-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.stageidx);
      tv.querySelectorAll('.oq-stage-card').forEach((c, i) => {
        const act = i === idx;
        c.classList.toggle('active', act);
        if (act) {
          c.style.borderColor = color;
          c.style.animation   = `oqPulse 2.8s ease-in-out infinite`;
        } else {
          c.style.borderColor = '';
          c.style.animation   = '';
        }
        const ghost = c.querySelector('.oq-card-ghost');
        ghost.style.color   = act ? color : '';
        ghost.style.opacity = act ? '.1'  : '';
      });
      const oqC = document.getElementById('oqContent');
      /* Flash overlay */
      const flash = document.createElement('div');
      flash.className = 'oq-flash';
      flash.style.setProperty('--mc', color);
      oqC.appendChild(flash);
      setTimeout(() => flash.remove(), 400);
      /* Content refresh */
      oqC.style.animation = 'none';
      void oqC.offsetHeight;
      oqC.style.animation = '';
      oqC.innerHTML = buildOQStageContentHTML(data.stages[idx], color);
      oqC.style.setProperty('--mc', color);
      /* bracket button visibility */
      const bracketWrap = document.getElementById('euBracketWrap');
      if (bracketWrap) bracketWrap.style.display = idx === 0 ? '' : 'none';
    });
  });
}

window.addEventListener('resize', () => {
  buildMap();
});

buildMap();
</script>
<script src="../auth.js"></script>
</body>
</html>
