<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCT 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root {
  --red: #FF4655;
  --americas: #FF4655;
  --emea: #00C8FF;
  --pacific: #FF8C00;
  --cn: #FF2244;
}

body {
  background: #080808;
  color: #fff;
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Header ── */
.hdr {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  padding: 1.1rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(to bottom, rgba(8,8,8,.85) 60%, transparent);
}

.brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 1.6rem;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.brand b { color: var(--red); }

.back-link {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.45);
  text-decoration: none;
  transition: color .15s;
}
.back-link:hover { color: #fff; }

/* ── Map wrapper ── */
.map-wrap {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.map-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  pointer-events: none;
}

/* dark vignette so edges fade */
.map-vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at center, transparent 40%, rgba(8,8,8,.6) 100%),
    linear-gradient(to bottom, rgba(8,8,8,.4) 0%, transparent 15%, transparent 80%, rgba(8,8,8,.7) 100%);
  pointer-events: none;
}

/* ── Section title overlay ── */
.section-title {
  position: absolute;
  top: 5.5rem;
  left: 1.5rem;
  z-index: 50;
  pointer-events: none;
}
.section-phase {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: .3rem;
}
.section-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 2.8rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .05em;
  line-height: 1;
  color: #fff;
  text-shadow: 0 2px 20px rgba(0,0,0,.5);
}

/* ── Pins ── */
.pin {
  position: absolute;
  transform: translate(-50%, -100%);
  cursor: pointer;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: z-index 0s;
}

.pin-bubble {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.15);
  background: rgba(8,8,8,.7);
  font-size: 20px;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  position: relative;
}

.pin-bubble::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  opacity: 0;
  transition: opacity .2s;
}

.pin-stem {
  width: 2px;
  height: 14px;
  opacity: .7;
  transition: opacity .2s;
}

.pin-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  opacity: .8;
  margin-top: -1px;
}

.pin-label {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: rgba(8,8,8,.9);
  border-radius: 3px;
  padding: 3px 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
}

.pin:hover .pin-bubble {
  transform: scale(1.25) translateY(-3px);
}
.pin:hover .pin-bubble::after { opacity: 1; }
.pin:hover .pin-label { opacity: 1; }
.pin:hover .pin-stem { opacity: 1; }

/* ── Region legend ── */
.legend {
  position: absolute;
  bottom: 5.5rem;
  left: 1.5rem;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: .35rem;
}
.legend-row {
  display: flex;
  align-items: center;
  gap: .4rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: rgba(255,255,255,.55);
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Phase nav bar ── */
.phase-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 200;
  padding: .75rem 1.5rem;
  display: flex;
  align-items: center;
  gap: .3rem;
  background: rgba(8,8,8,.88);
  border-top: 0.5px solid rgba(255,255,255,.08);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.phase-nav::-webkit-scrollbar { display: none; }

.phase-btn {
  flex-shrink: 0;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: .4rem .9rem;
  border-radius: 3px;
  border: 0.5px solid transparent;
  cursor: pointer;
  color: rgba(255,255,255,.45);
  background: transparent;
  transition: color .15s, background .15s, border-color .15s;
  white-space: nowrap;
}
.phase-btn:hover { color: rgba(255,255,255,.75); }
.phase-btn.active {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}

/* ── Detail panel ── */
.detail {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 280px;
  background: rgba(10,10,14,.97);
  border-left: 0.5px solid rgba(255,255,255,.09);
  z-index: 300;
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow-y: auto;
}
.detail.open { transform: translateX(0); }

.detail-top {
  padding: 4.5rem 1.4rem 1.2rem;
  border-bottom: 0.5px solid rgba(255,255,255,.07);
}

.detail-flag {
  font-size: 40px;
  line-height: 1;
  margin-bottom: .7rem;
}
.detail-region-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 2px;
  display: inline-block;
  margin-bottom: .6rem;
}
.detail-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.6rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .04em;
  line-height: 1.05;
  color: #fff;
}
.detail-sub-id {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  color: rgba(255,255,255,.35);
  margin-top: .3rem;
}

.detail-body {
  padding: 1rem 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.detail-row {
  padding: .7rem 0;
  border-bottom: 0.5px solid rgba(255,255,255,.06);
}
.detail-row:last-child { border-bottom: none; }
.detail-row-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  margin-bottom: .25rem;
}
.detail-row-val {
  font-size: 14px;
  color: rgba(255,255,255,.8);
}

.status-pill {
  display: inline-block;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 2px;
  background: rgba(255,70,85,.15);
  color: var(--red);
  border: 0.5px solid rgba(255,70,85,.3);
}

.detail-close {
  position: absolute;
  top: 1rem; right: 1rem;
  background: none;
  border: none;
  color: rgba(255,255,255,.4);
  font-size: 16px;
  cursor: pointer;
  line-height: 1;
  padding: .25rem;
  transition: color .15s;
}
.detail-close:hover { color: #fff; }
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">VCT <b>2027</b></div>
  <a href="../index.html" class="back-link">← 2026</a>
</header>

<div class="map-wrap">
  <img class="map-img" src="../assets/world_map.png" alt="World Map" draggable="false">
  <div class="map-vignette"></div>

  <div class="section-title">
    <div class="section-phase" id="sectionPhase">KickOff Open Qualifier</div>
    <div class="section-name" id="sectionName">Open<br>Qualifiers</div>
  </div>

  <!-- Pins rendered by JS -->
  <div id="pinLayer" style="position:absolute;inset:0;pointer-events:none"></div>

  <div class="legend">
    <div class="legend-row"><div class="legend-dot" style="background:var(--americas)"></div>Americas</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--emea)"></div>EMEA</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--pacific)"></div>Pacific</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--cn)"></div>China</div>
  </div>
</div>

<nav class="phase-nav">
  <button class="phase-btn active" data-phase="kickoff-oq">KickOff OQ</button>
  <button class="phase-btn" data-phase="kickoff">KickOff</button>
  <button class="phase-btn" data-phase="masters-seoul">Masters Seoul</button>
  <button class="phase-btn" data-phase="cups-oq">Cups OQ</button>
  <button class="phase-btn" data-phase="cups">Cups</button>
  <button class="phase-btn" data-phase="masters-valencia">Masters Valencia</button>
  <button class="phase-btn" data-phase="champs-oq">Champions OQ</button>
  <button class="phase-btn" data-phase="champions">Champions Austin</button>
</nav>

<div class="detail" id="detail">
  <button class="detail-close" id="detailClose">✕</button>
  <div class="detail-top">
    <div class="detail-flag" id="dFlag"></div>
    <div class="detail-region-tag" id="dRegionTag"></div>
    <div class="detail-name" id="dName"></div>
    <div class="detail-sub-id" id="dSubId"></div>
  </div>
  <div class="detail-body">
    <div class="detail-row">
      <div class="detail-row-label">Phase</div>
      <div class="detail-row-val" id="dPhase">KickOff Open Qualifier</div>
    </div>
    <div class="detail-row">
      <div class="detail-row-label">Status</div>
      <div class="detail-row-val"><span class="status-pill">예정</span></div>
    </div>
    <div class="detail-row">
      <div class="detail-row-label">지역</div>
      <div class="detail-row-val" id="dRegion"></div>
    </div>
    <div class="detail-row">
      <div class="detail-row-label">참가 팀 수</div>
      <div class="detail-row-val" id="dTeams">—</div>
    </div>
    <div class="detail-row">
      <div class="detail-row-label">진출 팀 수</div>
      <div class="detail-row-val" id="dSlots">—</div>
    </div>
  </div>
</div>

<script>
const COLORS = {
  americas: '#FF4655',
  emea:     '#00C8FF',
  pacific:  '#FF8C00',
  cn:       '#FF2244'
};

const REGION_LABELS = {
  americas: 'Americas',
  emea:     'EMEA',
  pacific:  'Pacific',
  cn:       'China'
};

const phaseLabels = {
  'kickoff-oq':       'KickOff Open Qualifier',
  'kickoff':          'KickOff',
  'masters-seoul':    'Masters Seoul',
  'cups-oq':          'Cups Open Qualifier',
  'cups':             'Cups',
  'masters-valencia': 'Masters Valencia',
  'champs-oq':        'Champions Open Qualifier',
  'champions':        'Champions Austin'
};

/* OQ 핀 공통 (KickOff OQ / Cups OQ / Champions OQ 동일) */
const OQ_PINS = [
  // Americas — 위도 기준 재보정
  { id:'na',     flag:'🇺🇸', name:'North America',           region:'americas', sub:'NA',   x:20, y:38 },
  { id:'lan',    flag:'🇲🇽', name:'Latin America North',     region:'americas', sub:'LAN',  x:24, y:56 },
  { id:'brazil', flag:'🇧🇷', name:'Brazil',                  region:'americas', sub:'BR',   x:38, y:77 },
  { id:'las',    flag:'🇦🇷', name:'Latin America South',     region:'americas', sub:'LAS',  x:33, y:84 },
  // EMEA
  { id:'eu',     flag:'🇪🇺', name:'Europe',                  region:'emea',     sub:'EU',   x:47, y:36 },
  { id:'tr',     flag:'🇹🇷', name:'Türkiye',                 region:'emea',     sub:'TR',   x:53, y:40 },
  { id:'mena',   flag:'🇸🇦', name:'Middle East & N. Africa', region:'emea',     sub:'MENA', x:58, y:48 },
  // China
  { id:'cn',     flag:'🇨🇳', name:'China',                   region:'cn',       sub:'CN',   x:76, y:39 },
  // Pacific
  { id:'kr',     flag:'🇰🇷', name:'South Korea',             region:'pacific',  sub:'KR',   x:80, y:38 },
  { id:'jp',     flag:'🇯🇵', name:'Japan',                   region:'pacific',  sub:'JP',   x:84, y:37 },
  { id:'sa',     flag:'🇮🇳', name:'South Asia',              region:'pacific',  sub:'SA',   x:66, y:49 },
  { id:'th',     flag:'🇹🇭', name:'Thailand',                region:'pacific',  sub:'TH',   x:74, y:51 },
  { id:'vn',     flag:'🇻🇳', name:'Vietnam',                 region:'pacific',  sub:'VN',   x:78, y:52 },
  { id:'sea',    flag:'🇵🇭', name:'Southeast Asia',          region:'pacific',  sub:'SEA',  x:82, y:52 },
  { id:'id',     flag:'🇮🇩', name:'Indonesia',               region:'pacific',  sub:'ID',   x:79, y:60 },
  { id:'oce',    flag:'🇦🇺', name:'Oceania',                 region:'pacific',  sub:'OCE',  x:86, y:71 },
];

/* Pin data per phase */
const phases = {
  'kickoff-oq': OQ_PINS,
  'kickoff': [
    { id:'americas', flag:'🌎', name:'Americas', region:'americas', sub:'Americas', x:19, y:55 },
    { id:'emea',     flag:'🌍', name:'EMEA',     region:'emea',     sub:'EMEA',     x:50, y:40 },
    { id:'pacific',  flag:'🌏', name:'Pacific',  region:'pacific',  sub:'Pacific',  x:78, y:46 },
    { id:'cn',       flag:'🇨🇳', name:'China',  region:'cn',       sub:'CN',       x:76, y:39 },
  ],
  'masters-seoul': [
    { id:'seoul', flag:'🇰🇷', name:'Masters Seoul', region:'pacific', sub:'International', x:80, y:38 },
  ],
  'cups-oq': OQ_PINS,
  'cups': [
    { id:'americas', flag:'🌎', name:'Americas', region:'americas', sub:'Americas', x:19, y:55 },
    { id:'emea',     flag:'🌍', name:'EMEA',     region:'emea',     sub:'EMEA',     x:50, y:40 },
    { id:'pacific',  flag:'🌏', name:'Pacific',  region:'pacific',  sub:'Pacific',  x:78, y:46 },
    { id:'cn',       flag:'🇨🇳', name:'China',  region:'cn',       sub:'CN',       x:76, y:39 },
  ],
  'masters-valencia': [
    { id:'valencia', flag:'🇪🇸', name:'Masters Valencia', region:'emea', sub:'International', x:45, y:39 },
  ],
  'champs-oq': OQ_PINS,
  'champions': [
    { id:'austin', flag:'🇺🇸', name:'Champions Austin', region:'americas', sub:'International', x:20, y:35 },
  ],
};

let currentPhase = 'kickoff-oq';

function renderPins(phaseKey) {
  const layer = document.getElementById('pinLayer');
  layer.innerHTML = '';
  const pins = phases[phaseKey] || [];
  pins.forEach(p => {
    const color = COLORS[p.region];
    const el = document.createElement('div');
    el.className = 'pin';
    el.style.cssText = `left:${p.x}%;top:${p.y}%;pointer-events:auto`;
    el.innerHTML = `
      <div class="pin-label" style="border-left:2px solid ${color}">${p.sub}</div>
      <div class="pin-bubble" style="border-color:${color}44;box-shadow:0 0 12px ${color}33">${p.flag}</div>
      <div class="pin-stem" style="background:${color}"></div>
      <div class="pin-dot" style="background:${color}"></div>
    `;
    el.addEventListener('click', () => openDetail(p, phaseKey));
    layer.appendChild(el);
  });
}

function openDetail(p, phaseKey) {
  const color = COLORS[p.region];
  document.getElementById('dFlag').textContent = p.flag;
  const tag = document.getElementById('dRegionTag');
  tag.textContent = REGION_LABELS[p.region];
  tag.style.background = color + '22';
  tag.style.color = color;
  tag.style.border = `0.5px solid ${color}44`;
  document.getElementById('dName').textContent = p.name;
  document.getElementById('dSubId').textContent = p.sub;
  document.getElementById('dPhase').textContent = phaseLabels[phaseKey];
  document.getElementById('dRegion').textContent = REGION_LABELS[p.region];
  document.getElementById('dTeams').textContent = '—';
  document.getElementById('dSlots').textContent = '—';
  document.getElementById('detail').classList.add('open');
}

document.getElementById('detailClose').addEventListener('click', () => {
  document.getElementById('detail').classList.remove('open');
});

document.querySelectorAll('.phase-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPhase = btn.dataset.phase;
    document.getElementById('detail').classList.remove('open');

    const label = phaseLabels[currentPhase];
    const isOQ = currentPhase.includes('oq');
    document.getElementById('sectionPhase').textContent = label;
    document.getElementById('sectionName').innerHTML = isOQ
      ? 'Open<br>Qualifiers'
      : label.replace(' ', '<br>');

    renderPins(currentPhase);
  });
});

/* Close detail on map click */
document.querySelector('.map-wrap').addEventListener('click', (e) => {
  if (!e.target.closest('.pin') && !e.target.closest('.detail')) {
    document.getElementById('detail').classList.remove('open');
  }
});

renderPins(currentPhase);
</script>
</body>
</html>
