<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCT 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#FF4655;--americas:#FF8C00;--emea:#85E62C;--pacific:#00C8FF;--cn:#FF2244}
body{background:#080808;color:#fff;font-family:'Barlow',sans-serif;overflow:hidden;height:100vh}

.hdr{
  position:fixed;top:0;left:0;right:0;z-index:200;
  padding:1.1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(8,8,8,.85) 60%,transparent);
}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;letter-spacing:.12em;text-transform:uppercase}
.brand b{color:var(--red)}
.back-link{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);text-decoration:none;transition:color .15s}
.back-link:hover{color:#fff}

.map-section{position:fixed;inset:0;overflow:hidden}
#worldMap{position:absolute;inset:0;width:100%;height:100%}
#pinLayer{position:absolute;inset:0;pointer-events:none}

.section-title{position:absolute;top:5.5rem;left:1.5rem;z-index:50;pointer-events:none}
.section-phase{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:.3rem}
.section-name{font-family:'Barlow Condensed',sans-serif;font-size:2.8rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;line-height:1;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5)}

.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.pin-bubble{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.15);background:rgba(8,8,8,.75);font-size:20px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.pin-stem{width:2px;height:14px;opacity:.7}
.pin-dot{width:5px;height:5px;border-radius:50%;opacity:.8;margin-top:-1px}
.pin-label{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(8,8,8,.92);border-radius:3px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .15s}
.pin:hover .pin-bubble{transform:scale(1.25) translateY(-3px)}
.pin:hover .pin-label{opacity:1}

.legend{position:absolute;bottom:5.5rem;left:1.5rem;z-index:50;display:flex;flex-direction:column;gap:.35rem}
.legend-row{display:flex;align-items:center;gap:.4rem;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.phase-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:.75rem 1.5rem;display:flex;align-items:center;gap:.3rem;background:rgba(8,8,8,.88);border-top:.5px solid rgba(255,255,255,.08);overflow-x:auto;-webkit-overflow-scrolling:touch}
.phase-nav::-webkit-scrollbar{display:none}
.phase-btn{flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:.4rem .9rem;border-radius:3px;border:.5px solid transparent;cursor:pointer;color:rgba(255,255,255,.45);background:transparent;transition:color .15s,background .15s;white-space:nowrap}
.phase-btn:hover{color:rgba(255,255,255,.75)}
.phase-btn.active{background:var(--red);color:#fff}

/* ── Modal overlay ── */
.modal-overlay{
  position:fixed;inset:0;z-index:400;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0);
  pointer-events:none;
  transition:background .25s;
}
.modal-overlay.open{
  background:rgba(0,0,0,.72);
  pointer-events:auto;
}

/* ── Modal panel ── */
.modal{
  position:relative;
  width:min(860px,90vw);
  max-height:80vh;
  background:#050508;
  border:1px solid var(--mc,#fff);
  display:flex;flex-direction:column;
  overflow:hidden;
  /* screen-on animation */
  transform:scaleY(0);
  transform-origin:center;
  opacity:0;
  box-shadow:
    0 0 0 1px var(--mc,#fff),
    0 0 40px var(--mc,rgba(255,255,255,.2)),
    0 0 80px var(--mc,rgba(255,255,255,.08)),
    inset 0 0 60px rgba(0,0,0,.6);
}
.modal-overlay.open .modal{
  animation:screenOn .42s cubic-bezier(.16,1,.3,1) forwards;
}
.modal-overlay.closing .modal{
  animation:screenOff .18s ease-in forwards;
}

/* scan line overlay */
.modal-scan{
  position:absolute;inset:0;z-index:20;
  pointer-events:none;
  overflow:hidden;
}
.modal-scan::after{
  content:'';
  position:absolute;left:0;right:0;
  height:3px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.25),transparent);
  animation:scanSweep .5s .1s linear forwards;
  opacity:0;
}
/* CRT scanlines texture */
.modal-scan::before{
  content:'';
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.06) 0px,
    rgba(0,0,0,.06) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events:none;
}

/* Content fades in after screen opens */
.modal-content{
  display:flex;flex-direction:column;
  flex:1;overflow:hidden;
  opacity:0;
  animation:contentIn .3s .28s ease forwards;
}

/* ── Header ── */
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 1.5rem 1rem;
  border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.modal-header-left{display:flex;align-items:center;gap:1rem}
.modal-flag{font-size:2.4rem;line-height:1}
.modal-region-tag{
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:2px 7px;border-radius:2px;
  display:inline-block;margin-bottom:.3rem;
}
.modal-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:1.5rem;font-weight:900;
  text-transform:uppercase;letter-spacing:.04em;
  line-height:1;color:#fff;
}
.modal-phase-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,.3);
  text-align:right;margin-bottom:.25rem;
}
.modal-close{
  background:none;border:none;cursor:pointer;
  font-size:14px;color:rgba(255,255,255,.3);
  padding:.4rem;margin-left:1rem;
  transition:color .15s;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;letter-spacing:.05em;
}
.modal-close:hover{color:#fff}

/* ── Body ── */
.modal-body{
  flex:1;
  padding:0;
  position:relative;
  min-height:340px;
  overflow:hidden;
}
.modal-body::-webkit-scrollbar{width:3px}
.modal-body::-webkit-scrollbar-track{background:transparent}
.modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}

.modal-section-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.25);
  margin-bottom:.85rem;
  display:flex;align-items:center;gap:.6rem;
}
.modal-section-label::after{
  content:'';flex:1;height:1px;background:rgba(255,255,255,.07);
}

/* Team grid */
.teams-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:.5rem;
}
.team-slot{
  border:1px solid rgba(255,255,255,.08);
  border-radius:4px;
  padding:.65rem .75rem;
  display:flex;align-items:center;gap:.65rem;
  background:rgba(255,255,255,.03);
  transition:background .15s,border-color .15s;
  min-height:52px;
  cursor:default;
}
.team-slot.partner:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
.team-slot.oq-slot{opacity:.45}
.team-logo{
  width:32px;height:32px;border-radius:3px;
  background:rgba(255,255,255,.06);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;overflow:hidden;
}
.team-logo img{width:100%;height:100%;object-fit:contain;display:block}
.team-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.team-abbr{
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
  color:#fff;line-height:1;
}
.team-fullname{
  font-family:'Barlow',sans-serif;
  font-size:10px;color:rgba(255,255,255,.35);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.oq-badge{
  margin-top:.1rem;
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.22);
}

/* ── Keyframes ── */
@keyframes screenOn{
  0%  {transform:scaleY(.025);opacity:1;filter:brightness(6) blur(1px)}
  18% {transform:scaleY(.025);filter:brightness(8) blur(0)}
  42% {transform:scaleY(1);   filter:brightness(2)}
  65% {filter:brightness(1.15)}
  100%{transform:scaleY(1);   opacity:1;filter:brightness(1)}
}
@keyframes screenOff{
  0%  {transform:scaleY(1);opacity:1;filter:brightness(1)}
  60% {transform:scaleY(.03);filter:brightness(4)}
  100%{transform:scaleY(.03);opacity:0;filter:brightness(0)}
}
@keyframes scanSweep{
  0%  {top:-3px;opacity:0}
  10% {opacity:1}
  100%{top:100%;opacity:0}
}
@keyframes contentIn{
  0%  {opacity:0}
  100%{opacity:1}
}

.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);transition:opacity .6s}
.map-loading.done{opacity:0;pointer-events:none}

/* ── Roster Panel ── */
.modal-body{position:relative;overflow:hidden}
.teams-view,.roster-view{
  position:absolute;inset:0;padding:1.25rem 1.5rem 1.5rem;
  overflow-y:auto;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .2s;
}
.teams-view::-webkit-scrollbar,.roster-view::-webkit-scrollbar{width:3px}
.teams-view::-webkit-scrollbar-thumb,.roster-view::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
.teams-view{transform:translateX(0);opacity:1}
.teams-view.slide-out{transform:translateX(-60px);opacity:0;pointer-events:none}
.roster-view{transform:translateX(60px);opacity:0;pointer-events:none}
.roster-view.slide-in{transform:translateX(0);opacity:1;pointer-events:auto}

.rp-back{
  display:flex;align-items:center;gap:.4rem;
  background:none;border:none;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.32);padding:0;margin-bottom:1rem;
  transition:color .15s;
}
.rp-back:hover{color:rgba(255,255,255,.7)}
.rp-back::before{content:'←';font-size:12px}

.rp-team-header{
  display:flex;align-items:center;gap:.85rem;
  margin-bottom:1.25rem;padding-bottom:1rem;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.rp-logo{
  width:48px;height:48px;border-radius:4px;
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
}
.rp-logo img{width:100%;height:100%;object-fit:contain}
.rp-team-abbr{
  font-family:'Barlow Condensed',sans-serif;
  font-size:26px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;line-height:1;
}
.rp-team-name{
  font-family:'Barlow',sans-serif;
  font-size:11px;color:rgba(255,255,255,.35);margin-top:3px;
}

.rp-section{margin-bottom:1.1rem}
.rp-section-head{
  display:flex;align-items:center;gap:.55rem;
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.25);
  margin-bottom:.5rem;
}
.rp-section-head .rp-section-icon{
  display:inline-block;width:2px;height:10px;
  background:var(--rp-accent-full,rgba(255,34,68,.7));border-radius:1px;
}
.rp-section-head::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}

.rp-player-row{
  display:flex;align-items:center;gap:.6rem;
  padding:.38rem 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.rp-player-row:last-child{border-bottom:none}
.rp-num{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  color:var(--rp-accent,rgba(255,34,68,.5));width:18px;text-align:center;flex-shrink:0;
}
.rp-ign{
  font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.04em;color:rgba(255,255,255,.88);flex:1;
}
.rp-real-name{
  font-family:'Barlow',sans-serif;font-size:13px;color:rgba(255,255,255,.38);
  margin-left:auto;flex-shrink:0;
}

.rp-staff-row{
  display:flex;align-items:center;gap:.6rem;
  padding:.36rem 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.rp-staff-row:last-child{border-bottom:none}
.rp-role-badge{
  font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,34,68,.12);color:rgba(255,100,120,.85);
  border:1px solid rgba(255,34,68,.2);
  padding:2px 5px;border-radius:2px;flex-shrink:0;min-width:28px;text-align:center;
}
.rp-staff-name{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.03em;color:rgba(255,255,255,.75);flex:1;
}
.rp-staff-real{
  font-family:'Barlow',sans-serif;font-size:13px;color:rgba(255,255,255,.38);
  margin-left:auto;flex-shrink:0;
}
.rp-empty{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;
  color:rgba(255,255,255,.18);padding:.4rem 0;text-align:center;
}
.team-slot.partner.clickable{cursor:pointer}
.team-slot.partner.clickable:hover{
  background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);
}
.team-slot.partner.clickable:hover .team-abbr{color:var(--mc,#FF2244)}

/* 편집 모드 */
.rp-edit-input{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:2px;color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.03em;padding:3px 6px;outline:none;
  transition:border-color .15s;
}
.rp-edit-input:focus{border-color:rgba(255,34,68,.55);background:rgba(255,34,68,.06)}
.rp-ign-input{width:90px}
.rp-name-input{width:90px}
.rp-role-input{width:52px}
.rp-real-input{width:72px;color:rgba(255,255,255,.55)}
.rp-del-btn{
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,.2);font-size:12px;padding:2px 4px;
  transition:color .12s;line-height:1;flex-shrink:0;
}
.rp-del-btn:hover{color:rgba(255,60,80,.85)}
.rp-add-btn{
  display:block;width:100%;margin-top:.35rem;
  background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);
  border-radius:2px;color:rgba(255,255,255,.3);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:.3rem 0;cursor:pointer;transition:all .15s;
}
.rp-add-btn:hover{background:rgba(255,34,68,.08);border-color:rgba(255,34,68,.3);color:rgba(255,34,68,.7)}
</style>
</head>
<body>

<header class="hdr site-header">
  <div class="brand">VCT <b>2027</b></div>
  <a href="../index.html" class="back-link">← 2026</a>
</header>

<div class="map-section">
  <svg id="worldMap"></svg>
  <div id="pinLayer"></div>
  <div class="map-loading" id="mapLoading">Loading map…</div>

  <div class="section-title">
    <div class="section-phase" id="sectionPhase">KickOff Open Qualifier</div>
    <div class="section-name" id="sectionName">Open<br>Qualifiers</div>
  </div>

  <div class="legend">
    <div class="legend-row"><div class="legend-dot" style="background:var(--americas)"></div>Americas</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--emea)"></div>EMEA</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--pacific)"></div>Pacific</div>
    <div class="legend-row"><div class="legend-dot" style="background:var(--cn)"></div>China</div>
  </div>
</div>

<nav class="phase-nav">
  <button class="phase-btn active" data-phase="kickoff-oq">KickOff OQ</button>
  <button class="phase-btn" data-phase="kickoff">KickOff</button>
  <button class="phase-btn" data-phase="masters-seoul">Masters Seoul</button>
  <button class="phase-btn" data-phase="cups-oq-1">Cups OQ</button>
  <button class="phase-btn" data-phase="cups-1">Cups 1</button>
  <button class="phase-btn" data-phase="masters-valencia">Masters Valencia</button>
  <button class="phase-btn" data-phase="cups-oq-2">Cups OQ</button>
  <button class="phase-btn" data-phase="cups-2">Cups 2</button>
  <button class="phase-btn" data-phase="champions">Champions Austin</button>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-scan"></div>
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-header-left">
          <div class="modal-flag" id="mFlag"></div>
          <div>
            <div class="modal-region-tag" id="mRegionTag"></div>
            <div class="modal-title" id="mTitle"></div>
          </div>
        </div>
        <div style="text-align:right">
          <div class="modal-phase-label" id="mPhase"></div>
          <button class="modal-close" id="modalClose">[ CLOSE ]</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="teams-view" id="teamsView">
          <div class="modal-section-label">Participating Teams</div>
          <div class="teams-grid" id="mTeamsGrid"></div>
        </div>
        <div class="roster-view" id="rosterView">
          <button class="rp-back" id="rosterBack">팀 목록으로</button>
          <div class="rp-team-header">
            <div class="rp-logo" id="rpLogo"></div>
            <div>
              <div class="rp-team-abbr" id="rpAbbr"></div>
              <div class="rp-team-name" id="rpName"></div>
            </div>
          </div>
          <div id="rpBody"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../storage.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const COLORS = {americas:'#FF8C00',emea:'#85E62C',pacific:'#00C8FF',cn:'#FF2244'};
const REGION_LABELS = {americas:'Americas',emea:'EMEA',pacific:'Pacific',cn:'China'};
const phaseLabels = {
  'kickoff-oq':  'KickOff Open Qualifier',
  'kickoff':     'KickOff',
  'masters-seoul':'Masters Seoul',
  'cups-oq-1':   'Cups Open Qualifier 1',
  'cups-1':      'Cups 1',
  'masters-valencia':'Masters Valencia',
  'cups-oq-2':   'Cups Open Qualifier 2',
  'cups-2':      'Cups 2',
  'champions':   'Champions Austin'
};

/* ── 파트너 팀 데이터 ── */
const BASE = '../assets/teams/VCT 2027';
const PARTNER_TEAMS = {
  americas:[
    {abbr:'LOUD', name:'LOUD',           logo:`${BASE}/VCT Americas/Americas_Partnership/LOUD.webp`},
    {abbr:'G2',   name:'G2 Esports',     logo:`${BASE}/VCT Americas/Americas_Partnership/G2.png`},
    {abbr:'NRG',  name:'NRG',            logo:`${BASE}/VCT Americas/Americas_Partnership/NRG.png`},
    {abbr:'SEN',  name:'Sentinels',      logo:`${BASE}/VCT Americas/Americas_Partnership/SEN.svg`},
    {abbr:'KRÜ',  name:'KRÜ Esports',   logo:`${BASE}/VCT Americas/Americas_Partnership/KRÜ.svg`},
    {abbr:'LEV',  name:'LEVIATÁN',       logo:`${BASE}/VCT Americas/Americas_Partnership/LEV.png`},

function buildMap() {
  const W = window.innerWidth;
  const H = window.innerHeight;

  const svg = d3.select('#worldMap').attr('width', W).attr('height', H);
  svg.selectAll('*').remove();

  const defs = svg.append('defs');

  /* 배경: 붉은 방사형 그라데이션 */
  const bgGrad = defs.append('radialGradient')
    .attr('id','bgGrad').attr('cx','38%').attr('cy','50%').attr('r','70%');
  bgGrad.append('stop').attr('offset','0%').attr('stop-color','#B81020');
  bgGrad.append('stop').attr('offset','55%').attr('stop-color','#6A0510');
  bgGrad.append('stop').attr('offset','100%').attr('stop-color','#1A0208');

  /* 빛 레이 (원본 이미지 느낌 재현) */
  const rayGrad = defs.append('radialGradient')
    .attr('id','rayGrad').attr('cx','38%').attr('cy','50%').attr('r','50%');
  rayGrad.append('stop').attr('offset','0%').attr('stop-color','#FF3030').attr('stop-opacity','.18');
  rayGrad.append('stop').attr('offset','100%').attr('stop-color','#FF3030').attr('stop-opacity','0');

  /* 비네트 */
  const vig = defs.append('radialGradient')
    .attr('id','vig').attr('cx','50%').attr('cy','50%').attr('r','50%');
  vig.append('stop').attr('offset','40%').attr('stop-color','transparent');
  vig.append('stop').attr('offset','100%').attr('stop-color','#000').attr('stop-opacity','.65');

  svg.append('rect').attr('width',W).attr('height',H).attr('fill','url(#bgGrad)');
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','url(#rayGrad)');

  /* Natural Earth 투영 — 세계 지도 타원형
     D3 기본: scale=153 → 960×500 픽셀
     → 현재 뷰포트에 맞게: scale = min(W/960, H/500) × 153 × 0.92 (여백) */
  const s = Math.min(W / 960, H / 500) * 153 * 0.92;
  projection = d3.geoNaturalEarth1()
    .scale(s)
    .translate([W / 2, H / 2 + H * 0.04]);

  const pathGen = d3.geoPath().projection(projection);

  /* 세계 지도 데이터 fetch */
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);
      const borders   = topojson.mesh(world, world.objects.countries, (a,b) => a !== b);
      const land      = topojson.merge(world, world.objects.countries.geometries);

      /* 대륙 그림자 (약간 두꺼운 어두운 외곽) */
      svg.append('path').datum(land)
        .attr('d', pathGen)
        .attr('fill','none')
        .attr('stroke','#000')
        .attr('stroke-width', 4)
        .attr('stroke-linejoin','round')
        .attr('opacity', .4);

      /* 나라 채우기 */
      svg.append('g').selectAll('path')
        .data(countries.features)
        .join('path')
        .attr('d', pathGen)
        .attr('fill','#0e0808')
        .attr('stroke','none');

      /* 국경선 */
      svg.append('path').datum(borders)
        .attr('d', pathGen)
        .attr('fill','none')
        .attr('stroke','#301010')
        .attr('stroke-width', .5);

      /* 비네트 오버레이 */
      svg.append('rect').attr('width',W).attr('height',H).attr('fill','url(#vig)');

      document.getElementById('mapLoading').classList.add('done');
      renderPins(currentPhase);
    })
    .catch(() => {
      document.getElementById('mapLoading').textContent = '지도 로드 실패 (인터넷 연결 확인)';
    });
}

function renderPins(phaseKey) {
  if (!projection) return;
  const layer = document.getElementById('pinLayer');
  layer.innerHTML = '';
  (phases[phaseKey] || []).forEach(p => {
    const pt = projection([p.lng, p.lat]);
    if (!pt) return;
    const [px, py] = pt;
    const color = COLORS[p.region];
    const el = document.createElement('div');
    el.className = 'pin';
    el.style.left = px + 'px';
    el.style.top  = py + 'px';
    el.innerHTML = `
      <div class="pin-label" style="border-left:2px solid ${color}">${p.sub}</div>
      <div class="pin-bubble" style="border-color:${color}55;box-shadow:0 0 14px ${color}44">${p.flag}</div>
      <div class="pin-stem"  style="background:${color}"></div>
      <div class="pin-dot"   style="background:${color}"></div>`;
    el.addEventListener('click', () => openModal(p, phaseKey));
    layer.appendChild(el);
  });
}

function openModal(p, phaseKey) {
  const color  = COLORS[p.region];
  _modalRegionColor = color;
  const overlay = document.getElementById('modalOverlay');
  const modal   = document.getElementById('modal');

  /* CSS variable for glow color */
  modal.style.setProperty('--mc', color);
  modal.style.boxShadow = `
    0 0 0 1px ${color}99,
    0 0 40px ${color}44,
    0 0 80px ${color}22,
    inset 0 0 60px rgba(0,0,0,.6)`;
  modal.style.borderColor = color + '99';

  /* Header */
  document.getElementById('mFlag').textContent = p.flag;
  const tag = document.getElementById('mRegionTag');
  tag.textContent = REGION_LABELS[p.region];
  tag.style.cssText = `background:${color}22;color:${color};border:.5px solid ${color}55`;
  document.getElementById('mTitle').textContent  = p.name;
  document.getElementById('mPhase').textContent  = phaseLabels[phaseKey];

  /* 대진표 링크 버튼 (KickOff OQ CN 전용) */
  const existingBracketBtn = document.getElementById('mBracketBtn');
  if (existingBracketBtn) existingBracketBtn.remove();
  if (phaseKey === 'kickoff-oq' && p.id === 'cn') {
    const btn = document.createElement('a');
    btn.id = 'mBracketBtn';
    btn.href = 'cn-threshold.html';
    btn.style.cssText = `display:inline-block;margin-top:.4rem;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cn);border:1px solid rgba(255,34,68,.35);padding:3px 10px;border-radius:2px;text-decoration:none;transition:background .15s;`;
    btn.textContent = '대진표 보기 →';
    btn.onmouseover = () => btn.style.background = 'rgba(255,34,68,.15)';
    btn.onmouseout  = () => btn.style.background = '';
    document.getElementById('mPhase').insertAdjacentElement('afterend', btn);
  }

  /* Team slots */
  const grid = document.getElementById('mTeamsGrid');
  grid.innerHTML = '';

  if (p.teams && p.teams.length) {
    /* Partner teams */
    const isOQCN = (phaseKey === 'kickoff-oq' && p.id === 'cn');
    p.teams.forEach(t => {
      const slot = document.createElement('div');
      slot.className = 'team-slot partner' + (isOQCN ? ' clickable' : '');
      slot.innerHTML = `
        <div class="team-logo">
          <img src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">
        </div>
        <div class="team-info">
          <div class="team-abbr">${t.abbr}</div>
          <div class="team-fullname">${t.name}</div>
        </div>`;
      if (isOQCN) {
        slot.addEventListener('click', () => openRosterPanel(t));
      }
      grid.appendChild(slot);
    });
    /* OQ placeholder slots */
    const oqCount = 12 - p.teams.length;
    for (let i = 0; i < oqCount; i++) {
      const slot = document.createElement('div');
      slot.className = 'team-slot oq-slot';
      slot.innerHTML = `
        <div class="team-logo" style="border:1px dashed rgba(255,255,255,.15)">?</div>
        <div class="team-info">
          <div class="team-abbr" style="color:rgba(255,255,255,.25)">TBD</div>
          <div class="oq-badge">Open Qualifier</div>
        </div>`;
      grid.appendChild(slot);
    }
  } else {
    /* Pure TBD (OQ phases, Masters, Champions) */
    const slotCount = phaseKey.includes('oq') ? 16 : (phaseKey.includes('masters') || phaseKey === 'champions') ? 12 : 8;
    for (let i = 0; i < slotCount; i++) {
      const slot = document.createElement('div');
      slot.className = 'team-slot oq-slot';
      slot.innerHTML = `
        <div class="team-logo" style="border:1px dashed rgba(255,255,255,.12)">?</div>
        <div class="team-info">
          <div class="team-abbr" style="color:rgba(255,255,255,.2)">TBD</div>
        </div>`;
      grid.appendChild(slot);
    }
  }

  /* Remove old animation classes to retrigger */
  overlay.classList.remove('closing');
  overlay.classList.add('open');
}

const RP_STORE_PREFIX = 'roster:cn-oq:';
let _rpCurrentAbbr = null;

function isAdmin() {
  try {
    if (localStorage.getItem('vct_admin_auth')) return true;
    const u = JSON.parse(localStorage.getItem('vct_auth_user'));
    return !!(u && u.role === 'admin');
  } catch(e) { return false; }
}

function rpLoadRoster(abbr) {
  const key = RP_STORE_PREFIX + abbr;
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const d = JSON.parse(raw);
      /* 구 포맷(감독/코치/기타) → 新 포맷 마이그레이션 */
      if (!d.스태프) {
        d.스태프 = [].concat(d.감독||[], d.코치||[], d.기타||[]);
        delete d.감독; delete d.코치; delete d.기타;
      }
      return d;
    }
  } catch(e) {}
  return CN_OQ_ROSTERS[abbr] || {players:[],스태프:[]};
}

function rpSaveRoster(abbr, data) {
  localStorage.setItem(RP_STORE_PREFIX + abbr, JSON.stringify(data));
}

    ? rows.map((r,i) => admin
        ? (isPlayer ? rpPlayerEditHTML(r,i,sectionKey) : rpStaffEditHTML(r,i,sectionKey))
        : (isPlayer ? rpPlayerRowHTML(r,i) : rpStaffRowHTML(r,label))
      ).join('')
    : (admin ? '' : `<div class="rp-empty">등록된 항목 없음</div>`);
  const addBtn = admin
    ? `<button class="rp-add-btn" data-section="${sectionKey}">+ 추가</button>` : '';
  return `<div class="rp-section">
    <div class="rp-section-head"><span class="rp-section-icon"></span>${label}</div>
    ${rowsHTML}
    ${addBtn}
  </div>`;
}

function rpRender(abbr) {
  const r = rpLoadRoster(abbr);
  const admin = isAdmin();
  const body = document.getElementById('rpBody');
  body.innerHTML =
    rpSectionHTML('PLAYERS', 'players', r.players, admin, '') +
    rpSectionHTML('STAFF',   '스태프',  r.스태프,  admin, '');

  if (!body.innerHTML.trim()) {
    body.innerHTML = '<div class="rp-empty" style="margin-top:2rem">등록된 로스터가 없습니다</div>';
  }

  if (admin) rpBindEditEvents(abbr);
}

function rpBindEditEvents(abbr) {
  const body = document.getElementById('rpBody');

  /* 필드 변경 */
  body.querySelectorAll('.rp-edit-input').forEach(input => {
    input.addEventListener('change', () => rpFlushEdit(abbr));
  });

  /* 삭제 */
  body.querySelectorAll('.rp-del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = btn.dataset.section;
      const idx = parseInt(btn.dataset.idx);
      const r = rpLoadRoster(abbr);
      r[section].splice(idx, 1);
      rpSaveRoster(abbr, r);
      rpRender(abbr);
    });
  });

  /* 추가 */
  body.querySelectorAll('.rp-add-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = btn.dataset.section;
      const r = rpLoadRoster(abbr);
      if (section === 'players') r.players.push({ign:'',real:''});
      else r.스태프.push({role:'',name:'',real:''});
      rpSaveRoster(abbr, r);
      rpRender(abbr);
      /* 새 행의 첫 input 포커스 */
      const rows = document.querySelectorAll(`[data-section="${section}"]`);
      const last = rows[rows.length-1];
      if (last) last.querySelector('input')?.focus();
    });
  });
}

function rpFlushEdit(abbr) {
  const body = document.getElementById('rpBody');
  const r = rpLoadRoster(abbr);
  body.querySelectorAll('.rp-edit-row').forEach(row => {
    const section = row.dataset.section;
    const idx = parseInt(row.dataset.idx);
    const obj = r[section][idx];
    if (!obj) return;
    row.querySelectorAll('.rp-edit-input').forEach(inp => {
      obj[inp.dataset.field] = inp.value.trim();
    });
  });
  rpSaveRoster(abbr, r);
}

function openRosterPanel(t) {
  _rpCurrentAbbr = t.abbr;
  const teamsView  = document.getElementById('teamsView');
  const rosterView = document.getElementById('rosterView');
  const modal      = document.getElementById('modal');

  /* 팀 퍼스널 컬러 적용 */
  const tc = t.color || '#FF2244';
  rosterView.style.setProperty('--rp-accent', tc + '99');
  /* 섹션 아이콘/헤드 색상도 덮어쓰기 */
  rosterView.style.setProperty('--rp-accent-full', tc);
  /* 모달 테두리/글로우 교체 */
  modal.style.boxShadow = `
    0 0 0 1px ${tc}99,
    0 0 40px ${tc}44,
    0 0 80px ${tc}22,
    inset 0 0 60px rgba(0,0,0,.6)`;
  modal.style.borderColor = tc + '99';

  document.getElementById('rpLogo').innerHTML =
    `<img src="${t.logo}" alt="${t.abbr}" onerror="this.style.display='none'">`;
  document.getElementById('rpAbbr').textContent = t.abbr;
  document.getElementById('rpName').textContent = t.name;

  rpRender(t.abbr);

  teamsView.classList.add('slide-out');
  rosterView.classList.add('slide-in');
  rosterView.scrollTop = 0;
}

function closeRosterPanel() {
  document.getElementById('teamsView').classList.remove('slide-out');
  document.getElementById('rosterView').classList.remove('slide-in');
  /* 모달 테두리를 원래 region 색으로 복원 */
  const modal = document.getElementById('modal');
  const c = _modalRegionColor;
  modal.style.boxShadow = `0 0 0 1px ${c}99,0 0 40px ${c}44,0 0 80px ${c}22,inset 0 0 60px rgba(0,0,0,.6)`;
  modal.style.borderColor = c + '99';
}

document.getElementById('rosterBack').addEventListener('click', closeRosterPanel);

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  if (!overlay.classList.contains('open')) return;
  closeRosterPanel();
  overlay.classList.add('closing');
  setTimeout(() => overlay.classList.remove('open','closing'), 200);
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.querySelectorAll('.phase-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPhase = btn.dataset.phase;
    closeModal();
    const label = phaseLabels[currentPhase];
    const isOQ  = currentPhase.includes('oq');
    document.getElementById('sectionPhase').textContent = label;
    const nameHTML = isOQ ? 'Open<br>Qualifiers' : label.replace(/(\s)(?=\S+$)/,'<br>');
    document.getElementById('sectionName').innerHTML = nameHTML;
    renderPins(currentPhase);
  });
});

window.addEventListener('resize', () => {
  buildMap();
});

buildMap();
</script>
<script src="../auth.js"></script>
</body>
