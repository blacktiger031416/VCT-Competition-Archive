<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALORANT Roulette</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+KR:wght@400;700&display=swap');

    :root {
      --red:    #ff4655;
      --teal:   #00d1d9;
      --gold:   #f0c040;
      --dark:   #0f1923;
      --darker: #070c12;
      --card:   #141e2a;
      --border: #22303f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--darker);
      color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,70,85,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,70,85,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none; z-index: 0;
      animation: gridDrift 24s linear infinite;
    }
    @keyframes gridDrift { from { background-position:0 0; } to { background-position:48px 48px; } }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 700px 500px at 10% 10%, rgba(255,70,85,.08) 0%, transparent 70%),
        radial-gradient(ellipse 600px 400px at 90% 90%, rgba(0,209,217,.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── screen shake ── */
    @keyframes screenShake {
      0%   { transform: translate(0,0); }
      10%  { transform: translate(-4px, 3px); }
      20%  { transform: translate(4px,-2px); }
      30%  { transform: translate(-3px, 4px); }
      40%  { transform: translate(3px,-3px); }
      50%  { transform: translate(-2px, 2px); }
      60%  { transform: translate(2px, 3px); }
      80%  { transform: translate(-1px,-1px); }
      100% { transform: translate(0,0); }
    }
    body.shake { animation: screenShake .55s ease-out; }

    /* ── particles ── */
    .pt {
      position: fixed;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      pointer-events: none;
      z-index: 200;
      transform: translate(-50%,-50%);
      animation: ptBurst .7s ease-out forwards;
    }
    .pt.teal { background: var(--teal); }
    .pt.gold  { background: var(--gold); }
    @keyframes ptBurst {
      0%   { opacity: 1; transform: translate(-50%,-50%) translate(0,0) scale(1.4); }
      100% { opacity: 0; transform: translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(0); }
    }

    /* ── shared header ── */
    #setup-screen, #main-screen { position: relative; z-index: 1; width: 100%; }
    .site-header {
      padding: 26px 0 18px; text-align: center; position: relative;
    }
    .site-header::after {
      content: ''; display: block;
      width: 200px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      margin: 10px auto 0;
      box-shadow: 0 0 14px rgba(255,70,85,.7);
      animation: linePulse 2.5s ease-in-out infinite;
    }
    @keyframes linePulse {
      0%,100% { opacity:1; width:200px; }
      50%      { opacity:.5; width:100px; }
    }
    .logo-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 3rem; font-weight: 700;
      letter-spacing: 12px; text-transform: uppercase;
      text-shadow: 0 0 40px rgba(255,70,85,.15);
    }
    .logo-text span { color:var(--red); text-shadow:0 0 24px rgba(255,70,85,.8),0 0 50px rgba(255,70,85,.35); }
    .sub-text { font-size:.72rem; letter-spacing:6px; color:#556677; text-transform:uppercase; margin-top:4px; }

    /* ════════ SETUP SCREEN ════════ */
    #setup-screen { flex:1; display:flex; flex-direction:column; align-items:center; padding:40px 20px 60px; }
    .setup-card {
      width:100%; max-width:500px;
      background:linear-gradient(135deg,rgba(15,25,35,.97),rgba(10,18,28,.97));
      border:1px solid rgba(255,70,85,.22); border-radius:12px;
      padding:36px 32px;
      box-shadow:0 0 50px rgba(255,70,85,.1),inset 0 1px 0 rgba(255,255,255,.04);
      position:relative; overflow:hidden;
    }
    .setup-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,70,85,.6),transparent);
    }
    .setup-card h2 {
      font-size:1.05rem; font-weight:700; letter-spacing:4px; text-transform:uppercase;
      color:rgba(255,255,255,.65); margin-bottom:24px; text-align:center;
    }
    .input-row { display:flex; gap:10px; margin-bottom:20px; }
    .input-row input {
      flex:1; background:var(--darker); border:2px solid var(--border); border-radius:6px;
      color:#fff; font-family:'Noto Sans KR',sans-serif; font-size:1rem;
      padding:10px 14px; outline:none; transition:border-color .2s;
    }
    .input-row input:focus { border-color:var(--red); }
    .input-row input::placeholder { color:#334455; }
    .btn-add {
      background:var(--red); color:#fff; border:none; padding:0 22px;
      font-family:'Noto Sans KR',sans-serif; font-size:.95rem; font-weight:700;
      cursor:pointer; border-radius:6px; transition:background .2s; white-space:nowrap;
    }
    .btn-add:hover { background:#e03040; }
    .player-chips { display:flex; flex-wrap:wrap; gap:8px; min-height:38px; margin-bottom:28px; }
    .chip {
      display:flex; align-items:center; gap:7px; background:var(--card);
      border:1px solid var(--border); border-radius:20px;
      padding:5px 10px 5px 14px; font-size:.9rem; color:#dde;
    }
    .chip-remove { background:none; border:none; color:#667788; cursor:pointer; font-size:1rem; padding:0; transition:color .15s; }
    .chip-remove:hover { color:var(--red); }
    .btn-done {
      width:100%; background:linear-gradient(135deg,#ff4655,#c8001a); color:#fff; border:none;
      padding:14px; font-family:'Noto Sans KR',sans-serif;
      font-size:1.05rem; font-weight:700; letter-spacing:4px; cursor:pointer;
      border-radius:6px; clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);
      transition:all .2s; box-shadow:0 4px 24px rgba(255,70,85,.35); position:relative; overflow:hidden;
    }
    .btn-done::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
      transform:translateX(-100%); transition:transform .4s;
    }
    .btn-done:not(:disabled):hover::after { transform:translateX(100%); }
    .btn-done:disabled { background:#1a2232; color:#2a3a4a; cursor:not-allowed; box-shadow:none; }
    .btn-done:not(:disabled):hover { box-shadow:0 6px 36px rgba(255,70,85,.55); transform:translateY(-2px); }

    /* ════════ MAIN SCREEN ════════ */
    #main-screen { flex:1; display:none; flex-direction:column; align-items:center; padding-bottom:80px; }

    /* player tab bar */
    .player-tabbar {
      width:100%; background:rgba(7,12,18,.9); border-bottom:1px solid rgba(255,70,85,.12);
      display:flex; overflow-x:auto; scrollbar-width:none; backdrop-filter:blur(8px);
    }
    .player-tabbar::-webkit-scrollbar { display:none; }
    .player-tab {
      flex-shrink:0; padding:13px 28px;
      font-family:'Noto Sans KR',sans-serif; font-size:.92rem; font-weight:700;
      color:#3a5060; background:none; border:none; border-bottom:2px solid transparent;
      cursor:pointer; white-space:nowrap; transition:color .2s,border-color .2s;
      margin-bottom:-1px; letter-spacing:1px;
    }
    .player-tab:hover { color:#7a9aaa; }
    .player-tab.active { color:#fff; border-bottom-color:var(--red); text-shadow:0 0 14px rgba(255,70,85,.5); }
    .btn-overview {
      flex-shrink:0; margin-left:auto; padding:0 22px;
      background:none; border:none; border-bottom:3px solid transparent;
      color:#557788; font-family:'Noto Sans KR',sans-serif;
      font-size:.88rem; font-weight:700; cursor:pointer; white-space:nowrap;
      transition:color .2s; margin-bottom:-2px; letter-spacing:1px;
    }
    .btn-overview:hover { color:var(--teal); }

    /* main content area */
    .main-wrap {
      width:100%; max-width:1000px;
      padding:28px 20px 0;
      display:flex; flex-direction:column; gap:0;
    }

    /* ── ROLL button row ── */
    .roll-row {
      display:flex; align-items:center; justify-content:center; gap:16px;
      margin-bottom:28px;
    }
    .roll-btn {
      background:linear-gradient(135deg, #ff4655 0%, #c8001a 60%, #8b0010 100%);
      color:#fff; border:none;
      padding:16px 80px;
      font-family:'Rajdhani',sans-serif;
      font-size:1.6rem; font-weight:700; letter-spacing:8px; text-transform:uppercase;
      cursor:pointer;
      clip-path:polygon(18px 0%,100% 0%,calc(100% - 18px) 100%,0% 100%);
      transition:all .2s;
      box-shadow:0 4px 30px rgba(255,70,85,.5), 0 0 0 1px rgba(255,70,85,.25),
                 inset 0 1px 0 rgba(255,255,255,.1);
      position:relative; overflow:hidden;
    }
    .roll-btn::before {
      content:''; position:absolute; top:0; left:-120%; width:70%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
      transition:left .6s;
    }
    .roll-btn:not(:disabled):hover::before { left:150%; }
    .roll-btn:not(:disabled):hover {
      box-shadow:0 8px 50px rgba(255,70,85,.75),0 0 0 2px rgba(255,70,85,.5),
                 inset 0 1px 0 rgba(255,255,255,.12);
      transform:translateY(-3px) scale(1.03);
    }
    .roll-btn:active { transform:scale(.96) translateY(1px); }
    .roll-btn:disabled {
      background:linear-gradient(135deg,#1a2232,#111820);
      color:#2a3a4a; cursor:not-allowed; transform:none; box-shadow:none;
    }
    .btn-adjust {
      background:rgba(20,30,42,.9); border:1px solid var(--border); color:#6a8899;
      padding:8px 16px; font-family:'Noto Sans KR',sans-serif;
      font-size:.82rem; font-weight:700; border-radius:5px; cursor:pointer;
      transition:border-color .2s,color .2s;
    }
    .btn-adjust:hover { border-color:var(--teal); color:var(--teal); }

    /* ── reel rows ── */
    .reel-rows { display:flex; flex-direction:column; gap:14px; }

    .reel-row {
      display:flex; align-items:stretch; gap:0;
      background:linear-gradient(135deg,rgba(12,20,30,.95),rgba(8,14,22,.95));
      border:1px solid rgba(255,255,255,.06); border-radius:10px;
      overflow:hidden;
      box-shadow:0 2px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.03);
      transition:border-color .3s, box-shadow .3s;
    }
    .reel-row.spinning-row {
      border-color:rgba(255,70,85,.45);
      box-shadow:0 0 40px rgba(255,70,85,.18),0 2px 20px rgba(0,0,0,.4);
    }
    .reel-row.landed-row {
      border-color:rgba(255,70,85,.25);
      box-shadow:0 0 24px rgba(255,70,85,.1),0 2px 20px rgba(0,0,0,.4);
    }

    .reel-label {
      flex-shrink:0; width:72px;
      display:flex; align-items:center; justify-content:center;
      padding:0 8px;
      border-right:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.2);
    }
    .reel-label-text {
      font-size:.7rem; font-weight:700; letter-spacing:3px; text-transform:uppercase;
      color:#556677; writing-mode:horizontal-tb;
    }

    /* strip area */
    .reel-strip-wrap { flex:1; min-width:0; position:relative; }

    .roulette-outer {
      position:relative; width:100%; overflow:hidden;
      transition:none;
    }
    .roulette-outer.agent-h  { height:138px; }
    .roulette-outer.weapon-h { height:108px; }

    /* fade edges */
    .roulette-outer::before, .roulette-outer::after {
      content:''; position:absolute;
      top:0; bottom:0; width:100px; z-index:5; pointer-events:none;
    }
    .roulette-outer::before { left:0;  background:linear-gradient(to right, rgba(8,14,22,1), transparent); }
    .roulette-outer::after  { right:0; background:linear-gradient(to left,  rgba(8,14,22,1), transparent); }

    /* pointer */
    .pointer {
      position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%);
      width:2px;
      background:linear-gradient(180deg, transparent 0%, var(--red) 12%, var(--red) 88%, transparent 100%);
      z-index:10;
      box-shadow:0 0 10px var(--red),0 0 24px rgba(255,70,85,.5);
      animation:pointerPulse 1.6s ease-in-out infinite;
    }
    @keyframes pointerPulse {
      0%,100% { box-shadow:0 0 10px var(--red),0 0 24px rgba(255,70,85,.45); }
      50%      { box-shadow:0 0 18px var(--red),0 0 40px rgba(255,70,85,.75); }
    }
    .pointer::before, .pointer::after {
      content:''; position:absolute; left:50%; transform:translateX(-50%);
      border-left:8px solid transparent; border-right:8px solid transparent;
    }
    .pointer::before { top:0;    border-top:   14px solid var(--red); filter:drop-shadow(0 3px 6px rgba(255,70,85,.9)); }
    .pointer::after  { bottom:0; border-bottom:14px solid var(--red); filter:drop-shadow(0 -3px 6px rgba(255,70,85,.9)); }

    .roulette-track {
      display:flex; align-items:center;
      height:100%; will-change:transform;
      gap:8px; padding:0 4px;
    }

    /* cards */
    .face-card {
      flex-shrink:0; width:108px; height:108px;
      border-radius:8px; overflow:hidden;
      border:1px solid rgba(255,255,255,.07); background:var(--card);
      margin:auto 0; transition:border-color .1s,box-shadow .1s;
      transform-origin:center center;
    }
    .face-card img { width:100%; height:100%; object-fit:cover; display:block; }
    .weapon-card {
      flex-shrink:0; width:165px; height:82px;
      border-radius:8px; border:1px solid rgba(255,255,255,.07);
      background:var(--card); margin:auto 0;
      display:flex; align-items:center; justify-content:center;
      padding:6px 10px; transition:border-color .1s,box-shadow .1s;
      transform-origin:center center;
    }
    .weapon-card img {
      max-width:100%; max-height:100%; object-fit:contain;
      filter:drop-shadow(0 2px 8px rgba(0,0,0,.7));
    }
    .face-card.hl {
      border-color:rgba(255,70,85,.8);
      box-shadow:0 0 30px rgba(255,70,85,.7),0 0 60px rgba(255,70,85,.3);
    }
    .weapon-card.hl {
      border-color:rgba(0,209,217,.8);
      box-shadow:0 0 30px rgba(0,209,217,.7),0 0 60px rgba(0,209,217,.3);
    }

    /* inline result (right panel) */
    .reel-result {
      flex-shrink:0; width:180px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:8px; padding:12px 16px;
      border-left:1px solid rgba(255,255,255,.05);
      background:rgba(0,0,0,.15);
      min-height:100%;
    }
    .reel-result.agent-h { min-height:138px; }
    .reel-result.weapon-h { min-height:108px; }

    .rr-empty { color:#2a3a4a; font-size:.8rem; letter-spacing:2px; }
    .rr-face { width:64px; height:64px; border-radius:7px; object-fit:cover; border:2px solid var(--border); }
    .rr-weapon-img { max-width:140px; max-height:48px; object-fit:contain; filter:drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
    .rr-name {
      font-family:'Rajdhani',sans-serif; font-size:1.15rem; font-weight:700;
      letter-spacing:2px; color:#ddeeff; text-align:center;
    }
    .rr-reveal {
      opacity:0; transform:scale(.7) translateY(10px);
      transition:opacity .4s, transform .4s cubic-bezier(.22,.68,0,1.3);
    }
    .rr-reveal.vis { opacity:1; transform:scale(1) translateY(0); }

    /* ── big agent reveal (below reels) ── */
    .agent-reveal {
      display:flex; flex-direction:column; align-items:center;
      padding:36px 0 0;
      opacity:0; transform:translateY(30px) scale(.9);
      transition:opacity .8s, transform .8s cubic-bezier(.22,.68,0,1.2);
      pointer-events:none;
    }
    .agent-reveal.vis { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
    .agent-reveal-name {
      font-family:'Rajdhani',sans-serif;
      font-size:3.8rem; font-weight:700;
      letter-spacing:10px; text-transform:uppercase;
      color:#fff;
      text-shadow:0 0 40px rgba(255,70,85,.8), 0 0 80px rgba(255,70,85,.4), 0 2px 0 rgba(0,0,0,.5);
      margin-bottom:12px;
    }
    .agent-reveal-img-wrap {
      position:relative; max-width:400px; width:100%; height:400px;
      display:flex; align-items:flex-end; justify-content:center;
    }
    .agent-reveal-img-wrap::before {
      content:''; position:absolute; bottom:10%; left:50%; transform:translateX(-50%);
      width:260px; height:260px; border-radius:50%;
      background:radial-gradient(circle, rgba(255,70,85,.18) 0%, transparent 65%);
      filter:blur(30px);
    }
    .agent-reveal-img-wrap img {
      max-height:100%; max-width:100%; object-fit:contain;
      filter:drop-shadow(0 12px 50px rgba(255,70,85,.6)) drop-shadow(0 0 100px rgba(255,70,85,.2));
      position:relative; z-index:1;
    }
    .reveal-glow-line {
      width:60%; height:2px;
      background:linear-gradient(90deg,transparent,var(--red),transparent);
      box-shadow:0 0 20px var(--red);
      margin-top:4px;
    }

    /* ── flash overlay ── */
    .result-flash {
      position:fixed; inset:0;
      background:radial-gradient(ellipse at center, rgba(255,70,85,.22) 0%, transparent 65%);
      pointer-events:none; z-index:50; opacity:0;
    }
    .result-flash.pop { animation:flashPop .8s ease-out forwards; }
    @keyframes flashPop {
      0%   { opacity:1; transform:scale(.7); }
      35%  { opacity:.8; transform:scale(1.15); }
      100% { opacity:0; transform:scale(1.6); }
    }

    /* ════════ OVERVIEW MODAL ════════ */
    #overview-modal {
      position:fixed; inset:0; background:rgba(0,0,0,.9); backdrop-filter:blur(5px);
      display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
    }
    #overview-modal.open { display:flex; }
    .ov-box {
      background:var(--dark); border:2px solid var(--border); border-radius:10px;
      width:100%; max-width:860px; max-height:90vh;
      display:flex; flex-direction:column; overflow:hidden;
    }
    .ov-head {
      padding:16px 22px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .ov-head h3 { font-size:1rem; font-weight:700; letter-spacing:3px; color:#dde; text-transform:uppercase; }
    .btn-ov-close {
      background:none; border:1px solid var(--border); color:#8899aa; padding:5px 14px;
      font-family:'Noto Sans KR',sans-serif; font-size:.82rem; font-weight:700;
      border-radius:4px; cursor:pointer; transition:border-color .15s,color .15s;
    }
    .btn-ov-close:hover { border-color:var(--red); color:var(--red); }
    .ov-body { flex:1; min-height:0; overflow-y:auto; padding:20px; }
    .ov-body::-webkit-scrollbar { width:6px; }
    .ov-body::-webkit-scrollbar-track { background:var(--darker); }
    .ov-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    .ov-table { width:100%; border-collapse:collapse; }
    .ov-table th {
      font-size:.72rem; font-weight:700; letter-spacing:3px; text-transform:uppercase;
      color:#445566; text-align:left; padding:0 14px 12px;
    }
    .ov-table th:first-child { width:130px; }
    .ov-table tr+tr td { border-top:1px solid var(--border); }
    .ov-table td { padding:12px 14px; vertical-align:middle; }
    .ov-player-name { font-size:1rem; font-weight:700; color:#ccdde; letter-spacing:1px; }
    .ov-cell { display:flex; align-items:center; gap:10px; }
    .ov-face { width:44px; height:44px; border-radius:5px; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
    .ov-weapon-img { max-width:100px; max-height:38px; object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,.5)); flex-shrink:0; }
    .ov-item-name { font-size:.9rem; font-weight:700; color:#ddeeff; letter-spacing:1px; }
    .ov-empty { color:#2a3a4a; font-size:.85rem; letter-spacing:1px; }

    /* ════════ AGENT MODAL ════════ */
    #agent-modal {
      position:fixed; inset:0; background:rgba(0,0,0,.9); backdrop-filter:blur(4px);
      display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
    }
    #agent-modal.open { display:flex; }
    .modal-box {
      background:var(--dark); border:2px solid var(--border); border-radius:10px;
      width:100%; max-width:760px; max-height:88vh;
      display:flex; flex-direction:column; overflow:hidden;
    }
    .modal-head {
      padding:18px 22px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .modal-head h3 { font-size:1rem; font-weight:700; letter-spacing:2px; color:#dde; }
    .modal-head-actions { display:flex; gap:8px; }
    .btn-select-all, .btn-deselect-all {
      background:var(--card); border:1px solid var(--border); color:#aabbcc;
      padding:5px 12px; font-family:'Noto Sans KR',sans-serif;
      font-size:.78rem; font-weight:700; border-radius:4px; cursor:pointer;
      transition:border-color .15s,color .15s;
    }
    .btn-select-all:hover  { border-color:var(--teal); color:var(--teal); }
    .btn-deselect-all:hover{ border-color:var(--red);  color:var(--red); }
    .modal-grid {

/* ═══════════════════ Audio ═══════════════════ */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTick(speed) {
  // speed: 0(fast)~1(slow) — 순수 사인파 클릭, 노이즈 없음
  try {
    const ctx  = getAudioCtx();
    const now  = ctx.currentTime;
    const freq = 900 - speed * 400; // 빠를수록 고음
    const vol  = 0.05 + speed * 0.18;

    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.045);
  } catch(e) {}
}

function playLand() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // 낮은 펀치 톤 (80hz)
    const osc1 = ctx.createOscillator();
    const g1   = ctx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(120, now);
    osc1.frequency.exponentialRampToValueAtTime(55, now + 0.25);
    g1.gain.setValueAtTime(0.7, now);
    g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    osc1.connect(g1); g1.connect(ctx.destination);
    osc1.start(now); osc1.stop(now + 0.38);

    // 살짝 높은 어택 톤 (300hz)
    const osc2 = ctx.createOscillator();
    const g2   = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = 300;
    g2.gain.setValueAtTime(0.25, now);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    osc2.connect(g2); g2.connect(ctx.destination);
    osc2.start(now); osc2.stop(now + 0.14);
  } catch(e) {}
}

function playWin() {
  try {
    const ctx = getAudioCtx();
    // 짧은 상승 아르페지오
    const freqs = [440, 554, 659, 880];
    freqs.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.4);
    });
  } catch(e) {}
}

/* ═══════════════════ Particles ═══════════════════ */
function spawnParticles(outerEl) {
  const rect = outerEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['', 'teal', 'gold', '', 'teal'];
  for (let i = 0; i < 14; i++) {
    const pt = document.createElement('div');
    pt.className = 'pt ' + colors[i % colors.length];
    const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
    const dist  = 35 + Math.random() * 70;
    pt.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
    pt.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
    pt.style.left = cx + 'px';
    pt.style.top  = cy + 'px';
    document.body.appendChild(pt);
    pt.addEventListener('animationend', () => pt.remove());
  }
}

/* ═══════════════════ Roulette engine ═══════════════════ */
function spinEase(t) {
  if (t < 0.72) {
    return (1 - Math.pow(1 - t / 0.72, 2.8)) * 0.87;
  } else {
    const s = (t - 0.72) / 0.28;
    return 0.87 + (1 - Math.pow(1 - s, 5)) * 0.13;
  }
}

function buildTrack(trackEl, items, winnerPos, winnerName, buildCard) {
  trackEl.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const name = (i === winnerPos) ? winnerName : items[Math.floor(Math.random() * items.length)];
    trackEl.appendChild(buildCard(name));
  }
}

function faceCard(name) {
  const d = document.createElement('div'); d.className = 'face-card';
  const img = document.createElement('img');
  img.src = `assets/valorant-roulette-agent-face/${name}_face.webp`; img.alt = name;
  d.appendChild(img); return d;
}
function weaponCard(name) {
  const d = document.createElement('div'); d.className = 'weapon-card';
  const img = document.createElement('img');
  img.src = `assets/valorant-roulette-weapon/${name}.webp`; img.alt = name;
  d.appendChild(img); return d;
}

function spinReel({ trackEl, outerEl, rowEl, items, cardClass, buildCard, dur, onResult }) {
  if (!items || items.length === 0) { onResult && onResult(null); return; }
  const winnerName = items[Math.floor(Math.random() * items.length)];
  const winnerPos  = 45;

  buildTrack(trackEl, items, winnerPos, winnerName, buildCard);
  trackEl.style.transform = 'translateX(0px)';
  rowEl.classList.add('spinning-row');

  requestAnimationFrame(() => {
    const cards     = trackEl.querySelectorAll('.' + cardClass);
    const outerRect = outerEl.getBoundingClientRect();
    const c0Rect    = cards[0].getBoundingClientRect();
    const c1Rect    = cards[1] ? cards[1].getBoundingClientRect() : null;
    const stride    = c1Rect ? (c1Rect.left - c0Rect.left) : (c0Rect.width + 8);
    const cardW     = c0Rect.width;
    const outerW    = outerRect.width;
    const card0Left = c0Rect.left - outerRect.left;
    const total     = card0Left + winnerPos * stride + cardW / 2 - outerW / 2;

    // ── 랜딩 타입 랜덤 결정 ──
    const roll = Math.random();
    let finaleExtra, finaleDur;
    if (roll < 0.3) {
      // short: 살짝 못 미치고 기어서 정착
      finaleExtra = -stride * (0.3 + Math.random() * 0.5);
      finaleDur   = 350 + Math.random() * 250;
    } else if (roll < 0.65) {
      // long: 조금 지나쳐서 돌아옴
      finaleExtra = stride * (0.5 + Math.random() * 1.0);
      finaleDur   = 600 + Math.random() * 400;
    } else {
      // reverse: 크게 지나쳐서 반대 방향으로 되돌아옴
      finaleExtra = stride * (1.8 + Math.random() * 1.6);
      finaleDur   = 950 + Math.random() * 500;
    }
    const mainStop = total + finaleExtra; // 1페이즈 종착점

    function updateCards(cur) {
      const pointerX = outerW / 2;
      const idx = Math.round((cur - card0Left + pointerX - cardW / 2) / stride);
      cards.forEach((c, i) => {
        const cx = card0Left + i * stride + cardW / 2 - cur;
        const dist = Math.abs(cx - pointerX);
        const sc = Math.max(0.72, 1 - dist / outerW * 0.55);
        const op = Math.max(0.35, 1 - dist / outerW * 0.9);
        c.style.transform = `scale(${sc.toFixed(3)})`;
        c.style.opacity   = op.toFixed(3);
        c.classList.toggle('hl', i === idx);
      });
      return Math.round((cur - card0Left + outerW / 2 - cardW / 2) / stride);
    }

    let start = null, lastHlIdx = -1;

    // ── 1페이즈: mainStop까지 메인 스핀 ──
    (function step(ts) {
      if (!start) start = ts;
      const t   = Math.min((ts - start) / dur, 1);
      const cur = spinEase(t) * mainStop;
      trackEl.style.transform = `translateX(-${cur}px)`;

      const idx = updateCards(cur);
      if (idx !== lastHlIdx) { lastHlIdx = idx; playTick(t); }

      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        // ── 2페이즈: total로 settle ──
        let start2 = null, lastHlIdx2 = -1;
        (function settle(ts2) {
          if (!start2) start2 = ts2;
          const s    = Math.min((ts2 - start2) / finaleDur, 1);
          const ease = 1 - Math.pow(1 - s, 3.5);
          const cur2 = mainStop + (total - mainStop) * ease;
          trackEl.style.transform = `translateX(-${cur2}px)`;

          const idx2 = updateCards(cur2);
          if (idx2 !== lastHlIdx2) {
            lastHlIdx2 = idx2;
            playTick(0.85 + s * 0.15); // settle 구간은 느린 소리
          }

          if (s < 1) {
            requestAnimationFrame(settle);
          } else {
            rowEl.classList.remove('spinning-row');
            rowEl.classList.add('landed-row');
            spawnParticles(outerEl);
            playLand();
            onResult(winnerName);
          }
        })(performance.now());
      }
    })(performance.now());
  });
}

/* ═══════════════════ ROLL ALL ═══════════════════ */
const rollBtn = document.getElementById('rollBtn');

function rollAll() {
  if (isRolling) return;
  isRolling = true;
  rollBtn.disabled = true;
  rollBtn.textContent = 'ROLLING...';

  players[curPlayer].results = { agent: null, pistol: null, primary: null };
  resetAllDisplays();

  // 감도 모드 전용
  if (gameMode === 'sensitivity') {
    document.getElementById('sensReveal').classList.remove('vis');
    document.getElementById('rrSens').innerHTML = '<span class="rr-empty">뽑는 중...</span>';
    document.getElementById('rowSens').classList.remove('landed-row','spinning-row');
    spinReel({
      trackEl:   document.getElementById('sensTrack'),
      outerEl:   document.getElementById('sensOuter'),
      rowEl:     document.getElementById('rowSens'),
      items:     SENSITIVITIES,
      cardClass: 'sens-card',
      buildCard: sensitivityCard,
      dur:       5500,
      onResult(key) {
        players[curPlayer].results.sensitivity = key;
        showInlineSensitivity(key);
        showSensitivityReveal(key);
        triggerFlash();
        playWin();
        setTimeout(() => { isRolling = false; rollBtn.disabled = false; rollBtn.textContent = 'ROLL'; }, 600);
      }
    });
    return;
  }

  // 조준점 모드 전용
  if (gameMode === 'crosshair') {
    document.getElementById('chReveal').classList.remove('vis');
    document.getElementById('rrCrosshair').innerHTML = '<span class="rr-empty">뽑는 중...</span>';
    document.getElementById('rowCrosshair').classList.remove('landed-row','spinning-row');
    spinReel({
      trackEl:   document.getElementById('crosshairTrack'),
      outerEl:   document.getElementById('crosshairOuter'),
      rowEl:     document.getElementById('rowCrosshair'),
      items:     CROSSHAIRS,
      cardClass: 'crosshair-card',
      buildCard: crosshairCard,
      dur:       5500,
      onResult(name) {
        players[curPlayer].results.crosshair = name;
        showInlineCrosshair(name);
        showCrosshairReveal(name);
        triggerFlash();
        playWin();
        setTimeout(() => { isRolling = false; rollBtn.disabled = false; rollBtn.textContent = 'ROLL'; }, 600);
      }
    });
    return;
  }

  const pool = [...players[curPlayer].agentPool];
  if (pool.length === 0) {
    isRolling = false; rollBtn.disabled = false; rollBtn.textContent = 'ROLL'; return;
  }

  function allDone() {
    document.body.classList.add('shake');
    document.body.addEventListener('animationend', () => document.body.classList.remove('shake'), { once: true });
    triggerFlash();
    playWin();
    const agent = players[curPlayer].results.agent;
    if (agent) showAgentReveal(agent);
    setTimeout(() => {
      isRolling = false;
      rollBtn.disabled = false;
      rollBtn.textContent = 'ROLL';
    }, 600);
  }

  // 1. Agent
  spinReel({
    trackEl: document.getElementById('agentTrack'),
    outerEl: document.getElementById('agentOuter'),
    rowEl:   document.getElementById('rowAgent'),
    items: pool, cardClass: 'face-card', buildCard: faceCard,
    dur: 5500,
    onResult(name) {
      players[curPlayer].results.agent = name;
      showInlineAgent(name);

      if (gameMode === 'agent') {
        allDone();
        return;
      }

      // 2. Pistol (600ms 후 시작)
      setTimeout(() => {
        spinReel({
          trackEl: document.getElementById('pistolTrack'),
          outerEl: document.getElementById('pistolOuter'),
          rowEl:   document.getElementById('rowPistol'),
          items: PISTOLS, cardClass: 'weapon-card', buildCard: weaponCard,
          dur: 5000,
          onResult(pName) {
            players[curPlayer].results.pistol = pName;
            showInlineWeapon('Pistol', pName);

            // 3. Primary (600ms 후 시작)
            setTimeout(() => {
              spinReel({
                trackEl: document.getElementById('primaryTrack'),
                outerEl: document.getElementById('primaryOuter'),
                rowEl:   document.getElementById('rowPrimary'),
                items: PRIMARIES, cardClass: 'weapon-card', buildCard: weaponCard,
                dur: 5000,
                onResult(rName) {
                  players[curPlayer].results.primary = rName;
                  showInlineWeapon('Primary', rName);
                  allDone();
                }
              });
            }, 600);
          }
        });
      }, 600);
    }
  });
}

    const piTd = document.createElement('td');
    piTd.innerHTML = r.pistol
      ? `<div class="ov-cell"><img class="ov-weapon-img" src="assets/valorant-roulette-weapon/${r.pistol}.webp" /><span class="ov-item-name">${WEAPON_KO[r.pistol]}</span></div>`
      : '<span class="ov-empty">미정</span>';
    const prTd = document.createElement('td');
    prTd.innerHTML = r.primary
      ? `<div class="ov-cell"><img class="ov-weapon-img" src="assets/valorant-roulette-weapon/${r.primary}.webp" /><span class="ov-item-name">${WEAPON_KO[r.primary]}</span></div>`
      : '<span class="ov-empty">미정</span>';
    tr.appendChild(agTd); tr.appendChild(piTd); tr.appendChild(prTd);
    tbody.appendChild(tr);
  });
  overviewModal.classList.add('open');
}

/* ═══════════════════ Agent modal ═══════════════════ */
const agentModal = document.getElementById('agent-modal');
document.getElementById('adjustBtn').addEventListener('click', () => {
  document.getElementById('modalTitle').textContent = `${players[curPlayer].name} — 요원 선택`;
  renderModal();
  agentModal.classList.add('open');
});
document.getElementById('modalDoneBtn').addEventListener('click', () => agentModal.classList.remove('open'));
document.getElementById('btnSelectAll').addEventListener('click', () => {
  players[curPlayer].agentPool = new Set(AGENTS); renderModal();
});
document.getElementById('btnDeselectAll').addEventListener('click', () => {
  players[curPlayer].agentPool = new Set(); renderModal();
});
agentModal.addEventListener('click', e => { if (e.target === agentModal) agentModal.classList.remove('open'); });

function renderModal() {
  const pool = players[curPlayer].agentPool;
  const grid = document.getElementById('modalGrid');
  grid.innerHTML = '';
  AGENTS.forEach(name => {
    const div = document.createElement('div');
    div.className = 'agent-toggle' + (pool.has(name) ? '' : ' off');
    div.innerHTML = `
      <img src="assets/valorant-roulette-agent-face/${name}_face.webp" alt="${AGENT_KO[name]}" />
      <div class="ag-name">${AGENT_KO[name]}</div>
      <div class="ag-off">✕</div>`;
    div.addEventListener('click', () => {
      if (pool.has(name)) pool.delete(name); else pool.add(name);
      div.classList.toggle('off', !pool.has(name));
    });
    grid.appendChild(div);
  });
}

/* ═══════════════════ Crosshair Roulette ═══════════════════ */
function crosshairCard(name) {
  const d = document.createElement('div'); d.className = 'crosshair-card';
  const img = document.createElement('img');
  img.src = `assets/valorant-roulette-crosshair/${name}.png`; img.alt = name;
  d.appendChild(img); return d;
}

function showInlineCrosshair(name) {
  const rr = document.getElementById('rrCrosshair');
  const data = CROSSHAIR_DATA[name];
  rr.innerHTML = `
    <img class="ch-reel-img" src="assets/valorant-roulette-crosshair/${name}.png" alt="" />
    <div class="ch-reel-name">${data.ko}</div>`;
  requestAnimationFrame(() => {
    rr.querySelector('.ch-reel-img').classList.add('vis');
    rr.querySelector('.ch-reel-name').classList.add('vis');
  });
}

function showCrosshairReveal(name) {
  const data = CROSSHAIR_DATA[name];
  document.getElementById('chRevealName').textContent = data.ko;
  document.getElementById('chRevealImg').src = `assets/valorant-roulette-crosshair/${name}.png`;
  document.getElementById('chCodeText').textContent = data.code;
  const rev = document.getElementById('chReveal');
  rev.classList.remove('vis');
  requestAnimationFrame(() => setTimeout(() => rev.classList.add('vis'), 80));
}

// 복사 버튼
document.getElementById('chCopyBtn').addEventListener('click', () => {
  const code = document.getElementById('chCodeText').textContent;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('chCopyBtn');
    btn.textContent = '복사됨!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
  });
});

/* ═══════════════════ Sensitivity Roulette ═══════════════════ */
function sensitivityCard(key) {
  const d = document.createElement('div'); d.className = 'sens-card';
  const data = SENSITIVITY_DATA[key];
  if (data.hasImg) {
    const img = document.createElement('img');
    img.src = `assets/valorant-roulette-sensitivity/${key}.webp`; img.alt = key;
    d.appendChild(img);
  } else {
    const t = document.createElement('div'); t.className = 'sens-card-text';
    t.innerHTML = data.ko + '<br>' + data.dpi + ' DPI<br>' + data.sens;
    d.appendChild(t);
  }
  return d;
}

function showInlineSensitivity(key) {
  const rr   = document.getElementById('rrSens');
  const data = SENSITIVITY_DATA[key];
  if (data.hasImg) {
    rr.innerHTML = `
      <img class="sens-reel-img" src="assets/valorant-roulette-sensitivity/${key}.webp" alt="" />
      <div class="sens-reel-name">${data.ko}</div>
      <div class="sens-reel-info">${data.dpi} DPI · ${data.sens}</div>`;
  } else {
    rr.innerHTML = `
      <div class="sens-reel-name">${data.ko}</div>
      <div class="sens-reel-info">${data.dpi} DPI · ${data.sens}</div>`;
  }
  requestAnimationFrame(() => {
    rr.querySelectorAll('.sens-reel-img,.sens-reel-name,.sens-reel-info').forEach(el => el.classList.add('vis'));
  });
}

function showSensitivityReveal(key) {
  _sensPopupKey = key;
  const data = SENSITIVITY_DATA[key];
  document.getElementById('sensRevealTitle').textContent = data.ko + ' 감도';
  const wrap = document.getElementById('sensRevealImgWrap');
  if (data.hasImg) {
    wrap.className = 'sens-reveal-img-wrap';
    wrap.innerHTML = `<img src="assets/valorant-roulette-sensitivity/${key}.webp" alt="${data.ko}" />`;
  } else {
    wrap.className = 'sens-reveal-noimg';
    wrap.textContent = data.ko;
  }
  document.getElementById('sensRevealInfo').textContent = `${data.dpi} DPI  ·  ${data.sens}`;
  const rev = document.getElementById('sensReveal');
  rev.classList.remove('vis');
  requestAnimationFrame(() => setTimeout(() => rev.classList.add('vis'), 80));
}

// DPI 팝업
let _sensPopupKey = null;
document.getElementById('sensDetailBtn').addEventListener('click', () => {
  if (!_sensPopupKey) return;
  openDpiPopup(_sensPopupKey);
});
document.getElementById('dpiPopupClose').addEventListener('click', () => {
  document.getElementById('dpiPopup').classList.remove('open');
});
document.getElementById('dpiPopup').addEventListener('click', e => {
  if (e.target === document.getElementById('dpiPopup'))
    document.getElementById('dpiPopup').classList.remove('open');
});

function openDpiPopup(key) {
  const data  = SENSITIVITY_DATA[key];
  const eDPI  = data.dpi * data.sens;
  const dpis  = [400, 800, 1600];
  document.getElementById('dpiPopupTitle').textContent = data.ko + ' 감도';
  const rows  = document.getElementById('dpiPopupRows');
  rows.innerHTML = '';
  dpis.forEach(d => {
    const sens = parseFloat((eDPI / d).toFixed(3));
    const row  = document.createElement('div');
    row.className = 'dpi-popup-row' + (d === data.dpi ? ' active-dpi' : '');
    row.innerHTML = `<span class="dpi-popup-dpi">${d} DPI</span><span class="dpi-popup-sens">${sens}</span>`;
    rows.appendChild(row);
  });
  document.getElementById('dpiPopup').classList.add('open');
}

/* ═══════════════════ Map Roulette ═══════════════════ */
let mapPool     = new Set(MAPS);
let mapSpinning = false;

function openMapModal() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('map-screen').style.display  = 'flex';
  document.getElementById('mapReelRow').classList.remove('landed-row','spinning-row');
  document.getElementById('mapReelResult').innerHTML = '<span class="map-result-empty">대기 중...</span>';
  document.getElementById('mapTrack').innerHTML = '';
}

document.getElementById('mapBackBtn').addEventListener('click', () => {
  document.getElementById('map-screen').style.display  = 'none';
  document.getElementById('main-screen').style.display = 'flex';
});

// 맵 조정 모달
const mapAdjModal = document.getElementById('map-adjust-modal');
document.getElementById('mapAdjustBtn').addEventListener('click', () => {
  renderMapToggles(); mapAdjModal.classList.add('open');
});
document.getElementById('mapModalDoneBtn').addEventListener('click', () => mapAdjModal.classList.remove('open'));
mapAdjModal.addEventListener('click', e => { if (e.target === mapAdjModal) mapAdjModal.classList.remove('open'); });
document.getElementById('btnMapSelectAll').addEventListener('click', () => {
  mapPool = new Set(MAPS); renderMapToggles();
});
document.getElementById('btnMapDeselectAll').addEventListener('click', () => {
  mapPool = new Set(); renderMapToggles();
});

function renderMapToggles() {
  const grid = document.getElementById('mapToggleGrid');
  grid.innerHTML = '';
  MAPS.forEach(name => {
    const div = document.createElement('div');
    div.className = 'map-toggle' + (mapPool.has(name) ? '' : ' off');
    div.innerHTML = `
      <img src="assets/valorant-roulette-map/${name}.webp" alt="${MAP_KO[name]}" />
      <div class="mt-name">${MAP_KO[name]}</div>
      <div class="mt-off">✕</div>`;
    div.addEventListener('click', () => {
      if (mapPool.has(name)) mapPool.delete(name); else mapPool.add(name);
      div.classList.toggle('off', !mapPool.has(name));
    });
    grid.appendChild(div);
  });
}

function mapCard(name) {
  const d = document.createElement('div'); d.className = 'map-card';
  d.innerHTML = `
    <img src="assets/valorant-roulette-map/${name}.webp" alt="${MAP_KO[name]}" />
    <div class="mc-name">${MAP_KO[name]}</div>`;
  return d;
}

document.getElementById('mapSpinBtn').addEventListener('click', () => {
  if (mapSpinning) return;
  const pool = [...mapPool];
  if (pool.length === 0) return;
  mapSpinning = true;
  const btn = document.getElementById('mapSpinBtn');
  btn.disabled = true;
  document.getElementById('mapReelRow').classList.remove('landed-row');
  document.getElementById('mapReelResult').innerHTML = '<span class="map-result-empty">뽑는 중...</span>';

  spinReel({
    trackEl:   document.getElementById('mapTrack'),
    outerEl:   document.getElementById('mapOuter'),
    rowEl:     document.getElementById('mapReelRow'),
    items:     pool,
    cardClass: 'map-card',
    buildCard: mapCard,
    dur:       5500,
    onResult(name) {
      const rr = document.getElementById('mapReelResult');
      rr.innerHTML = `
        <img class="map-result-img" src="assets/valorant-roulette-map/${name}.webp" alt="" />
        <div class="map-result-name">${MAP_KO[name]}</div>`;
      requestAnimationFrame(() => {
        rr.querySelector('.map-result-img').classList.add('vis');
        rr.querySelector('.map-result-name').classList.add('vis');
      });
      triggerFlash();
      playWin();
      setTimeout(() => { mapSpinning = false; btn.disabled = false; }, 600);
    }
  });
});
</script>
