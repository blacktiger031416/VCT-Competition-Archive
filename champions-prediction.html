<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>챔피언스 승부 예측 · VCT Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans KR", system-ui, sans-serif;
      color: #f0f0f0;
      background:
        linear-gradient(130deg, rgba(255,30,60,0.08), transparent 38%),
        linear-gradient(250deg, rgba(255,160,0,0.07), transparent 34%),
        #080808;
      min-height: 100vh;
    }
    body::before {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; content: "";
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 80%);
    }

    /* ── Header ── */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 10px;
      padding: 0 24px; height: 52px;
      background: rgba(8,8,8,.88);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .site-header .auth-header-btn { margin-left: auto !important; }
    .back-link { color:rgba(255,255,255,.38); font-size:13px; font-weight:500; text-decoration:none; transition:color .15s; flex-shrink:0; }
    .back-link:hover { color:rgba(255,255,255,.8); }
    .header-sep { color:rgba(255,255,255,.13); font-size:14px; flex-shrink:0; }
    .header-title { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:900; color:#ff3c5a; letter-spacing:.06em; text-transform:uppercase; flex-shrink:0; }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 72px 20px 56px;
    }
    .hero-eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
      color: #ff3c5a; margin-bottom: 14px;
    }
    .hero-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(42px, 8vw, 86px); font-weight: 900;
      text-transform: uppercase; letter-spacing: .04em; line-height: .95;
      color: #fff; margin-bottom: 20px;
    }
    .hero-title span { color: #ff3c5a; }
    .hero-desc {
      font-size: 14px; line-height: 1.75; color: rgba(255,255,255,.42);
      max-width: 420px; margin: 0 auto; word-break: keep-all;
    }

    /* ── Coming soon ── */
    .coming-wrap {
      max-width: 560px; margin: 0 auto 96px;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
      padding: 0 20px;
    }
    .coming-card {
      width: 100%;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,60,90,.18);
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
    }
    .coming-icon { font-size: 48px; margin-bottom: 16px; }
    .coming-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
      color: #fff; margin-bottom: 10px;
    }
    .coming-sub {
      font-size: 13px; color: rgba(255,255,255,.38); line-height: 1.7; word-break: keep-all;
    }
  </style>
  <script src="./auth.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="./index.html">← 홈</a>
    <span class="header-sep">/</span>
    <span class="header-title">Champions 승부 예측</span>
  </header>

  <div class="hero">
    <p class="hero-eyebrow">VCT Champions 2026</p>
    <h1 class="hero-title">챔피언스<br><span>승부 예측</span></h1>
    <p class="hero-desc">VCT Champions 2026의 경기 결과를 예측하고 코인을 획득하세요. 페이지 준비 중입니다.</p>
  </div>

  <div class="coming-wrap">
    <div class="coming-card">
      <div class="coming-icon">🏆</div>
      <div class="coming-title">Coming Soon</div>
      <div class="coming-sub">챔피언스 승부 예측 페이지가 곧 오픈됩니다.<br>조금만 기다려주세요!</div>
    </div>
  </div>
</body>
</html>
