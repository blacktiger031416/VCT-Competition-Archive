<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>챔피언스 승부 예측 · VCT Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,900;1,900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #ff3c5a;
      --accent2: #ffc840;
      --bg: #060a0e;
      --bg-card: #0d1318;
      --bg-card2: #121a22;
    }

    body {
      font-family: "Noto Sans KR", system-ui, sans-serif;
      color: #f0f0f0;
      background: var(--bg);
      min-height: 100vh;
    }
    body::before {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; content: "";
      background:
        radial-gradient(ellipse 70% 50% at 15% 0%, rgba(255,40,70,.07), transparent),
        radial-gradient(ellipse 50% 60% at 85% 100%, rgba(255,200,60,.05), transparent);
    }

    /* ── Header ── */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 10px;
      padding: 0 24px; height: 52px;
      background: rgba(6,10,14,.9);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .site-header .auth-header-btn { margin-left: auto !important; }
    .back-link { color:rgba(255,255,255,.35); font-size:13px; font-weight:500; text-decoration:none; transition:color .15s; flex-shrink:0; }
    .back-link:hover { color:rgba(255,255,255,.8); }
    .header-sep { color:rgba(255,255,255,.12); font-size:14px; flex-shrink:0; }
    .header-title { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:900; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; flex-shrink:0; }

    /* ── Coming Soon (non-admin) ── */
    #coming-soon { display:none; }
    .cs-wrap {
      max-width: 520px; margin: 80px auto 0;
      padding: 0 20px; text-align: center;
    }
    .cs-icon { font-size: 56px; margin-bottom: 20px; }
    .cs-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(36px, 7vw, 72px); font-weight: 900;
      text-transform: uppercase; letter-spacing: .04em; line-height: .95;
      color: #fff; margin-bottom: 18px;
    }
    .cs-title em { color: var(--accent); font-style: normal; }
    .cs-sub { font-size: 14px; color: rgba(255,255,255,.38); line-height: 1.75; word-break: keep-all; }
    .cs-card {
      margin-top: 36px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,60,90,.15);
      border-radius: 12px; padding: 36px 28px;
    }
    .cs-card-icon { font-size: 40px; margin-bottom: 12px; }
    .cs-card-title { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:#fff; margin-bottom:8px; }
    .cs-card-sub { font-size:13px; color:rgba(255,255,255,.35); line-height:1.7; word-break:keep-all; }

    /* ── Main (admin) ── */
    #main-content { display:none; }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 0 32px; background: rgba(6,10,14,.7);
      position: sticky; top: 52px; z-index: 90;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .tab-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.35); background: none; border: none;
      padding: 0 20px; height: 44px; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:hover { color: rgba(255,255,255,.7); }
    .tab-btn.active { color: #fff; border-bottom-color: var(--accent); }

    /* ── Tab panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Group Stage layout ── */
    .gs-wrap { max-width: 1100px; margin: 0 auto; padding: 36px 24px 96px; }

    .gs-section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(255,255,255,.3); margin-bottom: 14px;
    }

    /* ── 8 Selection Slots ── */
    .slots-area { margin-bottom: 48px; }
    .slots-header {
      display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px;
    }
    .slots-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
      color: #fff;
    }
    .slots-count {
      font-size: 13px; font-weight: 700; color: rgba(255,255,255,.3);
    }
    .slots-count span { color: var(--accent2); }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
    }
    @media (max-width: 800px) {
      .slots-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 480px) {
      .slots-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    }

    /* ── 슬롯 ── */
    .slot {
      aspect-ratio: 3/4;
      background: rgba(255,255,255,.03);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; overflow: hidden;
      transition: border-color .2s, background .2s, transform .15s, box-shadow .2s;
      user-select: none;
    }
    .slot::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.55) 100%);
      z-index: 1; pointer-events: none;
    }
    /* 스캔라인 */
    .slot::after {
      content: ''; position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--slot-color, #ff3c5a), transparent);
      opacity: 0; z-index: 4; pointer-events: none;
      top: -10%;
    }
    .slot.scanning::after {
      animation: scanSlot .55s ease-in forwards;
    }
    @keyframes scanSlot {
      0%   { top: -10%; opacity: .9; }
      80%  { top: 110%; opacity: .7; }
      100% { top: 110%; opacity: 0; }
    }

    .slot:hover:not(.filled):not(.removing) {
      border-color: rgba(255,255,255,.22);
      background: rgba(255,255,255,.05);
    }
    .slot.filled {
      border-color: color-mix(in srgb, var(--slot-color, #ff3c5a) 60%, transparent);
      background: color-mix(in srgb, var(--slot-color, #ff3c5a) 8%, transparent);
      box-shadow: 0 0 20px color-mix(in srgb, var(--slot-color, #ff3c5a) 15%, transparent),
                  inset 0 0 0 1px color-mix(in srgb, var(--slot-color, #ff3c5a) 25%, transparent);
    }
    .slot.filled:hover {
      border-color: color-mix(in srgb, var(--slot-color, #ff3c5a) 90%, transparent);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px color-mix(in srgb, var(--slot-color, #ff3c5a) 28%, transparent),
                  inset 0 0 0 1px color-mix(in srgb, var(--slot-color, #ff3c5a) 45%, transparent);
    }

    /* 슬롯 등장 애니메이션 */
    @keyframes slotAppear {
      0%   { transform: scale(.7) translateY(12px); opacity: 0;
             box-shadow: 0 0 60px color-mix(in srgb, var(--slot-color, #ff3c5a) 80%, transparent); }
      55%  { transform: scale(1.06) translateY(-3px); opacity: 1;
             box-shadow: 0 0 40px color-mix(in srgb, var(--slot-color, #ff3c5a) 50%, transparent); }
      78%  { transform: scale(.97) translateY(1px); }
      100% { transform: scale(1) translateY(0); opacity: 1;
             box-shadow: 0 0 20px color-mix(in srgb, var(--slot-color, #ff3c5a) 15%, transparent); }
    }
    .slot.appear {
      animation: slotAppear .45s cubic-bezier(.22,1,.36,1) forwards;
    }

    /* 슬롯 제거 애니메이션 */
    @keyframes slotRemove {
      0%   { transform: scale(1); opacity: 1; filter: brightness(1); }
      30%  { transform: scale(1.05); filter: brightness(1.8); }
      100% { transform: scale(.5) translateY(10px); opacity: 0; filter: brightness(0); }
    }
    .slot.removing {
      animation: slotRemove .3s ease-in forwards;
      pointer-events: none;
    }

    /* 카드 선택 flash */
    @keyframes cardFlash {
      0%   { transform: scale(1); box-shadow: none; }
      25%  { transform: scale(1.04); box-shadow: 0 0 0 2px var(--tc, #ff3c5a), 0 0 20px var(--tc, #ff3c5a); }
      60%  { transform: scale(.97); box-shadow: 0 0 0 1px var(--tc, #ff3c5a); }
      100% { transform: scale(1); box-shadow: none; }
    }
    .team-card.picking {
      animation: cardFlash .35s ease forwards;
      pointer-events: none;
    }

    /* 빈 슬롯 pulse (선택 대기 중) */
    @keyframes slotPulse {
      0%, 100% { border-color: rgba(255,255,255,.1); }
      50%       { border-color: rgba(255,255,255,.28); }
    }
    .slot.pulse { animation: slotPulse .7s ease-in-out 3; }

    /* empty slot content */
    .slot-empty-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px; font-weight: 900; color: rgba(255,255,255,.08);
      z-index: 2;
    }
    .slot-empty-line {
      font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.12); z-index: 2; margin-top: 4px;
    }

    /* filled slot content */
    .slot-logo {
      width: 52%; aspect-ratio: 1;
      object-fit: contain; z-index: 2;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,.7));
    }
    @keyframes logoIn {
      0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
      55%  { transform: scale(1.18) rotate(3deg); opacity: 1; }
      80%  { transform: scale(.94) rotate(-1deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    /* 일반 로고 brightness 플래시 (흰 로고는 적용 안 함) */
    @keyframes logoBrightFlash {
      0%   { filter: brightness(3); }
      50%  { filter: brightness(1.5); }
      100% { filter: brightness(1); }
    }
    .slot.appear .slot-logo { animation: logoIn .5s .05s cubic-bezier(.22,1,.36,1) both; }
    .slot.appear .slot-logo.logo-bright { animation: logoIn .5s .05s cubic-bezier(.22,1,.36,1) both, logoBrightFlash .5s .05s ease both; }

    @keyframes codeIn {
      0%   { opacity: 0; letter-spacing: .4em; }
      100% { opacity: 1; letter-spacing: .08em; }
    }
    .slot.appear .slot-code { animation: codeIn .3s .25s ease both; }

    @keyframes recordIn {
      0%   { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .slot.appear .slot-record { animation: recordIn .25s .35s ease both; }

    .slot-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 900; letter-spacing: .08em;
      color: #fff; z-index: 2; margin-top: 6px;
    }

    /* 2-0 / 2-1 toggle */
    .slot-record {
      z-index: 2; margin-top: 4px;
      display: flex; gap: 2px;
    }
    .slot-record-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06); color: rgba(255,255,255,.4);
      cursor: pointer; transition: all .14s; line-height: 1.4;
    }
    .slot-record-btn.active-20 { background: rgba(61,220,132,.2); border-color: rgba(61,220,132,.45); color: #3ddc84; }
    .slot-record-btn.active-21 { background: rgba(255,200,60,.18); border-color: rgba(255,200,60,.4); color: #ffc840; }

    /* 2-0 선택 플래시 */
    @keyframes recordFlash20 {
      0%   { transform: scale(1);    background: rgba(61,220,132,.7);  box-shadow: 0 0 0 0   rgba(61,220,132,.9),  0 0 14px rgba(61,220,132,.8); }
      35%  { transform: scale(1.22); background: rgba(61,220,132,.9);  box-shadow: 0 0 0 4px rgba(61,220,132,.5),  0 0 22px rgba(61,220,132,.7); }
      65%  { transform: scale(.95);  background: rgba(61,220,132,.35); box-shadow: 0 0 0 2px rgba(61,220,132,.3),  0 0 10px rgba(61,220,132,.4); }
      100% { transform: scale(1);    background: rgba(61,220,132,.2);  box-shadow: none; }
    }
    /* 2-1 선택 플래시 */
    @keyframes recordFlash21 {
      0%   { transform: scale(1);    background: rgba(255,200,60,.7);  box-shadow: 0 0 0 0   rgba(255,200,60,.9),  0 0 14px rgba(255,200,60,.8); }
      35%  { transform: scale(1.22); background: rgba(255,200,60,.9);  box-shadow: 0 0 0 4px rgba(255,200,60,.5),  0 0 22px rgba(255,200,60,.7); }
      65%  { transform: scale(.95);  background: rgba(255,200,60,.35); box-shadow: 0 0 0 2px rgba(255,200,60,.3),  0 0 10px rgba(255,200,60,.4); }
      100% { transform: scale(1);    background: rgba(255,200,60,.18); box-shadow: none; }
    }
    /* 비활성 버튼 shrink */
    @keyframes recordDeselect {
      0%   { transform: scale(1); opacity: 1; }
      40%  { transform: scale(.88); opacity: .5; }
      100% { transform: scale(1); opacity: 1; }
    }
    .slot-record-btn.flash-20 { animation: recordFlash20 .38s cubic-bezier(.22,1,.36,1) forwards; }
    .slot-record-btn.flash-21 { animation: recordFlash21 .38s cubic-bezier(.22,1,.36,1) forwards; }
    .slot-record-btn.deselect  { animation: recordDeselect .25s ease forwards; }

    /* remove button */
    .slot-remove {
      position: absolute; top: 5px; right: 5px; z-index: 5;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.15);
      color: rgba(255,255,255,.5); font-size: 10px; font-weight: 700;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      transition: background .13s, border-color .13s, color .13s;
      line-height: 1; backdrop-filter: blur(4px);
    }
    .slot.filled .slot-remove { display: flex; }
    .slot-remove:hover { background: rgba(255,60,90,.6); border-color: rgba(255,60,90,.8); color: #fff; }

    /* 카운터 팝 */
    @keyframes countPop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.5); color: #ffc840; }
      65%  { transform: scale(.9); }
      100% { transform: scale(1); }
    }
    #sel-count.pop { animation: countPop .35s ease both; }

    /* ── 확정 버튼 영역 ── */
    #confirm-area {
      display: flex; justify-content: center; align-items: center;
      margin-top: 18px; min-height: 52px;
    }

    @keyframes confirmAppear {
      0%   { opacity: 0; transform: scale(.7) translateY(10px); }
      60%  { opacity: 1; transform: scale(1.07) translateY(-2px); }
      80%  { transform: scale(.97); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .confirm-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
      padding: 12px 44px; border-radius: 8px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #3ddc84 0%, #00c97a 100%);
      color: #0a1a10;
      box-shadow: 0 0 24px rgba(61,220,132,.45), 0 4px 16px rgba(0,0,0,.4);
      animation: confirmAppear .45s cubic-bezier(.22,1,.36,1) both;
      transition: transform .15s, box-shadow .15s;
      position: relative; overflow: hidden;
    }
    .confirm-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.18) 50%, transparent 100%);
      transform: translateX(-100%);
      animation: confirmShimmer 2s 1.2s ease-in-out infinite;
    }
    @keyframes confirmShimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .confirm-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 36px rgba(61,220,132,.65), 0 8px 24px rgba(0,0,0,.5);
    }
    .confirm-btn:active { transform: scale(.97); }

    /* 확정 완료 배너 */
    @keyframes lockedIn {
      0%   { opacity: 0; transform: scale(.8); }
      55%  { opacity: 1; transform: scale(1.05); }
      80%  { transform: scale(.98); }
      100% { opacity: 1; transform: scale(1); }
    }
    .locked-badge {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 24px; border-radius: 8px;
      background: rgba(61,220,132,.08);
      border: 1.5px solid rgba(61,220,132,.3);
      box-shadow: 0 0 18px rgba(61,220,132,.12);
      animation: lockedIn .4s cubic-bezier(.22,1,.36,1) both;
    }
    .locked-badge-icon { font-size: 20px; }
    .locked-badge-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px; font-weight: 700; letter-spacing: .1em;
      color: #3ddc84;
    }
    .locked-badge-sub {
      font-size: 11px; color: rgba(61,220,132,.6); margin-top: 1px;
    }

    /* 잠금 시 슬롯/풀 dim */
    .gs-wrap.locked .slot-remove { display: none !important; }
    .gs-wrap.locked .slot-record-btn { pointer-events: none; }
    .gs-wrap.locked .slot.filled:hover { transform: none !important;
      box-shadow: 0 0 20px color-mix(in srgb, var(--slot-color, #ff3c5a) 15%, transparent),
                  inset 0 0 0 1px color-mix(in srgb, var(--slot-color, #ff3c5a) 25%, transparent) !important; }
    .gs-wrap.locked .pool-area { opacity: .35; pointer-events: none; filter: grayscale(.4); transition: opacity .4s, filter .4s; }
    .gs-wrap.locked .team-card { cursor: default; }

    /* 슬롯 잠금 아이콘 */
    .slot-lock-icon {
      position: absolute; bottom: 6px; right: 6px; z-index: 3;
      font-size: 11px; opacity: .45; display: none;
    }
    .gs-wrap.locked .slot.filled .slot-lock-icon { display: block; }

    /* 클릭 리플 */
    .ripple {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999;
      transform: scale(0); opacity: .7;
      animation: rippleOut .5s ease-out forwards;
    }
    @keyframes rippleOut {
      to { transform: scale(1); opacity: 0; }
    }

    /* ── Team Pool ── */
    .pool-area {}
    .regions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 700px) { .regions-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 400px) { .regions-grid { grid-template-columns: 1fr 1fr; gap: 10px; } }

    .region-col {}
    .region-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
      color: rgba(255,255,255,.28); margin-bottom: 10px;
      padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .region-teams { display: flex; flex-direction: column; gap: 6px; }

    .team-card {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color .15s, background .15s, opacity .15s, transform .1s;
      user-select: none;
    }
    .team-card:hover:not(.selected):not(.disabled) {
      border-color: color-mix(in srgb, var(--tc, #ff3c5a) 50%, transparent);
      background: color-mix(in srgb, var(--tc, #ff3c5a) 6%, var(--bg-card2));
      transform: translateX(2px);
    }
    .team-card.selected {
      opacity: .38;
      cursor: default;
      border-color: rgba(255,255,255,.04);
    }
    .team-card.disabled {
      opacity: .3;
      cursor: default;
    }
    .team-card-logo {
      width: 28px; height: 28px; object-fit: contain; flex-shrink: 0;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
    }
    .team-card-info { flex: 1; min-width: 0; }
    .team-card-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; font-weight: 900; letter-spacing: .06em;
      color: #fff; line-height: 1;
    }
    .team-card-name {
      font-size: 10px; color: rgba(255,255,255,.3); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .team-card-check {
      font-size: 14px; flex-shrink: 0;
      opacity: 0; transition: opacity .15s;
    }
    .team-card.selected .team-card-check { opacity: 1; }

    /* ── 플레이오프 DE 브래킷 ── */
    .po-wrap { padding: 16px 0 40px; overflow-x: auto; }
    .po-section { margin-bottom: 22px; }
    .po-section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(255,255,255,.28); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .po-section-title::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.06); }
    .gf-title { color: rgba(255,215,0,.6); font-size: 11px; }
    .bracket-rounds { display: flex; align-items: stretch; }
    .bracket-round-col { display: flex; flex-direction: column; }
    .bracket-round-header {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(255,255,255,.2); text-align: center;
      padding-bottom: 8px; white-space: nowrap; min-width: 158px;
    }
    .bracket-slots { display: flex; flex-direction: column; flex: 1; }
    .bracket-slot {
      display: flex; align-items: center; justify-content: center;
      padding: 5px 6px;
    }
    /* match card */
    .bm {
      width: 148px; border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.03); flex-shrink: 0;
    }
    .bm.ub-match { border-left: 2px solid rgba(99,179,237,.35); }
    .bm.lb-match { border-left: 2px solid rgba(252,129,74,.35); }
    .bm.gf-match { border-left: 2px solid rgba(255,215,0,.55); width: 178px; }
    .bm-team {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 8px; cursor: default;
      transition: background .12s, opacity .15s;
      min-height: 34px;
    }
    .bm-team.clickable { cursor: pointer; }
    .bm-team.clickable:hover { background: rgba(255,255,255,.08); }
    .bm-team.winner-row { background: rgba(61,220,132,.1); }
    .bm-team.loser-row { opacity: .28; }
    .gf-match .bm-team.winner-row { background: rgba(255,215,0,.1); }
    .bm-divider { height: 1px; background: rgba(255,255,255,.06); }
    .bm-seed {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px; font-weight: 700; color: rgba(255,255,255,.22);
      width: 10px; text-align: right; flex-shrink: 0;
    }
    .bm-logo { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    .bm-logo-ph {
      width: 20px; height: 20px; border-radius: 3px;
      background: rgba(255,255,255,.07);
      display: flex; align-items: center; justify-content: center;
      font-size: 7px; font-weight: 800; color: rgba(255,255,255,.25); flex-shrink: 0;
    }
    .bm-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 800; color: #fff; flex: 1;
    }
    .bm-tbd .bm-code { color: rgba(255,255,255,.22); }
    .bm-win-mark { font-size: 9px; color: #3ddc84; opacity: 0; flex-shrink: 0; }
    .bm-team.winner-row .bm-win-mark { opacity: 1; }
    .gf-match .bm-team.winner-row .bm-win-mark { color: gold; }
    /* winner flash */
    @keyframes bmWinFlash {
      0%   { background: rgba(61,220,132,.45); }
      100% { background: rgba(61,220,132,.1); }
    }
    .bm-team.winner-row.flash { animation: bmWinFlash .45s ease both; }
    .gf-match .bm-team.winner-row.flash { animation: none; background: rgba(255,215,0,.1); }
    /* drop label between UB and LB */
    .ub-drop-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(252,129,74,.45); text-align: right; padding: 0 14px 4px;
    }
    /* GF section */
    .gf-section { align-items: flex-start; }
    .gf-slot { padding: 5px 6px; }
  </style>
  <script src="./storage.js"></script>
  <script src="./auth.js" defer></script>

  <script>
    /* ── 팀 데이터 ── */
    var REGIONS = [
      {
        label: 'Pacific',
        teams: [
          { code: 'NS',  name: 'Nongshim RedForce', logo: './assets/teams/ns.svg',  color: '#e2012d', white: false },
          { code: 'T1',  name: 'T1',                logo: './assets/teams/t1.png',  color: '#ec1b24', white: false },
          { code: 'PRX', name: 'Paper Rex',          logo: './assets/teams/prx.svg', color: '#8c52ff', white: true  },
          { code: 'GE',  name: 'Global Esports',     logo: './assets/teams/ge.webp', color: '#e12c30', white: false },
        ]
      },
      {
        label: 'Americas',
        teams: [
          { code: 'NRG', name: 'NRG Esports', logo: 'https://i.namu.wiki/i/b5ns627KGg4zEIzK90XQi_FFDbBFY4VrEpOG0MDdLK_KJVx3y6AZczbN0kuwfv5bXqmtfSFWly2NgFrcMcLnvg.svg', color: '#F63D0A', white: false },
          { code: 'G2',  name: 'G2 Esports',  logo: 'https://i.namu.wiki/i/lx4lTUZuQJuG0lI7k1odIWttiaiDx9gbB6rAybzzna-UZR57F_Vwr_LMKF6OlHaepuw9UiVJbYoQ_B_IA4QnrA.svg', color: '#8400CB', white: false },
          { code: '?', name: 'TBD', logo: '', color: '#555', white: false, tbd: true },
          { code: '?', name: 'TBD', logo: '', color: '#555', white: false, tbd: true },
        ]
      },
      {
        label: 'EMEA',
        teams: [
          { code: 'KC',  name: 'Karmine Corp',  logo: './assets/teams/kc.png',                                                                                                  color: '#01ccff', white: false },
          { code: 'TL',  name: 'Team Liquid',   logo: 'https://i.namu.wiki/i/f_CgQqphVfEK8ZpEdvOwbGpar5zO-_FVVRi39YwZGPPXdUwewYA58qHLO9BMsDue-XXXYWNXJANDwuBBkPdncg.webp', color: '#142e60', white: true  },
          { code: 'FUT', name: 'FUT Esports',   logo: 'https://specs.gg/assets/img/teams/fut-esports.webp',                                                                    color: '#21efc4', white: false },
          { code: 'VIT', name: 'Team Vitality', logo: 'https://images.secretlab.co/theme/common/vitality_25_spacer_logo.png',                                                  color: '#f8ff04', white: false },
        ]
      },
      {
        label: 'CN',
        teams: [
          { code: 'TYL', name: 'TYLOO',           logo: 'https://i.namu.wiki/i/ygjpeHG-y9CYpiLp-E8wiEsNDU6j9aRNcwVvPJsOlvcSV1Ey_NCmMAjMarHe3bhjm6EDK-qgXl_hEmhQdz__ag.svg',  color: '#cc3a32', white: false },
          { code: 'JDG', name: 'JD Mall JDG',     logo: 'https://i.namu.wiki/i/YyWlT49EP4lbp3xXGQr4QdzyrHYb3xwHo50oXrrAPOE7T6hXJsSJ5GNGWsB65RT1N5Ceh1lVwzhmE9HgoaV3yw.svg',  color: '#da202d', white: false },
          { code: 'EDG', name: 'EDward Gaming',   logo: 'https://upload.wikimedia.org/wikipedia/commons/3/33/Edward_Gaming_logo.png',                                            color: '#442a1e', white: false },
          { code: 'XLG', name: 'Xi Lai Gaming',   logo: 'https://i.namu.wiki/i/Yywbu40Korgue4azcIZrrlnlCSyI6vdM7imxW_Qt7dA8JzhkIbIJuIeAMVuG-KOms30fAAwz12iuyETD7pCGvw.svg', color: '#206189', white: false },
        ]
      },
    ];

    /* state */
    var slots = new Array(8).fill(null);
    var lastFilledIdx = -1;
    var gsLocked = false;

    /* ── 리플 효과 ── */
    function spawnRipple(x, y, color) {
      var rip = document.createElement('div');
      rip.className = 'ripple';
      var sz = 120;
      rip.style.cssText = [
        'width:'+sz+'px','height:'+sz+'px',
        'left:'+(x-sz/2)+'px','top:'+(y-sz/2)+'px',
        'background:'+color,'border:2px solid '+color
      ].join(';');
      document.body.appendChild(rip);
      setTimeout(function(){ rip.remove(); }, 520);
    }

    /* ── 카운터 팝 ── */
    function popCount() {
      var el = document.getElementById('sel-count');
      el.classList.remove('pop');
      void el.offsetWidth; // reflow
      el.classList.add('pop');
      el.addEventListener('animationend', function(){ el.classList.remove('pop'); }, { once: true });
    }

    /* ── 슬롯 렌더 ── */
    function renderSlots(animIdx) {
      var grid = document.getElementById('slots-grid');
      grid.innerHTML = '';
      var filled = slots.filter(Boolean).length;
      document.getElementById('sel-count').textContent = filled;

      for (var i = 0; i < 8; i++) {
        var s = slots[i];
        var el = document.createElement('div');
        el.className = 'slot' + (s ? ' filled' : '');
        if (s && i === animIdx) el.classList.add('appear');
        el.dataset.idx = i;

        if (s) {
          if (s.color) el.style.setProperty('--slot-color', s.color);

          /* remove btn */
          var rem = document.createElement('button');
          rem.className = 'slot-remove';
          rem.textContent = '✕';
          rem.dataset.idx = i;
          rem.addEventListener('click', onRemove);
          el.appendChild(rem);

          /* logo */
          var img = document.createElement('img');
          img.className = 'slot-logo' + (s.white ? '' : ' logo-bright');
          img.src = s.logo; img.alt = s.code;
          if (s.white) img.style.filter = 'brightness(0) invert(1)';
          img.onerror = function(){ this.style.display='none'; };
          el.appendChild(img);

          /* code */
          var codeEl = document.createElement('div');
          codeEl.className = 'slot-code';
          codeEl.textContent = s.code;
          el.appendChild(codeEl);

          /* record toggle */
          var rec = document.createElement('div');
          rec.className = 'slot-record';
          ['2-0','2-1'].forEach(function(r) {
            var btn = document.createElement('button');
            btn.className = 'slot-record-btn' + (s.record === r ? (r==='2-0' ? ' active-20' : ' active-21') : '');
            btn.textContent = r;
            btn.dataset.idx = i;
            btn.dataset.rec = r;
            btn.addEventListener('click', onRecordToggle);
            rec.appendChild(btn);
          });
          el.appendChild(rec);

          /* 자물쇠 아이콘 (잠금 시 CSS로 표시) */
          var lockIco = document.createElement('span');
          lockIco.className = 'slot-lock-icon';
          lockIco.textContent = '🔒';
          el.appendChild(lockIco);
        } else {
          var num = document.createElement('div');
          num.className = 'slot-empty-num';
          num.textContent = i + 1;
          el.appendChild(num);
          var line = document.createElement('div');
          line.className = 'slot-empty-line';
          line.textContent = 'Pick';
          el.appendChild(line);
        }
        grid.appendChild(el);

        /* appear 슬롯: 스캔라인 타이밍 맞춰 실행 */
        if (s && i === animIdx) {
          (function(slotEl) {
            setTimeout(function() {
              slotEl.classList.add('scanning');
              slotEl.addEventListener('animationend', function handler(ev) {
                if (ev.animationName === 'scanSlot') {
                  slotEl.classList.remove('scanning');
                  slotEl.removeEventListener('animationend', handler);
                }
              });
            }, 160);
          })(el);
        }
      }
      renderConfirmArea();
    }

    /* ── 확정 버튼 렌더 ── */
    function renderConfirmArea() {
      var area = document.getElementById('confirm-area');
      if (!area) return;
      area.innerHTML = '';

      if (gsLocked) {
        var badge = document.createElement('div');
        badge.className = 'locked-badge';
        badge.innerHTML = '<span class="locked-badge-icon">🔒</span>'
          + '<div><div class="locked-badge-text">예측 확정 완료</div>'
          + '<div class="locked-badge-sub">더 이상 수정할 수 없습니다.</div></div>';
        area.appendChild(badge);

        /* 잠금 해제 버튼 (테스트용) */
        var unlockBtn = document.createElement('button');
        unlockBtn.textContent = '잠금 해제';
        unlockBtn.style.cssText = 'margin-left:12px;font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);cursor:pointer;transition:all .14s;';
        unlockBtn.addEventListener('mouseenter', function(){ this.style.background='rgba(255,80,80,.15)'; this.style.borderColor='rgba(255,80,80,.4)'; this.style.color='#ff6060'; });
        unlockBtn.addEventListener('mouseleave', function(){ this.style.background='rgba(255,255,255,.06)'; this.style.borderColor='rgba(255,255,255,.18)'; this.style.color='rgba(255,255,255,.45)'; });
        unlockBtn.addEventListener('click', function() {
          gsLocked = false;
          try { localStorage.removeItem('vct_gs_locked'); } catch(e) {}
          var wrap = document.querySelector('.gs-wrap');
          if (wrap) wrap.classList.remove('locked');
          renderSlots(-1);
          renderPool();
        });
        area.appendChild(unlockBtn);
        /* wrap에 locked 클래스 */
        var wrap = document.querySelector('.gs-wrap');
        if (wrap) wrap.classList.add('locked');
        return;
      }

      var filled = slots.filter(Boolean).length;
      if (filled < 8) return;

      var btn = document.createElement('button');
      btn.className = 'confirm-btn';
      btn.textContent = '✓  예측 확정';
      btn.addEventListener('click', onConfirm);
      area.appendChild(btn);
    }

    /* ── 확정 ── */
    function onConfirm() {
      gsLocked = true;
      try { localStorage.setItem('vct_gs_locked', '1'); } catch(e) {}
      renderConfirmArea();
    }

    /* ── 팀 풀 렌더 ── */
    function renderPool() {
      var selectedCodes = slots.filter(Boolean).map(function(s){ return s.code; });
      var grid = document.getElementById('regions-grid');
      grid.innerHTML = '';
      var allFull = selectedCodes.length >= 8;

      REGIONS.forEach(function(region) {
        var col = document.createElement('div');
        col.className = 'region-col';

        var lbl = document.createElement('div');
        lbl.className = 'region-label';
        lbl.textContent = region.label;
        col.appendChild(lbl);

        var teamsEl = document.createElement('div');
        teamsEl.className = 'region-teams';

        region.teams.forEach(function(team) {
          var isTbd = !!team.tbd;
          var isSelected = !isTbd && selectedCodes.indexOf(team.code) !== -1;
          var isDisabled = (!isSelected && allFull) || isTbd;

          var card = document.createElement('div');
          card.className = 'team-card' + (isSelected ? ' selected' : '') + (isDisabled ? ' disabled' : '');
          card.dataset.code = team.code;
          if (team.color && !isTbd) {
            card.style.setProperty('--tc', team.color);
          }

          if (isTbd) {
            var tbdEl = document.createElement('div');
            tbdEl.style.cssText = 'width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.2);flex-shrink:0;';
            tbdEl.textContent = '?';
            card.appendChild(tbdEl);
            var info = document.createElement('div');
            info.className = 'team-card-info';
            var codeEl = document.createElement('div');
            codeEl.className = 'team-card-code';
            codeEl.style.color = 'rgba(255,255,255,.2)';
            codeEl.textContent = 'TBD';
            info.appendChild(codeEl);
            card.appendChild(info);
            teamsEl.appendChild(card);
            return;
          }

          var logo = document.createElement('img');
          logo.className = 'team-card-logo';
          logo.src = team.logo; logo.alt = team.code;
          if (team.white) logo.style.filter = 'brightness(0) invert(1)';
          logo.onerror = function(){ this.style.display='none'; };
          card.appendChild(logo);

          var info = document.createElement('div');
          info.className = 'team-card-info';
          var codeEl = document.createElement('div');
          codeEl.className = 'team-card-code';
          codeEl.textContent = team.code;
          var nameEl = document.createElement('div');
          nameEl.className = 'team-card-name';
          nameEl.textContent = team.name;
          info.appendChild(codeEl);
          info.appendChild(nameEl);
          card.appendChild(info);

          var check = document.createElement('div');
          check.className = 'team-card-check';
          check.textContent = '✓';
          card.appendChild(check);

          if (!isSelected && !isDisabled) {
            card.addEventListener('click', (function(t) {
              return function(ev) { onTeamClick(t, ev); };
            })(team));
          }
          teamsEl.appendChild(card);
        });
        col.appendChild(teamsEl);
        grid.appendChild(col);
      });
    }

    /* ── 이벤트 핸들러 ── */
    function onTeamClick(team, ev) {
      if (gsLocked) return;
      var emptyIdx = slots.indexOf(null);
      if (emptyIdx === -1) return;

      /* 리플 */
      if (ev) spawnRipple(ev.clientX, ev.clientY, team.color || '#fff');

      /* 카드 picking flash */
      if (ev && ev.currentTarget) {
        ev.currentTarget.classList.add('picking');
      }

      /* 약간 딜레이 후 슬롯 채우기 */
      setTimeout(function() {
        slots[emptyIdx] = {
          code: team.code, name: team.name, logo: team.logo,
          color: team.color, white: team.white, record: '2-0'
        };
        renderSlots(emptyIdx);
        renderPool();
        popCount();

        /* 대상 슬롯 pulse */
        var grid = document.getElementById('slots-grid');
        var slotEl = grid.children[emptyIdx];
        if (slotEl) {
          slotEl.classList.add('pulse');
          slotEl.addEventListener('animationend', function() {
            slotEl.classList.remove('pulse');
          }, { once: true });
        }
      }, 130);
    }

    function onRemove(e) {
      e.stopPropagation();
      if (gsLocked) return;
      var idx = parseInt(e.currentTarget.dataset.idx);
      /* 해당 슬롯 removing 애니메이션 */
      var grid = document.getElementById('slots-grid');
      var slotEl = grid.children[idx];
      if (slotEl) {
        slotEl.classList.add('removing');
        setTimeout(function() {
          slots[idx] = null;
          slots = slots.filter(Boolean).concat(new Array(8).fill(null)).slice(0, 8);
          renderSlots(-1);
          renderPool();
          popCount();
        }, 290);
      } else {
        slots[idx] = null;
        slots = slots.filter(Boolean).concat(new Array(8).fill(null)).slice(0, 8);
        renderSlots(-1);
        renderPool();
      }
    }

    function onRecordToggle(e) {
      e.stopPropagation();
      var btn = e.currentTarget;
      var idx = parseInt(btn.dataset.idx);
      var rec = btn.dataset.rec;
      if (!slots[idx] || slots[idx].record === rec) return;

      slots[idx].record = rec;

      /* 같은 슬롯의 버튼들을 직접 찾아서 애니메이션 */
      var slotEl = document.querySelector('#slots-grid .slot[data-idx="' + idx + '"]');
      if (!slotEl) { renderSlots(-1); return; }

      var btns = slotEl.querySelectorAll('.slot-record-btn');
      btns.forEach(function(b) {
        b.classList.remove('active-20','active-21','flash-20','flash-21','deselect');
        void b.offsetWidth; // reflow

        if (b.dataset.rec === rec) {
          /* 선택된 버튼: active 클래스 + 플래시 */
          b.classList.add(rec === '2-0' ? 'active-20' : 'active-21');
          b.classList.add(rec === '2-0' ? 'flash-20' : 'flash-21');
          b.addEventListener('animationend', function() {
            b.classList.remove('flash-20','flash-21');
          }, { once: true });
        } else {
          /* 해제된 버튼: shrink */
          b.classList.add('deselect');
          b.addEventListener('animationend', function() {
            b.classList.remove('deselect');
          }, { once: true });
        }
      });
    }

    /* ══════════════════════════════════════════════
       플레이오프 더블 엘리미네이션 브래킷
       ══════════════════════════════════════════════ */

    /* 전체 14경기 상태 */
    var PO_STATE = {};
    for (var _pi = 1; _pi <= 14; _pi++) {
      PO_STATE[_pi] = { a: null, b: null, winner: null, seedA: null, seedB: null };
    }

    /* UB R1 시드 배치: [시드A, 시드B] for M1~M4 */
    var UB_SEEDS = [[1,8],[4,5],[2,7],[3,6]];

    /* 승자/패자 라우팅 */
    var PO_ROUTING = {
      1:  { win:{m:5, s:'a'}, lose:{m:8, s:'a'}  },
      2:  { win:{m:5, s:'b'}, lose:{m:9, s:'a'}  },
      3:  { win:{m:6, s:'a'}, lose:{m:9, s:'b'}  },
      4:  { win:{m:6, s:'b'}, lose:{m:8, s:'b'}  },
      5:  { win:{m:7, s:'a'}, lose:{m:11,s:'b'}  },
      6:  { win:{m:7, s:'b'}, lose:{m:10,s:'b'}  },
      7:  { win:{m:14,s:'a'}, lose:{m:13,s:'b'}  },
      8:  { win:{m:10,s:'a'} },
      9:  { win:{m:11,s:'a'} },
      10: { win:{m:12,s:'a'} },
      11: { win:{m:12,s:'b'} },
      12: { win:{m:13,s:'a'} },
      13: { win:{m:14,s:'b'} },
    };

    function getPoSlotTeam(seedNum) {
      var idx = seedNum - 1;
      return (idx >= 0 && idx < 8 && slots[idx]) ? slots[idx] : null;
    }

    function setPoSeeds() {
      UB_SEEDS.forEach(function(pair, i) {
        var mid = i + 1;
        PO_STATE[mid].a    = getPoSlotTeam(pair[0]);
        PO_STATE[mid].b    = getPoSlotTeam(pair[1]);
        PO_STATE[mid].seedA = pair[0];
        PO_STATE[mid].seedB = pair[1];
      });
    }

    function propagatePo() {
      for (var mid = 1; mid <= 13; mid++) {
        var m = PO_STATE[mid];
        if (!m.winner) continue;
        var route = PO_ROUTING[mid];
        if (!route) continue;
        if (route.win) {
          PO_STATE[route.win.m][route.win.s] = m.winner;
        }
        if (route.lose && m.a && m.b) {
          var loser = (m.winner.code === m.a.code) ? m.b : m.a;
          if (loser) PO_STATE[route.lose.m][route.lose.s] = loser;
        }
      }
    }

    function clearPoDownstream(mid) {
      var m = PO_STATE[mid];
      var route = PO_ROUTING[mid];
      if (!route || !m.winner) return;
      var oldWin  = m.winner;
      var oldLose = (m.a && m.b) ? (oldWin.code === m.a.code ? m.b : m.a) : null;

      function wipe(destMid, destSide, team) {
        if (!team) return;
        var dm = PO_STATE[destMid];
        if (dm[destSide] && dm[destSide].code === team.code) {
          dm[destSide] = null;
          if (dm.winner && dm.winner.code === team.code) {
            dm.winner = null;
            clearPoDownstream(destMid);
          }
        }
      }
      if (route.win)  wipe(route.win.m,  route.win.s,  oldWin);
      if (route.lose) wipe(route.lose.m, route.lose.s, oldLose);
    }

    function pickPoWinner(mid, side) {
      var m = PO_STATE[mid];
      var team = m[side];
      if (!team) return;

      if (m.winner && m.winner.code === team.code) {
        clearPoDownstream(mid);
        m.winner = null;
      } else {
        if (m.winner) clearPoDownstream(mid);
        m.winner = team;
        propagatePo();
      }
      savePo();
      renderPo();
      /* winner row flash */
      setTimeout(function() {
        var card = document.querySelector('.bm[data-match="' + mid + '"]');
        if (!card) return;
        var wr = card.querySelector('.bm-team.winner-row');
        if (wr) {
          wr.classList.remove('flash'); void wr.offsetWidth;
          wr.classList.add('flash');
          wr.addEventListener('animationend', function(){ wr.classList.remove('flash'); }, {once:true});
        }
      }, 10);
    }

    function savePo() {
      try {
        var d = {};
        for (var i = 1; i <= 14; i++) {
          d[i] = { winner: PO_STATE[i].winner ? PO_STATE[i].winner.code : null };
        }
        localStorage.setItem('vct_po_v2', JSON.stringify(d));
      } catch(e) {}
    }

    function loadPo() {
      try {
        var raw = localStorage.getItem('vct_po_v2');
        if (!raw) return;
        var d = JSON.parse(raw);
        for (var mid = 1; mid <= 13; mid++) {
          if (!d[mid] || !d[mid].winner) continue;
          var m = PO_STATE[mid];
          if (m.winner) continue;
          var wCode = d[mid].winner;
          var team  = (m.a && m.a.code === wCode) ? m.a
                    : (m.b && m.b.code === wCode) ? m.b : null;
          if (team) { m.winner = team; propagatePo(); }
        }
      } catch(e) {}
    }

    /* ── 카드 생성 ── */
    function makeBmCard(mid, type) {
      var m = PO_STATE[mid];
      var card = document.createElement('div');
      card.className = 'bm ' + (type || '') + '-match';
      card.dataset.match = mid;

      ['a','b'].forEach(function(side, idx) {
        var team = m[side];
        var seed = (side === 'a') ? m.seedA : m.seedB;
        var isWin  = !!(m.winner && team && m.winner.code === team.code);
        var isLose = !!(m.winner && team && m.winner.code !== team.code);
        var isTbd  = !team;

        var row = document.createElement('div');
        row.className = 'bm-team'
          + (isWin  ? ' winner-row' : '')
          + (isLose ? ' loser-row'  : '')
          + (isTbd  ? ' bm-tbd'     : '')
          + (!isTbd && !m.winner ? ' clickable' : '');

        if (!isTbd && !m.winner) {
          row.addEventListener('click', (function(m_, s_){
            return function(){ pickPoWinner(m_, s_); };
          })(mid, side));
        }

        /* 시드 번호 */
        var seedEl = document.createElement('span');
        seedEl.className = 'bm-seed';
        seedEl.textContent = seed || '';
        row.appendChild(seedEl);

        /* 로고 */
        if (team && team.logo) {
          var img = document.createElement('img');
          img.className = 'bm-logo';
          img.src = team.logo; img.alt = team.code || '';
          if (team.white) img.style.filter = 'brightness(0) invert(1)';
          img.onerror = function(){ this.style.display='none'; };
          row.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'bm-logo-ph';
          ph.textContent = isTbd ? '?' : (team ? team.code.slice(0,2) : '?');
          row.appendChild(ph);
        }

        /* 팀코드 */
        var codeEl = document.createElement('span');
        codeEl.className = 'bm-code';
        codeEl.textContent = team ? team.code : 'TBD';
        row.appendChild(codeEl);

        /* 승자 마크 */
        var mark = document.createElement('span');
        mark.className = 'bm-win-mark';
        mark.textContent = '●';
        row.appendChild(mark);

        card.appendChild(row);
        if (idx === 0) {
          var dv = document.createElement('div');
          dv.className = 'bm-divider';
          card.appendChild(dv);
        }
      });
      return card;
    }

    /* ── 라운드 컬럼 생성 ── */
    function makeRoundCol(label, matchDefs) {
      var col = document.createElement('div');
      col.className = 'bracket-round-col';

      var hdr = document.createElement('div');
      hdr.className = 'bracket-round-header';
      hdr.textContent = label;
      col.appendChild(hdr);

      var slotsEl = document.createElement('div');
      slotsEl.className = 'bracket-slots';

      matchDefs.forEach(function(def) {
        var slot = document.createElement('div');
        slot.className = 'bracket-slot';
        slot.style.flex = def.flex || 1;
        slot.appendChild(makeBmCard(def.id, def.type));
        slotsEl.appendChild(slot);
      });
      col.appendChild(slotsEl);
      return col;
    }

    /* ── 브래킷 전체 렌더 ── */
    function renderPo() {
      var container = document.getElementById('po-bracket');
      if (!container) return;
      container.innerHTML = '';

      /* UB Section */
      var ubSec = document.createElement('div');
      ubSec.className = 'po-section';
      var ubTitle = document.createElement('div');
      ubTitle.className = 'po-section-title';
      ubTitle.innerHTML = '<span style="color:rgba(99,179,237,.65)">▲</span>&nbsp;Upper Bracket';
      ubSec.appendChild(ubTitle);

      var ubRounds = document.createElement('div');
      ubRounds.className = 'bracket-rounds';
      ubRounds.appendChild(makeRoundCol('Quarterfinals', [
        {id:1,flex:1,type:'ub'},{id:2,flex:1,type:'ub'},
        {id:3,flex:1,type:'ub'},{id:4,flex:1,type:'ub'},
      ]));
      ubRounds.appendChild(makeRoundCol('Semifinals', [
        {id:5,flex:2,type:'ub'},{id:6,flex:2,type:'ub'},
      ]));
      ubRounds.appendChild(makeRoundCol('Upper Final', [
        {id:7,flex:4,type:'ub'},
      ]));
      ubSec.appendChild(ubRounds);

      /* UB→LB 낙하 표시 */
      var dropLbl = document.createElement('div');
      dropLbl.className = 'ub-drop-label';
      dropLbl.textContent = '↓ Lower Bracket로 낙하';
      ubSec.appendChild(dropLbl);
      container.appendChild(ubSec);

      /* LB Section */
      var lbSec = document.createElement('div');
      lbSec.className = 'po-section';
      var lbTitle = document.createElement('div');
      lbTitle.className = 'po-section-title';
      lbTitle.innerHTML = '<span style="color:rgba(252,129,74,.65)">▼</span>&nbsp;Lower Bracket';
      lbSec.appendChild(lbTitle);

      var lbRounds = document.createElement('div');
      lbRounds.className = 'bracket-rounds';
      lbRounds.appendChild(makeRoundCol('Round 1', [
        {id:8,flex:1,type:'lb'},{id:9,flex:1,type:'lb'},
      ]));
      lbRounds.appendChild(makeRoundCol('Round 2', [
        {id:10,flex:1,type:'lb'},{id:11,flex:1,type:'lb'},
      ]));
      lbRounds.appendChild(makeRoundCol('Semifinal', [
        {id:12,flex:2,type:'lb'},
      ]));
      lbRounds.appendChild(makeRoundCol('Final', [
        {id:13,flex:2,type:'lb'},
      ]));
      lbSec.appendChild(lbRounds);
      container.appendChild(lbSec);

      /* Grand Final */
      var gfSec = document.createElement('div');
      gfSec.className = 'po-section gf-section';
      var gfTitle = document.createElement('div');
      gfTitle.className = 'po-section-title gf-title';
      gfTitle.innerHTML = '🏆&nbsp;Grand Final';
      gfSec.appendChild(gfTitle);

      var gfSlot = document.createElement('div');
      gfSlot.className = 'bracket-slot gf-slot';
      gfSlot.appendChild(makeBmCard(14, 'gf'));
      gfSec.appendChild(gfSlot);
      container.appendChild(gfSec);
    }

    /* ── 탭 전환 ── */
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    /* ── Auth gate ── */
    function initPage() {
      var isAdmin = typeof window.vctIsAdmin === 'function' && window.vctIsAdmin();
      if (isAdmin) {
        document.getElementById('main-content').style.display = 'block';
        /* 잠금 상태 복원 */
        try { if (localStorage.getItem('vct_gs_locked') === '1') gsLocked = true; } catch(e) {}
        renderSlots(-1);
        renderPool();
        setPoSeeds();
        loadPo();
        renderPo();
      } else {
        document.getElementById('coming-soon').style.display = 'block';
      }
    }

    (window.storageReady || Promise.resolve()).then(function() {
      if (typeof window.vctIsAdmin === 'function') {
        initPage();
      } else {
        window.addEventListener('load', initPage);
      }
    });
  </script>
</body>
</html>
