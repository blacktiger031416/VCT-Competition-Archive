<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>발로란트 관전 친구 AI</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161923;
    --panel-2: #1d2130;
    --accent: #ff4655;
    --text: #e8e9ee;
    --text-dim: #9aa0b4;
    --border: #2a2f42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app {
    display: flex;
    height: 100vh;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    min-width: 0;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  h1 span { color: var(--accent); }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  label { font-size: 12px; color: var(--text-dim); }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
  }
  .video-wrap {
    flex: 1;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    position: relative;
    min-height: 0;
  }
  video {
    max-width: 100%;
    max-height: 100%;
  }
  .placeholder {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .status {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.55);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim);
  }
  .dot.live { background: #57e389; box-shadow: 0 0 6px #57e389; }
  .chat {
    width: 340px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px;
  }
  .chat h2 {
    font-size: 13px;
    margin: 0 0 10px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
  }
  .msg {
    background: var(--panel-2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
    animation: pop 0.2s ease;
  }
  .msg .time {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .msg.error { border: 1px solid var(--accent); color: #ffb3b8; }
  .msg.pending { color: var(--text-dim); font-style: italic; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <header>
      <h1>발로란트 관전 친구 <span>AI</span></h1>
      <div class="controls">
        <label for="interval">반응 간격</label>
        <select id="interval">
          <option value="6000">6초</option>
          <option value="8000" selected>8초</option>
          <option value="12000">12초</option>
          <option value="20000">20초</option>
        </select>
        <button id="startBtn">화면 공유 시작</button>
        <button id="stopBtn" class="secondary" disabled>중지</button>
      </div>
    </header>
    <div class="video-wrap">
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">대기 중</span></div>
      <video id="preview" autoplay muted playsinline></video>
      <div class="placeholder" id="placeholder">"화면 공유 시작"을 눌러서 보고 있는 방송 창이나 화면 전체를 공유하세요.</div>
    </div>
  </div>
  <div class="chat">
    <h2>실시간 반응</h2>
    <div class="messages" id="messages"></div>
  </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const intervalSelect = document.getElementById('interval');
const video = document.getElementById('preview');
const placeholder = document.getElementById('placeholder');
const canvas = document.getElementById('canvas');
const messagesEl = document.getElementById('messages');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let stream = null;
let timerId = null;
let isBusy = false;
const history = [];

function addMessage(text, type) {
  const el = document.createElement('div');
  el.className = 'msg' + (type ? ' ' + type : '');
  const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  el.innerHTML = `<span class="time">${time}</span>${text}`;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function setLive(isLive) {
  statusDot.classList.toggle('live', isLive);
  statusText.textContent = isLive ? '같이 보는 중' : '대기 중';
}

async function captureAndSend() {
  if (isBusy || !stream) return;
  isBusy = true;
  const pendingEl = addMessage('화면 보는 중…', 'pending');

  try {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

    const res = await fetch('/api/react', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl, history }),
    });
    const data = await res.json();
    pendingEl.remove();

    if (!res.ok) {
      addMessage(data.error || '오류가 발생했어요.', 'error');
    } else {
      addMessage(data.text);
      history.push(data.text);
      if (history.length > 6) history.shift();
    }
  } catch (err) {
    pendingEl.remove();
    addMessage('서버와 통신 중 오류가 발생했어요.', 'error');
  } finally {
    isBusy = false;
  }
}

async function startCapture() {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: 'never' },
      audio: false,
    });
  } catch (err) {
    addMessage('화면 공유 권한을 허용해야 시작할 수 있어요.', 'error');
    return;
  }

  video.srcObject = stream;
  placeholder.style.display = 'none';
  video.style.display = 'block';
  startBtn.disabled = true;
  stopBtn.disabled = false;
  setLive(true);

  stream.getVideoTracks()[0].addEventListener('ended', stopCapture);

  const interval = Number(intervalSelect.value);
  timerId = setInterval(captureAndSend, interval);
  captureAndSend();
}

function stopCapture() {
  if (timerId) clearInterval(timerId);
  timerId = null;
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  video.style.display = 'none';
  placeholder.style.display = 'block';
  startBtn.disabled = false;
  stopBtn.disabled = true;
  setLive(false);
}

startBtn.addEventListener('click', startCapture);
stopBtn.addEventListener('click', stopCapture);
intervalSelect.addEventListener('change', () => {
  if (timerId) {
    clearInterval(timerId);
    timerId = setInterval(captureAndSend, Number(intervalSelect.value));
  }
});
</script>
</body>
</html>
