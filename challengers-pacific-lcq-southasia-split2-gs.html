<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCT Pacific LCQ 2026 · SA Split 2 그룹 스테이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #01d2d7;
      --accent-dim: rgba(1,210,215,0.7);
      --bg-base: #060f14;
      --bg-card: #0b1820;
      --bg-card2: #0f2030;
    }
    body { background: var(--bg-base); color: #e8e4e0; font-family: 'Barlow','Noto Sans KR',sans-serif; min-height: 100vh; }
    .site-header { display:flex; align-items:center; gap:20px; padding:0 32px; height:56px; background:rgba(6,15,20,.92); border-bottom:1px solid rgba(1,210,215,.15); position:sticky; top:0; z-index:100; backdrop-filter:blur(12px); }
    .home-link { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.55); text-decoration:none; transition:color .15s; }
    .home-link:hover { color:#fff; }
    .home-link::after { content:" /"; margin-left:4px; color:rgba(255,255,255,.18); font-weight:400; }
    .back-link { font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.4); text-decoration:none; transition:color .15s; }
    .back-link:hover { color:rgba(255,255,255,.8); }
    .site-header .auth-header-btn { margin-left:auto !important; }

    .league-shell { max-width:1080px; margin:0 auto; padding:40px 32px 80px; }
    .page-hero { margin-bottom:32px; }
    .eyebrow { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
    .page-hero h1 { font-family:'Barlow Condensed',sans-serif; font-size:clamp(32px,6vw,64px); font-weight:900; letter-spacing:.03em; text-transform:uppercase; line-height:.95; color:#fff; }
    .page-hero .intro { font-size:13px; line-height:1.7; color:rgba(255,255,255,.4); margin-top:12px; font-family:'Noto Sans KR',sans-serif; font-weight:500; word-break:keep-all; }

    input[name="week"] { position:absolute; opacity:0; pointer-events:none; }

    .sub-title { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.25); margin-bottom:10px; }

    /* Team slots */
    .team-slots { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:24px; }
    @media(max-width:600px){ .team-slots{grid-template-columns:repeat(2,1fr);} }
    .team-slot { padding:10px 12px; background:var(--bg-card); border:1px solid rgba(255,255,255,.07); border-radius:4px; display:flex; align-items:center; gap:8px; min-height:52px; transition:border-color .15s,background .15s; }
    body:not(.view-only) .team-slot { cursor:pointer; }
    body:not(.view-only) .team-slot:hover { border-color:rgba(1,210,215,.3); background:var(--bg-card2); }
    .slot-num { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; color:rgba(1,210,215,.6); min-width:14px; }
    .slot-logo { width:26px; height:26px; object-fit:contain; flex-shrink:0; }
    .slot-name { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; text-transform:uppercase; color:rgba(255,255,255,.3); }
    .slot-name.filled { color:#fff; }

    /* Week tabs */
    .wk-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:16px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:6px; padding:3px; }
    .wk-tabs label { min-height:36px; display:grid; place-items:center; border-radius:4px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.35); cursor:pointer; transition:color .14s,background .14s; }
    #wk-1:checked ~ .wk-tabs label[for="wk-1"],
    #wk-2:checked ~ .wk-tabs label[for="wk-2"],
    #wk-3:checked ~ .wk-tabs label[for="wk-3"] { background:rgba(255,255,255,.08); color:#fff; }
    .wk1-matches,.wk2-matches,.wk3-matches { display:none; }
    #wk-1:checked ~ .wk1-matches { display:block; }
    #wk-2:checked ~ .wk2-matches { display:block; }
    #wk-3:checked ~ .wk3-matches { display:block; }

    /* Match grid */
    .match-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:32px; }
    @media(max-width:700px){ .match-grid{grid-template-columns:repeat(2,1fr);} }
    @media(max-width:400px){ .match-grid{grid-template-columns:1fr;} }
    .match-card { display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 14px 8px; background:var(--bg-card); border:1px solid rgba(255,255,255,.06); border-radius:4px; min-height:62px; position:relative; transition:border-color .15s,background .15s; }
    .match-card.clickable { cursor:pointer; }
    .match-card.clickable:hover { border-color:rgba(1,210,215,.25); background:var(--bg-card2); }
    .match-label { position:absolute; top:4px; left:8px; font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.2); }
    .match-team { display:flex; align-items:center; gap:6px; width:84px; justify-content:flex-end; }
    .match-team.r { flex-direction:row-reverse; justify-content:flex-end; }
    .match-team img { width:26px; height:26px; object-fit:contain; flex-shrink:0; }
    .match-tname { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; color:rgba(255,255,255,.3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .match-tname.set { color:rgba(255,255,255,.7); }
    .match-tname.win { color:var(--accent); }
    .match-score { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:900; color:rgba(255,255,255,.25); text-align:center; white-space:nowrap; flex-shrink:0; }
    .match-score.has { color:rgba(255,255,255,.9); }

    /* Standings */
    .standings-wrap { margin-top:8px; }
    .standings-table { width:100%; border-collapse:collapse; }
    .standings-table th { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.3); text-align:center; padding:9px 12px; border-bottom:1px solid rgba(255,255,255,.06); }
    .standings-table th.l { text-align:left; }
    .standings-table td { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; color:rgba(255,255,255,.65); text-align:center; padding:11px 12px; border-bottom:1px solid rgba(255,255,255,.04); }
    .standings-table td.l { text-align:left; }
    .standings-table tr:hover td { background:rgba(255,255,255,.02); }
    .standings-table .rn { color:rgba(255,255,255,.28); font-size:13px; }
    .team-cell { display:flex; align-items:center; gap:10px; }
    .team-cell img { width:28px; height:28px; object-fit:contain; }
    .team-cell-name { font-size:16px; color:#fff; }
    .standings-table tr.qualified td { background:rgba(1,210,215,0.08); }
    .standings-table tr.qualified:hover td { background:rgba(1,210,215,0.13); }
    .w-col { color:#6deef0; }
    .diff-pos { color:rgba(1,210,215,.8); }
    .diff-neg { color:rgba(255,100,100,.8); }


    /* Modals */
    .ga-modal,.sc-modal { position:fixed; inset:0; z-index:9800; display:flex; align-items:center; justify-content:center; }
    .ga-modal[hidden],.sc-modal[hidden] { display:none !important; }
    .ga-bd { position:absolute; inset:0; background:rgba(5,5,5,.65); backdrop-filter:blur(6px); }
    .ga-panel,.sc-panel { position:relative; z-index:1; background:#091820; border:1.5px solid rgba(1,210,215,.3); border-radius:18px; padding:24px; animation:modal-in .2s ease; }
    .ga-panel { width:min(520px,calc(100vw - 24px)); max-height:85vh; overflow-y:auto; }
    .sc-panel { width:min(360px,calc(100vw - 24px)); }
    @keyframes modal-in { from{opacity:0;transform:translateY(12px) scale(.97)} to{opacity:1;transform:none} }
    .ga-panel h2,.sc-panel h2 { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; color:#fff; margin-bottom:6px; }
    .ga-panel p,.sc-panel p { font-size:12px; color:rgba(255,255,255,.4); margin-bottom:14px; font-family:'Noto Sans KR',sans-serif; }
    .ga-team-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
    .ga-team-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-radius:8px; background:rgba(255,255,255,.04); border:1.5px solid rgba(255,255,255,.09); color:#fff; font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; cursor:pointer; transition:all .14s; text-align:center; letter-spacing:.04em; text-transform:uppercase; }
    .ga-team-btn img { width:30px; height:30px; object-fit:contain; }
    .ga-team-btn:hover { border-color:rgba(1,210,215,.5); background:rgba(1,210,215,.1); }
    .ga-team-btn.selected { border-color:var(--accent); background:rgba(1,210,215,.15); }
    .ga-team-btn.in-other { opacity:.22; pointer-events:none; }
    .ga-btn { padding:8px 18px; border-radius:8px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; cursor:pointer; border:none; }
    .ga-btn-save { background:var(--accent); color:#000; }
    .ga-btn-cancel { background:rgba(255,255,255,.08); color:rgba(255,255,255,.6); }
    .ga-btn-clear { background:rgba(220,50,50,.12); border:1px solid rgba(220,50,50,.3) !important; color:rgba(255,120,120,.8); }
    .ga-btn-save:hover { background:#00b8bc; }
    .ga-btn-cancel:hover { background:rgba(255,255,255,.14); }
    .ga-btn-clear:hover { background:rgba(220,50,50,.25); }
    .ga-actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
    .sc-row { display:flex; align-items:center; gap:10px; margin:14px 0; }
    .sc-team { flex:1; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; text-transform:uppercase; color:rgba(255,255,255,.7); }
    .sc-team.r { text-align:right; }
    .sc-input { width:52px; height:38px; text-align:center; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:6px; color:#fff; font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:900; }
    .sc-vs { color:rgba(255,255,255,.3); font-family:'Barlow Condensed',sans-serif; font-weight:700; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="home-link" href="./index.html">VCT Archive</a>
    <a class="back-link" href="./challengers-pacific-lcq-southasia-split2.html">SA Split 2</a>
  </header>

  <main class="league-shell">
    <div class="page-hero">
      <p class="eyebrow">VCT Pacific LCQ 2026 · South Asia Split 2</p>
      <h1>그룹 스테이지</h1>
      <p class="intro">8개 팀이 풀 라운드로빈(28경기)으로 그룹 스테이지를 진행하며, 상위 4팀이 싱글 엘리미네이션 파이널 스테이지에 진출합니다.</p>
    </div>

    <!-- GROUP STAGE -->
    <div>
      <p class="sub-title">참가 팀</p>
      <div class="team-slots" id="team-slots"></div>

      <input type="radio" name="week" id="wk-1" checked>
      <input type="radio" name="week" id="wk-2">
      <input type="radio" name="week" id="wk-3">
      <div class="wk-tabs">
        <label for="wk-1">1주차 · Week 1</label>
        <label for="wk-2">2주차 · Week 2</label>
        <label for="wk-3">3주차 · Week 3</label>
      </div>
      <div class="wk1-matches"><div class="match-grid" id="mg-wk1"></div></div>
      <div class="wk2-matches"><div class="match-grid" id="mg-wk2"></div></div>
      <div class="wk3-matches"><div class="match-grid" id="mg-wk3"></div></div>

      <div class="standings-wrap">
        <p class="sub-title">순위표</p>
        <table class="standings-table" id="standings"></table>
      </div>
    </div>

  </main>

  <!-- Team picker modal -->
  <div class="ga-modal" id="ga-modal" hidden>
    <div class="ga-bd" id="ga-bd"></div>
    <div class="ga-panel" role="dialog">
      <h2 id="ga-title">팀 배정</h2>
      <p id="ga-sub"></p>
      <div class="ga-team-grid" id="ga-grid"></div>
      <div class="ga-actions" id="ga-actions"></div>
    </div>
  </div>

  <!-- GS score modal -->
  <div class="sc-modal" id="sc-modal" hidden>
    <div class="ga-bd" id="sc-bd"></div>
    <div class="sc-panel" role="dialog">
      <h2 id="sc-title">결과 입력</h2>
      <div class="sc-row">
        <span class="sc-team" id="sc-a-name">-</span>
        <input class="sc-input" id="sc-a" type="number" min="0" max="2" value="0">
        <span class="sc-vs">:</span>
        <input class="sc-input" id="sc-b" type="number" min="0" max="2" value="0">
        <span class="sc-team r" id="sc-b-name">-</span>
      </div>
      <div class="ga-actions">
        <button class="ga-btn ga-btn-clear" id="sc-clear">초기화</button>
        <button class="ga-btn ga-btn-cancel" id="sc-cancel">취소</button>
        <button class="ga-btn ga-btn-save" id="sc-save">저장</button>
      </div>
    </div>
  </div>

<script src="./storage.js"></script>
  <script src="./auth.js"></script>
  <script>
  window.storageReady.then(function() {
    function lj(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
    function sj(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    var _isAdmin = typeof window.vctIsAdmin === 'function' && window.vctIsAdmin();

    document.body.classList.toggle('view-only', !_isAdmin);

    var DEFAULT_POOL = [
      {name:'S8UL Esports',       code:'S8UL', logo:'./assets/teams/S8UL.png', white:false},
      {name:'Revenant XSpark',    code:'RNTX', logo:'./assets/teams/RNTX.png', white:false},
      {name:'Asterisk',           code:'AST',  logo:'./assets/teams/AST.png',  white:true},
      {name:'SIGN Esports',       code:'SGN',  logo:'./assets/teams/SGN.png',  white:false},
      {name:'The Rad Syndicate',  code:'RAD',  logo:'./assets/teams/RAD.png',  white:false},
      {name:'XØ IND',             code:'XOGG', logo:'./assets/teams/XOGG.png', white:false},
      {name:'Leosun Esports',     code:'LSE',  logo:'./assets/teams/LSE.png',  white:false},
      {name:'No Salary Peek',     code:'NSP',  logo:'./assets/teams/NSP.png',  white:true},
    ];

    var PFX          = 'pacific_lcq_sa_s2_';
    var GS_TEAMS_KEY = PFX+'gs_match_teams';
    var SCORES_KEY   = PFX+'gs_scores';

    var gsTeams = lj(GS_TEAMS_KEY, {});
    var scores  = lj(SCORES_KEY, {});

    function pool(){ return DEFAULT_POOL; }
    function tmap(){ var m={}; pool().forEach(function(t){ m[t.name]=t; }); return m; }

    // ── 참가팀 정적 표시 ─────────────────────────────────────
    function renderSlots(){
      var el=document.getElementById('team-slots');
      el.innerHTML=DEFAULT_POOL.map(function(t){
        var lg=t.logo?'<img class="slot-logo'+(t.white?' logo-w':'')+'" src="'+esc(t.logo)+'" alt="">':'<span style="width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.06);display:inline-block;flex-shrink:0;"></span>';
        return '<div class="team-slot">'+lg+'<span class="slot-name filled">'+esc(t.name)+'</span></div>';
      }).join('');
    }

    // ── 팀 피커 ───────────────────────────────────────────────
    var _picker=null;
    function openTeamPicker(cfg){
      _picker=cfg;
      var p=pool(), cur=cfg.cur||'', used=cfg.used||[];
      document.getElementById('ga-title').textContent=cfg.title||'팀 선택';
      document.getElementById('ga-sub').textContent='경기에 참가할 팀을 선택하세요.';
      var grid=document.getElementById('ga-grid');
      grid.innerHTML=p.map(function(t){
        var f=t.white?'filter:brightness(0) invert(1);':'';
        var lg=t.logo?'<img src="'+esc(t.logo)+'" alt="" style="'+f+'">':"";
        var inOther=used.indexOf(t.name)>=0;
        return '<button class="ga-team-btn'+(t.name===cur?' selected':'')+(inOther?' in-other':'')+'" data-team="'+esc(t.name)+'">'+lg+'<span>'+esc(t.code||t.name)+'</span></button>';
      }).join('');
      grid.querySelectorAll('.ga-team-btn').forEach(function(btn){
        btn.addEventListener('click',function(){ closeGa(); cfg.onSelect(btn.dataset.team); });
      });
      var ac=document.getElementById('ga-actions');
      ac.innerHTML='';
      var clrBtn=document.createElement('button');
      clrBtn.className='ga-btn ga-btn-clear'; clrBtn.textContent='초기화';
      clrBtn.addEventListener('click',function(){ closeGa(); cfg.onClear(); });
      var canBtn=document.createElement('button');
      canBtn.className='ga-btn ga-btn-cancel'; canBtn.textContent='취소';
      canBtn.addEventListener('click',closeGa);
      ac.appendChild(clrBtn); ac.appendChild(canBtn);
      document.getElementById('ga-modal').hidden=false;
    }
    function closeGa(){ document.getElementById('ga-modal').hidden=true; _picker=null; }
    document.getElementById('ga-bd').addEventListener('click',closeGa);

    // ── 매치 카드 ────────────────────────────────────────────
    function makeCard(mid){
      var mt=gsTeams[mid]||{a:'',b:''};
      var tA=mt.a||'', tB=mt.b||'';
      var tm=tmap(), a=tA&&tm[tA], b=tB&&tm[tB];
      var sc=scores[mid]||null;
      var hasTeams=!!(tA&&tB);
      var hasScore=!!(sc&&(sc.a>0||sc.b>0));
      var winA=hasScore&&sc.a>sc.b, winB=hasScore&&sc.b>sc.a;
      function lgHtml(t,white){ return t&&t.logo?'<img src="'+esc(t.logo)+'" alt="" width="22" height="22" style="object-fit:contain'+(white?';filter:brightness(0) invert(1)':'')+'">':""; }
      var nA=tA?(a?a.code:tA):'?', nB=tB?(b?b.code:tB):'?';
      var scoreStr=hasScore?sc.a+' : '+sc.b:'- : -';

      var card=document.createElement('article');
      card.className='match-card clickable';
      card.innerHTML='<span class="match-label">M'+mid+'</span>'
        +'<div class="match-team" data-ts="a">'+lgHtml(a,a&&a.white)+'<span class="match-tname'+(tA?' set':'')+(winA?' win':'')+'">'+esc(nA)+'</span></div>'
        +'<span class="match-score'+(hasScore?' has':'')+'">'+scoreStr+'</span>'
        +'<div class="match-team r" data-ts="b">'+lgHtml(b,b&&b.white)+'<span class="match-tname'+(tB?' set':'')+(winB?' win':'')+'">'+esc(nB)+'</span></div>';

      card.addEventListener('click',function(e){
        if(_isAdmin){
          var ts=e.target.closest('[data-ts]');
          if(ts){
            var side=ts.dataset.ts;
            var other=side==='a'?tB:tA;
            openTeamPicker({
              title:'M'+mid+' '+(side==='a'?'A팀':'B팀')+' 선택',
              cur: side==='a'?tA:tB,
              used: other?[other]:[],
              onSelect:function(name){
                if(!gsTeams[mid]) gsTeams[mid]={a:'',b:''};
                gsTeams[mid][side]=name; sj(GS_TEAMS_KEY,gsTeams); renderMatches(); renderStandings();
              },
              onClear:function(){
                if(gsTeams[mid]) gsTeams[mid][side]=''; sj(GS_TEAMS_KEY,gsTeams); renderMatches(); renderStandings();
              }
            });
            return;
          }
          if(hasTeams){ openScModal(mid,tA,tB,a,b); }
          return;
        }
        if(!hasTeams) return;
        var sc2=scores[mid]||null;
        window.location.href='./challengers-sea-match-dark.html?'
          +new URLSearchParams({date:'pacific_lcq_sa_s2_m'+mid,teamA:tA,teamB:tB,
            score:sc2?sc2.a+' : '+sc2.b:'- : -',from:'pacific_lcq_sa_s2_gs'}).toString();
      });
      return card;
    }

    function renderMatches(){
      var g1=document.getElementById('mg-wk1'), g2=document.getElementById('mg-wk2'), g3=document.getElementById('mg-wk3');
      g1.innerHTML=''; g2.innerHTML=''; g3.innerHTML='';
      for(var i=0;i<28;i++){
        var mid=i+1;
        var g=i<8?g1:i<18?g2:g3;
        g.appendChild(makeCard(mid));
      }
    }

    // ── GS 스코어 모달 ────────────────────────────────────────
    var _scMid=null;
    function openScModal(mid,tA,tB,a,b){
      _scMid=mid;
      document.getElementById('sc-title').textContent='M'+mid+' 결과 입력';
      document.getElementById('sc-a-name').textContent=a?a.code:tA;
      document.getElementById('sc-b-name').textContent=b?b.code:tB;
      var sc=scores[mid]||{a:0,b:0};
      document.getElementById('sc-a').value=sc.a; document.getElementById('sc-b').value=sc.b;
      document.getElementById('sc-modal').hidden=false; document.getElementById('sc-a').focus();
    }
    function closeSc(){ document.getElementById('sc-modal').hidden=true; _scMid=null; }
    document.getElementById('sc-bd').addEventListener('click',closeSc);
    document.getElementById('sc-cancel').addEventListener('click',closeSc);
    document.getElementById('sc-clear').addEventListener('click',function(){
      if(_scMid==null) return; delete scores[_scMid]; sj(SCORES_KEY,scores); closeSc(); renderAll();
    });
    document.getElementById('sc-save').addEventListener('click',function(){
      if(_scMid==null) return;
      var a=Math.max(0,Number(document.getElementById('sc-a').value)||0);
      var b=Math.max(0,Number(document.getElementById('sc-b').value)||0);
      scores[_scMid]={a:a,b:b}; sj(SCORES_KEY,scores); closeSc(); renderAll();
    });

    // ── 순위표 ───────────────────────────────────────────────
    function calcStandings(){
      var st={};
      DEFAULT_POOL.forEach(function(t){ st[t.name]={name:t.name,w:0,l:0,sw:0,sl:0}; });
      for(var m=0;m<28;m++){
        var mid=m+1, mt=gsTeams[mid]||{};
        var tA=mt.a||'', tB=mt.b||'';
        var sc=scores[mid]; if(!tA||!tB||!sc) continue;
        if(sc.a>sc.b){ if(st[tA]) st[tA].w++; if(st[tB]) st[tB].l++; }
        else if(sc.b>sc.a){ if(st[tB]) st[tB].w++; if(st[tA]) st[tA].l++; }
        if(st[tA]){ st[tA].sw+=sc.a; st[tA].sl+=sc.b; }
        if(st[tB]){ st[tB].sw+=sc.b; st[tB].sl+=sc.a; }
      }
      return Object.values(st).sort(function(a,b){
        if(b.w!==a.w) return b.w-a.w;
        var da=a.sw-a.sl, db=b.sw-b.sl;
        if(db!==da) return db-da;
        return b.sw-a.sw;
      });
    }

    function renderStandings(){
      var rows=calcStandings(), tm=tmap();
      var el=document.getElementById('standings');
      el.innerHTML='<thead><tr><th class="l" style="width:28px"></th><th class="l">팀</th><th>W</th><th>L</th><th>세트</th><th>득실</th></tr></thead>';
      var tb=document.createElement('tbody');
      rows.forEach(function(r,i){
        var t=tm[r.name]||{};
        var lg=t.logo?'<img src="'+esc(t.logo)+'" alt="" '+(t.white?'style="filter:brightness(0) invert(1)"':'')+' width="20" height="20" style="object-fit:contain">':'';
        var diff=r.sw-r.sl;
        var tr=document.createElement('tr');
        if(i<4) tr.className='qualified';
        tr.innerHTML='<td class="rn">'+(i+1)+'</td>'
          +'<td class="l"><div class="team-cell">'+lg+'<span class="team-cell-name">'+esc(r.name)+'</span></div></td>'
          +'<td class="w-col">'+r.w+'</td><td>'+r.l+'</td>'
          +'<td>'+r.sw+'-'+r.sl+'</td>'
          +'<td class="'+(diff>=0?'diff-pos':'diff-neg')+'">'+(diff>=0?'+':'')+diff+'</td>';
        tb.appendChild(tr);
      });
      el.appendChild(tb);
    }

    // ── ESC ──────────────────────────────────────────────────
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape') return;
      if(!document.getElementById('sc-modal').hidden) closeSc();
      else if(!document.getElementById('ga-modal').hidden) closeGa();
    });

    function renderAll(){ renderSlots(); renderMatches(); renderStandings(); }
    renderAll();
  });
  </script>
  <script src="./help.js" defer></script>
</body>
</html>
