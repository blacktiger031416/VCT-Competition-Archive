<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>챔피언스 정답 · VCT Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,900;1,900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent:#ff3c5a; --bg:#060a0e; --bg-card:#0d1318; }
    body {
      font-family: "Noto Sans KR", system-ui, sans-serif;
      color: #f0f0f0; background: var(--bg); min-height: 100vh;
    }
    body::before {
      position:fixed;inset:0;z-index:-1;pointer-events:none;content:'';
      background:
        radial-gradient(ellipse 70% 50% at 15% 0%, rgba(255,40,70,.06), transparent),
        radial-gradient(ellipse 50% 60% at 85% 100%, rgba(255,200,60,.04), transparent);
    }

    /* ── Header ── */
    .site-header {
      position:sticky;top:0;z-index:100;
      display:flex;align-items:center;gap:10px;
      padding:0 24px;height:52px;
      background:rgba(6,10,14,.9);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .site-header .auth-header-btn { margin-left:auto!important; }
    .back-link { color:rgba(255,255,255,.35);font-size:13px;font-weight:500;text-decoration:none;transition:color .15s;flex-shrink:0; }
    .back-link:hover { color:rgba(255,255,255,.8); }
    .header-sep { color:rgba(255,255,255,.12);font-size:14px;flex-shrink:0; }
    .header-title { font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;color:#ffc840;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0; }

    /* ── 탭 바 ── */
    .tab-bar {
      display:flex;align-items:flex-end;
      padding:0 24px;border-bottom:1px solid rgba(255,255,255,.07);
      background:rgba(6,10,14,.85);
    }
    .tab-btn {
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
      color:rgba(255,255,255,.35);background:none;border:none;
      padding:0 20px;height:44px;cursor:pointer;
      border-bottom:2px solid transparent;margin-bottom:-1px;
      transition:color .15s,border-color .15s;text-decoration:none;
      display:inline-flex;align-items:center;
    }
    .tab-btn:hover { color:rgba(255,255,255,.7); }
    .tab-btn.active { color:#fff; border-bottom-color:var(--accent); }

    /* ── 레이아웃 ── */
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }
    .page-title {
      font-family:'Barlow Condensed',sans-serif;
      font-size:28px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
      color:#ffc840; margin-bottom:6px;
    }
    .page-subtitle { font-size:13px;color:rgba(255,255,255,.35);margin-bottom:28px; }

    /* ── 섹션 ── */
    .section { margin-bottom: 40px; }
    .section-head {
      display:flex;align-items:center;gap:10px;margin-bottom:16px;
    }
    .section-label {
      font-family:'Barlow Condensed',sans-serif;
      font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
      color:rgba(255,255,255,.3);
    }
    .section-head::after { content:'';flex:1;height:1px;background:rgba(255,255,255,.06); }
    .count-badge {
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px;font-weight:700;letter-spacing:.08em;
      color:#ffc840;
    }

    /* ── 정답 슬롯 그리드 ── */
    .ans-grid {
      display:grid;
      grid-template-columns:repeat(8,1fr);
      gap:10px;
    }
    @media(max-width:900px){ .ans-grid { grid-template-columns:repeat(4,1fr); } }
    @media(max-width:500px){ .ans-grid { grid-template-columns:repeat(2,1fr); } }

    .ans-slot {
      aspect-ratio:3/4;
      background:rgba(255,255,255,.03);
      border:1.5px solid rgba(255,255,255,.1);
      border-radius:8px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      position:relative;overflow:hidden;user-select:none;
      transition:border-color .2s,background .2s;
    }
    .ans-slot.filled {
      border-color:color-mix(in srgb,var(--slot-color,#ffc840) 55%,transparent);
      background:color-mix(in srgb,var(--slot-color,#ffc840) 7%,transparent);
      box-shadow:0 0 18px color-mix(in srgb,var(--slot-color,#ffc840) 12%,transparent);
    }
    /* 정답 확정 슬롯 테두리 골드 강조 */
    .ans-slot.confirmed {
      border-color: rgba(255,200,60,.6);
      box-shadow: 0 0 24px rgba(255,200,60,.15), inset 0 0 0 1px rgba(255,200,60,.2);
    }

    .ans-slot::before {
      content:'';position:absolute;inset:0;
      background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5) 100%);
      z-index:1;pointer-events:none;
    }
    .ans-empty-num {
      font-family:'Barlow Condensed',sans-serif;
      font-size:28px;font-weight:900;color:rgba(255,255,255,.08);z-index:2;
    }
    .ans-empty-line {
      font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
      color:rgba(255,255,255,.1);z-index:2;margin-top:4px;
    }
    .ans-logo {
      width:52%;aspect-ratio:1;object-fit:contain;z-index:2;
      filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));
    }
    .ans-code {
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px;font-weight:900;letter-spacing:.08em;
      color:#fff;z-index:2;margin-top:6px;
    }
    .ans-record-wrap {
      z-index:2;margin-top:4px;display:flex;gap:2px;
    }
    .ans-record-btn {
      font-family:'Barlow Condensed',sans-serif;
      font-size:10px;font-weight:700;letter-spacing:.06em;
      padding:2px 6px;border-radius:3px;border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);
      line-height:1.4;
    }
    .ans-record-btn.active-20 { background:rgba(61,220,132,.2);border-color:rgba(61,220,132,.45);color:#3ddc84; }
    .ans-record-btn.active-21 { background:rgba(255,200,60,.18);border-color:rgba(255,200,60,.4);color:#ffc840; }
    /* admin 전용 인터랙션 */
    .admin-mode .ans-record-btn { cursor:pointer; transition:all .14s; }
    .admin-mode .ans-record-btn:not(.active-20):not(.active-21):hover { background:rgba(255,255,255,.1); }
    .ans-remove {
      position:absolute;top:5px;right:5px;z-index:5;
      width:20px;height:20px;border-radius:50%;
      background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);
      color:rgba(255,255,255,.5);font-size:10px;font-weight:700;
      cursor:pointer;display:none;align-items:center;justify-content:center;
      transition:background .13s;line-height:1;backdrop-filter:blur(4px);
    }
    .admin-mode .ans-slot.filled .ans-remove { display:flex; }
    .ans-remove:hover { background:rgba(255,60,90,.6);color:#fff; }

    /* ── 팀 풀 (Admin) ── */
    #ans-pool { display:none; }
    .admin-mode #ans-pool { display:block; }
    .pool-section-label {
      font-family:'Barlow Condensed',sans-serif;
      font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      color:rgba(255,255,255,.25);margin-bottom:10px;margin-top:20px;
    }
    .regions-grid {
      display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
    }
    @media(max-width:700px){ .regions-grid { grid-template-columns:repeat(2,1fr); } }
    .region-col { display:flex;flex-direction:column;gap:2px; }
    .region-label {
      font-family:'Barlow Condensed',sans-serif;
      font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
      color:rgba(255,255,255,.25);padding:0 4px 5px;
    }
    .region-teams { display:flex;flex-direction:column;gap:3px; }
    .team-card {
      display:flex;align-items:center;gap:8px;
      padding:6px 8px;border-radius:6px;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(255,255,255,.02);
      cursor:pointer;transition:background .12s,border-color .12s,transform .1s;
      position:relative;
    }
    .team-card:hover:not(.selected):not(.disabled) {
      background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);transform:translateY(-1px);
    }
    .team-card.selected {
      background:color-mix(in srgb,var(--tc,#ffc840) 12%,transparent);
      border-color:color-mix(in srgb,var(--tc,#ffc840) 40%,transparent);
      pointer-events:none;
    }
    .team-card.disabled { opacity:.3;cursor:default; }
    .team-card-logo { width:24px;height:24px;object-fit:contain;flex-shrink:0; }
    .team-card-info { display:flex;flex-direction:column;min-width:0; }
    .team-card-code { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;color:#fff;line-height:1; }
    .team-card-name { font-size:10px;color:rgba(255,255,255,.3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .team-card-check { position:absolute;right:8px;font-size:12px;color:#ffc840;opacity:0;transition:opacity .15s; }
    .team-card.selected .team-card-check { opacity:1; }

    /* ── 점수 표시 ── */
    .score-wrap {
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.07);
      border-radius:12px;padding:20px 24px;
    }
    .score-summary {
      display:flex;align-items:baseline;gap:10px;margin-bottom:18px;
    }
    .score-pts {
      font-family:'Barlow Condensed',sans-serif;
      font-size:48px;font-weight:900;letter-spacing:.02em;color:#ffc840;
      line-height:1;
    }
    .score-max {
      font-family:'Barlow Condensed',sans-serif;
      font-size:20px;font-weight:700;color:rgba(255,255,255,.25);
    }
    .score-label {
      font-size:12px;color:rgba(255,255,255,.35);margin-left:4px;
    }
    .score-bar-track {
      height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-bottom:20px;
    }
    .score-bar-fill {
      height:100%;background:linear-gradient(90deg,#3ddc84,#ffc840);border-radius:3px;
      transition:width .5s cubic-bezier(.22,1,.36,1);
    }

    /* 항목별 점수 표 */
    .score-items { display:flex;flex-direction:column;gap:6px; }
    .score-item {
      display:flex;align-items:center;gap:10px;
      padding:8px 10px;border-radius:6px;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.05);
      font-size:13px;
    }
    .score-item.hit { border-color:rgba(61,220,132,.25);background:rgba(61,220,132,.05); }
    .score-item.partial { border-color:rgba(255,200,60,.2);background:rgba(255,200,60,.04); }
    .score-item.miss { opacity:.4; }
    .score-item-logo { width:22px;height:22px;object-fit:contain;flex-shrink:0; }
    .score-item-logo-ph {
      width:22px;height:22px;border-radius:3px;background:rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:rgba(255,255,255,.3);
    }
    .score-item-code { font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;flex:1; }
    .score-item-ans-rec {
      font-family:'Barlow Condensed',sans-serif;
      font-size:11px;font-weight:700;letter-spacing:.06em;
      color:rgba(255,255,255,.3);margin-right:4px;
    }
    .score-item-badge {
      font-family:'Barlow Condensed',sans-serif;
      font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      padding:2px 7px;border-radius:3px;flex-shrink:0;
    }
    .badge-hit   { background:rgba(61,220,132,.2);color:#3ddc84; }
    .badge-rec   { background:rgba(255,200,60,.18);color:#ffc840; }
    .badge-miss  { background:rgba(255,255,255,.05);color:rgba(255,255,255,.2); }
    .badge-tbd   { background:rgba(255,255,255,.04);color:rgba(255,255,255,.2); }
    .score-item-pts {
      font-family:'Barlow Condensed',sans-serif;
      font-size:14px;font-weight:900;color:#ffc840;width:32px;text-align:right;flex-shrink:0;
    }

    /* 예측 없음 안내 */
    .no-pred {
      padding:24px;text-align:center;
      color:rgba(255,255,255,.2);font-size:13px;
      border:1px dashed rgba(255,255,255,.08);border-radius:8px;
    }

    /* ── 내부 탭 ── */
    .inner-tabs {
      display:flex;align-items:flex-end;gap:0;margin-bottom:24px;
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .inner-tab-btn {
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
      color:rgba(255,255,255,.35);background:none;border:none;
      padding:0 20px;height:40px;cursor:pointer;
      border-bottom:2px solid transparent;margin-bottom:-1px;
      transition:color .15s,border-color .15s;
    }
    .inner-tab-btn:hover { color:rgba(255,255,255,.7); }
    .inner-tab-btn.active { color:#fff;border-bottom-color:var(--accent); }
    .inner-tab-panel { display:none; }
    .inner-tab-panel.active { display:block; }

    /* ── PO 브래킷 (공유) ── */
    .po-wrap { padding:8px 0 40px;overflow-x:auto; }
    .de-outer { display:flex;align-items:stretch;gap:0; }
    .de-brackets { flex:1;min-width:0; }
    .de-gf {
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:0 16px;min-width:220px;gap:10px;
    }
    .gf-label {
      font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
      letter-spacing:.12em;text-transform:uppercase;color:rgba(255,200,60,.55);
      text-align:center;line-height:1.4;
    }
    .po-section { margin-bottom:20px; }
    .po-section-title {
      display:flex;align-items:center;gap:10px;
      font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
      letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);
      margin-bottom:10px;
    }
    .po-section-title::after { content:'';flex:1;height:1px;background:rgba(255,255,255,.06); }
    .ub-drop-label {
      font-size:10px;color:rgba(99,179,237,.4);margin-top:6px;
      font-family:'Barlow Condensed',sans-serif;letter-spacing:.08em;
    }
    .bracket-rounds { display:flex;align-items:stretch; }
    .bracket-round-col { display:flex;flex-direction:column; }
    .bracket-round-header {
      font-family:'Barlow Condensed',sans-serif;
      font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
      color:rgba(255,255,255,.2);padding:0 12px 8px;
    }
    .bracket-slots { display:flex;flex-direction:column;flex:1; }
    .bracket-slot { display:flex;flex-direction:column;justify-content:center;padding:6px 12px;flex:1; }

    .bm {
      width:190px;border-radius:7px;overflow:hidden;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.03);flex-shrink:0;
    }
    .bm-force-strip {
      display:flex;align-items:center;justify-content:center;
      height:28px;border-top:1px solid rgba(255,255,255,.06);
    }
    .bm-force-btn {
      font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
      letter-spacing:.07em;padding:3px 10px;border-radius:4px;cursor:pointer;
      background:rgba(255,160,0,.12);border:1px solid rgba(255,160,0,.3);
      color:#ffaa00;transition:all .14s;
    }
    .bm-force-btn:hover { background:rgba(255,160,0,.25);border-color:rgba(255,160,0,.55);color:#ffc040; }
    .bm-force-btn.locked-all { background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.25);cursor:default; }
    .bm.ub-match { border-left:2.5px solid rgba(99,179,237,.4); }
    .bm.lb-match { border-left:2.5px solid rgba(252,129,74,.4); }
    .bm.gf-match {
      border-left:2.5px solid rgba(255,215,0,.6);width:210px;
      box-shadow:0 0 24px rgba(255,215,0,.08);
    }
    .bm-team {
      display:flex;align-items:center;gap:8px;padding:10px 10px;
      transition:background .12s,opacity .15s;min-height:42px;
    }
    .bm-team.clickable { cursor:pointer; }
    .bm-team.clickable:hover { background:rgba(255,255,255,.08); }
    .bm-team.winner-row { background:rgba(61,220,132,.1); }
    .bm-team.loser-row { opacity:.35; }
    .gf-match .bm-team.winner-row { background:rgba(255,215,0,.1); }
    .bm-divider { height:1px;background:rgba(255,255,255,.06); }
    .bm-logo { width:26px;height:26px;object-fit:contain;flex-shrink:0; }
    .bm-logo-ph {
      width:26px;height:26px;border-radius:4px;
      background:rgba(255,255,255,.07);
      display:flex;align-items:center;justify-content:center;
      font-size:8px;font-weight:800;color:rgba(255,255,255,.25);flex-shrink:0;
    }
    .bm-code { font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:#fff;flex:1; }
    .bm-tbd .bm-code { color:rgba(255,255,255,.2); }
    .bm-win-mark { font-size:10px;color:#3ddc84;opacity:0;flex-shrink:0; }
    .bm-team.winner-row .bm-win-mark { opacity:1; }
    .gf-match .bm-team.winner-row .bm-win-mark { color:gold; }
    @keyframes bmWinFlash {
      0% { background:rgba(61,220,132,.5); }
      100% { background:rgba(61,220,132,.1); }
    }
    .bm-team.winner-row.flash { animation:bmWinFlash .45s ease both; }
    /* 스코어 숫자 */
    .bm-score-num {
      font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;
      width:22px;text-align:center;flex-shrink:0;color:rgba(255,255,255,.2);line-height:1;
    }
    .bm-team.winner-row .bm-score-num { color:#3ddc84; }
    .gf-match .bm-team.winner-row .bm-score-num { color:gold; }
    .bm-score-num.cycle-score { cursor:pointer;transition:color .12s,transform .1s; }
    .bm-score-num.cycle-score:hover { color:rgba(255,255,255,.8)!important;transform:scale(1.2); }
    /* TBD 슬롯 (admin) */
    .bm-tbd-row {
      display:flex;align-items:center;justify-content:center;gap:6px;
      min-height:42px;padding:10px;cursor:pointer;
      background:rgba(255,255,255,.02);transition:background .12s;
    }
    .bm-tbd-row:hover { background:rgba(255,255,255,.06); }
    .bm-tbd-row span { font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:.08em; }
    .bm-tbd-row.active-pick { background:rgba(255,200,60,.08);border:1px solid rgba(255,200,60,.25); }
    .bm-remove-team {
      margin-left:auto;flex-shrink:0;width:16px;height:16px;border-radius:50%;
      background:rgba(255,60,90,.2);border:none;color:rgba(255,255,255,.4);
      font-size:8px;font-weight:800;cursor:pointer;display:none;
      align-items:center;justify-content:center;line-height:1;
    }
    .admin-mode .bm-team .bm-remove-team { display:flex; }

    /* 팀 피커 패널 */
    .po-team-picker {
      background:rgba(13,19,24,.97);border:1px solid rgba(255,255,255,.1);
      border-radius:10px;padding:16px;margin:12px 0;
      backdrop-filter:blur(12px);
    }
    .po-picker-header {
      font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
      letter-spacing:.15em;text-transform:uppercase;color:rgba(255,200,60,.7);
      margin-bottom:12px;
    }
    .po-picker-cancel {
      float:right;background:none;border:none;color:rgba(255,255,255,.3);
      cursor:pointer;font-size:14px;line-height:1;
    }
    .po-picker-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px; }
    .po-picker-team {
      display:flex;align-items:center;gap:8px;padding:7px 10px;
      border-radius:6px;border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.03);cursor:pointer;transition:all .12s;
    }
    .po-picker-team:hover { background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15); }
    .po-picker-team img { width:22px;height:22px;object-fit:contain;flex-shrink:0; }
    .po-picker-team span { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:#fff; }

    /* PO 채점 */
    .po-score-wrap { margin-top:28px; }
    .po-no-matchup {
      padding:40px 24px;text-align:center;
      color:rgba(255,255,255,.2);font-size:13px;

  <script>
    /* ── 팀 데이터 ── */
    var REGIONS = [
      { label: 'Pacific', teams: [
        { code:'NS',  name:'Nongshim RedForce', logo:'./assets/teams/ns.svg',  color:'#e2012d', white:false },
        { code:'T1',  name:'T1',                logo:'./assets/teams/t1.png',  color:'#ec1b24', white:false },
        { code:'PRX', name:'Paper Rex',          logo:'./assets/teams/prx.svg', color:'#8c52ff', white:true  },
        { code:'GE',  name:'Global Esports',     logo:'./assets/teams/ge.webp', color:'#e12c30', white:false },
      ]},
      { label: 'Americas', teams: [
        { code:'NRG', name:'NRG Esports', logo:'https://i.namu.wiki/i/b5ns627KGg4zEIzK90XQi_FFDbBFY4VrEpOG0MDdLK_KJVx3y6AZczbN0kuwfv5bXqmtfSFWly2NgFrcMcLnvg.svg', color:'#F63D0A', white:false },
        { code:'G2',  name:'G2 Esports',  logo:'https://i.namu.wiki/i/lx4lTUZuQJuG0lI7k1odIWttiaiDx9gbB6rAybzzna-UZR57F_Vwr_LMKF6OlHaepuw9UiVJbYoQ_B_IA4QnrA.svg', color:'#8400CB', white:false },
        { code:'100T', name:'100 Thieves', logo:'./assets/teams/First League/100T.png', color:'#e8102d', white:false },
        { code:'LOUD', name:'LOUD',        logo:'./assets/teams/First League/LOUD.png', color:'#a3ff12', white:false },
      ]},
      { label: 'EMEA', teams: [
        { code:'KC',  name:'Karmine Corp',  logo:'./assets/teams/kc.png',                                                                                                  color:'#01ccff', white:false },
        { code:'TL',  name:'Team Liquid',   logo:'https://i.namu.wiki/i/f_CgQqphVfEK8ZpEdvOwbGpar5zO-_FVVRi39YwZGPPXdUwewYA58qHLO9BMsDue-XXXYWNXJANDwuBBkPdncg.webp', color:'#142e60', white:true  },
        { code:'FUT', name:'FUT Esports',   logo:'https://specs.gg/assets/img/teams/fut-esports.webp',                                                                     color:'#21efc4', white:false },
        { code:'VIT', name:'Team Vitality', logo:'https://images.secretlab.co/theme/common/vitality_25_spacer_logo.png',                                                   color:'#f8ff04', white:false },
      ]},
      { label: 'CN', teams: [
        { code:'TYL', name:'TYLOO',           logo:'https://i.namu.wiki/i/ygjpeHG-y9CYpiLp-E8wiEsNDU6j9aRNcwVvPJsOlvcSV1Ey_NCmMAjMarHe3bhjm6EDK-qgXl_hEmhQdz__ag.svg',  color:'#cc3a32', white:false },
        { code:'JDG', name:'JD Mall JDG',     logo:'https://i.namu.wiki/i/YyWlT49EP4lbp3xXGQr4QdzyrHYb3xwHo50oXrrAPOE7T6hXJsSJ5GNGWsB65RT1N5Ceh1lVwzhmE9HgoaV3yw.svg',  color:'#da202d', white:false },
        { code:'EDG', name:'EDward Gaming',   logo:'https://upload.wikimedia.org/wikipedia/commons/3/33/Edward_Gaming_logo.png',                                              color:'#442a1e', white:false },
        { code:'XLG', name:'Xi Lai Gaming',   logo:'https://i.namu.wiki/i/Yywbu40Korgue4azcIZrrlnlCSyI6vdM7imxW_Qt7dA8JzhkIbIJuIeAMVuG-KOms30fAAwz12iuyETD7pCGvw.svg',  color:'#206189', white:false },
      ]},
    ];

    /* ── 상태 ── */
    var answers = new Array(8).fill(null); // 정답 슬롯 (admin)
    var isAdmin = false;

    /* ── 저장/불러오기 ── */
    function saveAnswers() {
      try {
        var data = answers.map(function(s) {
          return s ? { code:s.code, name:s.name, logo:s.logo, color:s.color, white:!!s.white, record:s.record } : null;
        });
        localStorage.setItem('vct_gs_answers', JSON.stringify(data));
      } catch(e) {}
    }
    function loadAnswers() {
      try {
        var raw = localStorage.getItem('vct_gs_answers');
        if (!raw) return;
        var data = JSON.parse(raw);
        if (Array.isArray(data)) answers = data.map(function(d){ return d || null; });
      } catch(e) {}
    }
    /* ── 정답 슬롯 렌더 ── */
    function renderAnswers() {
      var grid = document.getElementById('ans-grid');
      grid.innerHTML = '';
      var filled = answers.filter(Boolean).length;
      document.getElementById('ans-count').textContent = filled;

      for (var i = 0; i < 8; i++) {
        var s = answers[i];
        var el = document.createElement('div');
        el.className = 'ans-slot' + (s ? ' filled confirmed' : '');
        el.dataset.idx = i;
        if (s && s.color) el.style.setProperty('--slot-color', s.color);

        if (s) {
          /* X 버튼 */
          var rem = document.createElement('button');
          rem.className = 'ans-remove';
          rem.textContent = '✕';
          rem.dataset.idx = i;
          rem.addEventListener('click', onAnsRemove);
          el.appendChild(rem);

          /* 로고 */
          var img = document.createElement('img');
          img.className = 'ans-logo';
          img.src = s.logo; img.alt = s.code;
          if (s.white) img.style.filter = 'brightness(0) invert(1)';
          img.onerror = function(){ this.style.display='none'; };
          el.appendChild(img);

          /* 코드 */
          var codeEl = document.createElement('div');
          codeEl.className = 'ans-code';
          codeEl.textContent = s.code;
          el.appendChild(codeEl);

          /* 2-0 / 2-1 */
          var recWrap = document.createElement('div');
          recWrap.className = 'ans-record-wrap';
          ['2-0','2-1'].forEach(function(r) {
            var btn = document.createElement('button');
            btn.className = 'ans-record-btn' + (s.record === r ? (r==='2-0' ? ' active-20' : ' active-21') : '');
            btn.textContent = r;
            btn.dataset.idx = i; btn.dataset.rec = r;
            if (isAdmin) btn.addEventListener('click', onAnsRecord);
            el.appendChild; // will be done via recWrap
            recWrap.appendChild(btn);
          });
          el.appendChild(recWrap);
        } else {
          var num = document.createElement('div');
          num.className = 'ans-empty-num';
          num.textContent = i + 1;
          el.appendChild(num);
          var line = document.createElement('div');
          line.className = 'ans-empty-line';
          line.textContent = 'TBD';
          el.appendChild(line);
        }
        grid.appendChild(el);
      }

    }

    /* ── 팀 풀 렌더 (Admin) ── */
    function renderPool() {
      var selectedCodes = answers.filter(Boolean).map(function(s){ return s.code; });
      var allFull = selectedCodes.length >= 8;
      var container = document.getElementById('ans-regions');
      container.innerHTML = '';

      REGIONS.forEach(function(region) {
        var col = document.createElement('div');
        col.className = 'region-col';
        var lbl = document.createElement('div');
        lbl.className = 'region-label'; lbl.textContent = region.label;
        col.appendChild(lbl);

        var teamsEl = document.createElement('div');
        teamsEl.className = 'region-teams';
        region.teams.forEach(function(team) {
          if (team.tbd) return;
          var isSelected = selectedCodes.indexOf(team.code) !== -1;
          var isDisabled = !isSelected && allFull;
          var card = document.createElement('div');
          card.className = 'team-card' + (isSelected ? ' selected' : '') + (isDisabled ? ' disabled' : '');
          if (team.color) card.style.setProperty('--tc', team.color);

          var logo = document.createElement('img');
          logo.className = 'team-card-logo'; logo.src = team.logo; logo.alt = team.code;
          if (team.white) logo.style.filter = 'brightness(0) invert(1)';
          logo.onerror = function(){ this.style.display='none'; };
          card.appendChild(logo);

          var info = document.createElement('div'); info.className = 'team-card-info';
          var codeEl = document.createElement('div'); codeEl.className = 'team-card-code'; codeEl.textContent = team.code;
          var nameEl = document.createElement('div'); nameEl.className = 'team-card-name'; nameEl.textContent = team.name;
          info.appendChild(codeEl); info.appendChild(nameEl);
          card.appendChild(info);

          var check = document.createElement('div'); check.className = 'team-card-check'; check.textContent = '✓';
          card.appendChild(check);

          if (!isSelected && !isDisabled) {
            card.addEventListener('click', (function(t){ return function(){ onAnsTeamClick(t); }; })(team));
          }
          teamsEl.appendChild(card);
        });
        col.appendChild(teamsEl);
        container.appendChild(col);
      });
    }

    /* ── 이벤트 핸들러 ── */
    function onAnsTeamClick(team) {
      var emptyIdx = answers.indexOf(null);
      if (emptyIdx === -1) return;
      answers[emptyIdx] = { code:team.code, name:team.name, logo:team.logo, color:team.color, white:team.white, record:'2-0' };
      saveAnswers();
      renderAnswers();
      renderPool();
    }

    function onAnsRemove(e) {
      e.stopPropagation();
      var idx = parseInt(e.currentTarget.dataset.idx);
      answers[idx] = null;
      answers = answers.filter(Boolean).concat(new Array(8).fill(null)).slice(0, 8);
      saveAnswers();
      renderAnswers();
      renderPool();
    }

    function onAnsRecord(e) {
      e.stopPropagation();
      var idx = parseInt(e.currentTarget.dataset.idx);
      var rec = e.currentTarget.dataset.rec;
      if (!answers[idx] || answers[idx].record === rec) return;
      answers[idx].record = rec;
      saveAnswers();
      renderAnswers();
    }

    /* ══════════════════════════════════════════════
       플레이오프 정답 관리
       ══════════════════════════════════════════════ */

    var PO_ANS = {}; /* {mid: {a: team, b: team, winner: code, score: '2-0'|...}} */
    var activePickSlot = null; /* {mid, side} — Admin 팀 피커 활성 슬롯 */

    var ALL_TEAMS = (function(){
      var t = [];
      REGIONS.forEach(function(r){ r.teams.forEach(function(tm){ if (!tm.tbd) t.push(tm); }); });
      return t;
    })();

    function savePoAns() {
      try { localStorage.setItem('vct_po_answers', JSON.stringify(PO_ANS)); } catch(e) {}
    }
    function loadPoAns() {
      try {
        var raw = localStorage.getItem('vct_po_answers');
        PO_ANS = raw ? (JSON.parse(raw) || {}) : {};
      } catch(e) { PO_ANS = {}; }
    }
    /* ── PO 브래킷 렌더 ── */
    function makePoBmCard(mid, type) {
      var d    = PO_ANS[mid] || {};
      var isBo5 = (mid === 13 || mid === 14);
      var winN  = isBo5 ? 3 : 2;
      var maxL  = isBo5 ? 2 : 1;

      var card = document.createElement('div');
      card.className = 'bm ' + (type || '') + '-match';
      card.dataset.match = mid;

      ['a','b'].forEach(function(side, idx) {
        var team    = d[side] || null;
        var winner  = d.winner || null;
        var isWin   = !!(winner && team && winner === team.code);
        var isLose  = !!(winner && team && winner !== team.code);

        var row;
        if (!team) {
          /* TBD → Admin 클릭 가능 */
          row = document.createElement('div');
          row.className = 'bm-tbd-row' + (isAdmin ? ' clickable' : '');
          var pickKey = mid + ':' + side;
          if (activePickSlot && activePickSlot.mid === mid && activePickSlot.side === side) {
            row.classList.add('active-pick');
          }
          var ph = document.createElement('div'); ph.className = 'bm-logo-ph'; ph.textContent = '?';
          var lbl = document.createElement('span');
          lbl.textContent = isAdmin ? '+ 팀 선택' : 'TBD';
          row.appendChild(ph); row.appendChild(lbl);
          if (isAdmin) {
            row.addEventListener('click', (function(m_, s_){
              return function(){ openPoPicker(m_, s_); };
            })(mid, side));
          }
        } else {
          row = document.createElement('div');
          row.className = 'bm-team'
            + (isWin  ? ' winner-row' : '')
            + (isLose ? ' loser-row'  : '')
            + (isAdmin && !winner ? ' clickable' : '')
            + (isAdmin && isWin  ? ' clickable' : '');

          if (isAdmin) {
            row.addEventListener('click', (function(m_, code_){
              return function(){ pickPoAnsWinner(m_, code_); };
            })(mid, team.code));
          }

          var img = document.createElement('img');
          img.className = 'bm-logo'; img.src = team.logo; img.alt = team.code;
          if (team.white) img.style.filter = 'brightness(0) invert(1)';
          img.onerror = function(){ this.style.display='none'; };
          row.appendChild(img);

          var codeEl = document.createElement('span'); codeEl.className = 'bm-code';
          codeEl.textContent = team.code; row.appendChild(codeEl);

          /* 스코어 숫자 */
          var sn = document.createElement('span'); sn.className = 'bm-score-num';
          if (isWin) {
            sn.textContent = winN;
            row.appendChild(sn);
          } else if (isLose) {
            var curL2 = d.score ? parseInt(d.score.split('-')[1]) : 0;
            sn.textContent = curL2;
            if (isAdmin) {
              sn.classList.add('cycle-score');
              sn.addEventListener('click', (function(m_){
                return function(e){ e.stopPropagation(); cyclePoAnsScore(m_); };
              })(mid));
            }
            row.appendChild(sn);
          }

          if (false) { /* 하단 else 블록 유지용 더미 */ } else {
            /* Admin: X 제거 버튼 */
            if (isAdmin) {
              var rmBtn = document.createElement('button');
              rmBtn.className = 'bm-remove-team'; rmBtn.textContent = '✕';
              rmBtn.style.display = 'flex';
              rmBtn.addEventListener('click', (function(m_, s_){
                return function(e){ e.stopPropagation(); removePoAnsTeam(m_, s_); };
              })(mid, side));
              row.appendChild(rmBtn);
            } else {
              var mark = document.createElement('span'); mark.className = 'bm-win-mark'; mark.textContent = '●';
              row.appendChild(mark);
            }
          }
        }

        card.appendChild(row);
        if (idx === 0) {
          var dv = document.createElement('div'); dv.className = 'bm-divider';
          card.appendChild(dv);
        }
      });

      /* Admin 전용 강제 확정 버튼 */
      if (isAdmin && d.a && d.b) {
        var forceStrip = document.createElement('div');
        forceStrip.className = 'bm-force-strip';
        var forceBtn = document.createElement('button');
        forceBtn.className = 'bm-force-btn';
        forceBtn.textContent = '전체 강제 확정';
        forceBtn.addEventListener('click', (function(m_, b_) {
          return function(e) { e.stopPropagation(); forcePoLockAll(m_, b_); };
        })(mid, forceBtn));
        forceStrip.appendChild(forceBtn);
        card.appendChild(forceStrip);
      }

      return card;
    }

    function makePoRoundCol(label, matchDefs) {
      var col = document.createElement('div'); col.className = 'bracket-round-col';
      var hdr = document.createElement('div'); hdr.className = 'bracket-round-header'; hdr.textContent = label;
      col.appendChild(hdr);
      var slotsEl = document.createElement('div'); slotsEl.className = 'bracket-slots';
      matchDefs.forEach(function(def) {
        var slot = document.createElement('div'); slot.className = 'bracket-slot';
        slot.style.flex = def.flex || 1;
        slot.appendChild(makePoBmCard(def.id, def.type));
        slotsEl.appendChild(slot);
      });
      col.appendChild(slotsEl); return col;
    }

    function renderPoAns() {
      var container = document.getElementById('po-ans-bracket');
      if (!container) return;
      container.innerHTML = '';

      var outer = document.createElement('div'); outer.className = 'de-outer';
      var brackets = document.createElement('div'); brackets.className = 'de-brackets';

      /* UB */
      var ubSec = document.createElement('div'); ubSec.className = 'po-section';
      var ubTitle = document.createElement('div'); ubTitle.className = 'po-section-title';
      ubTitle.innerHTML = '<span style="color:rgba(99,179,237,.65)">▲</span>&nbsp;Upper Bracket';
      ubSec.appendChild(ubTitle);
      var ubR = document.createElement('div'); ubR.className = 'bracket-rounds';
      ubR.appendChild(makePoRoundCol('Quarterfinals', [{id:1,flex:1,type:'ub'},{id:2,flex:1,type:'ub'},{id:3,flex:1,type:'ub'},{id:4,flex:1,type:'ub'}]));
      ubR.appendChild(makePoRoundCol('Semifinals', [{id:5,flex:2,type:'ub'},{id:6,flex:2,type:'ub'}]));
      ubR.appendChild(makePoRoundCol('Upper Final', [{id:7,flex:4,type:'ub'}]));
      ubSec.appendChild(ubR);
      var dropLbl = document.createElement('div'); dropLbl.className = 'ub-drop-label';
      dropLbl.textContent = '↓ 패자 Lower Bracket 진출';
      ubSec.appendChild(dropLbl);
      brackets.appendChild(ubSec);

      /* LB */
      var lbSec = document.createElement('div'); lbSec.className = 'po-section';
      var lbTitle = document.createElement('div'); lbTitle.className = 'po-section-title';
      lbTitle.innerHTML = '<span style="color:rgba(252,129,74,.65)">▼</span>&nbsp;Lower Bracket';
      lbSec.appendChild(lbTitle);
      var lbR = document.createElement('div'); lbR.className = 'bracket-rounds';
      lbR.appendChild(makePoRoundCol('Round 1', [{id:8,flex:1,type:'lb'},{id:9,flex:1,type:'lb'}]));
      lbR.appendChild(makePoRoundCol('Round 2', [{id:10,flex:1,type:'lb'},{id:11,flex:1,type:'lb'}]));
      lbR.appendChild(makePoRoundCol('Semifinal', [{id:12,flex:2,type:'lb'}]));
      lbR.appendChild(makePoRoundCol('Final', [{id:13,flex:2,type:'lb'}]));
      lbSec.appendChild(lbR);
      brackets.appendChild(lbSec);
      outer.appendChild(brackets);

      /* GF */
      var gfCol = document.createElement('div'); gfCol.className = 'de-gf';
      var gfLbl = document.createElement('div'); gfLbl.className = 'gf-label';
      gfLbl.innerHTML = '🏆<br>Grand Final';
      gfCol.appendChild(gfLbl);
      gfCol.appendChild(makePoBmCard(14, 'gf'));
      outer.appendChild(gfCol);
      container.appendChild(outer);
    }

    /* ── Admin: 팀 선택 ── */
    function openPoPicker(mid, side) {
      activePickSlot = { mid: mid, side: side };
      var picker = document.getElementById('po-team-picker');
      var lbl = document.getElementById('po-picker-slot-label');
      lbl.textContent = 'M' + mid + ' — ' + (side === 'a' ? '위' : '아래') + ' 슬롯';
      /* 피커 그리드 */
      var grid = document.getElementById('po-picker-grid');
      grid.innerHTML = '';
      ALL_TEAMS.forEach(function(team) {
        var el = document.createElement('div'); el.className = 'po-picker-team';
        var img = document.createElement('img'); img.src = team.logo; img.alt = team.code;
        if (team.white) img.style.filter = 'brightness(0) invert(1)';
        img.onerror = function(){ this.style.display='none'; };
        var nameEl = document.createElement('span'); nameEl.textContent = team.code;
        el.appendChild(img); el.appendChild(nameEl);
        el.addEventListener('click', function(){ assignPoTeam(team); });
        grid.appendChild(el);
      });
      picker.style.display = 'block';
      renderPoAns();
    }

    function closePoPicker() {
      activePickSlot = null;
      document.getElementById('po-team-picker').style.display = 'none';
      renderPoAns();
    }

    function assignPoTeam(team) {
      if (!activePickSlot) return;
      var mid = activePickSlot.mid; var side = activePickSlot.side;
      if (!PO_ANS[mid]) PO_ANS[mid] = {};
      PO_ANS[mid][side] = { code:team.code, name:team.name, logo:team.logo, color:team.color, white:!!team.white };
      if (PO_ANS[mid].winner) {
        /* 이미 세팅된 winner가 이 슬롯이면 리셋 */
        /* (새 팀으로 교체했으므로) */
        delete PO_ANS[mid].winner; delete PO_ANS[mid].score;
      }
      savePoAns();
      closePoPicker();
    }

    function removePoAnsTeam(mid, side) {
      if (!PO_ANS[mid]) return;
      delete PO_ANS[mid][side];
      delete PO_ANS[mid].winner; delete PO_ANS[mid].score;
      savePoAns(); renderPoAns();
    }

    function pickPoAnsWinner(mid, teamCode) {
      if (!PO_ANS[mid]) return;
      var d = PO_ANS[mid];
      if (!d.a || !d.b) return;
      if (d.winner === teamCode) { delete d.winner; delete d.score; }
      else {
        var isBo5 = (mid === 13 || mid === 14);
        d.winner = teamCode;
        d.score  = d.score || (isBo5 ? '3-0' : '2-0');
      }
      savePoAns(); renderPoAns();
    }

    function cyclePoAnsScore(mid) {
      if (!PO_ANS[mid] || !PO_ANS[mid].winner) return;
      var isBo5 = (mid === 13 || mid === 14);
      var winN  = isBo5 ? 3 : 2;
      var maxL  = isBo5 ? 2 : 1;
      var cur   = PO_ANS[mid].score || (winN + '-0');
      var curL  = parseInt(cur.split('-')[1]) || 0;
      var nextL = (curL + 1) % (maxL + 1);
      PO_ANS[mid].score = winN + '-' + nextL;
      savePoAns();
      /* in-place */
      var card = document.querySelector('#po-ans-bracket .bm[data-match="' + mid + '"]');
      if (!card) return;
      var loserRow = card.querySelector('.bm-team.loser-row');
      if (loserRow) {
        var n = loserRow.querySelector('.bm-score-num');
        if (n) n.textContent = nextL;
      }
    }

    /* ── M경기 전체 강제 확정 ── */
    function forcePoLockAll(mid, btn) {
      if (!confirm('M' + mid + ' 경기를 모든 참가자에 강제 확정하시겠습니까?\n확정 후에는 유저들이 예측을 변경할 수 없습니다.')) return;
      var keys = typeof window.storageKeys === 'function' ? window.storageKeys() : [];
      var names = [];
      keys.forEach(function(k) {
        if (k.indexOf('vct_nickname:') === 0) names.push(k.slice('vct_nickname:'.length));
      });
      names.forEach(function(username) {
        var lockKey = 'vct_po_locked:' + username;
        var raw = localStorage.getItem(lockKey);
        var locked = {};
        try { locked = raw ? (JSON.parse(raw) || {}) : {}; } catch(e) {}
        locked[mid] = true;
        localStorage.setItem(lockKey, JSON.stringify(locked));
      });
      /* 글로벌 강제 확정 플래그 — prediction 페이지에서 취소 버튼 숨김용 */
      try {
        var globalRaw = localStorage.getItem('vct_po_force_locked');
        var globalLocked = {};
        try { globalLocked = globalRaw ? (JSON.parse(globalRaw) || {}) : {}; } catch(e) {}
        globalLocked[mid] = true;
        localStorage.setItem('vct_po_force_locked', JSON.stringify(globalLocked));
      } catch(e) {}
      if (btn) { btn.textContent = '🔒 확정 완료'; btn.classList.add('locked-all'); btn.disabled = true; }
      alert('M' + mid + ' 강제 확정 완료 — ' + names.length + '명 적용');
    }

    /* ── 내부 탭 전환 ── */
    document.querySelectorAll('.inner-tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.inner-tab-btn').forEach(function(b){ b.classList.remove('active'); });
        document.querySelectorAll('.inner-tab-panel').forEach(function(p){ p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('itab-' + btn.dataset.itab).classList.add('active');
      });
    });

    /* ── 초기화 ── */
    function initPage() {
      isAdmin = typeof window.vctIsAdmin === 'function' && window.vctIsAdmin();

      if (isAdmin) {
        document.getElementById('admin-badge').style.display = '';
        document.body.classList.add('admin-mode');
        document.getElementById('ans-pool').style.display = 'block';
      } else {
        document.getElementById('readonly-badge').style.display = '';
      }

      /* GS */
      loadAnswers();
      renderAnswers();
      if (isAdmin) renderPool();

      /* PO */
      loadPoAns();
      renderPoAns();

      /* 피커 닫기 버튼 */
      var cancelBtn = document.getElementById('po-picker-cancel');
      if (cancelBtn) cancelBtn.addEventListener('click', closePoPicker);
    }

    (window.storageReady || Promise.resolve()).then(function() {
      if (typeof window.vctIsAdmin === 'function') { initPage(); }
      else { window.addEventListener('load', initPage); }
    });
  </script>
</body>
</html>
